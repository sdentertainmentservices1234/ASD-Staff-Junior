name: Supreme Court cause-list fetch

on:
  schedule:
    - cron: "30 3  * * 1-6"   # 09:00 IST
    - cron: "30 8  * * 1-6"   # 14:00 IST
    - cron: "30 13 * * 1-6"   # 19:00 IST
    - cron: "30 14 * * 1-6"   # 20:00 IST
    - cron: "30 15 * * 1-6"   # 21:00 IST
    - cron: "30 16 * * 1-6"   # 22:00 IST
  workflow_dispatch:
    inputs:
      test_date:
        description: "Optional: check ONE specific date (YYYY-MM-DD), e.g. 2026-07-03. Leave blank for the normal upcoming-days run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: Fetch cause lists
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.test_date }}" ]; then
            python fetch_causelist.py "${{ github.event.inputs.test_date }}"
          else
            python fetch_causelist.py
          fi
      - name: Commit results if changed
        run: |
          git config user.name  "causelist-bot"
          git config user.email "actions@github.com"
          git add court-updates.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Cause-list refresh $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

