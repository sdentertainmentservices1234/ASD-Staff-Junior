name: Court updates (cause lists + orders + status)

on:
  schedule:
    # Multi-wave (UTC; IST = UTC+5:30). Adjust to your existing cadence if
    # you prefer — these give: early morning, mid-morning, post-lunch,
    # evening (supplementary window), and two night sweeps.
    - cron: '0 2 * * 1-6'    # 07:30 IST
    - cron: '30 4 * * 1-6'   # 10:00 IST
    - cron: '30 8 * * 1-6'   # 14:00 IST
    - cron: '30 12 * * 1-6'  # 18:00 IST — supplementary usually up by evening
    - cron: '30 14 * * 1-6'  # 20:00 IST
    - cron: '30 16 * * 1-6'  # 22:00 IST
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: court-updates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler (pdftotext) + pytest
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pip install pytest -q

      # GATE: golden-file regression tests run BEFORE any fetch. A parser
      # regression fails here and nothing is fetched or committed.
      - name: Parser regression tests
        run: python -m pytest test_parsers.py -q

      - name: Fetch cause lists
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          BOT_EMAIL:           ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD:        ${{ secrets.BOT_PASSWORD }}
        run: python fetch_causelist.py

      - name: Fetch orders / judgments / case status
        if: always()   # run even if cause-list step flagged anomalies
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          BOT_EMAIL:           ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD:        ${{ secrets.BOT_PASSWORD }}
        run: python fetch_orders.py

      - name: Commit updates
        if: always()
        run: |
          git config user.name  "asd-court-bot"
          git config user.email "bot@users.noreply.github.com"
          git add court-updates.json orders-updates.json || true
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "court updates $(date -u +'%Y-%m-%d %H:%M')Z"
          git push
