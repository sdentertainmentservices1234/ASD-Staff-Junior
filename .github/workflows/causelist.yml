name: Supreme Court cause-list fetch (multi-wave)

# The court publishes ADVANCE lists days ahead, MAIN lists a few days ahead, and
# SUPPLEMENTARY lists the evening before (often 8-9 PM, sometimes later). So we run
# several times through the day/evening, and each run checks a rolling window of
# upcoming days. GitHub cron is UTC; IST = UTC + 5:30.
on:
  schedule:
    # Public repo → free unlimited Actions minutes, so we poll densely to cut the
    # lag between the court publishing a list and it showing in the app. Most runs
    # find nothing new and exit without committing; only a changed list is pushed.
    # A concurrency guard (below) stops overlapping runs from piling up.
    #   Every 15 min across the whole publishing window: UTC 02:00–19:45
    #   = IST 07:30–01:15, which covers morning advance lists, afternoon main
    #   lists, and evening / very-late supplementary lists (often 9–11 PM IST).
    - cron: "*/15 2-19 * * *"
    #   Overnight insurance for the rare list posted after 01:15 IST:
    #   UTC 20:30 / 22:30 / 00:30 = IST 02:00 / 04:00 / 06:00.
    - cron: "30 20,22,0 * * *"
  workflow_dispatch:           # manual "Run workflow" button

# Never let two scheduled runs overlap and race on the commit.
concurrency:
  group: causelist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install pdfplumber
      - name: Fetch upcoming cause lists (advance + main + supplementary)
        run: python fetch_causelist.py
      - name: Commit court-updates.json if changed
        run: |
          git config user.name  "causelist-bot"
          git config user.email "actions@github.com"
          git add court-updates.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Cause-list refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # The fetch takes several minutes, so another push (e.g. an app
            # deploy) can land on main meanwhile and reject our push. Rebase our
            # single data commit onto the latest main and retry a few times.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto latest main."
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
