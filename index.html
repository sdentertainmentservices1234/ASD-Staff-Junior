<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASDC</title>
<style>
  :root{
    --ink:#1a1a18;
    --paper:#f6f4ef;        /* calm app background */
    --paper2:#ffffff;       /* card */
    --line:#eae6dd;         /* hairline */
    --line2:#f0ece3;
    --seal:#6b1f1f;         /* oxblood accent (owner) */
    --seal2:#8a2b2b;
    --seal-soft:#f3e9e6;
    --brass:#9a7b3f;
    --green:#33543f;
    --muted:#8a8478;
    --shadow:0 1px 2px rgba(26,26,24,.03);
    --radius:16px;
  }
  body.staff-theme{
    /* Cool teal-on-slate — deliberately distinct from the owner's warm cream */
    --paper:#eef2f3;        /* cool slate app background */
    --paper2:#fbfdfd;       /* card, faint cool white */
    --line:#d7e0e1;         /* cool hairline */
    --line2:#e2eaea;
    --seal:#1f5c54; --seal2:#2a6f66; --seal-soft:#dcebe8; --brass:#3f7d73;
    --green:#1f5c54;
    --muted:#6f8481;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;
    overflow-x:hidden;max-width:100%}
  body{padding-bottom:80px}
  h1,h2,h3{font-weight:600;letter-spacing:.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .mono{font-family:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}

  /* ---------- top masthead ---------- */
  header.mast{
    background:linear-gradient(180deg,#fffdf8,#f4efe3);
    border-bottom:2px solid var(--ink);
    padding:18px 22px 14px;position:sticky;top:0;z-index:40;
    box-shadow:0 2px 0 var(--brass), 0 6px 18px rgba(26,26,24,.05)}
  .mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    max-width:1080px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-seal{width:46px;height:46px;flex:none;display:grid;place-items:center}
  .brand-seal svg{display:block}
  .brand h1{font-size:21px;line-height:1.05}
  .brand .sub{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin-top:3px}
  .mode-pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);background:var(--paper2);color:var(--muted);
    padding:3px 9px;border-radius:20px}

  /* ---------- tab nav ---------- */
  nav.tabs{max-width:1080px;margin:0 auto;display:flex;gap:2px;
    border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:none;border:none;padding:11px 16px 9px;
    font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;
    white-space:nowrap;letter-spacing:.01em;flex:0 0 auto}
  nav.tabs button.active{color:var(--seal);border-bottom-color:var(--seal);font-weight:600}
  nav.tabs button:hover{color:var(--ink)}

  main{max-width:1080px;margin:0 auto;padding:22px;width:100%;box-sizing:border-box}
  .panel{display:none}
  .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- cards / layout ---------- */
  .card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 1px 2px rgba(26,26,24,.03);padding:20px;margin-bottom:14px}
  .card h2{font-size:15px;margin-bottom:3px;font-weight:700;letter-spacing:.01em}
  .card .hint{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
    font-weight:700;margin-bottom:6px}

  .grid{display:grid;gap:13px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:680px){.g2,.g3{grid-template-columns:1fr}}

  label.fld{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;font-weight:500}
  label.fld span.req{color:var(--seal)}
  input.in,select.in,textarea.in{width:100%;padding:12px 13px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink);font-size:15px;transition:border .15s,box-shadow .15s}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--seal);
    box-shadow:0 0 0 3px var(--seal-soft,rgba(107,31,31,.1))}
  textarea.in{resize:vertical;min-height:62px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--seal);
    background:var(--seal);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;
    letter-spacing:.01em;transition:transform .06s, opacity .15s;
    white-space:nowrap;flex-shrink:0;flex-grow:0;width:auto;max-width:100%;line-height:1.2;cursor:pointer}
  .btn:hover{opacity:.92}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--seal);border-color:var(--line)}
  .btn.ghost:hover{background:var(--seal-soft,#f3e9e6);opacity:1}
  .btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
  .btn.seal:hover{opacity:.92}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .primary{display:block;width:100%;background:var(--seal);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:2px}
  .primary:active{transform:translateY(1px);opacity:.92}
  /* TDS segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper2)}
  .seg-btn{background:none;border:none;padding:10px 20px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600}
  .seg-btn.on{background:var(--seal);color:#fff}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--seal-soft);border:1px solid transparent;color:var(--seal);border-radius:20px;
    padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--seal)}
  .fee-preview{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:13px 15px;
    font-size:15px;color:var(--muted)}
  .fee-preview .fp-g{font-weight:700;color:var(--ink)}
  .fee-preview .fp-t{color:var(--brass);font-weight:600}
  .fee-preview .fp-n{color:var(--seal);font-weight:700}
  .fee-preview .fp-sep{color:var(--line);margin:0 4px}
  .fee-preview .fp-muted{color:var(--muted)}
  .in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;
    color:var(--ink);font-size:15px;font-family:inherit}
  .in:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;align-items:stretch}
  .btn-row > .btn{flex:0 0 auto}
  /* card header: title block shrinks, button keeps full width, wraps on narrow screens */
  .card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .card-head > div:first-child{flex:1 1 240px;min-width:0}
  .card-head > button, .card-head > .btn{flex:0 0 auto}
  @media(max-width:520px){
    .card-head > button, .card-head > .btn{width:100%}
  }

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:380px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;position:relative;overflow:visible;min-width:0}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);border-radius:var(--radius) 0 0 var(--radius)}
  .stat.green::before{background:var(--green)}
  .stat.seal::before{background:var(--seal)}
  .stat.brass::before{background:var(--brass)}
  .stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    white-space:normal;overflow-wrap:break-word;line-height:1.3}
  .stat .v{font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
  .stat .vsub{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper2)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  thead th{background:#efe9db;text-align:left;padding:10px 12px;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line2)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fbf8f1}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    border:1px solid var(--line);color:var(--muted);background:#fff}
  .tag.active{color:var(--green);border-color:#bcd2c2;background:#f0f6f1}
  .tag.closed{color:var(--muted)}
  .row-act{color:var(--seal);font-size:12.5px;background:none;border:none;padding:2px 6px}
  .row-act:hover{text-decoration:underline}

  /* ---------- responsive registers ----------
     On narrow screens the multi-column register tables can't fit, forcing
     horizontal scroll and making a single entry span many lines. Below the
     breakpoint we transform each row into a compact card: the primary cell
     (first column) reads as a heading, the rest become tidy label:value lines,
     and the action cell becomes a small button row. Scoped to .tbl-wrap table
     so the print templates (table.inv / table.tpl-tbl) are untouched.
     data-label is stamped onto each <td> at render time by _labelizeTables(). */
  @media (max-width:640px){
    .tbl-wrap{overflow-x:visible;border:none;background:transparent;border-radius:0}
    .tbl-wrap table{min-width:0;width:100%;font-size:13.5px}
    .tbl-wrap table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .tbl-wrap table, .tbl-wrap tbody, .tbl-wrap tr, .tbl-wrap td{display:block}
    .tbl-wrap tbody tr{
      background:var(--paper2);border:1px solid var(--line);border-radius:12px;
      padding:11px 13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .tbl-wrap tbody tr:hover{background:var(--paper2)}
    .tbl-wrap tbody td{
      padding:3px 0;border:none;display:flex;justify-content:space-between;
      align-items:baseline;gap:14px;text-align:right}
    /* label from the header, shown on the left of each line */
    .tbl-wrap tbody td::before{
      content:attr(data-label);text-align:left;flex:0 0 auto;
      font-size:11px;letter-spacing:.06em;text-transform:uppercase;
      color:var(--muted);font-weight:600;white-space:nowrap}
    /* the first cell (code/no.) is the card's heading: bigger, no label, full width */
    .tbl-wrap tbody td:first-child{
      justify-content:flex-start;font-size:15px;font-weight:700;
      padding-bottom:7px;margin-bottom:6px;border-bottom:1px solid var(--line2)}
    .tbl-wrap tbody td:first-child::before{display:none}
    .tbl-wrap tbody td:first-child a{font-size:15px}
    /* an empty header (the actions column) — its cell holds buttons; lay them
       out as a right-aligned row with a hairline above, and hide the label */
    .tbl-wrap tbody td[data-label=""]{
      justify-content:flex-end;flex-wrap:wrap;gap:4px;
      padding-top:9px;margin-top:7px;border-top:1px solid var(--line2)}
    .tbl-wrap tbody td[data-label=""]::before{display:none}
    .tbl-wrap tbody td[data-label=""] .row-act{
      border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
    /* secondary text (remarks under a cell) should wrap under, left aligned */
    .tbl-wrap tbody td > div{text-align:right;margin-top:2px}
  }
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fdf9f0;padding:11px 20px;border-radius:6px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.warn{background:var(--seal)}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(26,26,24,.42);display:none;
    place-items:center;z-index:80;padding:18px}
  .modal-bg.show{display:grid}
  .modal{background:var(--paper2);border-radius:8px;max-width:560px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper2)}
  .modal-h h3{font-size:17px}
  .modal-b{padding:20px}
  .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
  .x:hover{color:var(--ink)}

  .note{font-size:12.5px;color:var(--muted);background:#fbf6ea;border:1px solid var(--line2);
    border-left:3px solid var(--brass);padding:10px 12px;border-radius:4px;margin-top:12px}

  /* ====== PRINTABLE DOCUMENTS — centred head, prominent type ====== */
  #receiptArea{position:fixed;left:-9999px;top:0}
  .doc{width:720px;background:#fff;color:#222;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum";}
  .doc-pad{padding:52px 60px 44px}
  .doc-compact .doc-pad{padding:40px 56px 32px}
  .doc *{box-sizing:border-box}

  /* letterhead — CENTRED, name most prominent */
  .dh{text-align:center;padding-bottom:14px;border-bottom:2px solid #1a1a18;margin-bottom:0}
  .dh-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;font-weight:700;
    letter-spacing:.01em;color:#1a1a18;line-height:1.1}
  .doc-compact .dh-name{font-size:27px}
  .dh-adv{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px;font-weight:600;color:#1a1a18;margin-top:3px}
  .dh-line{font-size:12px;color:#5a554c;margin-top:3px;line-height:1.5}
  .dh-ids{font-size:11px;color:#8a847a;margin-top:5px;letter-spacing:.02em}

  /* document type — CENTRED, big, prominent (2nd row) */
  .doc-type{text-align:center;font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);
    margin:18px 0 16px;padding-bottom:2px}
  .doc-compact .doc-type{font-size:21px;margin:14px 0 12px}

  /* number (left) + date (right) row */
  .doc-row2{display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 0;border-top:1px solid #e8e4dc;border-bottom:1px solid #e8e4dc}
  .dr-lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8a298;font-weight:600}
  .doc-row2 b{font-size:14px;color:#1a1a18}
  .doc-from{margin:14px 0 20px;font-size:13.5px;color:#2a2620;line-height:1.7}
  .doc-from .dr-lbl{margin-right:4px}
  .doc-from>div{margin-top:2px}
  .doc-from b{color:#1a1a18}

  /* legacy (unused) */
  .lh,.doc-band,.doc-meta,.lh-rule,.doc-thanks,.doc-stamp{display:none}

  /* ===== RECEIPT ===== */
  .rcpt-body{font-size:15px;line-height:1.9;color:#3a352e;margin:0;font-weight:400;max-width:560px}
  .rcpt-body b{color:#1a1a18;font-weight:600}
  .rcpt-amt{margin-top:40px;display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid #1a1a18;padding-top:16px}
  .rcpt-amt .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a8a298;font-weight:600}
  .rcpt-amt .val{font-size:26px;font-weight:600;color:#1a1a18;letter-spacing:.005em;
    font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .rcpt-tds{margin-top:26px;font-size:13px;color:#3a352e;max-width:340px}
  .rcpt-tds>div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0ece2}
  .rcpt-tds>div span:last-child{font-variant-numeric:tabular-nums}
  .rcpt-tds .net{border-bottom:none;border-top:1.5px solid #1a1a18;margin-top:2px;padding-top:8px;font-weight:600;color:#1a1a18}

  /* ===== INVOICE ===== */
  .inv-to{margin:0 0 30px}
  .inv-to .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8a298;font-weight:600;display:block;margin-bottom:6px}
  .inv-to b{font-size:15px;color:#1a1a18;font-weight:600}
  .inv-to{font-size:13px;color:#6a655c;line-height:1.6}
  table.inv{width:100%;border-collapse:collapse;font-size:13.5px;margin:0}
  table.inv thead th{background:transparent;text-align:left;padding:0 0 12px;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:600;color:#a8a298;border-bottom:1px solid #1a1a18}
  table.inv thead th.r{text-align:right}
  table.inv tbody td{padding:14px 0;border-bottom:1px solid #ede9e1;vertical-align:top;color:#2a2620;line-height:1.5}
  .doc-compact table.inv tbody td{padding:9px 0}
  table.inv tbody td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#1a1a18}
  table.inv tbody td:first-child{color:#b8b2a8;width:30px}
  .inv-tot{margin-top:18px;display:flex;justify-content:flex-end}
  .doc-compact .inv-tot{margin-top:12px}
  .inv-tot table{border-collapse:collapse;font-size:13.5px;min-width:300px}
  .inv-tot td{padding:7px 0}
  .doc-compact .inv-tot td{padding:5px 0}
  .inv-tot td.lbl{color:#7a756c;padding-right:40px}
  .inv-tot td.r{text-align:right;font-variant-numeric:tabular-nums;color:#1a1a18}
  .inv-tot tr.grand td{border-top:2px solid #1a1a18;padding-top:14px;font-weight:600;font-size:17px;color:#1a1a18;
    font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .doc-compact .inv-tot tr.grand td{padding-top:10px;font-size:16px}
  .inv-words{font-size:12px;color:#9a948a;margin-top:14px;letter-spacing:.01em}
  .doc-compact .inv-words{margin-top:10px}
  .inv-pay{margin-top:30px;padding:0;font-size:12px;color:#6a655c;line-height:1.6}
  .doc-compact .inv-pay{margin-top:16px}
  .inv-pay b{color:#1a1a18;font-weight:600}
  .inv-bank{margin-top:24px;border:1px solid #ede9e1;border-radius:6px;padding:16px 18px;display:flex;gap:20px;align-items:center}
  .doc-compact .inv-bank{margin-top:16px;padding:13px 16px}
  .inv-bank-t{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#a8a298;font-weight:600;margin-bottom:10px}
  .inv-bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
  .doc-compact .inv-bank-grid{gap:5px 28px}
  .inv-bank-grid>div{display:flex;flex-direction:column;gap:2px}
  .inv-bank-grid span{font-size:10px;color:#a8a298;letter-spacing:.02em}
  .inv-bank-grid b{font-size:12.5px;color:#1a1a18;font-weight:600;font-variant-numeric:tabular-nums}
  .inv-qr{text-align:center;flex:none}
  .inv-qr svg{display:block;border:1px solid #ede9e1;border-radius:4px}
  .inv-qr-c{font-size:9.5px;color:#7a756c;margin-top:5px;letter-spacing:.02em}

  /* shared footer — minimal signature */
  .doc-foot{display:flex;justify-content:flex-end;align-items:flex-end;margin-top:52px}
  .doc-compact .doc-foot{margin-top:30px}
  .doc-sign{text-align:center;font-size:12px;color:#7a756c}
  .doc-sign .line{border-top:1px solid #c5bfb4;width:200px;margin:0 auto 8px}
  .doc-sign .who{font-weight:600;color:#1a1a18;font-size:13px}
  .doc-note{font-size:9.5px;color:#b0a99e;margin-top:34px;border-top:1px solid #ede9e1;padding-top:12px;
    line-height:1.6;font-weight:400}
  .doc-compact .doc-note{margin-top:20px;padding-top:9px}

  @media print{
    body *{visibility:hidden}
    #receiptArea,#receiptArea *{visibility:visible}
    #receiptArea{position:absolute;left:0;top:0;width:100%}
    .doc{width:100%}
    .doc-pad{padding:4mm 3mm}
    .tpl{width:100%}
    /* Preserve every background fill, colour and image when printing —
       without this, browsers strip the oxblood/gold design to plain text. */
    #receiptArea, #receiptArea *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
    /* Each document is one page; never split it, and start a fresh page per doc. */
    #receiptArea .tpl{
      page-break-after:always; break-after:page;
      page-break-inside:avoid; break-inside:avoid;
    }
    #receiptArea .tpl:last-child{ page-break-after:auto; break-after:auto; }
    @page{margin:0}
  }

  /* ============================================================
     TEMPLATE STYLE v2 — oxblood + gold, matches home masthead.
     centered title · Inv/Date row · adaptive detail rows ·
     boxed amount / payment particulars · Payment Details block ·
     centered signature image · oxblood footer band.
     --tpx-* vars flip to bronze for the "B&W friendly" toggle.
     ============================================================ */
  .tpl{--tpx-ox:#6b1f1f;--tpx-oxd:#571818;--tpx-gold:#9a7b3f;--tpx-ink:#2a2620;
    --tpx-muted:#8a837a;--tpx-line:#e7e0d4;--tpx-cream:#faf7f0;--tpx-paper:#fffdf9;
    width:794px;min-height:1123px;background:var(--tpx-paper);color:var(--tpx-ink);position:relative;
    overflow:hidden;font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum";
    display:flex;flex-direction:column;margin:0 auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  .tpl.bw{--tpx-gold:#6e5320;--tpx-line:#cfc7b8}
  .tpl *{box-sizing:border-box}
  .tpl-edge{height:5px;background:linear-gradient(90deg,var(--tpx-ox) 0%,var(--tpx-ox) 62%,var(--tpx-gold) 62%,var(--tpx-gold) 100%)}
  /* masthead — mirrors home screen */
  .tpl-mast{padding:32px 54px 18px;text-align:center;position:relative}
  .tpl-mast .tpl-mono{margin:0 auto 10px;width:96px;height:62px}
  .tpl-mast .tpl-mono svg{width:96px;height:62px;display:block;margin:0 auto}
  .tpl-eyebrow{display:inline-flex;align-items:center;gap:11px;font-size:11px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--tpx-muted);font-weight:600;margin-bottom:9px}
  .tpl.bw .tpl-eyebrow{color:#4a463f;font-weight:700}
  .tpl-eyebrow::before,.tpl-eyebrow::after{content:"";width:34px;height:1px;background:var(--tpx-line);display:inline-block}
  .tpl-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:700;
    color:var(--tpx-ox);line-height:1.04;letter-spacing:.01em}
  .tpl-desg{font-size:12px;color:var(--tpx-ink);margin-top:9px;font-weight:600;letter-spacing:.26em;
    text-transform:uppercase;opacity:.82}
  .tpl-court{display:inline-block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--tpx-gold);font-weight:700;margin-top:11px;padding-top:11px;position:relative}
  .tpl.bw .tpl-court{font-weight:800}
  .tpl-court::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:30px;height:2px;border-radius:2px;background:var(--tpx-gold);opacity:.6}
  .tpl-mrule{height:2px;background:var(--tpx-ox);margin:20px 54px 0;position:relative}
  .tpl-mrule::after{content:"";position:absolute;left:50%;top:-3px;width:8px;height:8px;
    background:var(--tpx-gold);transform:translateX(-50%) rotate(45deg)}
  /* document title band — centered */
  .tpl-dband{text-align:center;padding:20px 54px 4px}
  .tpl-dtitle{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;color:var(--tpx-ox);
    letter-spacing:.02em;font-weight:700;line-height:1.05}
  .tpl-dband::after{content:"";display:block;width:54px;height:2px;border-radius:2px;
    background:var(--tpx-gold);opacity:.6;margin:14px auto 0}
  .tpl-body{padding:18px 54px 0;flex:1}
  /* No./Date row */
  .tpl-nrow{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--tpx-line)}
  .tpl-nrow .k{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--tpx-gold);display:block;margin-bottom:3px}
  .tpl.bw .tpl-nrow .k{font-weight:800}
  .tpl-nrow b{font-size:15px;color:var(--tpx-ox);font-weight:700;letter-spacing:.01em}
  .tpl-nrow .r{text-align:right}
  /* two-column parties block */
  .tpl-cols{display:flex;gap:40px;margin:16px 0 6px}
  .tpl-cols.solo{justify-content:center;text-align:center}
  .tpl-cols.solo .tpl-col{flex:0 1 auto;max-width:70%}
  .tpl-col{flex:1;min-width:0}
  .tpl-lbl{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tpx-gold);margin-bottom:7px}
  .tpl.bw .tpl-lbl{font-weight:800}
  .tpl-bigname{font-size:15px;font-weight:700;color:var(--tpx-ink);overflow-wrap:anywhere;line-height:1.3}
  .tpl-meta{font-size:11.5px;color:#5a554c;line-height:1.55;margin-top:6px}
  .tpl-dl{font-size:12.5px;line-height:1.9}
  .tpl-dl .row{display:flex;gap:0}
  .tpl-dl .k{color:var(--tpx-muted);width:78px;flex:0 0 78px}
  .tpl-dl b{color:var(--tpx-ink);font-weight:600;min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word}
  .tpl-dl .caze{align-items:flex-start;margin-bottom:4px}
  .tpl-dl .caze b{line-height:1.35}
  /* line-item table */
  table.tpl-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  table.tpl-tbl thead th{background:var(--tpx-ox);color:#fff;text-align:left;padding:10px 13px;
    font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  table.tpl-tbl thead th.r{text-align:right}
  table.tpl-tbl tbody td{padding:10px 13px;border-bottom:1px solid var(--tpx-line);vertical-align:top}
  table.tpl-tbl tbody td.r{text-align:right;color:var(--tpx-ox);font-variant-numeric:tabular-nums}
  table.tpl-tbl tbody tr:nth-child(even) td{background:#faf7f0}
  /* totals — amount column aligned to line items */
  .tpl-tot{display:flex;justify-content:flex-end;margin-top:14px}
  .tpl-tot table{border-collapse:collapse;font-size:12.5px;min-width:330px}
  .tpl-tot td{padding:7px 0}
  .tpl-tot td.k{color:var(--tpx-muted);padding-right:40px;text-align:left}
  .tpl-tot td.r{width:130px;text-align:right;padding-right:13px;color:var(--tpx-ink);font-variant-numeric:tabular-nums}
  .tpl-tot tr.grand td{background:var(--tpx-ox);color:#fff;font-weight:700;font-size:14px;padding-top:11px;padding-bottom:11px}
  .tpl-tot tr.grand td.k{padding-left:14px}
  .tpl-tot tr.grand td.r{color:#fff;padding-right:13px}
  .tpl-words{font-size:11.5px;font-style:italic;color:var(--tpx-muted);text-align:right;margin-top:8px}
  .tpl-payable{font-size:11.5px;color:var(--tpx-ox);font-weight:600;text-align:right;margin-top:3px}
  /* receipt amount box + payment particulars */
  .tpl-amtbox{display:flex;border:1px solid var(--tpx-line);border-radius:8px;overflow:hidden;
    margin:18px 0 18px;background:var(--tpx-cream)}
  .tpl-amtbox .amt{flex:1.15;padding:20px 24px;border-right:1px solid var(--tpx-line);text-align:center}
  .tpl-amtbox .amt .t{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:10px}
  .tpl.bw .tpl-amtbox .amt .t{font-weight:800}
  .tpl-amtbox .amt .v{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:32px;font-weight:700;color:var(--tpx-ox);line-height:1}
  .tpl-amtbox .amt .w{font-size:10.5px;font-style:italic;color:var(--tpx-muted);margin-top:9px}
  .tpl-amtbox .pparts{flex:1.25;padding:18px 24px}
  .tpl-amtbox .pparts .t{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:11px}
  .tpl.bw .tpl-amtbox .pparts .t{font-weight:800}
  .tpl-amtbox .pparts .dl{font-size:12px;line-height:1.8}
  .tpl-amtbox .pparts .dl .row{display:flex;gap:0}
  .tpl-amtbox .pparts .dl .k{color:var(--tpx-muted);width:76px;flex:0 0 76px}
  .tpl-amtbox .pparts .dl b{color:var(--tpx-ink);font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
  .tpl-amtbox .pparts .dl .caze{align-items:flex-start;margin-top:2px}
  .tpl-amtbox .pparts .dl .caze b{line-height:1.4}
  /* Payment Details block (invoice) */
  .tpl-noteblk{margin-top:22px;border:1px solid var(--tpx-line);border-left:3px solid var(--tpx-gold);
    border-radius:6px;background:var(--tpx-cream);padding:16px 20px}
  .tpl-noteblk .h{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tpx-ox);margin-bottom:11px}
  .tpl-noteblk .paygrid{display:flex;gap:30px}
  .tpl-noteblk .pcol{flex:1}
  .tpl-noteblk .row{display:flex;gap:8px;font-size:12px;line-height:1.95}
  .tpl-noteblk .row .k{color:var(--tpx-muted);min-width:104px}
  .tpl-noteblk .row b{color:var(--tpx-ink);font-weight:600}
  .tpl-noteblk .qr{flex:none;text-align:center}
  .tpl-noteblk .qr .cap{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:5px}
  .tpl-noteblk .qr svg{display:block;border:1px solid var(--tpx-line);border-radius:4px;width:92px;height:92px}
  .tpl-noteblk .instr{font-size:11px;color:#6a655c;line-height:1.7;margin-top:12px;padding-top:11px;
    border-top:1px dashed var(--tpx-line);text-align:justify}
  /* signature — centered image */
  .tpl-sign{display:flex;justify-content:flex-end;margin-top:26px}
  .tpl-sign .b{text-align:center;min-width:230px}
  .tpl-sign .b.nofor{padding-top:44px}
  .tpl-sign .sigimg{display:block;max-height:56px;max-width:210px;margin:0 auto 2px;object-fit:contain}
  .tpl-sign .b.hassig{padding-top:8px}
  .tpl-sign .who{font-weight:700;color:var(--tpx-ox);font-size:13px;border-top:1px solid #c9c1b4;padding-top:7px}
  .tpl-sign .rol{font-size:10.5px;color:var(--tpx-muted);margin-top:3px}
  .tpl-sign .cred{font-size:10px;color:var(--tpx-gold);font-weight:600;letter-spacing:.04em;margin-top:5px;line-height:1.5}
  .tpl.bw .tpl-sign .cred{font-weight:700}
  .tpl-sign .stamp{font-size:9.5px;color:var(--tpx-gold);font-weight:600;margin-top:5px;letter-spacing:.03em}
  .tpl.bw .tpl-sign .stamp{font-weight:700}
  /* voucher-specific */
  .tpl-vdl{font-size:12.5px;line-height:2.05;margin-top:16px}
  .tpl-vdl .row{display:flex;gap:0}
  .tpl-vdl .k{color:var(--tpx-muted);width:130px;flex:0 0 130px}
  .tpl-vdl b{color:var(--tpx-ink);font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
  .tpl-amtbox.tpl-amtbox-solo .amt{flex:1;border-right:none;text-align:center}
  .tpl-vrem{font-size:11.5px;color:#5a554c;line-height:1.6;margin-top:4px}
  .tpl-vrem .lbl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:4px}
  .tpl.bw .tpl-vrem .lbl{font-weight:800}
  .tpl-disc{font-size:10px;color:#a49d92;text-align:center;font-style:italic;margin-top:22px;line-height:1.6}
  /* footer band */
  .tpl-foot{margin-top:26px;background:var(--tpx-ox);color:#f0e9df;padding:0}
  .tpl-foot .fbar{height:3px;background:var(--tpx-gold)}
  .tpl-foot .faddr{display:flex;align-items:center;gap:9px;padding:15px 54px 0;font-size:11.5px;line-height:1.5}
  .tpl-foot .faddr svg{width:14px;height:14px;flex:none;opacity:.9}
  .tpl-foot .fsep{height:1px;background:rgba(255,255,255,.13);margin:12px 54px 0}
  .tpl-foot .fcontact{display:flex;flex-wrap:wrap;gap:8px 40px;padding:11px 54px 16px;font-size:11.5px}
  .tpl-foot .fi{display:flex;align-items:center;gap:8px}
  .tpl-foot .fi svg{width:13px;height:13px;flex:none;opacity:.9}
  /* ---- legacy compatibility classes (staff self-billing templates) ---- */
  .tpl .tpl-title{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:24px;font-weight:700;color:var(--tpx-ox);letter-spacing:.02em}
  .tpl .tpl-title.center{text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:22px}
  .tpl .tpl-titlewrap{display:flex;justify-content:space-between;align-items:flex-start;margin:18px 0 16px;padding:0 54px}
  .tpl .tpl-metatop{font-size:12.5px;line-height:1.9}
  .tpl .tpl-metatop .row{display:flex;gap:8px}
  .tpl .tpl-metatop .k{color:var(--tpx-muted);min-width:80px}
  .tpl .tpl-metatop b{color:var(--tpx-ox);font-weight:600}
  .tpl .tpl-metatop .c{color:var(--tpx-muted)}
  .tpl .tpl-center-orn{text-align:center;color:var(--tpx-gold);font-size:12px;letter-spacing:.4em;margin:2px 0 18px}
  .tpl .tpl-mast-txt{flex:1;min-width:0;text-align:center;width:100%}
  .tpl .tpl-courts{font-size:11px;color:#5a554c;margin-top:5px}
  .tpl .tpl-rule{border-top:2px solid var(--tpx-ox);margin:14px 54px 18px}
  .tpl .tpl-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:7px}
  .tpl .tpl-block{font-size:13px;line-height:1.6;color:var(--tpx-ink)}
  .tpl .tpl-block b{color:var(--tpx-ink);font-weight:700}
  .tpl .tpl-recbox{display:flex;border:1px solid var(--tpx-line);border-radius:8px;overflow:hidden;margin:16px 54px 16px;background:var(--tpx-cream)}
  .tpl .tpl-recbox .amt{flex:1.15;padding:18px 22px;border-right:1px solid var(--tpx-line);text-align:center}
  .tpl .tpl-recbox .amt .lbl{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:9px}
  .tpl .tpl-recbox .amt .val{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;font-weight:700;color:var(--tpx-ox);line-height:1}
  .tpl .tpl-recbox .amt .words{font-size:10.5px;font-style:italic;color:var(--tpx-muted);margin-top:8px}
  .tpl .tpl-recbox .mode{flex:1;padding:18px 22px}
  .tpl .tpl-recbox .mode .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tpx-muted);margin-bottom:9px}
  .tpl .tpl-recbox .mode .opt{display:flex;align-items:center;gap:9px;font-size:12px;margin:6px 0}
  .tpl .tpl-recbox .mode .box{width:13px;height:13px;border:1.4px solid #b3aa9b;border-radius:3px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .tpl .tpl-recbox .mode .box.on{background:var(--tpx-ox);border-color:var(--tpx-ox)}
  .tpl .tpl-refline{font-size:12px;line-height:2;margin:0 54px 8px}
  .tpl .tpl-refline .k{color:var(--tpx-muted);min-width:150px;display:inline-block}
  .tpl .tpl-refline b{color:var(--tpx-ox);font-weight:600}
  .tpl .tpl-pay{display:flex;gap:22px;margin:16px 54px 0;padding-top:14px;border-top:1px solid var(--tpx-line)}
  .tpl .tpl-pay .pd{flex:1}
  .tpl .tpl-pay .pd .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:7px}
  .tpl .tpl-pay .pd .row{display:flex;gap:8px;font-size:12px;line-height:1.9}
  .tpl .tpl-pay .pd .k{color:var(--tpx-muted);min-width:96px}
  .tpl .tpl-pay .pd b{color:var(--tpx-ink);font-weight:600}
  .tpl .tpl-sign .box{text-align:center;min-width:220px}
  .tpl .tpl-sign .recv{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tpx-gold);margin-bottom:30px;text-align:left}
  .tpl .tpl-sign .who{font-weight:700;color:var(--tpx-ox);font-size:13px;border-top:1px solid #c9c1b4;padding-top:7px}

  .foot-note{text-align:center;font-size:12px;color:var(--muted);padding:14px;margin-top:8px}
  /* Calendar — professional month grid, contained within the panel */
  .cal-wrap{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:14px;overflow:hidden}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .cal-title{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:19px;font-weight:700;color:var(--seal);text-align:center;flex:1}
  .cal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--seal);font-size:17px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .cal-nav:hover{background:var(--seal-soft)}
  .cal-today-btn{font-size:11px;font-weight:600;color:var(--seal);background:none;border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;font-family:inherit}
  .cal-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;justify-content:center}
  .cal-legend span{display:flex;align-items:center;gap:5px}
  .cal-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted);flex:0 0 auto}
  .cal-dot.hearing{background:#6b1f1f}
  .cal-dot.appt{background:#1f6b4a}
  .cal-dot.personal{background:#b08d3c}
  .cal-grid-h{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .cal-grid-h div{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:2px 0;letter-spacing:.02em}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
  .cal-cell{min-width:0;height:44px;border:1px solid var(--line);border-radius:9px;padding:3px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;transition:background .1s,border-color .1s;box-sizing:border-box}
  .cal-cell.empty{border:none;background:transparent;cursor:default}
  .cal-cell:hover:not(.empty){background:var(--seal-soft)}
  .cal-cell.today{border-color:var(--brass);border-width:2px}
  .cal-cell.today .cal-num{color:var(--brass);font-weight:700}
  .cal-cell.sel{background:var(--seal);border-color:var(--seal)}
  .cal-cell.sel .cal-num{color:#fff;font-weight:700}
  .cal-cell.sel .cal-dot{outline:1px solid rgba(255,255,255,.5)}
  .cal-num{font-size:13px;color:var(--ink);line-height:1}
  .cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;line-height:0}
  .cal-cell.sel .cal-count{background:#fff;color:var(--seal)}
  /* desktop: give the calendar more height per cell but keep it contained */
  body.desktop-view .cal-cell{height:64px}
  body.desktop-view .cal-num{font-size:14px}
  .folder-banner{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#faf7f0;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;flex-wrap:wrap}
  .dup-warn{background:#fbeaea;border:1px solid #d9a0a0;color:#7a1f1f;border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.5}
  /* ===== redesigned home ===== */
  .serif{font-family:'Iowan Old Style',Palatino,Georgia,serif}
  .today{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .today .greet{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}

  /* ===== Scapia-style shell ===== */
  body{padding-bottom:0}

     A real desktop layout: fixed LEFT SIDEBAR nav + full-width content.

  :root{ --sidebar-w:224px; --content-max:1180px; }

  .act-row{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);position:relative}
  .act-row:last-child{border-bottom:none}
  .act-row[onclick]:hover{background:var(--seal-soft)}
  .act-row[onclick]:active{background:var(--paper)}
  .act-chev{align-self:center;color:var(--muted);font-size:20px;flex:0 0 auto;margin-left:2px}
  .act-row.act-new{background:linear-gradient(90deg,rgba(192,57,43,.05),transparent)}
  .act-ic{font-size:17px;flex:0 0 auto;width:22px;text-align:center}
  .act-main{flex:1;min-width:0}
  .act-text{font-size:13.5px;color:var(--ink);line-height:1.4}
  .act-meta{font-size:11px;color:var(--brass);margin-top:3px}
  .act-newdot{width:8px;height:8px;border-radius:50%;background:#c0392b;flex:0 0 auto;margin-top:5px}
  .switch-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;cursor:pointer}
  .switch-row span{flex:1;font-size:14px;color:var(--ink)}
  .switch-row input[type=checkbox]{width:44px;height:26px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:20px;position:relative;cursor:pointer;flex:0 0 auto;transition:.2s;margin-top:2px}
  .switch-row input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch-row input[type=checkbox]:checked{background:var(--seal)}
  .switch-row input[type=checkbox]:checked::after{left:21px}
  /* On narrow windows, desktop view falls back to the phone bottom-nav layout
     so the sidebar never crowds a small screen. */
  @media(max-width:820px){
    body.desktop-view #appRoot{ padding-left:0; }
    body.desktop-view #appRoot main,
    body.desktop-view .mast,
    body.desktop-view .subnav,
    body.desktop-view .subback{ max-width:100%; }
    body.desktop-view .botnav{
      position:fixed; top:auto; left:0; right:0; bottom:0;
      width:100%; height:calc(72px + env(safe-area-inset-bottom,0px));
      flex-direction:row; justify-content:space-around; align-items:center;
      border-right:none; border-top:1px solid var(--line); padding:0; overflow:visible;
    }
    body.desktop-view .botnav::before{ display:none; }
    body.desktop-view .botnav button{ flex:1; width:auto; flex-direction:column; gap:3px; padding:6px 4px; justify-content:center; text-align:center; }
    body.desktop-view .botnav button .nl{ font-size:10.5px; }
    body.desktop-view .botnav button:hover{ background:none; }
    body.desktop-view .home-actions{ grid-template-columns:repeat(2,1fr)!important; }
  }

  /* home cards */
  .hello{font-size:15px;color:var(--muted);margin:10px 2px 14px}
  .hello b{color:var(--ink)}
  .scard{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .scard h3{margin:0 0 3px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .scard .big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:32px;font-weight:700;color:var(--ink);line-height:1.05;margin-top:4px}
  .scard .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .metric-row{display:flex;gap:12px}
  .metric-row .scard{flex:1;margin-bottom:14px}
  .metric-row .big{font-size:22px}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .qa .qbtn{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:18px 14px;
    text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:10px}
  .qa .qbtn .ic{width:38px;height:38px;border-radius:11px;background:var(--seal-soft,#f3e9e6);display:grid;place-items:center;color:var(--seal)}
  .qa .qbtn .lb{font-size:14.5px;font-weight:600;color:var(--ink)}
  .qa .qbtn .ds{font-size:12px;color:var(--muted);margin-top:-4px}
  .qa.full{grid-template-columns:1fr}
  /* bento grid dashboard */
  .bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .bento-hero{grid-column:1 / -1;background:var(--seal);color:#fff;border-radius:16px;padding:18px}
  .bento-hero .bh-lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;font-weight:600}
  .bento-hero .bh-val{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:700;line-height:1.05;margin-top:5px}
  .bento-hero .bh-sub{font-size:12.5px;opacity:.85;margin-top:5px}
  .bento-tile{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .bento-tile .bt-lbl{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bento-tile .bt-val{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;font-weight:700;color:var(--ink);margin-top:4px}
  .home-actions{display:flex;gap:8px;margin-bottom:12px}
  .home-actions .ha-btn{flex:1;background:var(--paper2);border:1px solid var(--line);border-radius:14px;
    padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;color:var(--seal)}
  .home-actions .ha-btn span{font-size:11.5px;font-weight:600;color:var(--ink)}
  .home-actions .ha-btn svg{width:22px;height:22px}
  .home-actions .ha-btn:active{transform:scale(.97)}
  .scard.compact{padding:15px}
  .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sc-head h3{margin:0}
  .sc-link{background:none;border:none;color:var(--seal);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  /* home cause-list tracker */
  .home-sub{font-size:13.5px;color:var(--muted);margin:-6px 0 16px}
  .hc-grp{margin-bottom:16px}
  .hc-grp-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
  .hc{display:flex;gap:12px;background:var(--paper2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px;cursor:pointer;align-items:flex-start}
  .hc:active{transform:scale(.995)}
  .hc-l{flex-shrink:0;width:76px;text-align:center}
  .hc-when{font-size:13px;font-weight:700;color:var(--ink)}
  .hc-when.od{color:#a3341f}
  .hc-when.td{color:var(--seal)}
  .hc-when.tm{color:var(--brass)}
  .hc-date{font-size:11px;color:var(--muted);margin-top:2px}
  .hc-body{flex:1;border-left:1px solid var(--line2);padding-left:12px}
  .hc-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
  .hc-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .hc-note{font-size:12px;color:var(--brass);margin-top:4px;font-style:italic}
  .billing-toggle{display:flex;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
  .billing-toggle button{flex:1;padding:10px;border:none;border-radius:9px;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .billing-toggle button.on{background:var(--seal);color:#fff}
  .seg-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:2px;font-size:11px;font-weight:700;line-height:18px;text-align:center;border-radius:9px;background:var(--brass);color:#fff;vertical-align:middle}
  .billing-toggle button.on .seg-badge{background:#fff;color:var(--seal)}
  .lrows{margin-top:4px}
  .lrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
  .lrow:first-child{border-top:none}
  .lrow .l .t{font-size:14.5px;color:var(--ink)}
  .lrow .l .s{font-size:12px;color:var(--muted);margin-top:2px}
  .lrow .amt{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 10px}
  .subback{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .subback button{background:var(--paper2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;
    font-size:13px;color:var(--seal);cursor:pointer;font-family:inherit;font-weight:600}
  .subback span{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  /* document folders */
  .folders{display:flex;flex-direction:column;gap:10px}
  .folder{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper2)}
  .folder.misc{border-style:dashed}
  .folder-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;cursor:pointer}
  .folder-head:hover{background:var(--paper)}
  .fh-l{display:flex;align-items:flex-start;gap:10px}
  .fh-caret{color:var(--muted);font-size:13px;margin-top:2px}
  .fh-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
  .fh-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .folder-body{border-top:1px solid var(--line2);padding:6px 15px 12px}
  .drow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line2)}
  .drow:first-child{border-top:none}
  .dr-main{font-size:13.5px;color:var(--ink)}
  .dr-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
  .dr-act{display:flex;gap:4px;flex-shrink:0}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--paper);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
  .tag.q{background:#fef6e6;border-color:#e8d9b0;color:#8a6d1f}
  .tag.c{background:var(--seal-soft);border-color:transparent;color:var(--seal)}
  .tag.f{background:#e9f0ee;border-color:#cfe0da;color:#1f5c54}
  .tag.i{background:#eef0f5;border-color:#d6dae5;color:#48506b}
  .row-act{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--seal);cursor:pointer;font-family:inherit}
  .row-act:hover{background:var(--seal-soft)}
  .bank-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--paper)}
  .bank-row-head{display:flex;align-items:center;gap:10px}
  .bank-row-head .bank-label{flex:1}
  .bank-def{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}

  /* gate */
  .gate-wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
  .gate-wrap .gcard{background:var(--paper2);border:1px solid var(--line);border-radius:18px;padding:24px}
  .gate-wrap h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:26px;color:var(--seal);text-align:center;margin:0 0 4px}
  .gate-wrap .glead{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
  .role-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
  .role-pick button{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:20px 14px;
    cursor:pointer;font-family:inherit;text-align:center}
  .role-pick button.sel{border-color:var(--seal);background:var(--seal-soft,#f3e9e6)}
  .role-pick .rt{font-size:15px;font-weight:700;color:var(--ink)}
  .role-pick .rd{font-size:12px;color:var(--muted);margin-top:4px}

  <section class="panel" id="panel-staff"></section>
  <section class="panel" id="panel-archive"></section>
  <section class="panel" id="panel-data"></section>
  <section class="panel" id="panel-settings"></section>
</main>

<nav class="botnav" id="botnav"></nav>
</div><!-- /appRoot -->

<div id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   FIREBASE BRIDGE (engine side)
   Connects the existing local-first engine to window.FB.
   - Shows a cloud login screen before the app
   - On login: pulls cloud data, or uploads local data first time
   - Wraps save() so each change also pushes to Firestore
   - Listens for remote changes and refreshes the UI
   Degrades gracefully: if FB never loads, the app stays local.
   ============================================================ */
(function(){
  window.__cloudBridge = true;   // tell engine to wait for cloud login

  /* ============================================================
     OWNER EMAIL — the single source of truth for who is the owner.
     ONLY this email address gets the full owner app. Every other
     account that signs in is treated as STAFF (needs approval).
     >>> SET THIS to the chamber owner's exact login email <<<
     ============================================================ */
  var OWNER_EMAIL = "adithdeshmukh@gmail.com";

  /* ============================================================
     CHAMBER NAME shown on the LOGIN PAGE (before anyone signs in).
     Fill these in so your chamber name appears on the sign-in screen
     on every device, including brand-new ones. Leave blank ("") to
     hide a line. These affect the login page only; your in-app
     header/receipts still use whatever you set in Settings.
     >>> SET THESE to your chamber details <<<
     ============================================================ */
  var CHAMBER_LOGIN_NAME  = "Adith Satish Deshmukh";                     // e.g. "Adv. Satish Deshmukh"
  var CHAMBER_LOGIN_DESG  = "Advocate on Record";   // e.g. "Advocate on Record"
  var CHAMBER_LOGIN_COURT = "Supreme Court of India";                     // e.g. "Supreme Court of India"

  function _isOwnerEmail(email){
    return !!email && !!OWNER_EMAIL &&
      email.trim().toLowerCase() === OWNER_EMAIL.trim().toLowerCase();
  }

  let FB = null;
  let _syncing = false;          // guard against listener/save loops
  let _cloudReady = false;
  let _pushQueue = {};           // name -> Set(id) of records to push (debounced)
  let _pushTimer = null;
  let _lastPushedIds = {};   // name -> Set of ids last known in cloud

  // wait for the firebase module to signal ready
  function whenFB(cb){
    if(window.FB){ cb(window.FB); return; }
    window.addEventListener("firebase-ready", ()=>cb(window.FB), {once:true});
    // safety: if module fails to load in 8s, proceed offline
    setTimeout(()=>{ if(!window.FB) cb(null); }, 8000);
  }

  // ---------- LOGIN SCREEN ----------
  function showCloudLogin(mode){
    let ov=document.getElementById("cloudGate");
    if(!ov){
      ov=document.createElement("div"); ov.id="cloudGate";
      ov.style.cssText="position:fixed;inset:0;z-index:9000;background:var(--paper,#f6f4ef);display:flex;align-items:center;justify-content:center;padding:20px";
      document.body.appendChild(ov);
    }
    ov.style.display="flex";
    var _lb=(function(){ try{ return {
      name: localStorage.getItem("asd_login_name")||"",
      desg: localStorage.getItem("asd_login_desg")||"",
      court: localStorage.getItem("asd_login_court")||""
    }; }catch(e){ return {name:"",desg:"",court:""}; } })();
    // Hardcoded config (set at top of this file) takes priority so the name
    // shows on EVERY device, including new ones; else fall back to what this
    // device remembered from the last successful sign-in.
    var _bName  = (typeof CHAMBER_LOGIN_NAME==="string"  && CHAMBER_LOGIN_NAME.trim())  ? CHAMBER_LOGIN_NAME.trim()  : _lb.name;
    _bName = String(_bName||"").replace(/^\s*(the\s+)?chambers?\s+of\s+/i,"").trim();
    var _bDesg  = (typeof CHAMBER_LOGIN_NAME==="string"  && CHAMBER_LOGIN_NAME.trim())  ? (CHAMBER_LOGIN_DESG||"")    : _lb.desg;
    var _bCourt = (typeof CHAMBER_LOGIN_NAME==="string"  && CHAMBER_LOGIN_NAME.trim())  ? (CHAMBER_LOGIN_COURT||"")   : _lb.court;
    var _esc=function(s){ return String(s||"").replace(/</g,"&lt;"); };
    var _crest = `<svg viewBox="0 0 170 110" width="120" height="78" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 15px">
      <g font-family="'Iowan Old Style',Palatino,Georgia,serif" font-weight="700" text-anchor="middle">
        <text x="46" y="82" font-size="86" fill="var(--seal,#6b1f1f)" opacity=".9">A</text>
        <text x="118" y="82" font-size="86" fill="var(--seal,#6b1f1f)" opacity=".9">D</text>
        <text x="83" y="86" font-size="104" fill="var(--brass,#9a7b3f)">S</text>
      </g>
    </svg>`;
    var _brand = _bName ? `
        <div style="text-align:center;margin-bottom:26px">
          ${_crest}
          <div style="display:inline-flex;align-items:center;gap:13px;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted,#8a8175);font-weight:600;margin-bottom:10px">
            <span style="width:30px;height:1px;background:var(--line,#e6e0d4);display:inline-block"></span>Chambers of<span style="width:30px;height:1px;background:var(--line,#e6e0d4);display:inline-block"></span>
          </div>
          <div style="font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:clamp(34px,8.4vw,50px);font-weight:700;color:var(--seal,#6b1f1f);line-height:1.04;letter-spacing:.01em;max-width:none;margin:0 auto">${_esc(_bName)}</div>
          ${_bDesg?`<div style="font-size:14px;color:#3a352e;font-weight:600;margin-top:12px;letter-spacing:.32em;text-transform:uppercase;opacity:.82">${_esc(_bDesg)}</div>`:""}
          ${_bCourt?`<div style="display:inline-block;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--brass,#9a7b3f);font-weight:700;margin-top:15px;padding-top:14px;position:relative">
            <span style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:2px;border-radius:2px;background:var(--brass,#9a7b3f);opacity:.55"></span>${_esc(_bCourt)}</div>`:""}
        </div>` : "";
    ov.innerHTML=`
      <div style="background:var(--paper2,#fffdf8);border:1px solid var(--line,#e6e0d4);border-radius:18px;padding:30px 34px;max-width:560px;width:100%;box-shadow:0 6px 30px rgba(0,0,0,.06)">
        ${_brand}
        <div style="font-family:'Iowan Old Style',Palatino,Georgia,serif;color:var(--ink,#3a352e);font-size:16px;font-weight:700;margin-bottom:3px;letter-spacing:.02em">${mode==="create"?"Create your login":"Chamber sign in"}</div>
        <div style="color:var(--muted,#8a8175);font-size:13px;margin-bottom:18px">${mode==="create"?"Staff: create your own login here. The chamber owner will approve you once, then you can start recording entries.":"Sign in with your email and password."}</div>
        <label style="display:block;font-size:12px;color:var(--muted,#8a8175);font-weight:600;margin-bottom:5px">Email</label>
        <input id="cgEmail" type="email" autocomplete="username" style="width:100%;padding:12px;border:1px solid var(--line,#e6e0d4);border-radius:11px;font-size:15px;font-family:inherit" placeholder="you@email.com">
        <label style="display:block;font-size:12px;color:var(--muted,#8a8175);font-weight:600;margin:12px 0 5px">Password</label>
        <input id="cgPw" type="password" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid var(--line,#e6e0d4);border-radius:11px;font-size:15px;font-family:inherit" placeholder="${mode==="create"?"At least 6 characters":"Your password"}" onkeydown="if(event.key==='Enter')window._cloudSubmit()">
        <button onclick="window._cloudSubmit()" style="width:100%;padding:13px;border:none;border-radius:11px;background:var(--seal,#6b1f1f);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit">${mode==="create"?"Create login":"Sign in"}</button>
        <button onclick="window._cloudToggle()" style="width:100%;padding:11px;border:1px solid var(--line,#e6e0d4);border-radius:11px;background:var(--paper,#f6f4ef);color:var(--seal,#6b1f1f);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:9px;font-family:inherit">${mode==="create"?"I already have a login — sign in":"New here? Create a login"}</button>
        <button onclick="window._cloudForgot()" style="width:100%;padding:9px;border:none;background:none;color:var(--muted,#8a8175);font-size:12.5px;cursor:pointer;margin-top:6px;font-family:inherit">Forgot password?</button>
        <div id="cgMsg" style="margin-top:14px;font-size:13px;line-height:1.5;min-height:18px"></div>
        <div id="cgStatus" style="margin-top:6px;font-size:11.5px;color:var(--muted,#8a8175);text-align:center"></div>
      </div>`;
    ov._mode = mode;
    if(!FB){ setMsg("err","Cloud not reachable right now. Check your connection and reload."); }
    try{ if(sessionStorage.getItem("asd_autologout")==="1"){ sessionStorage.removeItem("asd_autologout"); setMsg("ok","You were signed out after a period of inactivity. Please sign in again."); } }catch(e){}
  }
  // Resolve the given promise, or resolve with `fallback` if it takes longer
  // than `ms`. Never rejects — used so a slow cloud pull can't hang login.
  function _withTimeout(promise, ms, fallback){
    return new Promise(function(resolve){
      var done=false;
      var t=setTimeout(function(){ if(!done){ done=true; resolve({__timedOut:true, value:fallback}); } }, ms);
      Promise.resolve(promise).then(function(v){
        if(!done){ done=true; clearTimeout(t); resolve({__timedOut:false, value:v}); }
      }).catch(function(e){
        if(!done){ done=true; clearTimeout(t); resolve({__timedOut:true, value:fallback, error:e}); }
      });
    });
  }
  function hideCloudLogin(){ const o=document.getElementById("cloudGate"); if(o) o.style.display="none"; }
  function showAccessDenied(locked){
    hideCloudLogin();
    let ov=document.getElementById("accessGate");
    if(!ov){ ov=document.createElement("div"); ov.id="accessGate";
      ov.style.cssText="position:fixed;inset:0;z-index:9200;background:var(--paper,#f6f4ef);display:flex;align-items:center;justify-content:center;padding:22px"; document.body.appendChild(ov); }
    ov.style.display="flex";
    ov.innerHTML=`<div style="background:var(--paper2,#fffdf8);border:1px solid var(--line,#e6e0d4);border-radius:18px;padding:30px;max-width:400px;width:100%;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.06)">
      <div style="font-size:34px;margin-bottom:8px">🔒</div>
      <div style="font-family:'Iowan Old Style',Palatino,Georgia,serif;color:var(--seal,#6b1f1f);font-size:21px;font-weight:700;margin-bottom:8px">Access restricted</div>
      <div style="color:var(--muted,#8a8175);font-size:14px;line-height:1.6;margin-bottom:18px">${locked
        ? "This chamber app is temporarily locked by the Head of Chamber. Please try again later."
        : "This is a private chamber app. Your account isn't authorised to use it. Please contact the Head of Chamber to request access."}</div>
      <button onclick="location.reload()" style="width:100%;padding:12px;border:1px solid var(--line,#e6e0d4);border-radius:11px;background:var(--paper,#f6f4ef);color:var(--seal,#6b1f1f);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">Try again</button>
    </div>`;
  }
  window.showAccessDenied=showAccessDenied;
  function setMsg(kind,text){
    const m=document.getElementById("cgMsg"); if(!m) return;
    const col = kind==="err"?"var(--seal,#6b1f1f)":kind==="ok"?"var(--green,#1f6b4a)":"var(--muted,#8a8175)";
    m.style.color=col; m.innerHTML=text;
  }
  function setStatus(t){ const s=document.getElementById("cgStatus"); if(s) s.textContent=t; }

  function friendly(e){
    const c=e&&e.code?e.code:"";
    const map={
      "auth/invalid-email":"That email doesn't look right.",
      "auth/missing-password":"Enter a password.",
      "auth/weak-password":"Password needs at least 6 characters.",
      "auth/email-already-in-use":"That email already has an account — use Sign in instead.",
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/user-not-found":"No account with that email — create one.",
      "auth/too-many-requests":"Too many tries. Wait a minute.",
      "auth/network-request-failed":"Network problem — check your connection.",
      "auth/operation-not-allowed":"Email/Password sign-in isn't enabled in Firebase."
    };
    return (map[c]||(e&&e.message)||"Something went wrong.");
  }

  window._cloudToggle=function(){
    const o=document.getElementById("cloudGate");
    showCloudLogin(o&&o._mode==="create"?"login":"create");
  };
  window._cloudForgot=async function(){
    if(!FB) return;
    const email=(document.getElementById("cgEmail")||{}).value||"";
    if(!email.trim()){ setMsg("err","Type your email first, then tap Forgot password."); return; }
    try{ await FB.resetEmail(email.trim()); setMsg("ok","Reset email sent to "+email.trim()+"."); }
    catch(e){ setMsg("err",friendly(e)); }
  };
  window._cloudSubmit=async function(){
    if(!FB){ setMsg("err","Cloud not reachable. Reload the page."); return; }
    const o=document.getElementById("cloudGate"); const mode=o?o._mode:"login";
    const email=(document.getElementById("cgEmail").value||"").trim();
    const pw=document.getElementById("cgPw").value||"";
    if(!email||!pw){ setMsg("err","Enter email and password."); return; }
    setMsg("info", mode==="create"?"Creating account…":"Signing in…");
    try{
      if(mode==="create") await FB.createOwner(email,pw);
      else await FB.login(email,pw);
      // onAuthStateChanged handles the rest
    }catch(e){ setMsg("err",friendly(e)); }
  };

  // ---------- SYNC ORCHESTRATION ----------
  async function onSignedIn(){
    setMsg("ok","Signed in ✓"); setStatus("Loading…");
    try{
      const myUid = FB.uid();
      const myEmail = FB.email();

      // DECISIVE ROLE GATE: only the designated owner email is the owner.
      // Everyone else is staff, no matter what's in any account.
      const owner = _isOwnerEmail(myEmail);

      // MASTER ACCESS GATE: the owner controls who may use the app at all.
      // The owner always passes. Everyone else must be on the allow-list and
      // the app must not be locked. Enforced before any data or shell loads.
      if(!owner){
        let access=null;
        try{ access = await FB.getAccess(); }catch(e){ access=null; }
        if(access){
          const listRaw = Array.isArray(access.allow) ? access.allow : [];
          const allow = listRaw.map(x=>String(x||"").trim().toLowerCase()).filter(Boolean);
          const me = String(myEmail||"").trim().toLowerCase();
          const locked = access.locked===true;
          const listActive = access.allowActive===true; // only enforce list when the owner has turned it on
          if(locked || (listActive && allow.indexOf(me)<0)){
            try{ await FB.logout(); }catch(e){}
            showAccessDenied(locked);
            return;
          }
        }
      }

      if(!owner){
        await startStaffSession(myUid, myEmail);
        return;
      }

      // --- OWNER PATH (only reached by the designated owner email) ---
      if(FB) FB.role="owner";
      DB.deviceRole = "owner";
      DB.settings.ownerUid = myUid;   // record for reference
      setStatus("Loading your chamber records…");

      // Pull the cloud data, but never let a slow/stalled pull hang the login.
      // If it doesn't return within the timeout, we enter the app with whatever
      // is already local and let the live listeners fill in the cloud data.
      const pulled = await _withTimeout(FB.pullAll(), 12000, null);
      const cloud = pulled.value;

      if(cloud){
        const hasCloudData = (cloud.settings) ||
          FB.COLLECTIONS.some(n=>Array.isArray(cloud[n]) && cloud[n].length>0);
        if(hasCloudData){
          _syncing=true;
          if(cloud.settings) DB.settings = Object.assign({}, DB.settings, cloud.settings);
          if(cloud.counters) DB.counters = Object.assign({}, DB.counters, cloud.counters);
          FB.COLLECTIONS.forEach(n=>{ if(Array.isArray(cloud[n])) DB[n]=cloud[n]; });
          stripMeta();
          DB.settings.ownerUid = myUid;
          saveLocalOnly();
          _syncing=false;
          setStatus("Loaded from cloud ✓");
        }else{
          // No cloud data yet: this is a first-time setup. Seed the cloud.
          setStatus("Setting up your cloud database…");
          try{ await _withTimeout(FB.pushEntireDB(DB), 12000, null); }catch(e){}
          try{ await _withTimeout(FB.pushSettings(DB.settings), 8000, null); }catch(e){}
          setStatus("Cloud database ready ✓");
        }
      }else{
        // Pull timed out or failed. Enter the app with local data; the live
        // listeners below will sync the cloud in as soon as it responds.
        setStatus("Slow connection — opening with saved data. Syncing in the background…");
      }

      _cloudReady=true;
      FB.COLLECTIONS.forEach(n=>{ _lastPushedIds[n]=new Set((DB[n]||[]).map(r=>r.id)); });
      // These must ALWAYS run so the owner is never stranded on the loading
      // screen. Each is guarded so one failure can't block the others.
      try{ startRemoteListeners(); }catch(e){ console.warn("owner listeners", e); }
      try{ startInboxListener(); }catch(e){ console.warn("owner inbox listener", e); }
      hideCloudLogin();
      try{ if(window.bootAfterCloud) window.bootAfterCloud(); }catch(e){ console.warn("bootAfterCloud", e); }
      if(window._startIdleTimer) try{ window._startIdleTimer(); }catch(e){}
    }catch(e){
      console.error(e);
      setMsg("err","Could not load your data: "+(e&&e.message?e.message:e)+". You can retry, or work offline.");
      setStatus("");
    }
  }

  function stripMeta(){
    // remove Firestore-only fields from records so they don't leak into UI/logic
    FB.COLLECTIONS.forEach(n=>{ (DB[n]||[]).forEach(r=>{ delete r._updated; }); });
    if(DB.settings) delete DB.settings._updated;
    if(DB.counters) delete DB.counters._updated;
  }

  function startRemoteListeners(){
    FB.startListeners(
      (name, records)=>{
        if(_syncing) return;
        _syncing=true;
        DB[name]=records; records.forEach(r=>delete r._updated);
        saveLocalOnly();
        if(DB.deviceRole==="staff"){
          if(window._staffRefresh) try{ _staffRefresh(); }catch(e){}
        }else{
          if(window.renderAll) try{ renderAll(); }catch(e){}
          if(window._shellRefresh) try{ _shellRefresh(); }catch(e){}
        }
        _syncing=false;
      },
      (settings)=>{
        if(_syncing) return;
        _syncing=true;
        delete settings._updated;
        DB.settings=Object.assign({},DB.settings,settings);
        saveLocalOnly();
        if(window.applyBranding) try{ applyBranding(); }catch(e){}
        if(window.renderAll) try{ renderAll(); }catch(e){}
        _syncing=false;
      },
      (counters)=>{
        if(_syncing) return;
        delete counters._updated;
        DB.counters=Object.assign({},DB.counters,counters);
        saveLocalOnly();
      }
    );
  }

  // ---------- STAFF SESSION (non-owner login) ----------
  // Staff read/write only their own inbox + their own staffdir profile.
  let _staffDirUnsub=null, _myInboxUnsub=null;
  async function startStaffSession(myUid, myEmail){
    if(FB) FB.role="staff";
    setStatus("Loading the chamber…");
    // Read/create staff profile (approval status).
    let prof=null;
    try{ prof = await FB.getStaffDir(myUid); }catch(e){ console.warn("getStaffDir failed", e); }
    if(!prof){
      prof = { email:myEmail||"", name:"", status:"pending", registeredAt:new Date().toISOString() };
      try{ await FB.putStaffDir(myUid, prof); }catch(e){ console.warn("putStaffDir failed", e); }
    }
    window.__staff = { uid:myUid, email:myEmail, profile:prof, inbox:[] };
    DB.deviceRole = "staff";
    _cloudReady=true;

    // Pull SHARED chamber data (matters, expenses, docs, filings, advances, staff).
    try{
      const cloud = await FB.pullAll();   // staff role -> only shared collections
      _syncing=true;
      FB.SHARED.forEach(n=>{ if(Array.isArray(cloud[n])) DB[n]=cloud[n]; });
      stripMeta();
      saveLocalOnly();
      _syncing=false;
      // seed ids for deletion reconciliation
      FB.SHARED.forEach(n=>{ _lastPushedIds[n]=new Set((DB[n]||[]).map(r=>r.id)); });
    }catch(e){ console.warn("staff pullAll failed", e); }

    // Enter shell now (never hang).
    hideCloudLogin();
    try{ if(window.enterStaffShell) window.enterStaffShell(); }catch(e){ console.warn("enterStaffShell", e); }
    if(window._startIdleTimer) try{ window._startIdleTimer(); }catch(e){}

    // Live listeners on shared data + own profile.
    try{ startRemoteListeners(); }catch(e){ console.warn("staff listeners", e); }
    try{
      if(_staffDirUnsub) _staffDirUnsub();
      _staffDirUnsub = FB.listenStaffDir(myUid, p=>{
        if(p){ window.__staff.profile = p; if(window.renderStaffHome && DB.deviceRole==="staff") try{ if(_shellTabIsHome()) renderStaffHome(); }catch(e){} }
      });
    }catch(e){ console.warn("listenStaffDir", e); }
  }
  function _shellTabIsHome(){ try{ return document.getElementById("panel-home").classList.contains("active"); }catch(e){ return false; } }

  // ---------- OWNER: watch the staff inbox + directory ----------
  let _inboxUnsub=null, _dirUnsub=null;
  function startInboxListener(){
    if(_dirUnsub) _dirUnsub();
    _dirUnsub = FB.listenStaffDirAll(list=>{
      _syncing=true;
      list.forEach(d=>{
        // Removed/blocked people stay OFF the roster unless they re-register (pending/approved).
        if(d.status==="removed" || d.status==="blocked"){
          DB.staff = DB.staff.filter(x=>x.uid!==d.uid);
          return;
        }
        let s=DB.staff.find(x=>x.uid===d.uid);
        if(!s){ s={uid:d.uid}; DB.staff.push(s); }
        s.email=d.email||s.email; s.name=d.name||s.name||d.email||"Staff";
        if(!s.status) s.status = d.status||"pending";
        if(s.status!=="approved" && d.status) s.status=d.status;
      });
      saveLocalOnly();
      _syncing=false;
      if(window._shellRefresh) try{ _shellRefresh(); }catch(e){}
      if(document.getElementById("panel-advances") && document.getElementById("panel-advances").classList.contains("active")){ try{ renderAdvances(); }catch(e){} }
    });
    // Inbox model retired: staff now write shared data directly. No inbox listener.
  }

  // Bring inbox entries into DB.advances/docs as pending, without duplicating.
  function ingestInbox(items){
    if(!Array.isArray(items)) return;
    _syncing=true;
    let changed=false;
    items.forEach(it=>{
      if(!it || !it.kind) return;
      if(it.kind==="advance-entry"){
        // money entry: appears in DB.advances as pending (dedupe by inboxId)
        const exists = DB.advances.find(a=>a.inboxId===it.id);
        if(!exists){
          DB.advances.push({ id:(window.uid?uid():("adv"+Date.now()+Math.random())),
            inboxId:it.id, staffUid:it.staffUid, staffName:it.staffName||"",
            date:it.date||todayISO(), type:it.type, amount:+it.amount||0,
            note:it.note||"", head:it.head||null, payee:it.payee||null,
            status:"pending", createdBy:"staff", createdAt:it.createdAt||new Date().toISOString(),
            acceptedAt:null, expenseId:null });
          changed=true;
        }
      }else if(it.kind==="document"){
        const isCourt = it.docKind==="court";
        const target = isCourt ? "docsFiled" : "docsIn";
        if(!Array.isArray(DB[target])) DB[target]=[];
        const exists=(DB[target]||[]).find(d=>d.inboxId===it.id);
        if(!exists){
          DB[target].push({ id:(window.uid?uid():("doc"+Date.now())), inboxId:it.id,
            date:it.date||todayISO(), title:it.title||"Staff upload",
            docType:isCourt?"Court file":"Inward",
            source:it.staffName||"Staff",
            matterId:"", matterText:it.matterText||"",
            note:(it.note||"")+(it.matterText?(" ["+it.matterText+"]"):"")+" — via "+(it.staffName||"staff"),
            files:it.files||[] });
          changed=true;
        }
      }
    });
    if(changed) saveLocalOnly();
    _syncing=false;
    if(changed && window._shellRefresh) try{ _shellRefresh(); }catch(e){}
    if(changed && document.getElementById("panel-advances") && document.getElementById("panel-advances").classList.contains("active")){
      try{ renderAdvances(); }catch(e){}
    }
  }
  window.__ingestInbox = ingestInbox;

  // queue a push of changed records (debounced), reconciling deletions
  function queueFullPush(){
    if(!_cloudReady || !FB || _syncing) return;
    clearTimeout(_pushTimer);
    _pushTimer=setTimeout(async ()=>{
      try{
        await FB.pushSettings(DB.settings);
        await FB.pushCounters(DB.counters);
        for(const name of FB.COLLECTIONS){
          const arr = DB[name]||[];
          await FB.pushCollection(name, arr);
          // reconcile deletions: any id previously present but now gone -> delete in cloud
          const currentIds = new Set(arr.map(r=>r.id));
          const prev = _lastPushedIds[name];
          if(prev){
            for(const oldId of prev){
              if(!currentIds.has(oldId)){ try{ await FB.deleteRecord(name, oldId); }catch(e){} }
            }
          }
          _lastPushedIds[name] = currentIds;
        }
      }catch(e){ console.warn("push failed",e); }
    }, 400);
  }

  // ---------- HOOK save() ----------
  let saveLocalOnly = null;
  function installSaveHook(){
    if(typeof window.save!=="function") return;
    const origSave = window.save;
    saveLocalOnly = origSave;
    window.save = function(){
      origSave.apply(this, arguments);   // keep local persistence
      queueFullPush();                    // mirror to cloud
    };
  }

  // ---------- BOOT ----------
  window.onFirebaseAuth = function(user){
    if(user){ onSignedIn(); }
    else { _cloudReady=false; if(FB) FB.stopListeners(); showCloudLogin("login"); }
  };

  function start(){
    whenFB(function(fb){
      FB=fb;
      installSaveHook();
      if(!FB){ // no cloud — run purely local (old behaviour)
        if(window.bootAfterCloud) window.bootAfterCloud();
        return;
      }
      // FB present; auth state callback will drive login/boot
      if(FB.user===null){ showCloudLogin("login"); }
      else if(FB.user){ onSignedIn(); }
      else { showCloudLogin("login"); }
    });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
