<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASDC</title>
<style>
  :root{
    --ink:#1a1a18;
    --paper:#f6f4ef;        /* calm app background */
    --paper2:#ffffff;       /* card */
    --line:#eae6dd;         /* hairline */
    --line2:#f0ece3;
    --seal:#6b1f1f;         /* oxblood accent (owner) */
    --seal2:#8a2b2b;
    --seal-soft:#f3e9e6;
    --brass:#9a7b3f;
    --green:#33543f;
    --muted:#8a8478;
    --shadow:0 1px 2px rgba(26,26,24,.03);
    --radius:16px;
  }
  body.staff-theme{
    --seal:#1f5c54; --seal2:#2a6f66; --seal-soft:#e6f0ee; --brass:#c08a2d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;
    overflow-x:hidden;max-width:100%}
  body{padding-bottom:80px}
  h1,h2,h3{font-weight:600;letter-spacing:.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .mono{font-family:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}

  /* ---------- top masthead ---------- */
  header.mast{
    background:linear-gradient(180deg,#fffdf8,#f4efe3);
    border-bottom:2px solid var(--ink);
    padding:18px 22px 14px;position:sticky;top:0;z-index:40;
    box-shadow:0 2px 0 var(--brass), 0 6px 18px rgba(26,26,24,.05)}
  .mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    max-width:1080px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-seal{width:46px;height:46px;flex:none;display:grid;place-items:center}
  .brand-seal svg{display:block}
  .brand h1{font-size:21px;line-height:1.05}
  .brand .sub{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin-top:3px}
  .mode-pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);background:var(--paper2);color:var(--muted);
    padding:3px 9px;border-radius:20px}

  /* ---------- tab nav ---------- */
  nav.tabs{max-width:1080px;margin:0 auto;display:flex;gap:2px;
    border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:none;border:none;padding:11px 16px 9px;
    font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;
    white-space:nowrap;letter-spacing:.01em;flex:0 0 auto}
  nav.tabs button.active{color:var(--seal);border-bottom-color:var(--seal);font-weight:600}
  nav.tabs button:hover{color:var(--ink)}

  main{max-width:1080px;margin:0 auto;padding:22px;width:100%;box-sizing:border-box}
  .panel{display:none}
  .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- cards / layout ---------- */
  .card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 1px 2px rgba(26,26,24,.03);padding:20px;margin-bottom:14px}
  .card h2{font-size:15px;margin-bottom:3px;font-weight:700;letter-spacing:.01em}
  .card .hint{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
    font-weight:700;margin-bottom:6px}

  .grid{display:grid;gap:13px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:680px){.g2,.g3{grid-template-columns:1fr}}

  label.fld{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;font-weight:500}
  label.fld span.req{color:var(--seal)}
  input.in,select.in,textarea.in{width:100%;padding:12px 13px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink);font-size:15px;transition:border .15s,box-shadow .15s}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--seal);
    box-shadow:0 0 0 3px var(--seal-soft,rgba(107,31,31,.1))}
  textarea.in{resize:vertical;min-height:62px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--seal);
    background:var(--seal);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;
    letter-spacing:.01em;transition:transform .06s, opacity .15s;
    white-space:nowrap;flex-shrink:0;flex-grow:0;width:auto;max-width:100%;line-height:1.2;cursor:pointer}
  .btn:hover{opacity:.92}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--seal);border-color:var(--line)}
  .btn.ghost:hover{background:var(--seal-soft,#f3e9e6);opacity:1}
  .btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
  .btn.seal:hover{opacity:.92}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .primary{display:block;width:100%;background:var(--seal);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:2px}
  .primary:active{transform:translateY(1px);opacity:.92}
  /* TDS segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper2)}
  .seg-btn{background:none;border:none;padding:10px 20px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600}
  .seg-btn.on{background:var(--seal);color:#fff}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--seal-soft);border:1px solid transparent;color:var(--seal);border-radius:20px;
    padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--seal)}
  .fee-preview{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:13px 15px;
    font-size:15px;color:var(--muted)}
  .fee-preview .fp-g{font-weight:700;color:var(--ink)}
  .fee-preview .fp-t{color:var(--brass);font-weight:600}
  .fee-preview .fp-n{color:var(--seal);font-weight:700}
  .fee-preview .fp-sep{color:var(--line);margin:0 4px}
  .fee-preview .fp-muted{color:var(--muted)}
  .in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;
    color:var(--ink);font-size:15px;font-family:inherit}
  .in:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;align-items:stretch}
  .btn-row > .btn{flex:0 0 auto}
  /* card header: title block shrinks, button keeps full width, wraps on narrow screens */
  .card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .card-head > div:first-child{flex:1 1 240px;min-width:0}
  .card-head > button, .card-head > .btn{flex:0 0 auto}
  @media(max-width:520px){
    .card-head > button, .card-head > .btn{width:100%}
  }

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:380px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;position:relative;overflow:visible;min-width:0}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);border-radius:var(--radius) 0 0 var(--radius)}
  .stat.green::before{background:var(--green)}
  .stat.seal::before{background:var(--seal)}
  .stat.brass::before{background:var(--brass)}
  .stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    white-space:normal;overflow-wrap:break-word;line-height:1.3}
  .stat .v{font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
  .stat .vsub{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper2)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  thead th{background:#efe9db;text-align:left;padding:10px 12px;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line2)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fbf8f1}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    border:1px solid var(--line);color:var(--muted);background:#fff}
  .tag.active{color:var(--green);border-color:#bcd2c2;background:#f0f6f1}
  .tag.closed{color:var(--muted)}
  .row-act{color:var(--seal);font-size:12.5px;background:none;border:none;padding:2px 6px}
  .row-act:hover{text-decoration:underline}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fdf9f0;padding:11px 20px;border-radius:6px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.warn{background:var(--seal)}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(26,26,24,.42);display:none;
    place-items:center;z-index:80;padding:18px}
  .modal-bg.show{display:grid}
  .modal{background:var(--paper2);border-radius:8px;max-width:560px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper2)}
  .modal-h h3{font-size:17px}
  .modal-b{padding:20px}
  .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
  .x:hover{color:var(--ink)}

  .note{font-size:12.5px;color:var(--muted);background:#fbf6ea;border:1px solid var(--line2);
    border-left:3px solid var(--brass);padding:10px 12px;border-radius:4px;margin-top:12px}

  /* ====== PRINTABLE DOCUMENTS — centred head, prominent type ====== */
  #receiptArea{position:fixed;left:-9999px;top:0}
  .doc{width:720px;background:#fff;color:#222;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum";}
  .doc-pad{padding:52px 60px 44px}
  .doc-compact .doc-pad{padding:40px 56px 32px}
  .doc *{box-sizing:border-box}

  /* letterhead — CENTRED, name most prominent */
  .dh{text-align:center;padding-bottom:14px;border-bottom:2px solid #1a1a18;margin-bottom:0}
  .dh-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;font-weight:700;
    letter-spacing:.01em;color:#1a1a18;line-height:1.1}
  .doc-compact .dh-name{font-size:27px}
  .dh-adv{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px;font-weight:600;color:#1a1a18;margin-top:3px}
  .dh-line{font-size:12px;color:#5a554c;margin-top:3px;line-height:1.5}
  .dh-ids{font-size:11px;color:#8a847a;margin-top:5px;letter-spacing:.02em}

  /* document type — CENTRED, big, prominent (2nd row) */
  .doc-type{text-align:center;font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);
    margin:18px 0 16px;padding-bottom:2px}
  .doc-compact .doc-type{font-size:21px;margin:14px 0 12px}

  /* number (left) + date (right) row */
  .doc-row2{display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 0;border-top:1px solid #e8e4dc;border-bottom:1px solid #e8e4dc}
  .dr-lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8a298;font-weight:600}
  .doc-row2 b{font-size:14px;color:#1a1a18}
  .doc-from{margin:14px 0 20px;font-size:13.5px;color:#2a2620;line-height:1.7}
  .doc-from .dr-lbl{margin-right:4px}
  .doc-from>div{margin-top:2px}
  .doc-from b{color:#1a1a18}

  /* legacy (unused) */
  .lh,.doc-band,.doc-meta,.lh-rule,.doc-thanks,.doc-stamp{display:none}

  /* ===== RECEIPT ===== */
  .rcpt-body{font-size:15px;line-height:1.9;color:#3a352e;margin:0;font-weight:400;max-width:560px}
  .rcpt-body b{color:#1a1a18;font-weight:600}
  .rcpt-amt{margin-top:40px;display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid #1a1a18;padding-top:16px}
  .rcpt-amt .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a8a298;font-weight:600}
  .rcpt-amt .val{font-size:26px;font-weight:600;color:#1a1a18;letter-spacing:.005em;
    font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .rcpt-tds{margin-top:26px;font-size:13px;color:#3a352e;max-width:340px}
  .rcpt-tds>div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0ece2}
  .rcpt-tds>div span:last-child{font-variant-numeric:tabular-nums}
  .rcpt-tds .net{border-bottom:none;border-top:1.5px solid #1a1a18;margin-top:2px;padding-top:8px;font-weight:600;color:#1a1a18}

  /* ===== INVOICE ===== */
  .inv-to{margin:0 0 30px}
  .inv-to .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8a298;font-weight:600;display:block;margin-bottom:6px}
  .inv-to b{font-size:15px;color:#1a1a18;font-weight:600}
  .inv-to{font-size:13px;color:#6a655c;line-height:1.6}
  table.inv{width:100%;border-collapse:collapse;font-size:13.5px;margin:0}
  table.inv thead th{background:transparent;text-align:left;padding:0 0 12px;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:600;color:#a8a298;border-bottom:1px solid #1a1a18}
  table.inv thead th.r{text-align:right}
  table.inv tbody td{padding:14px 0;border-bottom:1px solid #ede9e1;vertical-align:top;color:#2a2620;line-height:1.5}
  .doc-compact table.inv tbody td{padding:9px 0}
  table.inv tbody td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#1a1a18}
  table.inv tbody td:first-child{color:#b8b2a8;width:30px}
  .inv-tot{margin-top:18px;display:flex;justify-content:flex-end}
  .doc-compact .inv-tot{margin-top:12px}
  .inv-tot table{border-collapse:collapse;font-size:13.5px;min-width:300px}
  .inv-tot td{padding:7px 0}
  .doc-compact .inv-tot td{padding:5px 0}
  .inv-tot td.lbl{color:#7a756c;padding-right:40px}
  .inv-tot td.r{text-align:right;font-variant-numeric:tabular-nums;color:#1a1a18}
  .inv-tot tr.grand td{border-top:2px solid #1a1a18;padding-top:14px;font-weight:600;font-size:17px;color:#1a1a18;
    font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .doc-compact .inv-tot tr.grand td{padding-top:10px;font-size:16px}
  .inv-words{font-size:12px;color:#9a948a;margin-top:14px;letter-spacing:.01em}
  .doc-compact .inv-words{margin-top:10px}
  .inv-pay{margin-top:30px;padding:0;font-size:12px;color:#6a655c;line-height:1.6}
  .doc-compact .inv-pay{margin-top:16px}
  .inv-pay b{color:#1a1a18;font-weight:600}
  .inv-bank{margin-top:24px;border:1px solid #ede9e1;border-radius:6px;padding:16px 18px;display:flex;gap:20px;align-items:center}
  .doc-compact .inv-bank{margin-top:16px;padding:13px 16px}
  .inv-bank-t{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#a8a298;font-weight:600;margin-bottom:10px}
  .inv-bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
  .doc-compact .inv-bank-grid{gap:5px 28px}
  .inv-bank-grid>div{display:flex;flex-direction:column;gap:2px}
  .inv-bank-grid span{font-size:10px;color:#a8a298;letter-spacing:.02em}
  .inv-bank-grid b{font-size:12.5px;color:#1a1a18;font-weight:600;font-variant-numeric:tabular-nums}
  .inv-qr{text-align:center;flex:none}
  .inv-qr svg{display:block;border:1px solid #ede9e1;border-radius:4px}
  .inv-qr-c{font-size:9.5px;color:#7a756c;margin-top:5px;letter-spacing:.02em}

  /* shared footer — minimal signature */
  .doc-foot{display:flex;justify-content:flex-end;align-items:flex-end;margin-top:52px}
  .doc-compact .doc-foot{margin-top:30px}
  .doc-sign{text-align:center;font-size:12px;color:#7a756c}
  .doc-sign .line{border-top:1px solid #c5bfb4;width:200px;margin:0 auto 8px}
  .doc-sign .who{font-weight:600;color:#1a1a18;font-size:13px}
  .doc-note{font-size:9.5px;color:#b0a99e;margin-top:34px;border-top:1px solid #ede9e1;padding-top:12px;
    line-height:1.6;font-weight:400}
  .doc-compact .doc-note{margin-top:20px;padding-top:9px}

  @media print{
    body *{visibility:hidden}
    #receiptArea,#receiptArea *{visibility:visible}
    #receiptArea{position:absolute;left:0;top:0;width:100%}
    .doc{width:100%}
    .doc-pad{padding:4mm 3mm}
    .tpl{width:100%}
    @page{margin:0}
  }

  /* ============================================================
     NEW TEMPLATE STYLE (inspired by uploaded reference)
     monogram masthead · label:value rows · boxed amount ·
     mode-of-payment · dark footer band. tpl-* classes.
     ============================================================ */
  .tpl{width:720px;background:#fff;color:#2a2620;position:relative;overflow:hidden;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum"}
  .tpl *{box-sizing:border-box}
  .tpl-corner{position:absolute;top:0;right:0;width:0;height:0;
    border-top:112px solid var(--accent,#efe6cf);border-left:112px solid transparent}
  .tpl-body{padding:40px 46px 0}
  .tpl-mast{display:flex;align-items:center;gap:20px;padding-bottom:16px}
  .tpl-mono{flex:none;width:74px;height:74px;display:flex;align-items:center;justify-content:center}
  .tpl-mono svg{width:74px;height:74px}
  .tpl-mast-txt{flex:1;min-width:0}
  .tpl-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:27px;font-weight:700;
    letter-spacing:.06em;color:#1a2340;line-height:1.05;text-transform:uppercase}
  .tpl-sub{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#8a6d2f;
    text-transform:uppercase;margin-top:5px}
  .tpl-courts{font-size:11px;color:#5a554c;margin-top:5px;letter-spacing:.01em}
  .tpl-rule{border-top:2px solid #1a2340;margin:0 0 20px}
  .tpl-title{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:26px;font-weight:700;
    color:#1a2340;letter-spacing:.02em}
  .tpl-title.center{text-align:center;letter-spacing:.16em;text-transform:uppercase;font-size:23px}
  .tpl-subtitle{font-size:11px;font-weight:700;letter-spacing:.06em;color:#8a6d2f;
    text-transform:uppercase;margin-top:4px}
  .tpl-titlewrap{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
  .tpl-metatop{font-size:12.5px;color:#2a2620;line-height:2}
  .tpl-metatop .row{display:flex;gap:8px}
  .tpl-metatop .k{color:#6a655c;min-width:88px}
  .tpl-metatop .c{color:#a8a298}
  .tpl-metatop b{color:#1a2340;font-weight:600}
  .tpl-center-orn{text-align:center;color:#b08d3c;font-size:13px;letter-spacing:.4em;margin:2px 0 20px}
  /* two-column detail block */
  .tpl-cols{display:flex;gap:36px;margin-bottom:22px}
  .tpl-col{flex:1;min-width:0}
  .tpl-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:#b08d3c;margin-bottom:8px}

<script>
/* ============================================================
   FIREBASE BRIDGE (engine side)
   Connects the existing local-first engine to window.FB.
   - Shows a cloud login screen before the app
   - On login: pulls cloud data, or uploads local data first time
   - Wraps save() so each change also pushes to Firestore
   - Listens for remote changes and refreshes the UI
   Degrades gracefully: if FB never loads, the app stays local.
   ============================================================ */
(function(){
  window.__cloudBridge = true;   // tell engine to wait for cloud login

  /* ============================================================
     OWNER EMAIL — the single source of truth for who is the owner.
     ONLY this email address gets the full owner app. Every other
     account that signs in is treated as STAFF (needs approval).
     >>> SET THIS to the chamber owner's exact login email <<<
     ============================================================ */
  var OWNER_EMAIL = "REPLACE_WITH_OWNER_EMAIL@example.com";
  function _isOwnerEmail(email){
    return !!email && !!OWNER_EMAIL &&
      email.trim().toLowerCase() === OWNER_EMAIL.trim().toLowerCase();
  }

  let FB = null;
  let _syncing = false;          // guard against listener/save loops
  let _cloudReady = false;
  let _pushQueue = {};           // name -> Set(id) of records to push (debounced)
  let _pushTimer = null;
  let _lastPushedIds = {};   // name -> Set of ids last known in cloud

  // wait for the firebase module to signal ready
  function whenFB(cb){
    if(window.FB){ cb(window.FB); return; }
    window.addEventListener("firebase-ready", ()=>cb(window.FB), {once:true});
    // safety: if module fails to load in 8s, proceed offline
    setTimeout(()=>{ if(!window.FB) cb(null); }, 8000);
  }

  // ---------- LOGIN SCREEN ----------
  function showCloudLogin(mode){
    let ov=document.getElementById("cloudGate");
    if(!ov){
      ov=document.createElement("div"); ov.id="cloudGate";
      ov.style.cssText="position:fixed;inset:0;z-index:9000;background:var(--paper,#f6f4ef);display:flex;align-items:center;justify-content:center;padding:20px";
      document.body.appendChild(ov);
    }
    ov.style.display="flex";
    ov.innerHTML=`
      <div style="background:var(--paper2,#fffdf8);border:1px solid var(--line,#e6e0d4);border-radius:18px;padding:26px;max-width:400px;width:100%;box-shadow:0 6px 30px rgba(0,0,0,.06)">
        <div style="font-family:'Iowan Old Style',Palatino,Georgia,serif;color:var(--seal,#6b1f1f);font-size:22px;font-weight:700;margin-bottom:3px">${mode==="create"?"Create your login":"Chamber sign in"}</div>
        <div style="color:var(--muted,#8a8175);font-size:13px;margin-bottom:18px">${mode==="create"?"Staff: create your own login here. The chamber owner will approve you once, then you can start recording entries.":"Sign in with your email and password."}</div>
        <label style="display:block;font-size:12px;color:var(--muted,#8a8175);font-weight:600;margin-bottom:5px">Email</label>
        <input id="cgEmail" type="email" autocomplete="username" style="width:100%;padding:12px;border:1px solid var(--line,#e6e0d4);border-radius:11px;font-size:15px;font-family:inherit" placeholder="you@email.com">
        <label style="display:block;font-size:12px;color:var(--muted,#8a8175);font-weight:600;margin:12px 0 5px">Password</label>
        <input id="cgPw" type="password" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid var(--line,#e6e0d4);border-radius:11px;font-size:15px;font-family:inherit" placeholder="${mode==="create"?"At least 6 characters":"Your password"}" onkeydown="if(event.key==='Enter')window._cloudSubmit()">
        <button onclick="window._cloudSubmit()" style="width:100%;padding:13px;border:none;border-radius:11px;background:var(--seal,#6b1f1f);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit">${mode==="create"?"Create login":"Sign in"}</button>
        <button onclick="window._cloudToggle()" style="width:100%;padding:11px;border:1px solid var(--line,#e6e0d4);border-radius:11px;background:var(--paper,#f6f4ef);color:var(--seal,#6b1f1f);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:9px;font-family:inherit">${mode==="create"?"I already have a login — sign in":"New here? Create a login"}</button>
        <button onclick="window._cloudForgot()" style="width:100%;padding:9px;border:none;background:none;color:var(--muted,#8a8175);font-size:12.5px;cursor:pointer;margin-top:6px;font-family:inherit">Forgot password?</button>
        <div id="cgMsg" style="margin-top:14px;font-size:13px;line-height:1.5;min-height:18px"></div>
        <div id="cgStatus" style="margin-top:6px;font-size:11.5px;color:var(--muted,#8a8175);text-align:center"></div>
      </div>`;
    ov._mode = mode;
    if(!FB){ setMsg("err","Cloud not reachable right now. Check your connection and reload."); }
  }
  function hideCloudLogin(){ const o=document.getElementById("cloudGate"); if(o) o.style.display="none"; }
  function setMsg(kind,text){
    const m=document.getElementById("cgMsg"); if(!m) return;
    const col = kind==="err"?"var(--seal,#6b1f1f)":kind==="ok"?"var(--green,#1f6b4a)":"var(--muted,#8a8175)";
    m.style.color=col; m.innerHTML=text;
  }
  function setStatus(t){ const s=document.getElementById("cgStatus"); if(s) s.textContent=t; }

  function friendly(e){
    const c=e&&e.code?e.code:"";
    const map={
      "auth/invalid-email":"That email doesn't look right.",
      "auth/missing-password":"Enter a password.",
      "auth/weak-password":"Password needs at least 6 characters.",
      "auth/email-already-in-use":"That email already has an account — use Sign in instead.",
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/user-not-found":"No account with that email — create one.",
      "auth/too-many-requests":"Too many tries. Wait a minute.",
      "auth/network-request-failed":"Network problem — check your connection.",
      "auth/operation-not-allowed":"Email/Password sign-in isn't enabled in Firebase."
    };
    return (map[c]||(e&&e.message)||"Something went wrong.");
  }

  window._cloudToggle=function(){
    const o=document.getElementById("cloudGate");
    showCloudLogin(o&&o._mode==="create"?"login":"create");
  };
  window._cloudForgot=async function(){
    if(!FB) return;
    const email=(document.getElementById("cgEmail")||{}).value||"";
    if(!email.trim()){ setMsg("err","Type your email first, then tap Forgot password."); return; }
    try{ await FB.resetEmail(email.trim()); setMsg("ok","Reset email sent to "+email.trim()+"."); }
    catch(e){ setMsg("err",friendly(e)); }
  };
  window._cloudSubmit=async function(){
    if(!FB){ setMsg("err","Cloud not reachable. Reload the page."); return; }
    const o=document.getElementById("cloudGate"); const mode=o?o._mode:"login";
    const email=(document.getElementById("cgEmail").value||"").trim();
    const pw=document.getElementById("cgPw").value||"";
    if(!email||!pw){ setMsg("err","Enter email and password."); return; }
    setMsg("info", mode==="create"?"Creating account…":"Signing in…");
    try{
      if(mode==="create") await FB.createOwner(email,pw);
      else await FB.login(email,pw);
      // onAuthStateChanged handles the rest
    }catch(e){ setMsg("err",friendly(e)); }
  };

  // ---------- SYNC ORCHESTRATION ----------
  async function onSignedIn(){
    setMsg("ok","Signed in ✓"); setStatus("Loading…");
    try{
      const myUid = FB.uid();
      const myEmail = FB.email();

      // DECISIVE ROLE GATE: only the designated owner email is the owner.
      // Everyone else is staff, no matter what's in any account.
      if(!_isOwnerEmail(myEmail)){
        await startStaffSession(myUid, myEmail);
        return;
      }

      // --- OWNER PATH (only reached by the designated owner email) ---
      setStatus("Loading your chamber records…");
      const cloud = await FB.pullAll();
      const hasCloudData = (cloud.settings) ||
        FB.COLLECTIONS.some(n=>Array.isArray(cloud[n]) && cloud[n].length>0);
      if(hasCloudData){
        _syncing=true;
        if(cloud.settings) DB.settings = Object.assign({}, DB.settings, cloud.settings);
        if(cloud.counters) DB.counters = Object.assign({}, DB.counters, cloud.counters);
        FB.COLLECTIONS.forEach(n=>{ if(Array.isArray(cloud[n])) DB[n]=cloud[n]; });
        stripMeta();
        DB.settings.ownerUid = myUid;   // record for reference
        DB.deviceRole = "owner";
        saveLocalOnly();
        _syncing=false;
        setStatus("Loaded from cloud ✓");
      }else{
        setStatus("Setting up your cloud database…");
        DB.settings.ownerUid = myUid;
        DB.deviceRole = "owner";
        await FB.pushEntireDB(DB);
        await FB.pushSettings(DB.settings);
        setStatus("Cloud database ready ✓");
      }
      _cloudReady=true;
      FB.COLLECTIONS.forEach(n=>{ _lastPushedIds[n]=new Set((DB[n]||[]).map(r=>r.id)); });
      startRemoteListeners();
      startInboxListener();   // owner watches the staff inbox
      hideCloudLogin();
      if(window.bootAfterCloud) window.bootAfterCloud();
    }catch(e){
      console.error(e);
      setMsg("err","Could not load your data: "+(e&&e.message?e.message:e)+". You can retry, or work offline.");
      setStatus("");
    }
  }

  function stripMeta(){
    // remove Firestore-only fields from records so they don't leak into UI/logic
    FB.COLLECTIONS.forEach(n=>{ (DB[n]||[]).forEach(r=>{ delete r._updated; }); });
    if(DB.settings) delete DB.settings._updated;
    if(DB.counters) delete DB.counters._updated;
  }

  function startRemoteListeners(){
    FB.startListeners(
      (name, records)=>{
        if(_syncing) return;
        _syncing=true;
        DB[name]=records; records.forEach(r=>delete r._updated);
        saveLocalOnly();
        if(window.renderAll) try{ renderAll(); }catch(e){}
        if(window._shellRefresh) try{ _shellRefresh(); }catch(e){}
        _syncing=false;
      },
      (settings)=>{
        if(_syncing) return;
        _syncing=true;
        delete settings._updated;
        DB.settings=Object.assign({},DB.settings,settings);
        saveLocalOnly();
        if(window.applyBranding) try{ applyBranding(); }catch(e){}
        if(window.renderAll) try{ renderAll(); }catch(e){}
        _syncing=false;
      },
      (counters)=>{
        if(_syncing) return;
        delete counters._updated;
        DB.counters=Object.assign({},DB.counters,counters);
        saveLocalOnly();
      }
    );
  }

  // ---------- STAFF SESSION (non-owner login) ----------
  // Staff read/write only their own inbox + their own staffdir profile.
  let _staffDirUnsub=null, _myInboxUnsub=null;
  async function startStaffSession(myUid, myEmail){
    setStatus("Loading your staff workspace…");
    // ensure a staffdir profile exists (registers this person; owner approves once)
    let prof=null;
    try{ prof = await FB.getStaffDir(myUid); }catch(e){}
    if(!prof){
      prof = { email:myEmail||"", name:"", status:"pending", registeredAt:new Date().toISOString() };
      try{ await FB.putStaffDir(myUid, prof); }catch(e){}
    }
    window.__staff = { uid:myUid, email:myEmail, profile:prof };
    DB.deviceRole = "staff";
    // live-watch my profile (approval + balance mirror the owner writes)
    if(_staffDirUnsub) _staffDirUnsub();
    _staffDirUnsub = FB.listenStaffDir(myUid, p=>{
      if(p){ window.__staff.profile = p; if(window.renderStaffHome) try{ renderStaffHome(); }catch(e){} }
    });
    // live-watch my own inbox (so staff sees pending/accepted status echoed back)
    if(_myInboxUnsub) _myInboxUnsub();
    _myInboxUnsub = FB.listenInboxFor(myUid, items=>{
      window.__staff.inbox = items; if(window.renderStaffHome) try{ renderStaffHome(); }catch(e){}
    });
    _cloudReady=true;
    hideCloudLogin();
    if(window.enterStaffShell) window.enterStaffShell();
    else if(window.bootAfterCloud) window.bootAfterCloud();
  }

  // ---------- OWNER: watch the staff inbox + directory ----------
  let _inboxUnsub=null, _dirUnsub=null;
  function startInboxListener(){
    if(_dirUnsub) _dirUnsub();
    _dirUnsub = FB.listenStaffDirAll(list=>{
      // merge directory into DB.staff roster (pending + approved people)
      _syncing=true;
      list.forEach(d=>{
        let s=DB.staff.find(x=>x.uid===d.uid);
        if(!s){ s={uid:d.uid}; DB.staff.push(s); }
        s.email=d.email||s.email; s.name=d.name||s.name||d.email||"Staff";
        if(!s.status) s.status = d.status||"pending";
        // owner's approval decision wins; keep local status if already approved
        if(s.status!=="approved" && d.status) s.status=d.status;
      });
      saveLocalOnly();
      _syncing=false;
      if(window._shellRefresh) try{ _shellRefresh(); }catch(e){}
    });
    if(_inboxUnsub) _inboxUnsub();
    _inboxUnsub = FB.listenAllInbox(items=>{
      ingestInbox(items);
    });
  }

  // Bring inbox entries into DB.advances/docs as pending, without duplicating.
  function ingestInbox(items){
    if(!Array.isArray(items)) return;
    _syncing=true;
    let changed=false;
    items.forEach(it=>{
      if(!it || !it.kind) return;
      if(it.kind==="advance-entry"){
        // money entry: appears in DB.advances as pending (dedupe by inboxId)
        const exists = DB.advances.find(a=>a.inboxId===it.id);
        if(!exists){
          DB.advances.push({ id:(window.uid?uid():("adv"+Date.now()+Math.random())),
            inboxId:it.id, staffUid:it.staffUid, staffName:it.staffName||"",
            date:it.date||todayISO(), type:it.type, amount:+it.amount||0,
            note:it.note||"", head:it.head||null, payee:it.payee||null,
            status:"pending", createdBy:"staff", createdAt:it.createdAt||new Date().toISOString(),
            acceptedAt:null, expenseId:null });
          changed=true;
        }
      }else if(it.kind==="document"){
        // documents flow automatically into docsIn
        const exists=(DB.docsIn||[]).find(d=>d.inboxId===it.id);
        if(!exists){
          DB.docsIn.push({ id:(window.uid?uid():("doc"+Date.now())), inboxId:it.id,
            date:it.date||todayISO(), title:it.title||"Staff upload", docType:it.docType||"",
            source:it.staffName||"Staff", matterId:it.matterId||"", note:it.note||"",
            files:it.files||[] });
          changed=true;
        }
      }
    });
    if(changed) saveLocalOnly();
    _syncing=false;
    if(changed && window._shellRefresh) try{ _shellRefresh(); }catch(e){}
    if(changed && document.getElementById("panel-advances") && document.getElementById("panel-advances").classList.contains("active")){
      try{ renderAdvances(); }catch(e){}
    }
  }
  window.__ingestInbox = ingestInbox;

  // queue a push of changed records (debounced), reconciling deletions
  function queueFullPush(){
    if(!_cloudReady || !FB || _syncing) return;
    clearTimeout(_pushTimer);
    _pushTimer=setTimeout(async ()=>{
      try{
        await FB.pushSettings(DB.settings);
        await FB.pushCounters(DB.counters);
        for(const name of FB.COLLECTIONS){
          const arr = DB[name]||[];
          await FB.pushCollection(name, arr);
          // reconcile deletions: any id previously present but now gone -> delete in cloud
          const currentIds = new Set(arr.map(r=>r.id));
          const prev = _lastPushedIds[name];
          if(prev){
            for(const oldId of prev){
              if(!currentIds.has(oldId)){ try{ await FB.deleteRecord(name, oldId); }catch(e){} }
            }
          }
          _lastPushedIds[name] = currentIds;
        }
      }catch(e){ console.warn("push failed",e); }
    }, 400);
  }

  // ---------- HOOK save() ----------
  let saveLocalOnly = null;
  function installSaveHook(){
    if(typeof window.save!=="function") return;
    const origSave = window.save;
    saveLocalOnly = origSave;
    window.save = function(){
      origSave.apply(this, arguments);   // keep local persistence
      queueFullPush();                    // mirror to cloud
    };
  }

  // ---------- BOOT ----------
  window.onFirebaseAuth = function(user){
    if(user){ onSignedIn(); }
    else { _cloudReady=false; if(FB) FB.stopListeners(); showCloudLogin("login"); }
  };

  function start(){
    whenFB(function(fb){
      FB=fb;
      installSaveHook();
      if(!FB){ // no cloud — run purely local (old behaviour)
        if(window.bootAfterCloud) window.bootAfterCloud();
        return;
      }
      // FB present; auth state callback will drive login/boot
      if(FB.user===null){ showCloudLogin("login"); }
      else if(FB.user){ onSignedIn(); }
      else { showCloudLogin("login"); }
    });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>

const DEFAULTS = () => ({

let DB = load();

/* ===========================================================
   FORUMS & CASE TYPES (forum-first; type list filters by forum)

/* ---------- date / money helpers ---------- */
function fyStartForToday(){
  const d = new Date();
  const y = d.getFullYear();
  const fy = (d.getMonth() >= 3) ? y : y - 1;   // April = month 3
  return `${fy}-04-01`;
}
function fyLabel(fyStartISO){
  const y = +fyStartISO.slice(0,4);
  return `${y}\u2013${(y+1).toString().slice(2)}`;   // 2026–27
}
function inFY(dateISO, fyStartISO){
  if(!dateISO) return false;
  const start = new Date(fyStartISO);
  const end = new Date(start); end.setFullYear(end.getFullYear()+1);
  const d = new Date(dateISO);
  return d >= start && d < end;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtINR(n){
  n = Number(n)||0;
  return "\u20B9" + n.toLocaleString("en-IN",{maximumFractionDigits:0});
}
function fmtDate(iso){
  if(!iso) return "\u2014";
  const [y,m,d] = iso.split("-");
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1];
  return `${d} ${mon} ${y}`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===========================================================
   ENCRYPTION (WebCrypto: PBKDF2 + AES-GCM)
   The localStorage index is encrypted at rest. The data key is
   wrapped by both the password and a one-time recovery code, so
   either can unlock; losing both = unrecoverable (by design).
   =========================================================== */
const _sessionKeyHolder = true; // (enc state vars hoisted above)

function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ const s=atob(b64); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a.buffer; }
function randBytes(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }

async function deriveKEK(passphrase, salt){ // key-encryption-key from a passphrase
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["wrapKey","unwrapKey","encrypt","decrypt"]);
}
function genRecoveryCode(){ // 24 chars, grouped: XXXX-XXXX-XXXX-XXXX-XXXX-XXXX
  const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r=randBytes(24);
  let s=""; for(let i=0;i<24;i++){ s+=al[r[i]%al.length]; if(i%4===3&&i<23)s+="-"; } return s;
}

// Create a fresh data key, wrap it with password + recovery code, store meta.
async function encSetup(password){
  const dataKey = await crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
  const recovery = genRecoveryCode();
  const pSalt = randBytes(16), rSalt = randBytes(16);
  const pKEK = await deriveKEK(password, pSalt);
  const rKEK = await deriveKEK(recovery, rSalt);
  const pIv = randBytes(12), rIv = randBytes(12);
  const pWrap = await crypto.subtle.wrapKey("raw", dataKey, pKEK, {name:"AES-GCM", iv:pIv});
  const rWrap = await crypto.subtle.wrapKey("raw", dataKey, rKEK, {name:"AES-GCM", iv:rIv});
  const meta = {
    v:1,
    p:{ salt:buf2b64(pSalt), iv:buf2b64(pIv), wrap:buf2b64(pWrap) },
    r:{ salt:buf2b64(rSalt), iv:buf2b64(rIv), wrap:buf2b64(rWrap) }
  };
  localStorage.setItem(ENC_META, JSON.stringify(meta));
  _sessionKey = dataKey;
  return recovery;
}
function encEnabled(){ return !!localStorage.getItem(ENC_META); }

async function encUnlock(secret, which){ // which: 'p' or 'r'
  const meta = JSON.parse(localStorage.getItem(ENC_META)||"null"); if(!meta) return false;
  const slot = meta[which]; if(!slot) return false;
  try{
    const KEK = await deriveKEK(secret, new Uint8Array(b642buf(slot.salt)));
    const dataKey = await crypto.subtle.unwrapKey("raw", b642buf(slot.wrap), KEK,
      {name:"AES-GCM", iv:new Uint8Array(b642buf(slot.iv))}, {name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
    _sessionKey = dataKey; return true;
  }catch(e){ return false; }
}
// Re-wrap the existing data key under a new password (keeps recovery code valid only if re-issued)
async function encChangePassword(newPassword){
  if(!_sessionKey) return null;
  const meta = JSON.parse(localStorage.getItem(ENC_META));
  const pSalt = randBytes(16), pIv = randBytes(12);
  const pKEK = await deriveKEK(newPassword, pSalt);
  const pWrap = await crypto.subtle.wrapKey("raw", _sessionKey, pKEK, {name:"AES-GCM", iv:pIv});
  meta.p = { salt:buf2b64(pSalt), iv:buf2b64(pIv), wrap:buf2b64(pWrap) };
  // also issue a fresh recovery code
  const recovery = genRecoveryCode(); const rSalt=randBytes(16), rIv=randBytes(12);
  const rKEK = await deriveKEK(recovery, rSalt);
  const rWrap = await crypto.subtle.wrapKey("raw", _sessionKey, rKEK, {name:"AES-GCM", iv:rIv});
  meta.r = { salt:buf2b64(rSalt), iv:buf2b64(rIv), wrap:buf2b64(rWrap) };
  localStorage.setItem(ENC_META, JSON.stringify(meta));
  return recovery;
}
async function encryptDB(){
  if(!_sessionKey) return null;
  const iv = randBytes(12);
  const plain = new TextEncoder().encode(JSON.stringify(DB));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, _sessionKey, plain);
  return JSON.stringify({iv:buf2b64(iv), ct:buf2b64(ct)});
}
async function decryptBlob(blob){
  const o = JSON.parse(blob);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(b642buf(o.iv))}, _sessionKey, b642buf(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- persistence ---------- */
function load(){
  // when encryption is enabled, the real data load happens after unlock (loadDecrypted)
  if(encEnabled()){ _locked = true; return DEFAULTS(); }
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return DEFAULTS();
    return migrate(JSON.parse(raw));
  }catch(e){ console.warn("load failed",e); return DEFAULTS(); }
}
async function loadDecrypted(){
  const blob = localStorage.getItem(ENC_KEY);
  if(!blob){ DB = DEFAULTS(); _locked=false; return; }
  try{ DB = migrate(await decryptBlob(blob)); _locked=false; }
  catch(e){ throw new Error("decrypt failed"); }
}

const SCHEMA_VERSION = 3;  // bump when the data shape changes; migrate handles upgrades
function migrate(data){
  // Forward-compatible: merges in any NEW default fields without dropping
  // existing data, preserves unknown keys, and never throws on partial data.
  if(!data || typeof data!=="object") data = {};
  const base = DEFAULTS();
  // settings: keep all existing values, add any newly-introduced defaults
  data.settings = Object.assign({}, base.settings, data.settings||{});
  // core arrays: ensure present
  for(const k of ["matters","receipts","expenses","cash","docsIn","docsFiled","invoices"]) if(!Array.isArray(data[k])) data[k]=[];
  data.counters = Object.assign({}, base.counters, data.counters||{});
  // back-fill voucher counter from existing vouchers if missing
  if(!data.counters.voucher){
    let mx=0; data.expenses.forEach(e=>{ const m=/V-\d{2}-(\d{3})/.exec(e.voucherNo||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.voucher = mx;
  }
  // back-fill invoice counter likewise
  if(!data.counters.invoice){
    let mx=0; (data.invoices||[]).forEach(v=>{ const m=/\/(\d{3})$/.exec(v.no||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.invoice = mx;
  }
  // migrate any legacy inline proof -> IndexedDB, keep only meta in index
  data.expenses.forEach(e=>{
    if(e.proof && e.proof.data){
      const pid = e.id;
      try{ idbPut("proof:"+pid, e.proof.data); }catch(_){}
      e.proofMeta = {name:e.proof.name, type:e.proof.type};
      delete e.proof;
    }
  });
  if(!Array.isArray(data.staffLog)) data.staffLog = [];
  if(!Array.isArray(data.staff)) data.staff = [];
  if(!Array.isArray(data.advances)) data.advances = [];
  if(!Array.isArray(data.trash)) data.trash = [];
  // auto-download backup is now off by default (was a source of confusing Downloads clutter)
  data.settings.autoBackup = false;
  // migrate legacy single bank details into the banks[] array
  if(!Array.isArray(data.settings.banks)) data.settings.banks = [];
  if(data.settings.banks.length===0 && (data.settings.bankName||data.settings.bankAcc)){
    data.settings.banks.push({
      id: uid(), label: data.settings.bankName||"Primary account",
      name: data.settings.bankName||"", branch: data.settings.bankBranch||"",
      acc: data.settings.bankAcc||"", ifsc: data.settings.bankIfsc||"", acctype:"", isDefault: true
    });
  }
  // migrate legacy UPI (from settings or from any bank row) into upis[]
  if(!Array.isArray(data.settings.upis)) data.settings.upis = [];
  if(data.settings.upis.length===0){
    let legacyUpi = data.settings.bankUpi||"";
    if(!legacyUpi){ const wb=(data.settings.banks||[]).find(b=>b.upi); if(wb) legacyUpi=wb.upi; }
    if(legacyUpi){ data.settings.upis.push({id:uid(), label:"UPI", vpa:legacyUpi, isDefault:true}); }
  }
  // strip upi/showQr off any migrated bank rows
  (data.settings.banks||[]).forEach(b=>{ delete b.upi; delete b.showQr; });
  data.ver = APP_VER;
  data.schema = SCHEMA_VERSION;
  return data;
}
function save(){
  if(encEnabled() && _sessionKey){
    // write encrypted blob; remove any plaintext index
    encryptDB().then(blob=>{ if(blob){ localStorage.setItem(ENC_KEY, blob); localStorage.removeItem(LS_KEY); } })
      .catch(()=>toast("Could not save (encryption error).", true));
    return;
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast("Could not save the index. Export a backup now.", true); }
}

/* ===========================================================
   PROOF STORE — IndexedDB (uses your actual disk, no 5MB cap)
   Only the small JSON index lives in localStorage; the heavy
   PDF/image bytes live here, keyed by proof id.
   =========================================================== */
const IDB_NAME = "chamberProofs", IDB_STORE = "proofs";
let _idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{ _idb=req.result; res(_idb); };
    req.onerror = ()=>rej(req.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>res(r.result||null); r.onerror = ()=>rej(r.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}

/* ---------- delete / void / cancel core ----------
   Delete  = soft-delete (recoverable in trash). If the record holds the
             LATEST number in its series, roll the counter back so the number
             is reused; the trashed copy releases its number (formerNo).
   Void/Cancel = keep the record visible, mark status 'void'/'cancelled' with
             a short reason; number is retained and never reused; excluded
             from income totals.
   Series map: receipts->counters.receipt, invoices->counters.invoice,
             matters(kind case)->counters.matter, matters(kind query)->counters.query.
*/
function _seqInfo(coll, rec){
  // returns {counterKey, num} where num is the numeric sequence this record holds
  if(coll==="receipts"){ return {counterKey:"receipt", num:_numFromCode(rec.no)}; }
  if(coll==="invoices"){ return {counterKey:"invoice", num:_numFromCode(rec.no)}; }
  if(coll==="matters"){
    if(rec.kind==="query") return {counterKey:"query", num:_numFromCode(rec.code)};
    return {counterKey:"matter", num:_numFromCode(rec.code)};
  }
  return {counterKey:null, num:null};
}
function _numFromCode(code){
  if(!code) return null;
  // grab the LAST group of digits in the code (e.g. R/2026-27/014 -> 14, M-26-003 -> 3)
  const m = String(code).match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1],10) : null;
}
function _isLatestInSeries(coll, rec){
  const {counterKey, num} = _seqInfo(coll, rec);
  if(!counterKey || num==null) return false;
  return DB.counters[counterKey] === num;   // holds the top number
}
// Soft-delete (recoverable). Returns true if the number was reused.
function softDelete(coll, id){
  const arr = DB[coll]; if(!Array.isArray(arr)) return false;
  const idx = arr.findIndex(x=>x.id===id); if(idx<0) return false;
  const rec = arr[idx];
  const latest = _isLatestInSeries(coll, rec);
  const {counterKey, num} = _seqInfo(coll, rec);
  let reused=false, formerNo=null;
  if(latest && counterKey){
    DB.counters[counterKey] = Math.max(0, DB.counters[counterKey]-1); // roll back
    formerNo = rec.no || rec.code || null;
    reused=true;
  }
  // move to trash (recoverable); strip its active number if reused
  const trashed = Object.assign({}, rec);
  if(reused){ trashed.no=null; trashed.code=null; trashed._releasedNo=formerNo; }
  DB.trash = DB.trash || [];
  DB.trash.push({ id:uid(), coll, rec:trashed, deletedAt:new Date().toISOString(), formerNo });
  arr.splice(idx,1);
  save();
  return reused;
}
// Void/Cancel (keep, mark, never reuse number)
function voidRecord(coll, id, reason, label){
  const arr = DB[coll]; if(!Array.isArray(arr)) return;
  const rec = arr.find(x=>x.id===id); if(!rec) return;
  rec.status = label || "void";           // 'void' for receipts/invoices, 'cancelled' for matters
  rec.voidReason = reason || "";
  rec.voidedAt = new Date().toISOString();
  save();
}
function isVoided(rec){ return rec && (rec.status==="void" || rec.status==="cancelled"); }

/* ===========================================================
   DERIVED TOTALS
   =========================================================== */
function fyReceipts(){ return DB.receipts.filter(r=>inFY(r.date, DB.settings.fyStart) && !isVoided(r)); }
function fyExpenses(){ return DB.expenses.filter(e=>inFY(e.date, DB.settings.fyStart)); }
function grossReceiptsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.amount||0),0); }
function expensesFY(){ return fyExpenses().reduce((s,e)=>s+(+e.amount||0),0); }
function presumptive(){ return Math.round(grossReceiptsFY()*0.5); }
function tdsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.tds||0),0); }
function netActual(){ return grossReceiptsFY() - expensesFY(); }

/* ===========================================================
   STAFF ADVANCES / FLOAT (imprest) with review-then-accept
   Balance in staff hands = accepted advances - accepted expenses
     - accepted returns.  Only ACCEPTED entries count toward the
     balance and the chamber books (one source of truth).
   Staff-created entries start status:'pending'; owner accepts.
   Accepted expenses post to the chamber expense books (dual purpose),
   taking the next voucher number AT ACCEPTANCE (gap-free series).
   =========================================================== */
function advancesFor(uid){ return DB.advances.filter(a=>a.staffUid===uid); }
function acceptedFor(uid){ return advancesFor(uid).filter(a=>a.status==="accepted"); }
function pendingFor(uid){ return advancesFor(uid).filter(a=>a.status==="pending"); }
function allPending(){ return DB.advances.filter(a=>a.status==="pending"); }
function staffBalance(uid){
  return acceptedFor(uid).reduce((bal,a)=>{
    if(a.type==="advance") return bal + (+a.amount||0);
    if(a.type==="return")  return bal - (+a.amount||0);
    if(a.type==="expense") return bal - (+a.amount||0);
    return bal;
  }, 0);
}
function staffAdvancesTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="advance").reduce((s,a)=>s+(+a.amount||0),0); }
function staffExpensesTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="expense").reduce((s,a)=>s+(+a.amount||0),0); }
function staffReturnsTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="return").reduce((s,a)=>s+(+a.amount||0),0); }
function pendingBalanceImpact(uid){
  // net effect on balance if all pending were accepted (for a staff "pending" note)
  return pendingFor(uid).reduce((d,a)=>{
    if(a.type==="advance") return d + (+a.amount||0);
    return d - (+a.amount||0);
  },0);
}
// Create an advance-ledger entry. byOwner => accepted immediately; staff => pending.
function addAdvanceEntry(type, staffUid, staffName, amount, date, note, opts){
  opts=opts||{};
  const rec={ id:uid(), staffUid, staffName:staffName||"", date:date||todayISO(), type,
    amount:+amount||0, note:note||"", mode:opts.mode||"Cash",
    head:opts.head||null, payee:opts.payee||null,
    status: opts.byOwner ? "accepted" : "pending",
    createdBy: opts.byOwner ? "owner" : "staff",
    createdAt: new Date().toISOString(),
    acceptedAt: opts.byOwner ? new Date().toISOString() : null,
    expenseId: null };
  if(type==="expense" && rec.status==="accepted"){ rec.expenseId = _postExpenseToBooks(rec); }
  DB.advances.push(rec); save(); return rec;
}
function acceptAdvance(id){
  const a=DB.advances.find(x=>x.id===id); if(!a || a.status!=="pending") return;
  a.status="accepted"; a.acceptedAt=new Date().toISOString();
  if(a.type==="expense"){ a.expenseId = _postExpenseToBooks(a); }
  save();
}
function rejectAdvance(id, reason){
  const a=DB.advances.find(x=>x.id===id); if(!a) return;
  a.status="rejected"; a.rejectReason=reason||""; a.rejectedAt=new Date().toISOString();
  save();
}

    remarks:(a.note||"")+" (paid by "+(a.staffName||"staff")+" from advance)",
    staffUid:a.staffUid, fromAdvance:true });

function removeStaffExpense(advanceId){
  const a=DB.advances.find(x=>x.id===advanceId); if(!a) return;
  if(a.expenseId){ DB.expenses = DB.expenses.filter(e=>e.id!==a.expenseId); }
  DB.advances = DB.advances.filter(x=>x.id!==advanceId);
  save();
}

}

function matterById(id){ return DB.matters.find(m=>m.id===id); }

function newRegimeTax(income){
  // FY 2025-26 new regime slabs + 87A rebate (nil up to 12L taxable).
  // Slabs: 0-4L nil, 4-8L 5%, 8-12L 10%, 12-16L 15%, 16-20L 20%, 20-24L 25%, >24L 30%.
  if(income<=1200000) return 0; // rebate makes it nil
  let t=0;
  const sl=[[400000,0],[800000,0.05],[1200000,0.10],[1600000,0.15],[2000000,0.20],[2400000,0.25],[Infinity,0.30]];
  let prev=0;
  for(const [cap,rate] of sl){ if(income>prev){ t+=(Math.min(income,cap)-prev)*rate; prev=cap; } else break; }
  return Math.round(t*1.04); // + 4% cess
}
function taxSnapshot(declared){
  const tds = tdsFY();
  const tax = newRegimeTax(declared);
  const balance = tax - tds;     // positive = payable, negative = refund
  const safe = declared <= 1200000;
  let line2;
  if(tax===0){
    line2 = tds>0
      ? `<div style="font-size:14px;margin-top:8px">Estimated tax: <b>\u20B90</b> (within \u20B912L rebate). TDS of <b>${fmtINR(tds)}</b> already deducted is <b>refundable</b> on filing.</div>`
      : "";
  } else {
    line2 = `<div style="font-size:14px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap">
      <span>Estimated tax: <b>${fmtINR(tax)}</b></span>
      <span>Less TDS credit: <b>${fmtINR(tds)}</b></span>
      <span>${balance>=0?`Balance payable: <b style="color:var(--seal)">${fmtINR(balance)}</b>`:`Refund due: <b style="color:var(--green)">${fmtINR(-balance)}</b>`}</span>
    </div>`;
  }
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:15px">Declared income this FY: <b>${fmtINR(declared)}</b></div>
      <span class="tag ${safe?'active':'closed'}">${safe?'Within \u20B912L rebate \u2014 indicatively nil tax':'Above \u20B912L \u2014 tax likely'}</span>
    </div>
    ${line2}
    <div class="hint" style="margin-top:10px;margin-bottom:0">TDS credit is the tax already withheld by clients against your PAN (visible in Form 26AS / AIS). It is set off against your tax — and refunded if it exceeds your liability. Figures indicative; confirm with your CA.</div>`;
}

let _tdsMode="no";
function setTdsMode(m){
  _tdsMode=m;
  document.querySelectorAll("#tdsSeg .seg-btn").forEach(b=>b.classList.toggle("on", b.dataset.tds===m));
  document.getElementById("tdsBox").style.display = m==="yes"?"block":"none";
  if(m==="no"){ document.getElementById("rcTdsRate").value=""; document.getElementById("rcTdsAmt").value=""; }
  updFee();
}
function setTdsRate(r){
  document.getElementById("rcTdsRate").value=r;
  document.getElementById("rcTdsAmt").value="";
  updFee("rate");
}
function focusCustomRate(){ const f=document.getElementById("rcTdsRate"); if(f){ f.value=""; f.focus(); } }
function computeFee(){
  const gross=+document.getElementById("rcGross").value||0;
  let tds=0;
  if(_tdsMode==="yes"){
    const amt=+document.getElementById("rcTdsAmt").value||0;
    const rate=+document.getElementById("rcTdsRate").value||0;
    if(amt>0) tds=amt;
    else if(rate>0) tds=Math.round(gross*rate/100);
  }
  if(tds>gross) tds=gross;
  return {gross, tds, net:gross-tds};
}
function updFee(src){
  // if user typed a rate, clear amount and vice-versa (they're alternatives)
  if(src==="rate"){ const a=document.getElementById("rcTdsAmt"); if(a) a.value=""; }
  if(src==="amt"){ const r=document.getElementById("rcTdsRate"); if(r) r.value=""; }
  const {gross,tds,net}=computeFee();
  const p=document.getElementById("rcPreview");
  if(!p) return;
  if(gross<=0){ p.innerHTML="Enter the gross fee to see the breakdown."; return; }
  if(_tdsMode==="no" || tds<=0){
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-muted">No TDS</span>`;
  }else{
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-t">TDS ${fmtINR(tds)}</span> <span class="fp-sep">·</span> <span class="fp-n">Net ${fmtINR(net)}</span>`;
  }
}
function quickMatter(){
  openModal("Quick new matter", matterFormHTML());
}
function peekNextMatterCode(){
  const yr = DB.settings.fyStart.slice(2,4);
  return `M-${yr}-${String(DB.counters.matter+1).padStart(3,"0")}`;
}

function issueReceipt(){
  const matterId = document.getElementById("rcMatter").value;
  const date = document.getElementById("rcDate").value;
  const {gross,tds,net}=computeFee();
  if(!matterId){ toast("Select a matter first.", true); return; }
  if(!date){ toast("Pick a date.", true); return; }
  if(!gross || gross<=0){ toast("Enter the gross professional fee.", true); return; }
  const no = nextReceiptNo();
  const rec = {
    id: uid(), no, date, matterId,
    amount: gross,               // gross fee (what the receipt acknowledges)
    net: net,                    // reaches bank
    tds: tds,                    // tax deducted at source
    showTds: document.getElementById("rcShowTds").checked,
    mode: document.getElementById("rcMode").value,
    towards: document.getElementById("rcTowards").value.trim() || "Professional fees",
    remarks: document.getElementById("rcRemarks").value.trim()
  };
  DB.receipts.push(rec);
  DB.cash.push({id:uid(), date, particulars:`Receipt ${no} — ${matterLabel(matterId)}${tds?" (net of TDS "+fmtINR(tds)+")":""}`,
    type:"in", amount: net, mode:rec.mode, ref:no});
  save();
  printReceipt(rec);
  renderAll();
  shellGo("books");
  toast(`Receipt ${no} saved.`);
}

       </div>
       ${showBreak?`<div class="tpl-refline"><span class="k">Gross professional fee</span><b>${fmtINR(rec.amount)}</b></div>
         <div class="tpl-refline"><span class="k">Less: TDS u/s 194J</span><b>(${fmtINR(rec.tds)})</b></div>
         <div class="tpl-refline"><span class="k">Net received</span><b>${fmtINR(rec.net)}</b></div>`:""}
       <div class="tpl-refline"><span class="k">Towards</span><b>${esc(rec.towards||"Professional fees")}</b>${rec.remarks?` — ${esc(rec.remarks)}`:""}</div>
       <div class="tpl-sign">
         <div class="box"><div class="recv">Received by</div><div class="who">${esc(s.advName||"")}</div></div>
       </div>
       <div class="tpl-disc">This receipt acknowledges the amount received only.${s.rcmNote?" "+esc(s.rcmNote):""}</div>
     </div>
     ${_tplFoot(s)}
   </div>`;
  setTimeout(()=>window.print(), 150);
}

function nextInvoiceNo(){
  DB.counters.invoice += 1;
  const yr = DB.settings.fyStart.slice(2,4);
  return `INV/${fyLabel(DB.settings.fyStart)}/${String(DB.counters.invoice).padStart(3,"0")}`;
}
function peekNextInvoiceNo(){
  const yr = DB.settings.fyStart.slice(2,4);
  return `INV/${fyLabel(DB.settings.fyStart)}/${String(DB.counters.invoice+1).padStart(3,"0")}`;
}
let _invLines = [];      // [{desc, amount}]
let _invExpenses = [];   // [{desc, amount}]

  }).join("");
  document.getElementById("panel-invoice").innerHTML = `
    <div class="card">
      <h2>Raise a fee invoice (memo of fees)</h2>
      <div class="hint">A bill sent to the client requesting payment — distinct from a receipt. Choose itemised (each item listed) or consolidated (a single professional-fee line).</div>
      <div class="grid g2">
        <div><label class="fld">Matter <span class="req">*</span></label><select class="in" id="ivMatter"><option value="">— Select —</option>${opts}</select>
          <div style="margin-top:6px"><button class="btn ghost sm" onclick="quickMatter()">+ Quick new matter</button></div></div>
        <div><label class="fld">Date <span class="req">*</span></label><input class="in" type="date" id="ivDate" value="${todayISO()}"></div>

      <div style="margin-top:11px"><label class="fld">Invoice no.</label><input class="in mono" id="ivNo" value="${esc(peekNextInvoiceNo())}" readonly style="background:#f1ece0;color:var(--muted);max-width:220px"></div>
      ${(banksList().length||upisList().length)?`<div class="grid g3" style="margin-top:11px">
        ${banksList().length?`<div><label class="fld">Show bank account</label><select class="in" id="ivBank">
          ${banksList().map(b=>`<option value="${b.id}" ${b.isDefault?"selected":""}>${esc(b.label)}${b.acc?" · ···"+esc(String(b.acc).slice(-4)):""}</option>`).join("")}
          <option value="">— None —</option>
        </select></div>`:""}
        ${upisList().length?`<div><label class="fld">Show UPI ID</label><select class="in" id="ivUpi">
          ${upisList().map(u=>`<option value="${u.id}" ${u.isDefault?"selected":""}>${esc(u.label)} · ${esc(u.vpa)}</option>`).join("")}
          <option value="">— None —</option>
        </select></div>`:""}
        ${upisList().length?`<div><label class="fld">Scan-to-pay QR</label>
          <label class="fld" style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink)">
            <input type="checkbox" id="ivQr" checked> Include QR</label></div>`:""}
      </div>`:""}
      <div class="grid g2" style="margin-top:11px">
        <div><label class="fld">Style</label><select class="in" id="ivStyle" onchange="onInvStyleChange()">
          <option value="consolidated">Consolidated (single fee line)</option>
          <option value="itemised">Itemised (list each item)</option>
        </select></div>
        <div><label class="fld">Payment terms</label>
          <div style="display:flex;gap:8px">
            <select class="in" id="ivDueMode" onchange="onDueModeChange()" style="flex:1">
              <option value="days">Payable within…</option>
              <option value="onreceipt">Payable on receipt</option>
              <option value="none">No mention</option>
            </select>
            <select class="in" id="ivDueDays" style="width:120px">
              ${[7,10,15,30,45,60].map(n=>`<option value="${n}" ${n===15?"selected":""}>${n} days</option>`).join("")}
            </select>
          </div>

      </div>

      <div id="ivLinesWrap" style="margin-top:16px">
        <div class="eyebrow">Professional fees</div>
