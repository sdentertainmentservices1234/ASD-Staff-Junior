function renderHome(){
  const home=document.getElementById("panel-home");
  if(DB.deviceRole==="staff"){ renderStaffHome(); return; }
  const active = DB.matters.filter(m=>(m.status!=="Closed"&&m.status!=="Concluded") && !isVoided(m));
  const dated = active.filter(m=>m.nextDate).sort((a,b)=>(a.nextDate||"").localeCompare(b.nextDate||""));
  const undated = active.filter(m=>!m.nextDate);

  const buckets={overdue:[],today:[],tomorrow:[],week:[],later:[]};
  dated.forEach(m=>{ buckets[_dateBucket(m.nextDate)].push(m); });

  const weekCount = buckets.today.length+buckets.tomorrow.length+buckets.week.length;
  const overdueCount = buckets.overdue.length;

  function caseCard(m){
    const n=_daysUntil(m.nextDate);
    const when = n<0?`${Math.abs(n)}d overdue`:n===0?"Today":n===1?"Tomorrow":`in ${n}d`;
    const cls = n<0?"od":n===0?"td":n===1?"tm":"";
    return `<div class="hc" onclick="openMatterDetail('${m.id}')">
      <div class="hc-l">
        <div class="hc-when ${cls}">${when}</div>
        <div class="hc-date">${fmtDate(m.nextDate)}</div>
      </div>
      <div class="hc-body">
        <div class="hc-title">${esc(m.parties||m.client||"—")}</div>
        <div class="hc-sub">${esc(m.code)}${m.caseNo?" · "+esc(m.caseNo):""}${m.court?" · "+esc(m.court):""}</div>
        ${m.hearingNote?`<div class="hc-note">${esc(m.hearingNote)}</div>`:""}
      </div>
    </div>`;
  }
  function section(title, arr){
    if(!arr.length) return "";
    return `<div class="hc-grp"><div class="hc-grp-h">${title}</div>${arr.map(caseCard).join("")}</div>`;
  }

  const trackerBody = (dated.length)
    ? section(`Overdue · ${overdueCount}`, buckets.overdue)
      + section("Today", buckets.today)
      + section("Tomorrow", buckets.tomorrow)
      + section("This week", buckets.week)
      + section("Later", buckets.later)
    : `<div class="empty" style="padding:30px 16px">No hearing dates set yet.<br>Tap a case below to add its next date.</div>`;

function showCounter(kind){
  const active = DB.matters.filter(m=>(m.status!=="Closed"&&m.status!=="Concluded") && !isVoided(m));
  let title="", rows="";
  if(kind==="hearings"){
    const dated=active.filter(m=>m.nextDate).sort((a,b)=>(a.nextDate||"").localeCompare(b.nextDate||""));
    const week=dated.filter(m=>{const n=_daysUntil(m.nextDate);return n>=0&&n<=7;});
    const od=dated.filter(m=>_daysUntil(m.nextDate)<0);
    title="Hearings this week";
    const line=(m)=>{const n=_daysUntil(m.nextDate);const d=new Date(m.nextDate+"T00:00:00");
      const w=n<0?`${Math.abs(n)}d overdue`:n===0?"Today":n===1?"Tomorrow":d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
      const cls=n<0?"od":n===0?"td":"";
      return `<div class="cb-row" onclick="closeModal();openMatterDetail('${m.id}')">
        <div class="cb-when ${cls}">${esc(w)}</div>
        <div class="cb-mid"><div class="cb-t">${esc(m.parties||m.client||"—")}</div>
          <div class="cb-s">${esc(m.code||"")}${m.court?" · "+esc(m.court):""}</div></div>
        <span class="cb-go">›</span></div>`;};
    const body=(od.length?`<div class="cb-grp">Overdue</div>`+od.map(line).join(""):"")
      + (week.length?`<div class="cb-grp">This week</div>`+week.map(line).join(""):"");
    rows = body || `<div class="empty" style="padding:20px">No hearings in the next 7 days.</div>`;
  }
  else if(kind==="tasks"){
    title="Tasks pending";
    const open=(typeof _openTodos==="function")?_openTodos().slice().sort((a,b)=>_prioRank(a.priority)-_prioRank(b.priority)):[];
    rows = open.length ? open.map(t=>{
      const pm=_prioMeta(t.priority);
      return `<div class="cb-row" onclick="closeModal();openTodos()">
        <span class="td-badge ${pm.cls}" style="flex:0 0 auto">${esc(pm.label)}</span>
        <div class="cb-mid"><div class="cb-t">${esc(t.text)}</div>${t.problem?`<div class="cb-s">${esc(t.problem)}</div>`:""}</div>
        <span class="cb-go">›</span></div>`;
    }).join("") : `<div class="empty" style="padding:20px">No pending tasks.</div>`;
  }
  else {
    title="Active matters";
    const sorted=active.slice().sort((a,b)=>(a.parties||a.client||"").localeCompare(b.parties||b.client||""));
    rows = sorted.length ? sorted.map(m=>`<div class="cb-row" onclick="closeModal();openMatterDetail('${m.id}')">
        <div class="cb-mid"><div class="cb-t">${esc(m.parties||m.client||"—")}</div>
          <div class="cb-s">${esc(m.code||"")}${m.nextDate?" · next "+fmtDate(m.nextDate):" · no date"}${m.court?" · "+esc(m.court):""}</div></div>
        <span class="cb-go">›</span></div>`).join("") : `<div class="empty" style="padding:20px">No active matters.</div>`;
  }
  openModal(title, `<div class="cb-list">${rows}</div>
    <div class="btn-row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

// Live check: warn if the chosen hearing date is a Supreme Court holiday, and
// note if it falls in the partial-court-working window. Non-blocking.
function _adDateCheck(){
  const el=document.getElementById("adDateWarn"); if(!el) return;
  if(!scOverlayOn()){ el.className="dup-warn"; el.textContent=""; return; }
  const iso=(document.getElementById("adDate")||{}).value||"";
  const hol=scHoliday(iso); const kind=scDayKind(iso);
  if(hol){
    el.className="dup-warn show hot";
    el.innerHTML=`⚖️ <b>${esc(hol.name)}</b> is a Supreme Court holiday — the Court isn't sitting on this day. Double-check the listing date.`;
  } else if(kind==="sunday"){
    el.className="dup-warn show hot";
    el.innerHTML=`⚖️ This is a <b>Sunday</b> — the Court is closed. Double-check the listing date.`;
  } else if(kind==="partial"){
    el.className="dup-warn show";
    el.innerHTML=`◑ This date is in the <b>partial-court-working</b> period (Full Court resumes 13 Jul 2026).`;
  } else {
    el.className="dup-warn"; el.textContent="";
  }
}

function doAddDate(id, editId){
  const m=matterById(id); if(!m) return;
  const g=(x)=>((document.getElementById(x)||{}).value||"").trim();
  const date=g("adDate")||todayISO();
  let reason=(document.getElementById("adReason")||{}).value||"";
  if(/other/i.test(reason)){ reason=g("adCustom")||"Other"; }
  const note=g("adNote");
  const timingMode=(document.getElementById("adTimingMode")||{}).value||"default";
  const special=g("adSpecialTime");
  // calendar time = special time if set, else custom court-from, else blank
  const time = special || (timingMode==="custom"?g("adCourtFrom"):"") || "";
  if(!Array.isArray(m.dates)) m.dates=[];
  const fields={ date, time, reason, note,
    courtNo:g("adCourtNo"), itemNo:g("adItemNo"), coram:g("adCoram"),
    timingMode, courtFrom:g("adCourtFrom"), courtTo:g("adCourtTo"), specialTime:special,
    mainTotal:g("adMainTotal"), mainFresh:g("adMainFresh"), suppTotal:g("adSuppTotal"),
    suppFresh:g("adSuppFresh"), seqPos:g("adSeqPos"), team:g("adTeam") };
  if(editId){
    const d=m.dates.find(x=>x.id===editId);
    if(d){ Object.assign(d, fields); _auditStamp(d, false); }
  } else {
    m.dates.push(_auditStamp(Object.assign({ id:uid() }, fields), true));
  }
  m.dates.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const future=m.dates.filter(d=>d.date>=todayISO());
  const next = future.length? future[0] : m.dates[m.dates.length-1];
  m.nextDate = next? next.date : "";
  m.hearingNote = next? next.reason : "";
  save(); closeModal(); _refreshMatterDetail();
  if(document.getElementById("panel-home")&&document.getElementById("panel-home").classList.contains("active")){ if(isStaffView()) renderStaffHome(); else renderHome(); }
  _refreshCalendarIfOpen();
  toast(editId?"Date updated.":"Date added.");
}

  panel.innerHTML=`

/* ===========================================================
   AUTO-LOGOUT ON INACTIVITY
   A rolling timer: any interaction resets it. After the idle period
   with no activity, the session is signed out for security. A short
   warning appears first so the user can stay signed in with one tap.
   =========================================================== */
var _idleTimer=null, _idleWarnTimer=null, _idleWarnEl=null;
function idleTimeoutMin(){
  const v = DB.settings && +DB.settings.idleLogoutMin;
  return (v && v>0) ? v : 30;   // default 30 minutes
}
function _clearIdleWarn(){
  if(_idleWarnEl){ try{_idleWarnEl.remove();}catch(e){} _idleWarnEl=null; }
  if(_idleWarnTimer){ clearTimeout(_idleWarnTimer); _idleWarnTimer=null; }
}
function _showIdleWarning(){
  _clearIdleWarn();
  const el=document.createElement("div");
  el.id="idleWarn";
  el.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9500;background:#6b1f1f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:340px;width:92%;text-align:center;font-family:inherit";
  el.innerHTML=`You'll be signed out shortly for security.<div style="margin-top:9px"><button id="idleStay" style="background:#fff;color:#6b1f1f;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">Stay signed in</button></div>`;
  document.body.appendChild(el); _idleWarnEl=el;
  document.getElementById("idleStay").addEventListener("click",()=>{ _clearIdleWarn(); _resetIdleTimer(); });
  // if ignored for 60s, log out
  _idleWarnTimer=setTimeout(()=>{ _autoLogout(); }, 60000);
}
async function _autoLogout(){
  _clearIdleWarn(); _stopIdleTimer();
  try{
    DB.deviceRole=null; save();
    if(window.FB && FB.logout) await FB.logout();
  }catch(e){}
  try{ sessionStorage.setItem("asd_autologout","1"); }catch(e){}
  location.reload();
}
function _resetIdleTimer(){
  if(_idleTimer) clearTimeout(_idleTimer);
  _clearIdleWarn();
  if(!DB.deviceRole) return;   // only when signed in
  const ms = idleTimeoutMin()*60000;
  // show the warning 60s before the actual logout
  const warnAt = Math.max(ms-60000, Math.floor(ms*0.5));
  _idleTimer=setTimeout(()=>{ _showIdleWarning(); }, warnAt);
}
var _idleBound=false;
function _startIdleTimer(){
  if(!_idleBound){
    ["click","keydown","touchstart","mousemove","scroll","visibilitychange"].forEach(evt=>{
      window.addEventListener(evt, ()=>{ if(document.visibilityState!=="hidden") _resetIdleTimer(); }, {passive:true});
    });
    _idleBound=true;
  }
  _resetIdleTimer();
}
function _stopIdleTimer(){
  if(_idleTimer){ clearTimeout(_idleTimer); _idleTimer=null; }
  _clearIdleWarn();
}

   DESKTOP / PHONE VIEW TOGGLE (device-level UI preference)

function _viewPrefKey(){ return "asd_view_pref"; }
function isDesktopView(){

}
function applyViewPref(){

    btn.innerHTML = on

      : `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>`;

function toggleDesktopView(){

/* ===========================================================
   MASTER ACCESS CONTROL (owner-only)
   Allow-list of authorised emails + kill-switch. Stored in the cloud
   at chamber/main/meta/access; enforced at login for everyone but the owner.
   =========================================================== */
var _accessCache={ allow:[], allowActive:false, locked:false };
async function loadAccess(){
  try{ const a = window.FB && FB.getAccess ? await FB.getAccess() : null;
    if(a){ _accessCache={ allow:Array.isArray(a.allow)?a.allow:[], allowActive:a.allowActive===true, locked:a.locked===true }; }
  }catch(e){}
  return _accessCache;
}
async function saveAccess(){
  try{ if(window.FB && FB.putAccess){ await FB.putAccess(_accessCache); toast("Access settings saved."); } }
  catch(e){ toast("Could not save access settings: "+(e&&e.message?e.message:e), true); }
}
function renderAccess(target){
  const panel=target || document.getElementById("panel-access");
  if(!panel) return;
  const a=_accessCache;
  const emails=(a.allow||[]).map(e=>String(e||"").trim()).filter(Boolean);
  const rows = emails.length ? emails.map((e,i)=>`<div class="lrow"><div class="l"><div class="t">${esc(e)}</div></div>
      <div><button class="row-act" onclick="removeAccessEmail(${i})">Remove</button></div></div>`).join("")
    : `<div class="empty" style="padding:12px">No emails added yet.</div>`;
  panel.innerHTML=`
    <div class="card">
      <div class="card-head"><div><h2>Access control</h2><div class="hint">Decide who may use this app. You (the Head of Chamber) always have access.</div></div></div>

      <div class="acc-block" style="margin-top:6px">
        <label class="switch-row">
          <span><b>Restrict to approved emails only</b><div class="hint" style="margin-top:2px">When on, only emails on the list below can use the app — chamber and personal billing alike.</div></span>
          <input type="checkbox" id="accListActive" ${a.allowActive?"checked":""} onchange="setAccessListActive(this.checked)">
        </label>
      </div>

      <div style="margin-top:12px">
        <label class="fld">Add an email</label>
        <div style="display:flex;gap:8px">
          <input class="in" id="accEmail" type="email" placeholder="person@email.com" style="flex:1">
          <button class="btn seal sm" onclick="addAccessEmail()">Add</button>
        </div>
        <div class="lrows" style="margin-top:10px">${rows}</div>
      </div>

      <div class="acc-block" style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">
        <label class="switch-row">
          <span><b style="color:var(--seal)">Lock the app (kill-switch)</b><div class="hint" style="margin-top:2px">Instantly blocks everyone except you. Use in an emergency; turn off to restore access.</div></span>
          <input type="checkbox" id="accLocked" ${a.locked?"checked":""} onchange="setAccessLocked(this.checked)">
        </label>
      </div>

      <div class="note" style="margin-top:16px">Changes take effect the next time someone opens or reloads the app. Anyone already signed in keeps their current session until they reload or are signed out by inactivity.</div>
    </div>`;
}
function _renderAccessInto(body){
  // Access data loads async; render immediately, then refresh once loaded.

function addAccessEmail(){
  const el=document.getElementById("accEmail"); if(!el) return;
  const v=(el.value||"").trim().toLowerCase();
  if(!v || v.indexOf("@")<0){ toast("Enter a valid email.", true); return; }
  if(!Array.isArray(_accessCache.allow)) _accessCache.allow=[];
  if(_accessCache.allow.map(x=>String(x).toLowerCase()).indexOf(v)>=0){ toast("Already on the list."); return; }
  _accessCache.allow.push(v); el.value="";
  saveAccess().then(()=>_accessRefresh());
}
function removeAccessEmail(i){
  if(!Array.isArray(_accessCache.allow)) return;
  const email=_accessCache.allow[i];
  openModal("Remove access", `<div class="hint" style="margin-bottom:10px">Remove <b>${esc(email||"")}</b> from the approved list? They will lose access to the app when they next reload.</div>

      <button class="btn seal" onclick="doRemoveAccessEmail(${i})">Remove</button></div>`);
}
function doRemoveAccessEmail(i){
  _accessCache.allow.splice(i,1);
  closeModal();
  saveAccess().then(()=>_accessRefresh());
}
function setAccessListActive(on){ _accessCache.allowActive=!!on; saveAccess(); }
function setAccessLocked(on){

}

var _myBill = null;         // {profile:{name,pan,bank,upi,addr}, receipts:[], invoices:[], counters:{r,i}}

function _myBillKey(){ return "asd_mybill_"+((window.__staff&&window.__staff.uid)||"anon"); }
function _loadMyBill(){
  if(_myBill) return _myBill;
  try{ _myBill = JSON.parse(localStorage.getItem(_myBillKey())||"null"); }catch(e){ _myBill=null; }
  if(!_myBill) _myBill = {profile:{name:"",pan:"",addr:"",bankName:"",bankAcc:"",ifsc:"",upi:""}, receipts:[], invoices:[], counters:{r:0,i:0}};

  try{ localStorage.setItem(_myBillKey(), JSON.stringify(_myBill)); }catch(e){}

  const chip=(u)=> u?` <a class="cl-chip" href="${esc(u)}" target="_blank" rel="noopener" title="Open saved PDF">☁︎</a>`:"";
  const recRows=recs.map((r,i)=>`<tr>

  const invRows=invs.map((v,i)=>`<tr>

      <td>${fmtDate(v.date)}</td>
      <td>${esc(v.to||"—")}</td>

    </tr>`).join("");
  return `
    <div class="scard">
      <div class="sc-head" style="display:flex;justify-content:space-between;align-items:center"><h3>My receipts</h3><div class="hint">${recs.length} · total ${fmtINR(recTotal)}</div></div>

const FB = {

  email(){ return auth.currentUser ? auth.currentUser.email : null; },
  // ---- Firestore refs (per-account, per-record) ----

  _base(){ const u=this.uid(); return u ? `accounts/${u}` : null; },
  colRef(name){ const b=this._baseFor(name); return b ? collection(db, b, name) : null; },

  listen(name, cb){

  async putSettings(obj){

  // ERASE ALL CLOUD DATA (owner only). Deletes every document in every

  // default so the chamber identity + who-can-access survive the wipe.
  async wipeCloud(opts){

  const snap=await getDocs(FB.inboxColRef(u)); const out=[]; snap.forEach(d=>out.push(Object.assign({id:d.id}, d.data()))); return out;
};
// staff profile / directory (owner-managed approval + balance mirror)
FB.staffDirRef = function(uid){ return doc(db, "staffdir", uid); };
// Staff member's own private space (their own account) — for personal billing etc.
FB.putOwnDoc = async function(coll, id, data){
  const u=FB.uid(); if(!u) return;
  await setDoc(doc(db,"accounts",u,coll,id), Object.assign({},data,{_updated:serverTimestamp()}), {merge:true});
};
FB.getOwnDoc = async function(coll, id){
  const u=FB.uid(); if(!u) return null;
  const s=await getDoc(doc(db,"accounts",u,coll,id)); return s.exists()? s.data() : null;
};
FB.getStaffDir = async function(uid){ const s=await getDoc(FB.staffDirRef(uid)); return s.exists()? s.data() : null; };
FB.putStaffDir = async function(uid, data){ await setDoc(FB.staffDirRef(uid), Object.assign({},data,{_updated:serverTimestamp()}), {merge:true}); };
FB.listenStaffDir = function(uid, cb){ return onSnapshot(FB.staffDirRef(uid), s=>cb(s.exists()?s.data():null)); };
// owner watches the whole inbox across all staff via collectionGroup
FB.listenAllInbox = function(cb){
  const q = collectionGroup(db, "entries");
  return onSnapshot(q, snap=>{
    const out=[]; snap.forEach(d=>{ const data=d.data(); out.push(Object.assign({id:d.id, _path:d.ref.path}, data)); });
    cb(out);
  }, err=>{ console.warn("inbox listen error", err); });
};
// owner lists the staff directory (all who have registered)
FB.listenStaffDirAll = function(cb){
  return onSnapshot(collection(db, "staffdir"), snap=>{
    const out=[]; snap.forEach(d=>out.push(Object.assign({uid:d.id}, d.data()))); cb(out);
  }, err=>{ console.warn("staffdir listen error", err); });
};
FB.getStaffDirAll = async function(){
  const snap=await getDocs(collection(db,"staffdir")); const out=[]; snap.forEach(d=>out.push(Object.assign({uid:d.id}, d.data()))); return out;
};

onAuthStateChanged(auth, u=>{
  FB.user = u || null;
  FB._authCbs.forEach(cb=>{ try{ cb(FB.user); }catch(e){} });
  // let the engine know
  if(window.onFirebaseAuth) window.onFirebaseAuth(FB.user);
});

window.FB = FB;
window.dispatchEvent(new Event("firebase-ready"));

</script>

  // Home-screen long-press shortcuts (Android/desktop PWA). Each opens the app
  // with a ?do= param the app reads on load to jump straight to the action.
  manifest.shortcuts = [
    { name:"New receipt", short_name:"Receipt", url: SELF+"?do=receipt" },
    { name:"Today's hearings", short_name:"Today", url: SELF+"?do=today" },
    { name:"Add task", short_name:"Task", url: SELF+"?do=task" }
  ];
  try {
    var mBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    var mUrl = URL.createObjectURL(mBlob);
    var link = document.createElement("link");
    link.rel = "manifest"; link.setAttribute("crossorigin","use-credentials"); link.href = mUrl;
    document.head.appendChild(link);
  } catch(e) {}

  // Register a service worker so the browser offers a true "Install app"
  // (which uses THIS app's icon), instead of a Home-screen shortcut that
  // gets badged with the browser's own logo. The worker file (sw.js) must
  // sit next to this HTML file on the server (GitHub Pages).
  //
  // Also drives the auto-update prompt: this build carries a version stamp;
  // the app polls a tiny version.json on the server and, when it differs,
  // shows a "new version available" banner that reloads cleanly on tap.
  window.APP_VERSION = "2026.07.07-0230";
  window.__APP_VER_PLACEHOLDER = ["__APP","_VERSION__"].join("");  // never matches the stamp
  (function(){
    function showUpdateBar(serverVer){
      if(document.getElementById("updateBar")) return;
      var bar=document.createElement("div");
      bar.id="updateBar";
      bar.innerHTML='<span class="ub-txt">A new version of the app is available.</span>'+
        '<button class="ub-btn" id="ubReload">Update now</button>'+
        '<button class="ub-x" id="ubClose" aria-label="Dismiss">\u00d7</button>';
      document.body.appendChild(bar);
      document.getElementById("ubReload").addEventListener("click", doAppUpdate);
      document.getElementById("ubClose").addEventListener("click", function(){ bar.remove(); });
    }
    window.doAppUpdate = function(){
      // Clear caches, nudge any waiting service worker to activate, then reload once.
      var done=function(){ location.reload(true); };
      try{
        var tasks=[];
        if(window.caches && caches.keys){
          tasks.push(caches.keys().then(function(ns){ return Promise.all(ns.map(function(n){ return caches.delete(n); })); }));
        }
        if(navigator.serviceWorker){
          tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
            regs.forEach(function(r){ if(r.waiting) r.waiting.postMessage("skipWaiting"); try{ r.update(); }catch(e){} });
          }));
        }
        Promise.all(tasks).then(done, done);
        setTimeout(done, 1500); // safety net
      }catch(e){ done(); }
    };
    window.checkForUpdate = function(){
      try{
        fetch("version.json?ts="+Date.now(), {cache:"no-store"})
          .then(function(r){ return r.ok? r.json() : null; })
          .then(function(j){
            if(j && j.version && window.APP_VERSION && j.version!==window.APP_VERSION && window.APP_VERSION!==window.__APP_VER_PLACEHOLDER){
              showUpdateBar(j.version);
            }
          }).catch(function(){});
      }catch(e){}
    };
  })();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline or file missing: install still works via manifest on most browsers */ });
      // If a new worker takes control while the app is open, reload to pick it up.
      var reloaded=false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(reloaded) return; reloaded=true; location.reload();
      });
    });
  }
  // Poll for a newer published version: shortly after load, then hourly, and
  // whenever the app regains focus (staff often reopen it in the morning).
  window.addEventListener("load", function(){
    setTimeout(function(){ if(window.checkForUpdate) window.checkForUpdate(); }, 4000);
    setInterval(function(){ if(window.checkForUpdate) window.checkForUpdate(); }, 3600000);
  });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && window.checkForUpdate) window.checkForUpdate();
  });
  // Friendly "Install app" affordance: capture the prompt, show a small button.
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e;
    var b = document.getElementById("installBtn");
    if(b) b.style.display = "inline-flex";
  });
  window.__installApp = function(){
    if(deferred){ deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; var b=document.getElementById("installBtn"); if(b) b.style.display="none"; }); }
    else { alert("To install: in your browser menu choose \u2018Install app\u2019 or \u2018Add to Home Screen\u2019."); }
  };
})();
