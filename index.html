// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

// ---- Document verification QR ----
// Encodes a self-contained, human-readable summary of the document so a client
// can scan it and see the canonical details (chamber, doc type, number, date,
// amount). There is no server to verify against; this is a tamper-evident
// summary, not an online check. Toggle off in Settings if not wanted.
function _verifyPayload(kind, no, date, amount){
  const s=DB.settings||{};
  const who=(s.chamberName&&s.chamberName.trim())||s.advName||"Chamber";
  const lines=[
    who,
    kind+" No: "+(no||"—"),
    "Date: "+fmtDate(date),
    (amount!=null?("Amount: "+fmtINR(amount)):"")
  ].filter(Boolean);
  return lines.join("\n");
}
function _verifyQRBlock(kind, no, date, amount){
  if(DB.settings && DB.settings.docVerifyQR===false) return "";
  let svg="";
  try{ svg=QR.svg(_verifyPayload(kind,no,date,amount), 84); }catch(e){ svg=""; }
  if(!svg) return "";
  return `<div class="tpl-verify"><div class="vq">${svg}</div><div class="vcap">Scan to verify<br>${esc(kind)} details</div></div>`;
}
/* QR.svg wrapper for inline use (UPI payloads) */
var QR = (function(){
  function svg(text, px){
    try{
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount();
      var rects = "";
      for(var r=0;r<n;r++)for(var c=0;c<n;c++){ if(qr.isDark(r,c)) rects += '<rect x="'+c+'" y="'+r+'" width="1" height="1"/>'; }
      var dim = n+8;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 '+dim+' '+dim+'" width="'+(px||140)+'" height="'+(px||140)+'"><rect x="-4" y="-4" width="'+dim+'" height="'+dim+'" fill="#fff"/><g fill="#1a1a18">'+rects+'</g></svg>';
    }catch(e){ return ""; }
  }
  return { svg: svg };
})();


function numToWords(n){
  n = Math.round(Number(n)||0);
  if(n===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=> x<20? a[x] : b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=> { const h=Math.floor(x/100), r=x%100; return (h? a[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
  let out="", crore=Math.floor(n/10000000); n%=10000000;
  let lakh=Math.floor(n/100000); n%=100000;
  let thou=Math.floor(n/1000); n%=1000;
  let hund=n;
  if(crore) out+=two(crore)+" Crore ";
  if(lakh) out+=two(lakh)+" Lakh ";
  if(thou) out+=two(thou)+" Thousand ";
  if(hund) out+=three(hund);
  return out.trim().replace(/\s+/g," ");
}

// ---- Duplicate-smart warnings while typing (matter form) ----
function _dupCheck(field, val, selfId){
  const el=document.getElementById(field==="case"?"dupCase":"dupClient"); if(!el) return;
  val=(val||"").trim(); if(!val || val.length<3){ el.className="dup-warn"; el.textContent=""; return; }
  const low=val.toLowerCase();
  let hits=[];
  if(field==="case"){
    hits=(DB.matters||[]).filter(m=>m.id!==selfId && !isVoided(m) && (m.caseNo||"").trim().toLowerCase()===low);
  } else {
    hits=(DB.matters||[]).filter(m=>m.id!==selfId && !isVoided(m) && (m.client||"").trim().toLowerCase()===low);
  }
  if(!hits.length){ el.className="dup-warn"; el.textContent=""; return; }
  if(field==="case"){
    el.className="dup-warn show hot";
    el.innerHTML=`⚠️ A matter with this case number already exists: <b>${esc(hits[0].code)}</b>${hits[0].parties?" — "+esc(hits[0].parties):""}. Check before adding a duplicate.`;
  } else {
    el.className="dup-warn show";
    el.innerHTML=`ℹ️ You already have ${hits.length} matter${hits.length>1?"s":""} for a client named “${esc(val)}” (${hits.slice(0,3).map(h=>esc(h.code)).join(", ")}${hits.length>3?"…":""}). That's fine if it's a new matter.`;
  }
}

/* ===========================================================
   APPOINTMENTS & MEETINGS
   - Case-related / Other business -> SHARED (DB.appointments)
   - Personal -> PRIVATE to the person (DB.myAppointments, mirrored
     to their own account space; never shared)
   Both owner and staff can add/edit/delete shared ones.
   =========================================================== */
function _myApptKey(){
  const who = isStaffView() ? ((window.__staff&&window.__staff.uid)||"staff") : "owner";
  return "asd_myappts_"+who;
}
function _loadMyAppts(){
  // Always load strictly from THIS person's key. Never inherit another
  // person's in-memory personal appointments (privacy).
  let v=[];
  try{ const raw=localStorage.getItem(_myApptKey()); v=raw?JSON.parse(raw):[]; }catch(e){ v=[]; }
  DB.myAppointments = Array.isArray(v)? v : [];
  return DB.myAppointments;
}
function _saveMyAppts(){
  try{ localStorage.setItem(_myApptKey(), JSON.stringify(DB.myAppointments||[])); }catch(e){}
  try{ if(window.FB && FB.putOwnDoc) FB.putOwnDoc("private","appointments",{list:DB.myAppointments||[]}); }catch(e){}
}
function _allApptsForMe(){
  // shared (case/business) + my personal ones
  const shared=(DB.appointments||[]);
  const mine=_loadMyAppts();
  return shared.concat(mine);
}

/* ===========================================================
   ACTIVITY FEED (in-app notifications)
   Shared events (matters, expenses, advances, tasks, documents) go to the
   shared feed everyone sees. Owner-only events (receipts, invoices) go to a
   private owner feed so the finance wall is preserved — staff never see them.
   =========================================================== */
function logActivity(type, text, opts){
  opts=opts||{};
  const ev={ id:uid(), type, text:text||"", who:headLabelOrStaff(), at:new Date().toISOString(), refId:opts.refId||"" };
  if(opts.ownerOnly){
    if(!Array.isArray(DB._ownerActivity)) DB._ownerActivity=[];
    DB._ownerActivity.unshift(ev);
    DB._ownerActivity=DB._ownerActivity.slice(0,300);
  }else{
    if(!Array.isArray(DB.activity)) DB.activity=[];
    DB.activity.push(ev);
    // keep the shared feed from growing without bound
    if(DB.activity.length>400) DB.activity=DB.activity.slice(-400);
  }
  _refreshActivityBadge();
}
function _activityForMe(){
  const shared=(DB.activity||[]).slice();
  const own = (!isStaffView() && Array.isArray(DB._ownerActivity)) ? DB._ownerActivity.slice() : [];
  return shared.concat(own).sort((a,b)=>(b.at||"").localeCompare(a.at||""));
}

// Which activity types can open an underlying record (needs a refId we can route)
function _activityHasTarget(e){
  if(!e) return false;
  if(e.type==="matter") return true; // routes by refId or by parsing code
  return !!e.refId && ["receipt","invoice","expense","advance","task","document","appointment","date"].indexOf(e.type)>=0;
}
// Route a tapped activity item to the record it refers to.
function _activityGoTo(type, refId){
  try{
    switch(type){
      case "matter":{
        if(refId && DB.matters.some(m=>m.id===refId)){ openMatterDetail(refId); return; }
        // older matter events had no refId — fall back to the Matters register
        openSub("matters"); return;
      }
      case "receipt": openSub("ledger"); return;
      case "invoice": openBilling? openBilling("invoiceledger") : openSub("ledger"); return;
      case "expense":
      case "advance": openLedger(); return;
      case "task": openTodos(); return;
      case "document": openSub("unassigned"); return;
      case "appointment":
      case "date": openAppointments(); return;
      default: return;
    }
  }catch(err){ /* never let routing throw */ }
}

   GLOBAL SEARCH — search across everything, tap a result to open it

function openSearch(){

function _gsMatchesText(hay, q){ return (hay||"").toLowerCase().indexOf(q)>=0; }
// text of the matter a record is linked to, so searching a party/code/case no.
// also surfaces the receipts/expenses/docs attached to that matter
function _gsMatterText(matterId){
  if(!matterId) return "";
  const m=(DB.matters||[]).find(x=>x.id===matterId); if(!m) return "";
  return [m.code,m.parties,m.client,m.caseNo].filter(Boolean).join(" ");
}
function _gsMatterLabel(matterId){
  if(!matterId) return "";
  const m=(DB.matters||[]).find(x=>x.id===matterId); if(!m) return "";
  const t=m.parties||m.client||""; return m.code+(t?" · "+t:"");
}
// Build a flat, ranked result list from every collection the current viewer may see.
function _gsSearch(q){
  q=(q||"").trim().toLowerCase();
  if(!q) return [];
  const staff=isStaffView();
  const out=[];
  // Matters (everyone)
  (DB.matters||[]).forEach(m=>{
    const hay=[m.code,m.parties,m.client,m.caseNo,m.court,m.forum,m.status].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"matter", icon:"📋", title:(m.code||"")+(m.parties?" — "+m.parties:(m.client?" — "+m.client:"")),
      sub:(m.caseNo?("Case "+m.caseNo+" · "):"")+(m.status||"Active"),
      go:()=>{ closeModal(); openMatterDetail(m.id); }
    });
  });
  // Expenses (everyone)
  (DB.expenses||[]).forEach(x=>{
    const hay=[x.head,x.note,x.remarks,String(x.amount),_gsMatterText(x.matterId)].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"expense", icon:"💸", title:"Expense "+fmtINR(x.amount)+(x.head?" — "+x.head:""),
      sub:(x.date?fmtDate(x.date)+" · ":"")+(_gsMatterLabel(x.matterId)||"General"),
      go:()=>{ closeModal(); openLedger(); }
    });
  });
  // Tasks (everyone)
  (DB.todos||[]).forEach(t=>{
    if(_gsMatchesText(t.text,q)) out.push({
      type:"task", icon:"✅", title:t.text, sub:(t.status==="resolved"?"Resolved":"Open task"),
      go:()=>{ closeModal(); openTodos(); }
    });
  });
  // Documents (everyone)
  (DB.docsIn||[]).concat(DB.docsFiled||[]).forEach(d=>{
    const hay=[d.title,d.name,d.note,_gsMatterText(d.matterId)].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"document", icon:"📎", title:"Doc: "+(d.title||d.name||"file"),
      sub:_gsMatterLabel(d.matterId)||"Unassigned",
      go:()=>{ closeModal(); if(d.url){ window.open(d.url,"_blank"); } else { openSub("unassigned"); } }
    });
  });
  // Appointments (everyone)
  (DB.appointments||[]).forEach(a=>{
    const hay=[a.title,a.note,a.with,a.place].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"appointment", icon:"🗓️", title:a.title||"Appointment",
      sub:(a.date?fmtDate(a.date):"")+(a.time?" "+a.time:""),
      go:()=>{ closeModal(); openAppointments(); }
    });
  });
  // Receipts & invoices — OWNER ONLY (finance wall)
  if(!staff){
    (DB.receipts||[]).forEach(r=>{
      const hay=[r.no,r.towards,r.remarks,String(r.amount),r.mode,_gsMatterText(r.matterId)].join(" ");
      if(_gsMatchesText(hay,q)) out.push({
        type:"receipt", icon:"🧾", title:"Receipt "+(r.no||"")+" — "+fmtINR(r.amount),
        sub:(r.date?fmtDate(r.date)+" · ":"")+(_gsMatterLabel(r.matterId)||""),
        go:()=>{ closeModal(); openSub("ledger"); }
      });
    });
    (DB.invoices||[]).forEach(v=>{
      const hay=[v.no,v.towards,String(v.total||v.amount),_gsMatterText(v.matterId)].join(" ");
      if(_gsMatchesText(hay,q)) out.push({
        type:"invoice", icon:"📄", title:"Invoice "+(v.no||"")+" — "+fmtINR(v.total||v.amount||0),
        sub:(v.date?fmtDate(v.date)+" · ":"")+(_gsMatterLabel(v.matterId)||""),
        go:()=>{ closeModal(); (typeof openBilling==="function"?openBilling("invoiceledger"):openSub("ledger")); }
      });
    });
  }
  // exact code/number matches first, then the rest
  out.sort((a,b)=>{
    const ax=(a.title||"").toLowerCase().indexOf(q), bx=(b.title||"").toLowerCase().indexOf(q);
    return ax-bx;
  });
  return out;
}
var _gsHandlers=[];
function _gsRun(q){
  const box=document.getElementById("gsResults"); if(!box) return;
  const qa=_parseQuickAdd(q);
  const qaChip = qa ? `<div class="qa-chip" onclick="_runQuickAdd()">
      <span class="qa-ic">＋</span>

      <span class="gs-chev">›</span></div>` : "";
  window.__quickAdd = qa;
  const results=_gsSearch(q);
  _gsHandlers=results;
  if(!q || !q.trim()){ box.innerHTML=`<div class="hint" style="padding:10px 2px">Start typing to search — or begin with <b>receipt</b>, <b>invoice</b>, <b>task</b>, <b>matter</b> to quick-add.</div>`; return; }
  const resHTML = results.length ? results.slice(0,60).map((r,i)=>`
    <div class="gs-row" onclick="_gsGo(${i})">
      <span class="gs-ic">${r.icon||"•"}</span>

    </div>`).join("")
    + (results.length>60?`<div class="hint" style="padding:8px 2px">Showing first 60 of ${results.length}. Refine your search to narrow.</div>`:"")
    : (qa ? "" : `<div class="empty" style="padding:20px">No matches for “${esc(q)}”.</div>`);
  box.innerHTML = qaChip + resHTML;
}
// Parse a quick-add command like "receipt kavale 50000" or "task draft reply friday".
function _parseQuickAdd(q){
  q=(q||"").trim(); if(!q) return null;
  const m=/^(receipt|invoice|task|reminder|matter|expense)\b\s*(.*)$/i.exec(q);
  if(!m) return null;
  const kind=m[1].toLowerCase(); const rest=(m[2]||"").trim();
  // pull a trailing amount if present
  let amount=null; const am=/(?:₹|rs\.?\s*)?(\d[\d,]{2,})\b\s*$/i.exec(rest);
  let body=rest;
  if(am){ amount=parseInt(am[1].replace(/,/g,""),10); body=rest.slice(0,am.index).trim(); }
  // try to match a known client/matter in the body
  let matter=null;
  if(body){
    const low=body.toLowerCase();
    matter=(DB.matters||[]).find(x=>!isVoided(x) && ((x.client&&low.indexOf(x.client.toLowerCase())>=0)||(x.parties&&low.indexOf(x.parties.toLowerCase())>=0)||(x.code&&low.indexOf(x.code.toLowerCase())>=0)));
  }
  const labels={receipt:"New receipt",invoice:"New invoice",task:"New task",reminder:"New reminder",matter:"New matter",expense:"New expense"};
  let detail=[];
  if(matter) detail.push(matter.code+(matter.client?" · "+matter.client:""));
  if(amount) detail.push(fmtINR(amount));
  if(!matter && body && (kind==="task"||kind==="reminder"||kind==="matter")) detail.push("“"+body+"”");
  return { kind, body, amount, matterId:matter?matter.id:"", label:labels[kind], detail: detail.join("  ·  ")||"Tap to fill the form" };
}
function _runQuickAdd(){
  const qa=window.__quickAdd; if(!qa) return;
  closeModal();
  setTimeout(()=>{
    if(qa.kind==="receipt"){ openBilling&&openBilling("receipt"); setTimeout(()=>{ if(qa.matterId){const s=document.getElementById("rcMatter"); if(s){s.value=qa.matterId; s.dispatchEvent(new Event("change"));}} if(qa.amount){const g=document.getElementById("rcGross"); if(g){g.value=qa.amount; g.dispatchEvent(new Event("input"));}} },160); }
    else if(qa.kind==="invoice"){ openBilling&&openBilling("invoice"); setTimeout(()=>{ if(qa.matterId){const s=document.getElementById("ivMatter"); if(s){s.value=qa.matterId; s.dispatchEvent(new Event("change"));}} },160); }
    else if(qa.kind==="task"){ addTodo&&addTodo(); setTimeout(()=>{ const t=document.getElementById("tdText"); if(t&&qa.body) t.value=qa.body; if(qa.matterId){const s=document.getElementById("tdMatter"); if(s) s.value=qa.matterId;} },160); }
    else if(qa.kind==="reminder"){ addReminder&&addReminder(); setTimeout(()=>{ const t=document.getElementById("rmText"); if(t&&qa.body) t.value=qa.body; },160); }
    else if(qa.kind==="matter"){ addMatter&&addMatter(); setTimeout(()=>{ const c=document.getElementById("mfClient"); if(c&&qa.body) c.value=qa.body; },160); }
    else if(qa.kind==="expense"){ addExpense&&addExpense(); }
  },120);
}
function _gsGo(i){ const r=_gsHandlers[i]; if(r && typeof r.go==="function") r.go(); }
function _actWhen(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date();
  const diff=(now-d)/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+"m ago";
  if(diff<86400 && d.getDate()===now.getDate()) return "today "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  if(diff<172800) return "yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}

/* ============================================================
   SUPREME COURT OF INDIA — official calendar (holidays &
   partial-court-working days). Source: SCI Calendar 2026.
   Used to tint the calendar and flag non-sitting days so a
   listing is never expected on a day the Court isn't sitting.
   ============================================================ */
var SC_HOLIDAYS_2026 = [
  {from:"2026-01-01", to:"2026-01-02", name:"New Year Holidays"},
  {from:"2026-01-14", name:"Makar Sankranti / Pongal"},
  {from:"2026-01-26", name:"Republic Day"},
  {from:"2026-03-02", to:"2026-03-07", name:"Holi Holidays"},
  {from:"2026-03-21", name:"Id-ul-Fitr"},
  {from:"2026-03-26", name:"Ram Navami"},
  {from:"2026-03-27", name:"Local Holiday"},
  {from:"2026-03-30", name:"Local Holiday"},
  {from:"2026-03-31", name:"Mahavir Jayanti"},
  {from:"2026-04-03", name:"Good Friday"},
  {from:"2026-05-01", name:"Budha Purnima"},
  {from:"2026-05-27", name:"Id-ul-Zuha (Bakrid)"},
  {from:"2026-06-26", name:"Muharram"},
  {from:"2026-08-15", name:"Independence Day"},
  {from:"2026-08-26", name:"Milad-un-Nabi"},
  {from:"2026-08-28", name:"Raksha Bandhan"},
  {from:"2026-09-04", name:"Janmashtami"},
  {from:"2026-09-14", name:"Ganesh Chaturthi"},
  {from:"2026-10-02", name:"Mahatma Gandhi's Birthday"},
  {from:"2026-10-19", to:"2026-10-24", name:"Dussehra Holidays"},
  {from:"2026-11-09", to:"2026-11-14", name:"Diwali Holidays"},
  {from:"2026-11-24", name:"Guru Nanak's Birthday"},
  {from:"2026-12-21", to:"2027-01-01", name:"Christmas & New Year Holidays"}
];
// Partial-court-working window: 1 Jun 2026 → 10 Jul 2026 (Full Court resumes 13 Jul).
var SC_PARTIAL_2026 = {from:"2026-06-01", to:"2026-07-10", resumeFull:"2026-07-13", registryLastSat:"2026-07-11"};

// Return the holiday object covering an ISO date, or null.
function scHoliday(iso){
  if(!iso) return null;
  for(var i=0;i<SC_HOLIDAYS_2026.length;i++){
    var h=SC_HOLIDAYS_2026[i];
    var to=h.to||h.from;
    if(iso>=h.from && iso<=to) return h;
  }
  return null;
}
// Is this ISO date within the partial-court-working window (a working weekday)?
function scIsPartial(iso){
  if(!iso) return false;
  if(iso<SC_PARTIAL_2026.from || iso>SC_PARTIAL_2026.to) return false;
  var dow=new Date(iso+"T00:00:00").getDay();
  if(dow===0 || dow===6) return false;  // weekends are not partial working days
  return !scHoliday(iso);               // a partial working weekday, unless it's a holiday
}
// Classify a date for the Court: 'holiday' | 'partial' | 'sunday' | 'full' .
function scDayKind(iso){
  if(!iso) return "full";
  if(scHoliday(iso)) return "holiday";
  var dow=new Date(iso+"T00:00:00").getDay();
  if(dow===0) return "sunday";
  if(scIsPartial(iso)) return "partial";
  return "full";
}
// Short human label for a date's court status (or "" if a normal full working day).
function scDayLabel(iso){
  var h=scHoliday(iso); if(h) return "Supreme Court holiday — "+h.name;
  var k=scDayKind(iso);
  if(k==="partial") return "Partial Court working day";
  if(k==="sunday") return "Sunday — Court closed";
  return "";
}

// so always on. Guarded so it can be turned off via a setting if ever needed.
function scOverlayOn(){ return (DB.settings && DB.settings.scOverlay===false) ? false : true; }

function _calShift(delta){

function _eventsOn(iso){
  const ev=[];
  DB.matters.forEach(m=>{
    if(m.nextDate===iso && !isVoided(m)){
      // find the matching date entry, if any
      let t="", de=null;
      if(Array.isArray(m.dates)){ de=m.dates.find(d=>d.date===iso); if(de) t=de.specialTime||de.time||""; }
      ev.push({type:"hearing", title:(m.parties||m.client||"Hearing"),
        sub:(t?t+" · ":"")+(m.code||"")+(m.hearingNote?" · "+m.hearingNote:""),
        matterId:m.id, dateId:de?de.id:"", time:t,
        code:m.code||"", caseNo:m.caseNo||"", court:m.court||"",
        reason:(de&&de.reason)||m.hearingNote||"", courtNo:(de&&de.courtNo)||"",
        itemNo:(de&&de.itemNo)||"", coram:(de&&de.coram)||"", special:(de&&de.specialTime)||""});
    }
  });
  _allApptsForMe().forEach(a=>{ if(a.date===iso) ev.push({type:a.kind==="personal"?"personal":"appt", title:a.title||"Appointment", sub:(a.time?a.time+" · ":"")+(a.location||"")+(a.createdBy?" · by "+a.createdBy:""), apptId:a.id, time:a.time||"", location:a.location||"", matterId:a.matterId||""}); });
  // Task deadlines (things-to-do with a due date) show as deadlines.
  (DB.todos||[]).forEach(t=>{
    if(t.due===iso && t.status!=="resolved"){
      const mt = t.matterId? matterById(t.matterId) : null;
      ev.push({type:"deadline", title:"Deadline: "+(t.text||"task"),
        sub:(t.time?t.time+" · ":"")+(mt?mt.code+" · ":"")+(t.granted?t.granted:"To be completed today"),
        todoId:t.id, time:t.time||"", matterId:t.matterId||""});
    }
  });
  // Standalone reminders (item 9) if present.
  (DB.reminders||[]).forEach(r=>{
    if(r.date===iso && r.status!=="done"){
      ev.push({type:"reminder", title:"Reminder: "+(r.text||""), sub:(r.time?r.time+" · ":"")+(r.forWho||""), reminderId:r.id, time:r.time||""});
    }
  });
  // sort by time (timed first, in clock order; untimed after)
  ev.sort((a,b)=>{
    const ta=a.time||"", tb=b.time||"";
    if(ta&&tb) return ta.localeCompare(tb);
    if(ta&&!tb) return -1;
    if(!ta&&tb) return 1;
    return 0;
  });
  return ev;
}

      <div class="cal-grid-h">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div>${d}</div>`).join("")}</div>

    else if(e.apptId) editBtn=`<button class="dv-edit" onclick="event.stopPropagation();editAppointment('${e.apptId}')">Edit</button>`;

    if(hol){
      scBanner=`<div class="dv-scbanner sc-hol"><span class="dv-scico">⚖</span><div><b>Supreme Court holiday</b><div class="dv-scsub">${esc(hol.name)} — the Court is not sitting on this day.</div></div></div>`;

  box.innerHTML=`<div class="dv-wrap">
    <div class="dv-head">
      <div class="dv-datebox${isToday?" today":""}">
        <div class="dv-dnum">${dayNum}</div>
        <div class="dv-dmon">${esc(monShort)}</div>
      </div>

        <div class="dv-count">${ev.length} ${ev.length===1?"item":"items"}</div>
      </div>
      <button class="dv-add" onclick="calAddOnDate('${iso}')" aria-label="Add">+</button>
    </div>
    ${scBanner}
    <div class="dv-actions">
      <button class="dv-actbtn" onclick="printCauseList('${iso}',true)"><span>📋</span> Cause list</button>
      <button class="dv-actbtn" onclick="printTodayList('${iso}')"><span>🖨</span> Day list</button>
    </div>
    <div class="dv-list">${cards}</div>
  </div>`;
}

function doCalAddHearing(iso){
  const mid=(document.getElementById("chMatter")||{}).value||"";
  if(!mid){ toast("Select a case.", true); return; }
  const m=matterById(mid); if(!m) return;
  const time=(document.getElementById("chTime")||{}).value||"";
  let reason=(document.getElementById("chReason")||{}).value||"";
  if(/other/i.test(reason)) reason=(document.getElementById("chCustom")||{}).value||"Other";
  const note=(document.getElementById("chNote")||{}).value||"";
  if(!Array.isArray(m.dates)) m.dates=[];
  m.dates.push(_auditStamp({ id:uid(), date:iso, time, reason, note }, true));
  m.dates.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const future=m.dates.filter(d=>d.date>=todayISO());
  const next=future.length?future[0]:m.dates[m.dates.length-1];
  m.nextDate=next?next.date:""; m.hearingNote=next?next.reason:"";

/* ===========================================================
   REJECT / DELETE for expenses and advances.
   Reject (owner only): keeps entry, marks 'rejected', excludes from
   books, balance and totals; shows reason. Delete: removes entirely.
   Staff may delete only their OWN entries; only owner may reject.
   =========================================================== */
function _canDeleteOwn(rec){
  if(!isStaffView()) return true;   // owner can delete anything
  const me=(window.__staff&&window.__staff.profile&&window.__staff.profile.name)||"Staff";
  return rec && rec.createdBy===me;  // staff: only own
}
// EXPENSE reject: mark the books expense rejected AND its linked advance entry (so balance returns)
function rejectExpense(id){
  if(isStaffView()){ toast("Only the Head of Chamber can reject.", true); return; }
  openModal("Reject this expense?", `

    <div class="btn-row" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancel</button>

function doRejectExpense(id){
  const reason=(document.getElementById("rjReason")||{}).value||"";
  const e=DB.expenses.find(x=>x.id===id); if(!e) return;
  e.status="rejected"; e.rejectReason=reason; e.rejectedAt=new Date().toISOString(); e.rejectedBy=headLabel();
  // also reject the linked advance-ledger entry so the staff balance returns
  const linked=DB.advances.find(a=>a.expenseId===id);
  if(linked){ linked.status="rejected"; linked.rejectReason=reason; }

  if(document.getElementById("panel-salary")&&document.getElementById("panel-salary").classList.contains("active")){ try{renderPeople();}catch(_){} } else if(document.getElementById("panel-advances")&&document.getElementById("panel-advances").classList.contains("active")){ try{renderAdvances();}catch(_){} }

function renderBooksOverview(){
  const fy=fyLabel(DB.settings.fyStart);
  const gross=grossReceiptsFY(), exp=expensesFY(), tds=tdsFY(), month=thisMonthReceipts();
  const net=gross-exp;
  const billed=billedFY(), received=gross, outstanding=outstandingFY();
  const collPct = billed>0 ? Math.min(100, Math.round((received/billed)*100)) : 0;
  const nRec=fyReceipts().length, nInv=fyInvoices().length, nExp=fyExpenses().length;
  const tc=taxComparison();
  // Month trend (inline SVG so it works fully offline, no chart library needed).
  const mf=monthlyFeesFY();
  const mLabels=["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
  const maxM=Math.max(1,...mf);
  const curMonthIdx=(()=>{ const m=new Date().getMonth(); return (m>=3)?(m-3):(m+9); })();
  const chartW=320, chartH=120, padL=6, padB=18, gap=6;
  const barW=(chartW-padL-(mLabels.length-1)*gap)/mLabels.length;
  const bars=mf.map((v,i)=>{
    const h=Math.round((v/maxM)*(chartH-padB));
    const x=padL+i*(barW+gap);
    const y=chartH-padB-h;
    const cur=i===curMonthIdx;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${Math.max(1,h)}" rx="2" fill="${cur?'#6b1f1f':'#9a7b3f'}"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${chartH-6}" text-anchor="middle" font-size="8" fill="#8a837a">${mLabels[i]}</text>`;
  }).join("");
  const trendSVG=`<svg viewBox="0 0 ${chartW} ${chartH}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${bars}</svg>`;

  const panel=document.getElementById("panel-booksoverview");
  panel.innerHTML=`
    <div class="ov-hero">
      <div class="ov-hero-lbl">Net position · FY ${fy}</div>
      <div class="ov-hero-val">${fmtINR(net)}</div>
      <div class="ov-hero-sub">Fees received ${fmtINR(gross)} − Expenses ${fmtINR(exp)}</div>
    </div>

function renderReceiptLedger(){

  const rows = list.map(r=>{

      ? `<span style="text-decoration:line-through;color:var(--muted)">${esc(r.no)}</span> <span class="tag">Void${r.voidReason?" ("+esc(r.voidReason)+")":""}</span>`

    return `<tr${voided?' style="opacity:.6"':''}>
      <td class="mono">${noCell}</td>

      <td>${esc(r.mode)}</td>

      <td style="white-space:nowrap">
        ${r.cloudUrl?`<a class="row-act" href="${esc(r.cloudUrl)}" target="_blank" rel="noopener" title="Open cloud copy">☁︎</a>`:""}<button class="row-act" onclick="reprint('${r.id}')">Print</button>

        ${voided?"":`<button class="row-act" onclick="editReceipt('${r.id}')">Edit</button>`}

    <div class="ov-stats" style="margin-bottom:16px">

      <div class="ov-stat"><div class="ov-stat-lbl">This month</div><div class="ov-stat-val">${fmtINR(month)}</div></div>
      <div class="ov-stat"><div class="ov-stat-lbl">${declLabel}</div><div class="ov-stat-val">${fmtINR(declared)}</div></div>
    </div>`;
  document.getElementById("panel-ledger").innerHTML = `
    ${summary}
    <div class="card">
      <div class="card-head">
        <div><h2>Receipt ledger</h2><div class="hint">All fee receipts issued. FY ${fy} gross: <b>${fmtINR(gross)}</b>${tds?` · TDS deducted: <b>${fmtINR(tds)}</b>`:""}</div></div>
        <div style="display:flex;gap:6px">${list.length?`<button class="btn ghost sm" onclick="exportReceiptsCSV()">⬇ Excel</button>`:""}<button class="btn ghost sm" onclick="go('receipt')">+ New receipt</button></div>
      </div>
      ${list.length? `<div class="tbl-wrap"><table class="sr-num">
        <thead><tr><th>No.</th><th>Date</th><th>Matter</th><th>Towards</th><th>Mode</th><th class="num">Gross fee</th>${anyTds?'<th class="num">TDS</th><th class="num">Net</th>':''}<th></th></tr></thead>

function reprint(id){ const r=DB.receipts.find(x=>x.id===id); if(r) _docPrintChooser("receipt", r); }
// Edit an existing receipt in place (correct a mistake without changing its number).
function editReceipt(id){
  const r=DB.receipts.find(x=>x.id===id); if(!r) return;
  if(isVoided(r)){ toast("This receipt is void and can't be edited.", true); return; }
  const matters=DB.matters.filter(m=>true);
  const isRet=!!r.retainer;
  const mOpts=`<option value="">— No matter (retainer / other) —</option>`+matters.map(m=>`<option value="${m.id}"${m.id===r.matterId?" selected":""}>${esc(m.code)} · ${esc(m.client||m.parties||"")}</option>`).join("");
  const modes=["NEFT/RTGS","UPI","Cheque","Cash","Bank transfer","NEFT"];
  const modeOpts=modes.filter((m,i,a)=>a.indexOf(m)===i).map(m=>`<option${m===r.mode?" selected":""}>${esc(m)}</option>`).join("");
  const curTds=+r.tds||0; const curRate = (r.amount>0 && curTds>0) ? +( (curTds/r.amount*100).toFixed(2) ) : 0;
  openModal(`Edit receipt ${esc(r.no)}`, `
    <div class="hint" style="margin-bottom:12px">Correct the details of this receipt. Its number (${esc(r.no)}) stays the same. Totals, TDS credit and the cash book update automatically.</div>
    ${isRet?`<label class="fld"><span>Senior advocate</span><input class="in" id="edPayer" value="${esc(r.retainerSenior||r.payer||"")}"></label>`:""}
    ${isRet?"":`<label class="fld"><span>Matter</span><select class="in" id="edMatter">${mOpts}</select></label>`}
    <div class="row2">
      <label class="fld"><span>Date</span><input class="in" type="date" id="edDate" value="${esc(r.date||"")}"></label>
      <label class="fld"><span>Mode</span><select class="in" id="edMode">${modeOpts}</select></label>
    </div>
    <div class="row2">
      <label class="fld"><span>Gross fee (₹)</span><input class="in" type="number" id="edGross" value="${r.amount||""}" oninput="_edRcPreview()"></label>
      <label class="fld"><span>TDS rate (%)</span><input class="in" type="number" id="edRate" value="${curRate||""}" oninput="_edRcPreview()" placeholder="0"></label>
    </div>
    <div class="fp" id="edRcPreview" style="margin:2px 0 12px"></div>
    <label class="fld"><span>Towards</span><input class="in" id="edTowards" value="${esc(r.towards||"")}"></label>
    <label class="fld"><span>Remarks</span><input class="in" id="edRemarks" value="${esc(r.remarks||"")}"></label>
    <label class="chk" style="margin:4px 0 12px"><input type="checkbox" id="edShowTds"${r.showTds?" checked":""}> Show TDS/net breakdown on the printed receipt</label>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doEditReceipt('${r.id}')">Save changes</button>
    </div>`);
  setTimeout(_edRcPreview,30);
}
function _edRcVals(){
  const gross=+(document.getElementById("edGross")||{}).value||0;
  const rate=+(document.getElementById("edRate")||{}).value||0;
  let tds=Math.round(gross*rate/100); if(tds>gross) tds=gross;
  return {gross, rate, tds, net:gross-tds};
}
function _edRcPreview(){
  const p=document.getElementById("edRcPreview"); if(!p) return;
  const {gross,tds,net}=_edRcVals();
  if(gross<=0){ p.innerHTML="Enter the gross fee to see the breakdown."; return; }
  p.innerHTML = tds>0
    ? `<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-t">TDS ${fmtINR(tds)}</span> <span class="fp-sep">·</span> <span class="fp-n">Net ${fmtINR(net)}</span>`
    : `<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-muted">No TDS</span>`;
}
function doEditReceipt(id){
  const r=DB.receipts.find(x=>x.id===id); if(!r) return;
  const {gross,tds,net}=_edRcVals();
  if(!gross || gross<=0){ toast("Enter the gross fee.", true); return; }
  const date=(document.getElementById("edDate")||{}).value||r.date;
  if(!date){ toast("Pick a date.", true); return; }
  r.amount=gross; r.tds=tds; r.net=net;
  r.date=date;
  r.mode=(document.getElementById("edMode")||{}).value||r.mode;
  r.towards=((document.getElementById("edTowards")||{}).value||"").trim()||r.towards;
  r.remarks=((document.getElementById("edRemarks")||{}).value||"").trim();
  r.showTds=!!(document.getElementById("edShowTds")||{}).checked;
  if(r.retainer){
    const nm=((document.getElementById("edPayer")||{}).value||"").trim();
    if(nm){ r.retainerSenior=nm; r.payer=nm; }
  } else {
    const mSel=document.getElementById("edMatter");
    if(mSel) r.matterId=mSel.value;
  }
  // Keep the linked cash-book entry in step (match by receipt number reference).
  const cash=DB.cash.find(c=>c.ref===r.no);
  if(cash){ cash.date=r.date; cash.amount=r.net; cash.mode=r.mode; }
  logActivity("receipt", `Receipt ${r.no} edited — ${fmtINR(r.amount)}`, {ownerOnly:true, refId:r.id});
  save();
  closeModal();
  renderAll();
  toast(`Receipt ${r.no} updated.`);
}
function delReceipt(id){
  const r=DB.receipts.find(x=>x.id===id); if(!r) return;
  const latest=_isLatestInSeries("receipts",r);
  const warn = latest
    ? `Receipt <b>${esc(r.no)}</b> is the latest in the series. Deleting frees the number ${esc(r.no)} to be used again — right for a test or mistaken entry.`
    : `Receipt <b>${esc(r.no)}</b> is not the latest. Deleting leaves a permanent gap at ${esc(r.no)}. If this receipt was actually issued to a client, use <b>Void</b> instead so the number stays on record.`;
  openModal("Delete receipt?", `
    <div class="hint">${warn}</div>
    <div class="note">Deleted items are recoverable from More → Backup, if needed.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${latest?"":`<button class="btn ghost" onclick="closeModal();voidReceiptPrompt('${id}')">Void instead</button>`}
      <button class="btn seal" onclick="doDelReceipt('${id}')">Delete</button>
    </div>`);
}
function doDelReceipt(id){
  const reused=softDelete("receipts",id);
  const snap=window._lastTrashId;
  closeModal(); renderAll();
  toastUndo(reused?"Receipt deleted — number freed.":"Receipt deleted.", ()=>_undoSoftDelete("receipts",snap));
}
function voidReceiptPrompt(id){
  const r=DB.receipts.find(x=>x.id===id); if(!r) return;
  openModal("Void receipt "+esc(r.no), `
    <div class="hint">The receipt stays on record as <b>cancelled</b>, is excluded from your income totals, and its number is never reused. Add a short reason (shown in brackets).</div>
    <label class="fld">Reason</label>
    <input class="in" id="voidReason" placeholder="e.g. cheque bounced, wrong amount" maxlength="60">
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doVoidReceipt('${id}')">Void receipt</button>
    </div>`);
}
function doVoidReceipt(id){
  const reason=(document.getElementById("voidReason")||{}).value||"";
  voidRecord("receipts",id,reason,"void");
  closeModal(); renderAll();
  toastUndo("Receipt voided.", ()=>{ const r=DB.receipts.find(x=>x.id===id); if(r){ delete r.status; delete r.voidReason; delete r.voidedAt; save(); renderAll(); toast("Void undone."); } });
}

/* ===========================================================
   CASH BOOK  (auto from receipts + expenses, plus manual rows)
   =========================================================== */
function renderCash(){
  // Build clean: receipts (in) + expenses (out) + explicit manual entries
  const rows = [];
  DB.receipts.forEach(r=>rows.push({date:r.date, p:`Receipt ${r.no} — ${matterLabel(r.matterId)}`, t:"in", a:+r.amount||0, mode:r.mode}));
  DB.expenses.forEach(e=>rows.push({date:e.date, p:`${e.head}${e.payee?" — "+e.payee:""}`, t:"out", a:+e.amount||0, mode:e.mode}));
  DB.cash.filter(c=>c.manual).forEach(c=>rows.push({date:c.date, p:c.particulars, t:c.type, a:+c.amount||0, mode:c.mode}));
  rows.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let bal=0;
  const body = rows.map(r=>{
    bal += r.t==="in"? r.a : -r.a;
    return `<tr>
      <td>${fmtDate(r.date)}</td><td>${esc(r.p)}</td><td>${esc(r.mode||"")}</td>
      <td class="num">${r.t==="in"?fmtINR(r.a):""}</td>
      <td class="num">${r.t==="out"?fmtINR(r.a):""}</td>
      <td class="num" style="font-weight:600">${fmtINR(bal)}</td></tr>`;
  }).join("");
  const totIn = rows.filter(r=>r.t==="in").reduce((s,r)=>s+r.a,0);
  const totOut = rows.filter(r=>r.t==="out").reduce((s,r)=>s+r.a,0);
  document.getElementById("panel-cash").innerHTML = `
    <div class="ov-stats" style="margin-bottom:16px">
      <div class="ov-stat"><div class="ov-stat-lbl">Total in</div><div class="ov-stat-val" style="color:var(--green,#2e7d5b)">${fmtINR(totIn)}</div></div>
      <div class="ov-stat"><div class="ov-stat-lbl">Total out</div><div class="ov-stat-val" style="color:var(--seal)">${fmtINR(totOut)}</div></div>
      <div class="ov-stat"><div class="ov-stat-lbl">Balance</div><div class="ov-stat-val">${fmtINR(totIn-totOut)}</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div><h2>Cash book</h2><div class="hint">Auto-built from receipts (in) and expenses (out). Add manual entries for anything else. This is your Rule 6F cash record.</div></div>
        <button class="btn ghost sm" onclick="addCash()">+ Manual entry</button>
      </div>
      ${rows.length? `<div class="tbl-wrap"><table class="sr-num">
        <thead><tr><th>Date</th><th>Particulars</th><th>Mode</th><th class="num">Receipts</th><th class="num">Payments</th><th class="num">Balance</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr style="font-weight:700;background:#efe9db">
          <td colspan="3">Totals</td><td class="num">${fmtINR(totIn)}</td>
          <td class="num">${fmtINR(totOut)}</td><td class="num">${fmtINR(totIn-totOut)}</td></tr></tfoot>
        </table></div>`
        : `<div class="empty">No entries yet.</div>`}
    </div>`;
}
function addCash(){
  openModal("Manual cash-book entry", `
    <div class="grid g2">
      <div><label class="fld">Date</label><input class="in" type="date" id="caDate" value="${todayISO()}"></div>
      <div><label class="fld">Type</label><select class="in" id="caType"><option value="in">Receipt (in)</option><option value="out">Payment (out)</option></select></div>
    </div>
    <div style="margin-top:11px"><label class="fld">Particulars</label><input class="in" id="caP" placeholder="Opening balance / misc"></div>
    <div class="grid g2" style="margin-top:11px">
      <div><label class="fld">Amount (\u20B9)</label><input class="in" type="number" id="caA" min="0"></div>
      <div><label class="fld">Mode</label><input class="in" id="caMode" placeholder="Cash / Bank"></div>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>

function saveCash(){
  const a=+document.getElementById("caA").value;
  if(!a){ toast("Enter an amount.",true); return; }
  DB.cash.push({id:uid(), manual:true, date:document.getElementById("caDate").value,
    type:document.getElementById("caType").value, amount:a,
    particulars:document.getElementById("caP").value.trim()||"Manual entry",
    mode:document.getElementById("caMode").value.trim()});
  save(); renderCash(); closeModal(); toast("Entry added.");
}

/* ---- proof handling: compress images, hold in staging until save ---- */
let _proofStaging = null;
function onProofPicked(input){
  const f = input.files && input.files[0];
  const info = document.getElementById("exFileInfo");
  _proofStaging = null;
  if(!f){ info.textContent=""; return; }
  if(f.type === "application/pdf"){
    const r = new FileReader();
    r.onload = ()=>{ _proofStaging = {name:f.name, type:f.type, data:r.result};
      info.textContent = `Attached: ${f.name} (${(f.size/1024).toFixed(0)} KB)`; };
    r.readAsDataURL(f);
  } else if(f.type.startsWith("image/")){
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600; let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){ const s = maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const out = c.toDataURL("image/jpeg", 0.8);
        _proofStaging = {name:f.name.replace(/\.\w+$/,"")+".jpg", type:"image/jpeg", data:out};
        info.textContent = `Attached: ${_proofStaging.name} (~${Math.round((out.length*0.75)/1024)} KB)`;
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  } else { info.innerHTML = `<span style="color:var(--seal)">Only images or PDF allowed.</span>`; input.value=""; }
}
async function viewProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(!e || !e.proofMeta){ toast("No attachment.",true); return; }
  let blobData;
  try{ blobData = await idbGet("proof:"+id); }catch(_){}
  if(!blobData){ toast("Attachment missing on this device. Restore from a full backup.",true); return; }
  const p = e.proofMeta;
  const body = p.type==="application/pdf"
    ? `<iframe src="${blobData}" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:6px"></iframe>`
    : `<img src="${blobData}" style="max-width:100%;border:1px solid var(--line);border-radius:6px">`;
  openModal(`Proof — ${esc(p.name||"attachment")} (voucher ${esc(e.voucherNo||"")})`, `${body}
    <div class="btn-row" style="margin-top:14px">
      <a class="btn ghost" href="${blobData}" download="${esc(p.name||'proof')}">Download</a>
      <button class="btn ghost" onclick="removeProof('${id}')">Remove attachment</button>
      <button class="btn seal" onclick="closeModal()">Close</button>
    </div>`);
}
async function removeProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(e){ delete e.proofMeta; try{ await idbDel("proof:"+id); }catch(_){}
    save(); renderExpense(); closeModal(); toast("Attachment removed."); }
}
/* attach a proof to an existing voucher that had none */
function attachLater(id){
  const e = DB.expenses.find(x=>x.id===id); if(!e) return;
  _proofStaging = null;
  openModal(`Attach proof — voucher ${esc(e.voucherNo||"")}`, `
    <label class="fld">Bill / receipt / screenshot</label>
    <input class="in" type="file" id="exFile" accept="image/*,application/pdf" onchange="onProofPicked(this)">

}
async function saveLateProof(id){
  const e = DB.expenses.find(x=>x.id===id); if(!e) return;
  if(!_proofStaging){ toast("Choose a file first.",true); return; }
  try{
    await idbPut("proof:"+id, _proofStaging.data);
    e.proofMeta = {name:_proofStaging.name, type:_proofStaging.type};
    _proofStaging=null; save(); renderExpense(); closeModal(); toast("Proof attached.");
  }catch(err){ toast("Could not store the file.",true); }
}
async function saveExpense(){
  const head=document.getElementById("exHead").value;
  const amt=+document.getElementById("exAmt").value;
  if(!head){ toast("Select an expense head.",true); return; }
  const miscDetail = head==="Misc." ? document.getElementById("exMisc").value.trim() : "";
  if(head==="Misc." && !miscDetail){ toast("Specify what the miscellaneous expense was.",true); return; }
  if(!amt){ toast("Enter the amount.",true); return; }
  const id = uid();
  const voucherNo = nextVoucherNo();
  const exp = {id, voucherNo, date:document.getElementById("exDate").value,
    head, miscDetail, payee:document.getElementById("exPayee").value.trim(), amount:amt,
    matterId:(document.getElementById("exMatter")||{value:""}).value||"",
    mode:document.getElementById("exMode").value, remarks:document.getElementById("exRem").value.trim(),
    billRef:(document.getElementById("exBillRef")||{value:""}).value.trim()};
  if(_proofStaging){
    try{ await idbPut("proof:"+id, _proofStaging.data);
      exp.proofMeta = {name:_proofStaging.name, type:_proofStaging.type}; }
    catch(err){ toast("Voucher saved, but the attachment could not be stored.", true); }
  }
  DB.expenses.push(exp);
  _proofStaging = null;
  save(); renderAll(); closeModal(); toast(`Voucher ${voucherNo} saved.`);
}
function delExpense(id){
  DB.expenses=DB.expenses.filter(e=>e.id!==id);

  save(); renderAll(); toast("Expense deleted.");
}

// Signature upload handling — reads file, optional white-strip, stores data URI on settings.
function onSigPicked(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ window.__lastSigRaw = rd.result; _applyStripToggle(); };
  rd.readAsDataURL(f);
}
function _applyStripToggle(){
  const raw = window.__lastSigRaw; if(!raw) return;
  const strip = !!(document.getElementById("stSigStripWhite")||{}).checked;
  const finish = (dataUrl)=>{
    DB.settings.signatureImg = dataUrl;
    DB.settings.sigStripWhite = strip;
    const pv = document.getElementById("sigPreview");
    if(pv) pv.innerHTML = `<img src="${dataUrl}" style="max-width:170px;max-height:56px;object-fit:contain">`;
  };
  if(!strip){ finish(raw); return; }
  // strip near-white pixels to transparent
  const img = new Image();
  img.onload = ()=>{
    try{
      const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const cx=c.getContext("2d"); cx.drawImage(img,0,0);
      const d=cx.getImageData(0,0,c.width,c.height); const a=d.data;
      for(let i=0;i<a.length;i+=4){ if(a[i]>235 && a[i+1]>235 && a[i+2]>235){ a[i+3]=0; } }
      cx.putImageData(d,0,0);
      finish(c.toDataURL("image/png"));
    }catch(e){ finish(raw); }
  };
  img.onerror = ()=>finish(raw);
  img.src = raw;
}
function removeSignature(){
  DB.settings.signatureImg=""; window.__lastSigRaw=null;
  const pv=document.getElementById("sigPreview");

  const al="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";

}

/* ===========================================================
   ARCHIVE — everything catalogued by year and month
   Pulls together receipts, invoices, expenses, documents and
   imported staff handovers into one browsable timeline.
   =========================================================== */
function monthKey(iso){ return (iso||"").slice(0,7); } // YYYY-MM
function monthLabel(ym){
  if(!ym || ym.length<7) return "Undated";
  const [y,m]=ym.split("-");
  const mon=["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1]||"";
  return `${mon} ${y}`;
}
let _archiveOpen = {}; // track expanded months

function buildArchiveIndex(){
  // returns { year: { ym: {receipts:[], invoices:[], expenses:[], docsIn:[], docsFiled:[], imports:[] , fees, exp} } }
  const idx = {};
  function bucket(ym){
    const yr = ym && ym.length>=4 ? ym.slice(0,4) : "Undated";
    idx[yr] = idx[yr] || {};
    idx[yr][ym] = idx[yr][ym] || {receipts:[],invoices:[],expenses:[],docsIn:[],docsFiled:[],imports:[],fees:0,exp:0,inv:0};
    return idx[yr][ym];
  }
  (DB.receipts||[]).forEach(r=>{ const b=bucket(monthKey(r.date)); b.receipts.push(r); b.fees+=+r.amount||0; });
  (DB.invoices||[]).forEach(v=>{ const b=bucket(monthKey(v.date));
    const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
    b.invoices.push(v); b.inv+=t; });
  (DB.expenses||[]).forEach(e=>{ const b=bucket(monthKey(e.date)); b.expenses.push(e); b.exp+=+e.amount||0; });
  (DB.docsIn||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.received)); b.docsIn.push(d); });
  (DB.docsFiled||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.filed)); b.docsFiled.push(d); });
  // (staff import log removed with handover feature)
  return idx;
}

function renderArchive(){
  const idx = buildArchiveIndex();
  const years = Object.keys(idx).sort((a,b)=>b.localeCompare(a)); // newest first
  let body="";
  if(!years.length){
    body = `<div class="card"><div class="empty">Nothing archived yet. As you add receipts, invoices, expenses, documents and import staff entries, they'll be catalogued here by month and year.</div></div>`;
  } else {
    for(const yr of years){
      const months = Object.keys(idx[yr]).sort((a,b)=>b.localeCompare(a));
      // year totals
      let yFees=0,yExp=0,yInv=0,yR=0,yV=0,yD=0,yI=0;
      months.forEach(ym=>{const m=idx[yr][ym]; yFees+=m.fees;yExp+=m.exp;yInv+=m.inv;yR+=m.receipts.length;yV+=m.expenses.length;yD+=m.docsIn.length+m.docsFiled.length;yI+=m.imports.length;});
      body += `<div class="card">
        <div class="card-head"><div>
          <h2 style="margin-bottom:2px">${esc(yr)}</h2>
          <div class="hint" style="margin:0">${yR} receipts · ${yV} vouchers · ${yInv?fmtINR(yInv)+" invoiced · ":""}${yD} documents · ${yI} imports</div>
        </div>
        <div style="text-align:right"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Fees received</div>
          <div style="font-size:20px;font-weight:700;color:var(--seal)">${fmtINR(yFees)}</div></div></div>
        <div style="margin-top:10px">`;
      for(const ym of months){
        const m = idx[yr][ym];
        const open = !!_archiveOpen[ym];
        const count = m.receipts.length+m.invoices.length+m.expenses.length+m.docsIn.length+m.docsFiled.length+m.imports.length;
        body += `<div class="arch-month">
          <div class="arch-mhead" onclick="toggleArchMonth('${ym}')">
            <div><span class="arch-caret">${open?"▾":"▸"}</span> <b>${esc(monthLabel(ym))}</b>
              <span style="color:var(--muted);font-size:12.5px;margin-left:8px">${count} item${count!==1?"s":""}</span></div>
            <div style="font-size:12.5px;color:var(--muted)">${m.fees?"Fees "+fmtINR(m.fees):""}${m.exp?" · Exp "+fmtINR(m.exp):""}</div>
          </div>
          ${open?renderArchMonthDetail(m):""}
        </div>`;
      }
      body += `</div></div>`;
    }
  }
  document.getElementById("panel-archive").innerHTML = `
    <div class="card">
      <h2>Archive</h2>
      <div class="hint">Your complete chamber record, catalogued by year and month — receipts, invoices, expenses, documents, and imported staff entries. This grows with you over the years.</div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ghost sm" onclick="exportArchiveCSV()">Export full archive (CSV)</button>
      </div>
    </div>
    ${body}`;
}

function renderArchMonthDetail(m){
  let out = `<div class="arch-detail">`;
  if(m.receipts.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Receipts</div><table class="arch-tbl"><tbody>`;
    m.receipts.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(r=>{
      out += `<tr><td class="mono">${esc(r.no||"")}</td><td>${fmtDate(r.date)}</td><td>${esc(matterLabel(r.matterId))}</td><td class="num">${fmtINR(r.amount)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.invoices.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Invoices</div><table class="arch-tbl"><tbody>`;
    m.invoices.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(v=>{
      const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
      out += `<tr><td class="mono">${esc(v.no||"")}</td><td>${fmtDate(v.date)}</td><td>${esc(matterLabel(v.matterId))}</td><td class="num">${fmtINR(t)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.expenses.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Expenses</div><table class="arch-tbl"><tbody>`;
    m.expenses.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>{
      out += `<tr><td class="mono">${esc(e.voucherNo||"")}</td><td>${fmtDate(e.date)}</td><td>${esc(e.head||"")}${e.payee?" · "+esc(e.payee):""}</td><td class="num">${fmtINR(e.amount)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.docsIn.length || m.docsFiled.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Documents</div><table class="arch-tbl"><tbody>`;
    [...m.docsIn.map(d=>({d,k:"Inward"})), ...m.docsFiled.map(d=>({d,k:"Filed"}))]
      .sort((a,b)=>((a.d.date||"")).localeCompare(b.d.date||"")).forEach(({d,k})=>{
      out += `<tr><td>${esc(k)}</td><td>${fmtDate(d.date)}</td><td>${esc(d.title||d.desc||"—")}</td><td>${esc(matterLabel(d.matterId)||"")}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.imports.length){

// ---- Per-register CSV export (opens in Excel / Google Sheets) ----
function _downloadCSV(rows, filename){
  const csv = rows.map(r=>r.map(c=>{c=String(c==null?"":c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}); // BOM so Excel reads ₹ and Unicode
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("Exported "+filename);
}

// ---- Speech-to-text: a small mic button that dictates into a text field ----
// Uses the browser's built-in Web Speech API. No key, no server. Where the
// browser lacks support (some Android webviews), the button simply hides.
var _speechSupported = (typeof window!=="undefined") && !!(window.SpeechRecognition||window.webkitSpeechRecognition);
var _activeRec=null;
function micButton(targetId){
  if(!_speechSupported) return "";
  return `<button type="button" class="mic-btn" id="mic_${targetId}" onclick="_micToggle('${targetId}')" title="Dictate" aria-label="Dictate">🎤</button>`;
}
function _micToggle(targetId){
  const btn=document.getElementById("mic_"+targetId);
  const field=document.getElementById(targetId);
  if(!field) return;
  if(_activeRec){ try{ _activeRec.stop(); }catch(e){} _activeRec=null; if(btn) btn.classList.remove("rec"); return; }
  const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R) return;
  const rec=new R();
  const lang=(DB.settings&&DB.settings.dictationLang)||"en-IN";
  rec.lang=lang; rec.interimResults=true; rec.continuous=false;
  let base=field.value||""; if(base && !/\s$/.test(base)) base+=" ";
  rec.onresult=(e)=>{
    let txt=""; for(let i=e.resultIndex;i<e.results.length;i++){ txt+=e.results[i][0].transcript; }
    field.value=base+txt;
    if(field.tagName==="TEXTAREA"){ field.style.height="auto"; field.style.height=field.scrollHeight+"px"; }
  };
  rec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("Microphone blocked. Allow mic access in your browser.",true); } _activeRec=null; if(btn) btn.classList.remove("rec"); };
  rec.onend=()=>{ _activeRec=null; if(btn) btn.classList.remove("rec"); };
  try{ rec.start(); _activeRec=rec; if(btn) btn.classList.add("rec"); toast("Listening… tap mic again to stop."); }
  catch(e){ toast("Could not start dictation.",true); }
}

   DOCUMENT REGISTERS (Master) — inward + filed, with viewer

const DOC_SOURCES = ["Client","Court","Opposite party / counsel","Government office","Registry","Courier / post","Other"];
const INWARD_TYPES = ["Vakalatnama","Case papers / file","Court order / notice","Affidavit","Agreement / deed",
  "ID / KYC documents","Cheque / DD","Correspondence","Evidence / annexure","Other"];
const FILED_TYPES = ["Main petition / paper-book (full filed copy)","SLP (filed copy)","Writ Petition (filed copy)",
  "Appeal (filed copy)","Interlocutory Application (IA)","Interim Application","Stay Application",
  "Counter / Reply","Rejoinder","Affidavit","Annexure compilation","Vakalatnama","Other filed document"];
let _mDocStaging = [];
function onMDocsPicked(input, infoId){
  const files=[...(input.files||[])]; _mDocStaging=[];
  const info=document.getElementById(infoId); if(!files.length){info.textContent="";return;}
  let done=0; const total=files.length; const collected=[];
  info.textContent=`Reading ${total} file(s)…`;
  files.forEach(f=>{
    if(f.type==="application/pdf"){ const r=new FileReader();
      r.onload=()=>{collected.push({name:f.name,type:f.type,data:r.result,size:f.size});tick();}; r.readAsDataURL(f);
    }else if(f.type.startsWith("image/")){ const r=new FileReader();
      r.onload=()=>{const img=new Image();img.onload=()=>{const max=1800;let{width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",0.82);collected.push({name:f.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data:out,size:Math.round(out.length*0.75)});tick();
      };img.src=r.result;}; r.readAsDataURL(f);
    }else{collected.push(null);tick();}
  });
  function tick(){done++;if(done===total){_mDocStaging=collected.filter(Boolean);
    const kb=_mDocStaging.reduce((s,x)=>s+(x.size||0),0)/1024;
    info.textContent=`${_mDocStaging.length} file(s) ready (~${kb>1024?(kb/1024).toFixed(1)+" MB":Math.round(kb)+" KB"}).`;}}
}

/* ===========================================================
   EXPORT DOCUMENTS TO A REAL FOLDER (catalogued case files)
   Uses File System Access API (Chrome/Edge desktop). Falls
   back to a downloadable ZIP where unsupported.
   =========================================================== */
function fsSupported(){ return typeof window!=="undefined" && "showDirectoryPicker" in window; }
function safeName(s){ return (s||"").replace(/[\/\\:*?"<>|]/g,"-").replace(/\s+/g," ").trim().slice(0,120); }
function dataURLtoBlob(dataURL){
  try{
    const [head,b64]=dataURL.split(",");
    const mime=(head.match(/data:(.*?);/)||[])[1]||"application/octet-stream";
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}
function matterFolderName(m){
  if(!m) return "Unassigned";
  const bits=[m.code, safeName(m.client)];
  if(m.caseNo) bits.push(safeName(m.caseNo).replace(/\//g,"-"));
  return safeName(bits.join("  "));
}
function docsForMatter(matterId){
  return {
    filed: DB.docsFiled.filter(d=>d.matterId===matterId),
    inward: DB.docsIn.filter(d=>d.matterId===matterId)
  };
}
function buildIndexText(m, sets){
  const L=[];
  L.push("CASE DOCUMENT INDEX");
  L.push("=".repeat(40));
  if(m){ L.push("Matter code : "+m.code); L.push("Client      : "+m.client);
    if(m.parties) L.push("Parties     : "+m.parties);
    if(m.caseNo) L.push("Case no.    : "+m.caseNo);
    if(m.court) L.push("Forum       : "+m.court);
  } else L.push("Unassigned documents");
  L.push("Generated   : "+new Date().toLocaleString());
  L.push("");
  function section(title, arr){
    L.push(title); L.push("-".repeat(title.length));
    if(!arr.length){ L.push("(none)"); L.push(""); return; }
    arr.forEach(d=>{
      (d.files||[]).forEach((f,i)=>{
        const fname = fileNameFor(d, f, i);
        L.push(`${fmtDate(d.date)}  ${fname}`);
      });
      const extra=[d.docType, d.source?("from "+d.source):"", d.iaNo, d.notes, d.enteredBy&&d.enteredBy!=="(self)"?("logged by "+d.enteredBy):""].filter(Boolean).join(" · ");
      if(extra) L.push("    "+extra);
    });
    L.push("");
  }
  section("FILED RECORDS", sets.filed);
  section("INWARD DOCUMENTS", sets.inward);
  return L.join("\n");
}
function fileNameFor(d, f, i){
  const ext = (f.name && f.name.includes(".")) ? f.name.slice(f.name.lastIndexOf(".")) : (f.type==="application/pdf"?".pdf":".jpg");
  const base = safeName(d.title) + (((d.files||[]).length>1)?(" ("+(i+1)+")"):"");
  return `${d.date}  ${base}${ext}`;
}

async function writeMatterToDir(parentDir, m, sets){
  const folderName = matterFolderName(m);
  const dir = await parentDir.getDirectoryHandle(folderName, {create:true});
  async function writeSet(subName, arr){
    if(!arr.length) return 0;
    const sub = await dir.getDirectoryHandle(subName, {create:true});
    let n=0;
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i];
        let data; try{ data=await idbGet(f.key); }catch(e){}
        if(!data) continue;
        const blob=dataURLtoBlob(data); if(!blob) continue;
        const fh=await sub.getFileHandle(fileNameFor(d,f,i), {create:true});
        const w=await fh.createWritable(); await w.write(blob); await w.close(); n++;
      }
    }
    return n;
  }
  const nf=await writeSet("Filed", sets.filed);
  const ni=await writeSet("Inward", sets.inward);
  // index file
  const idx=await dir.getFileHandle("_index.txt",{create:true});
  const w=await idx.createWritable(); await w.write(buildIndexText(m,sets)); await w.close();
  return nf+ni;
}

async function exportMatterToFolder(matterId){

    try{

async function exportAllToFolder(){
  if(!DB.docsFiled.length && !DB.docsIn.length){ toast("No documents to export.",true); return; }
  if(fsSupported()){
    try{
      const parent = await window.showDirectoryPicker({mode:"readwrite"});
      let total=0, folders=0;
      // one folder per matter that has docs
      const matterIds = new Set([...DB.docsFiled, ...DB.docsIn].map(d=>d.matterId||""));
      for(const mid of matterIds){
        const m = mid? matterById(mid) : null;
        const sets = mid? docsForMatter(mid) : {filed:DB.docsFiled.filter(d=>!d.matterId), inward:DB.docsIn.filter(d=>!d.matterId)};
        if(!sets.filed.length && !sets.inward.length) continue;
        total += await writeMatterToDir(parent, m, sets); folders++;
      }
      toast(`Exported ${total} file(s) across ${folders} case folder(s).`);
    }catch(e){ if(e && e.name==="AbortError") return; toast("Could not write to that folder.",true); }
  }else{
    toast("Folder export needs Chrome or Edge on desktop. Downloading a ZIP instead.");
    await exportAllAsZip();
  }
}

/* ---- ZIP fallback (Safari/iPhone) via a tiny zip builder ---- */
function crc32(buf){
  let c, table=crc32.t||(crc32.t=(()=>{const t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})());
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function buildZip(files){ // files:[{path,bytes}]
  const chunks=[], central=[]; let offset=0;
  const dosTime=0, dosDate=0x21;
  for(const f of files){
    const nameB=strBytes(f.path); const data=f.bytes; const crc=crc32(data);
    const local=new Uint8Array(30+nameB.length);
    const dv=new DataView(local.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    local.set(nameB,30);
    chunks.push(local, data);
    const cen=new Uint8Array(46+nameB.length); const cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameB.length,true); cv.setUint32(42,offset,true); cen.set(nameB,46);
    central.push(cen);
    offset+=local.length+data.length;
  }
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array(22); const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true); ev.setUint32(16,offset,true);
  return new Blob([...chunks,...central,end],{type:"application/zip"});
}
async function collectFilesForZip(m, sets, rootName){
  const out=[];
  async function add(subName, arr){
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i]; let data; try{data=await idbGet(f.key);}catch(e){}
        if(!data) continue; const blob=dataURLtoBlob(data); if(!blob) continue;
        const bytes=new Uint8Array(await blob.arrayBuffer());
        out.push({path:`${rootName}/${subName}/${fileNameFor(d,f,i)}`, bytes});
      }
    }
  }
  await add("Filed", sets.filed); await add("Inward", sets.inward);
  out.push({path:`${rootName}/_index.txt`, bytes:strBytes(buildIndexText(m,sets))});
  return out;
}
async function exportMatterAsZip(m, sets){
  const root=matterFolderName(m);
  const files=await collectFilesForZip(m,sets,root);
  const zip=buildZip(files); downloadBlob(zip, root+".zip");
  toast("Case documents downloaded as a ZIP.");
}
async function exportAllAsZip(){
  let all=[];
  const matterIds=new Set([...DB.docsFiled,...DB.docsIn].map(d=>d.matterId||""));
  for(const mid of matterIds){
    const m=mid?matterById(mid):null;
    const sets=mid?docsForMatter(mid):{filed:DB.docsFiled.filter(d=>!d.matterId),inward:DB.docsIn.filter(d=>!d.matterId)};
    if(!sets.filed.length&&!sets.inward.length) continue;
    const part=await collectFilesForZip(m,sets,matterFolderName(m)); all=all.concat(part);
  }
  if(!all.length){ toast("Nothing to export.",true); return; }
  downloadBlob(buildZip(all), "Chamber-Cases-"+todayISO()+".zip");
  toast("All case documents downloaded as a ZIP.");
}
function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

// ---- Keyboard shortcuts (desktop/MacBook). Ignored while typing in a field. ----
var _kbReg=false, _kbGPending=false, _kbGTimer=null;
function _initKeyboardShortcuts(){
  if(_kbReg) return; _kbReg=true;
  document.addEventListener("keydown", function(e){
    // never intercept while typing, or with cmd/ctrl/alt held (browser shortcuts)
    const t=e.target, tag=(t&&t.tagName)||"";
    const typing = tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable);
    // Escape closes an open modal even while typing
    if(e.key==="Escape"){ const bg=document.getElementById("modalBg"); if(bg&&bg.classList.contains("show")){ closeModal(); return; } }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(DB.deviceRole==="staff") return; // owner shortcuts only for now
    const modalOpen=(document.getElementById("modalBg")||{}).classList&&document.getElementById("modalBg").classList.contains("show");
    // "g" prefix for navigation (g then h/m/c/b)
    if(_kbGPending){
      _kbGPending=false; clearTimeout(_kbGTimer);
      const map={h:"home",m:"matters",c:"calendar",b:"billing"};
      if(map[e.key]){ e.preventDefault(); shellGo(map[e.key]); return; }
      return;
    }
    switch(e.key){
      case "/": if(!modalOpen){ e.preventDefault(); openSearch(); } break;

var _shellTab="home";
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function finishStaffSetup(){
  const a=(document.getElementById("gPin1").value||"").trim(), b=(document.getElementById("gPin2").value||"").trim(), msg=document.getElementById("gMsg");
  if(!/^\d{4,6}$/.test(a)){ msg.textContent="PIN must be 4–6 digits."; return; }
  if(a!==b){ msg.textContent="PINs don't match."; return; }

// Home-screen shortcut / quick-action handler: reads ?do= from the URL and
// jumps to the action, once, then cleans the URL so refresh doesn't repeat it.
function _handleShortcut(){
  try{
    var q=new URLSearchParams(location.search); var doIt=q.get("do");
    if(!doIt) return;
    // clean the URL so a refresh doesn't re-trigger
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    if(DB.deviceRole==="staff") return; // shortcuts are owner actions for now
    setTimeout(function(){
      if(doIt==="receipt") openBilling("receipt");
      else if(doIt==="task") addTodo();
      else if(doIt==="today"){ shellGo("home"); }
    }, 250);
  }catch(e){}
}

var _subBackTo="home";

// Stamp each register-table <td> with a data-label taken from its column header,
// so the responsive card layout (CSS <=640px) can show "Label: value" lines.
// Idempotent and defensive: does nothing if there's no table/thead. Scoped to
// .tbl-wrap tables only, leaving print templates (table.inv/.tpl-tbl) alone.
// Add a "Sr." column to any register table marked .sr-num. Idempotent.
function _numberTables(root){
  if(!root) return;
  try{
    root.querySelectorAll(".tbl-wrap table.sr-num").forEach(function(tbl){
      if(tbl.getAttribute("data-sr")==="1") return; // already numbered
      var thead=tbl.querySelector("thead tr");
      if(thead && !thead.querySelector("th.sr-h")){
        var th=document.createElement("th"); th.className="sr-h"; th.textContent="Sr."; th.style.width="34px";
        thead.insertBefore(th, thead.firstChild);
      }
      var n=0;
      tbl.querySelectorAll("tbody tr").forEach(function(tr){
        if(tr.querySelector("td.sr-c")) return;
        n++;
        var td=document.createElement("td"); td.className="sr-c"; td.setAttribute("data-label","Sr."); td.textContent=n;
        tr.insertBefore(td, tr.firstChild);
      });
      // footer: pad a leading empty cell so columns stay aligned
      tbl.querySelectorAll("tfoot tr").forEach(function(tr){
        if(tr.querySelector("td.sr-c")) return;
        var td=document.createElement("td"); td.className="sr-c"; td.setAttribute("data-empty","1");
        tr.insertBefore(td, tr.firstChild);
      });
      tbl.setAttribute("data-sr","1");
    });
  }catch(e){}
}
function _labelizeTables(root){
  if(!root) return;
  try{
    root.querySelectorAll(".tbl-wrap table").forEach(function(tbl){
      var ths = tbl.querySelectorAll("thead th");
      if(!ths.length) return;
      var labels = Array.prototype.map.call(ths, function(th){ return (th.textContent||"").trim(); });
      // Body rows: stamp each cell with its column label; flag blank cells so
      // the mobile card view can hide empty labelled lines (e.g. cash book).
      tbl.querySelectorAll("tbody tr").forEach(function(tr){
        Array.prototype.forEach.call(tr.children, function(td, i){
          if(td.tagName!=="TD") return;
          if(td.getAttribute("data-label")===null)
            td.setAttribute("data-label", labels[i]!=null?labels[i]:"");
          var txt=(td.textContent||"").trim();
          if(txt==="" || txt==="—" || txt==="\u2014") td.setAttribute("data-empty","1");
          else td.removeAttribute("data-empty");
        });
      });
      // Footer (totals) row: account for colspan so labels line up, and mark
      // the row so the mobile view can render it as a distinct summary card.
      tbl.querySelectorAll("tfoot tr").forEach(function(tr){
        tr.setAttribute("data-total","1");
        var col=0;
        Array.prototype.forEach.call(tr.children, function(td){
          if(td.tagName!=="TD") return;
          var span=parseInt(td.getAttribute("colspan")||"1",10)||1;
          // the label for a footer cell is the header of the column it sits under;
          // for a spanned "Totals" cell, treat it as the card heading (no label).
          if(td.getAttribute("data-label")===null){
            if(span>1) td.setAttribute("data-label","");
            else td.setAttribute("data-label", labels[col]!=null?labels[col]:"");
          }
          col+=span;
        });
      });
    });
  }catch(e){ /* labeling is cosmetic; never let it break a render */ }
}
// Watch the app for any register table being (re)built by ANY render path
// — openSub, in-place refreshes, cloud listeners, staff tabs — and labelize it.
// One central hook means no renderer needs editing and none can be missed.
function _startTableLabeler(){
  try{
    var root=document.getElementById("appRoot")||document.body;
    _labelizeTables(root); _numberTables(root);
    var scheduled=false;
    var obs=new MutationObserver(function(){
      if(scheduled) return; scheduled=true;
      requestAnimationFrame(function(){ scheduled=false; _numberTables(root); _labelizeTables(root); });
    });
    obs.observe(root,{childList:true,subtree:true});
  }catch(e){}
}

function _daysUntil(iso){
  if(!iso) return null;
  const today=new Date(todayISO()+"T00:00:00");
  const d=new Date(iso+"T00:00:00");
  return Math.round((d-today)/86400000);
}
function _dateBucket(iso){
  const n=_daysUntil(iso);
  if(n==null) return "none";
  if(n<0) return "overdue";
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n<=7) return "week";
  return "later";
}

// ---- Proactive chamber alerts: things that need attention, computed locally ----
function _alertsDismissedToday(){
  // Dismissals are per-day: an alert cleared today stays hidden until tomorrow,
  // so genuinely-persistent issues resurface but you're not nagged all day.
  const d=(DB.settings&&DB.settings.alertsDismissed)||{};
  const today=todayISO();
  return (d.date===today && Array.isArray(d.keys)) ? d.keys : [];
}
function _dismissAlert(key){
  const today=todayISO();
  let d=(DB.settings&&DB.settings.alertsDismissed)||{};
  if(d.date!==today){ d={date:today, keys:[]}; }
  if(d.keys.indexOf(key)<0) d.keys.push(key);
  DB.settings.alertsDismissed=d;
  save();
  if(window.renderHome) try{ renderHome(); }catch(e){}
}
function _chamberAlerts(){
  const out=[]; const today=todayISO();
  const active=(DB.matters||[]).filter(m=>!isVoided(m)&&m.status!=="Concluded"&&m.status!=="Closed");
  // 1. Overdue tasks
  const overdueTasks=(DB.todos||[]).filter(t=>t.status!=="resolved"&&t.due&&t.due<today);
  if(overdueTasks.length) out.push({key:"overdueTasks",sev:"hot",icon:"⏰",text:`${overdueTasks.length} task${overdueTasks.length>1?"s":""} overdue`,hint:"Open your tasks and reschedule or resolve them.",go:"openSub('todos')"});
  // 2. Tasks due today
  const dueToday=(DB.todos||[]).filter(t=>t.status!=="resolved"&&t.due===today);
  if(dueToday.length) out.push({key:"dueToday",sev:"warn",icon:"✅",text:`${dueToday.length} task${dueToday.length>1?"s":""} due today`,hint:"Check today's tasks so nothing slips.",go:"openSub('todos')"});
  // 3. Hearing time conflicts — same date & time, two different matters
  const byslot={};
  active.forEach(m=>{ if(!m.nextDate) return;
    (m.dates||[]).filter(d=>d.date===m.nextDate&&(d.time||d.specialTime)).forEach(d=>{
      const key=m.nextDate+"|"+(d.specialTime||d.time);
      (byslot[key]||(byslot[key]=[])).push(m.code||m.caseNo||"case");
    });
  });
  const clashes=Object.keys(byslot).filter(k=>byslot[k].length>1&&k.split("|")[0]>=today);
  if(clashes.length) out.push({key:"clashes",sev:"hot",icon:"⚠️",text:`${clashes.length} hearing time clash${clashes.length>1?"es":""}`,hint:"Two matters share a slot — open the calendar to adjust timings or arrange cover.",go:"shellGo('calendar')"});
  // 4. Invoices unpaid > 60 days
  const old=(DB.invoices||[]).filter(v=>{ if(isVoided(v)) return false; if(v.status==="paid"||v.paid) return false;
    return v.date && _daysUntil(v.date)!=null && _daysUntil(v.date) <= -60; });
  if(old.length) out.push({key:"oldInvoices",sev:"warn",icon:"₹",text:`${old.length} invoice${old.length>1?"s":""} unpaid 60+ days`,hint:"Open the invoice ledger to follow up on payment.",go:"subGo('books','invoiceledger')"});
  // 5. Receipt number gaps (a missing number in the sequence)
  try{
    const nums=(DB.receipts||[]).filter(r=>!isVoided(r)).map(r=>{const m=/(\d+)\s*$/.exec(r.no||"");return m?+m[1]:null;}).filter(n=>n!=null).sort((a,b)=>a-b);
    let gaps=0; for(let i=1;i<nums.length;i++){ if(nums[i]-nums[i-1]>1) gaps++; }
    if(gaps) out.push({key:"receiptGaps",sev:"info",icon:"#",text:`Receipt number gap${gaps>1?"s":""} detected`,hint:"A number is missing in the receipt series — check the ledger for a deleted or skipped receipt.",go:"subGo('books','ledger')"});
  }catch(e){}
  // NOTE: "matters with no next date" was intentionally removed — a matter awaiting
  // its next date is routine and shouldn't sit in Needs attention.
  // Filter out anything dismissed for today.
  const dis=_alertsDismissedToday();
  return out.filter(a=>dis.indexOf(a.key)<0);
}
function _briefingHTML(){

  const chip=(a)=>`<div class="brf-chip ${a.sev}">
