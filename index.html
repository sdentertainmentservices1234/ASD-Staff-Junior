        <button class="btn ghost sm" onclick="addInvExpense()" style="margin-top:8px">+ Add expense line</button>
      </div>

      <div style="margin-top:14px"><label class="fld">Notes on the invoice (optional)</label>
        <input class="in" id="ivNotes" placeholder="e.g. towards drafting and filing of SLP, appearances on 2 dates"></div>

      <div class="note" id="ivTotalNote" style="font-size:14px">Total: ₹0</div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn seal" onclick="saveAndPrintInvoice()">Save &amp; print invoice</button>
      </div>
    </div>`;
  // init lines
  if(_invLines.length===0) _invLines=[{desc:"Professional fees",amount:""}];
  drawInvLines(); drawInvExpenses(); onInvStyleChange(); onDueModeChange();
}
function renderInvoiceLedger(){
  const list=[...DB.invoices].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.no||"").localeCompare(a.no||""));
  const raised = list.filter(i=>!isVoided(i)).reduce((s,inv)=>s+((inv.lines||[]).reduce((x,l)=>x+(+l.amount||0),0)+(inv.expenses||[]).reduce((x,l)=>x+(+l.amount||0),0)),0);
  const rows=list.map(inv=>{
    const tot=(inv.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(inv.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
    const voided=isVoided(inv);
    const noCell = voided
      ? `<span style="text-decoration:line-through;color:var(--muted)">${esc(inv.no)}</span> <span class="tag">Void${inv.voidReason?" ("+esc(inv.voidReason)+")":""}</span>`
      : esc(inv.no);
    return `<tr${voided?' style="opacity:.6"':''}><td class="mono">${noCell}</td><td>${fmtDate(inv.date)}</td>
      <td>${esc(matterLabel(inv.matterId))}</td><td>${inv.style==="itemised"?"Itemised":"Consolidated"}</td>
      <td class="num">${fmtINR(tot)}</td>
      <td style="white-space:nowrap"><button class="row-act" onclick="reprintInvoice('${inv.id}')">Print</button>
        ${voided?"":`<button class="row-act" onclick="voidInvoice('${inv.id}')">Void</button>`}
        <button class="row-act" onclick="delInvoice('${inv.id}')">Delete</button></td></tr>`;
  }).join("");
  document.getElementById("panel-invoiceledger").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><h2>Invoices</h2><div class="hint">All fee invoices raised. Total billed (excluding voided): <b>${fmtINR(raised)}</b></div></div>
        <button class="btn ghost sm" onclick="openBilling('invoice')">+ New invoice</button>
      </div>
      ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Date</th><th>Matter</th><th>Style</th><th class="num">Total</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No invoices raised yet.</div>`}
    </div>`;
}
function onInvStyleChange(){
  const style=document.getElementById("ivStyle").value;
  const addBtn=document.getElementById("ivAddLine");
  // consolidated: single locked-ish line; itemised: multiple
  if(style==="consolidated"){
    if(_invLines.length>1) _invLines=[{desc:"Professional fees", amount:_invLines.reduce((s,l)=>s+(+l.amount||0),0)||""}];
    if(_invLines.length===0) _invLines=[{desc:"Professional fees",amount:""}];
    addBtn.style.display="none";
  }else{
    addBtn.style.display="inline-flex";
  }
  drawInvLines(); recalcInvTotal();
}
function drawInvLines(){
  const wrap=document.getElementById("ivLines"); if(!wrap) return;
  wrap.innerHTML=_invLines.map((l,i)=>`<div class="grid" style="grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:7px">
    <input class="in" placeholder="Description of work" value="${esc(l.desc)}" oninput="updInvLine(${i},'desc',this.value)">
    <input class="in" type="number" min="0" placeholder="Amount" value="${esc(l.amount)}" oninput="updInvLine(${i},'amount',this.value)">
    ${_invLines.length>1?`<button class="btn ghost sm" onclick="rmInvLine(${i})" style="padding:6px">✕</button>`:"<div></div>"}
  </div>`).join("");
}
function drawInvExpenses(){
  const wrap=document.getElementById("ivExpenses"); if(!wrap) return;
  wrap.innerHTML=_invExpenses.map((l,i)=>`<div class="grid" style="grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:7px">
    <input class="in" placeholder="e.g. court fees, travel, printing" value="${esc(l.desc)}" oninput="updInvExp(${i},'desc',this.value)">
    <input class="in" type="number" min="0" placeholder="Amount" value="${esc(l.amount)}" oninput="updInvExp(${i},'amount',this.value)">
    <button class="btn ghost sm" onclick="rmInvExp(${i})" style="padding:6px">✕</button>
  </div>`).join("");
}
function addInvLine(){ _invLines.push({desc:"",amount:""}); drawInvLines(); }
function rmInvLine(i){ _invLines.splice(i,1); if(!_invLines.length)_invLines=[{desc:"",amount:""}]; drawInvLines(); recalcInvTotal(); }
function updInvLine(i,k,v){ _invLines[i][k]=v; if(k==="amount")recalcInvTotal(); }
function addInvExpense(){ _invExpenses.push({desc:"",amount:""}); drawInvExpenses(); }
function rmInvExp(i){ _invExpenses.splice(i,1); drawInvExpenses(); recalcInvTotal(); }
function updInvExp(i,k,v){ _invExpenses[i][k]=v; if(k==="amount")recalcInvTotal(); }
function recalcInvTotal(){
  const fees=_invLines.reduce((s,l)=>s+(+l.amount||0),0);
  const exp=_invExpenses.reduce((s,l)=>s+(+l.amount||0),0);
  const note=document.getElementById("ivTotalNote");
  if(note) note.innerHTML=`Fees ${fmtINR(fees)}${exp?` + Expenses ${fmtINR(exp)}`:""} &nbsp;=&nbsp; <b>Total ${fmtINR(fees+exp)}</b>`;
}
function saveAndPrintInvoice(){
  const matterId=document.getElementById("ivMatter").value;
  const date=document.getElementById("ivDate").value;
  if(!matterId){ toast("Select a matter.",true); return; }
  if(!date){ toast("Pick a date.",true); return; }
  const lines=_invLines.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim()||"Professional fees",amount:+l.amount||0}));
  const expenses=_invExpenses.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim(),amount:+l.amount||0}));
  if(!lines.length || lines.reduce((s,l)=>s+l.amount,0)<=0){ toast("Enter at least one fee amount.",true); return; }
  const dueMode=document.getElementById("ivDueMode").value;
  const dueDays=+document.getElementById("ivDueDays").value||0;
  const bankSel=document.getElementById("ivBank");
  const upiSel=document.getElementById("ivUpi");
  const qrChk=document.getElementById("ivQr");
  const inv={ id:uid(), no:nextInvoiceNo(), date, matterId,
    style:document.getElementById("ivStyle").value, dueMode, due:dueDays,
    bankId: bankSel? bankSel.value : (defaultBank()?defaultBank().id:""),
    upiId: upiSel? upiSel.value : (defaultUpi()?defaultUpi().id:""),
    showQr: qrChk? qrChk.checked : false,
    lines, expenses, notes:document.getElementById("ivNotes").value.trim(), status:"raised" };
  DB.invoices.push(inv);
  save();
  printInvoice(inv);
  _invLines=[{desc:"Professional fees",amount:""}]; _invExpenses=[];
  save(); renderInvoice(); markPanel("invoice");
  toast(`Invoice ${inv.no} saved.`);
}
function onDueModeChange(){
  const mode=document.getElementById("ivDueMode").value;
  document.getElementById("ivDueDays").style.display = mode==="days" ? "block" : "none";
}
function reprintInvoice(id){ const inv=DB.invoices.find(x=>x.id===id); if(inv) printInvoice(inv); }
function delInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  const latest=_isLatestInSeries("invoices",inv);
  const warn = latest
    ? `Invoice <b>${esc(inv.no)}</b> is the latest in the series. Deleting it frees the number ${esc(inv.no)} to be used again — right for a test or mistaken entry.`
    : `Invoice <b>${esc(inv.no)}</b> is not the latest. Deleting leaves a permanent gap at ${esc(inv.no)}. If this invoice was actually issued to a client, use <b>Void</b> instead so the number stays on record.`;
  openModal("Delete invoice?", `
    <div class="hint">${warn}</div>
    <div class="note">Deleted items are recoverable from More → Backup, if needed.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${latest?"":`<button class="btn ghost" onclick="closeModal();voidInvoice('${id}')">Void instead</button>`}
      <button class="btn seal" onclick="doDelInvoice('${id}')">Delete</button>
    </div>`);
}
function _refreshInvoiceViews(){
  const ledgerActive=document.getElementById("panel-invoiceledger") && document.getElementById("panel-invoiceledger").classList.contains("active");
  if(ledgerActive) renderInvoiceLedger();
  else renderInvoice();
}
function doDelInvoice(id){
  const reused=softDelete("invoices",id);
  closeModal(); _refreshInvoiceViews();
  toast(reused?"Invoice deleted — number freed for reuse.":"Invoice deleted.");
}
function voidInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  openModal("Void invoice "+esc(inv.no), `
    <div class="hint">The invoice stays on record as <b>cancelled</b> and its number is never reused. Add a short reason (shown in brackets).</div>
    <label class="fld">Reason</label>
    <input class="in" id="voidReason" placeholder="e.g. wrong amount, duplicate" maxlength="60">
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doVoidInvoice('${id}')">Void invoice</button>
    </div>`);
}
function doVoidInvoice(id){
  const reason=(document.getElementById("voidReason")||{}).value||"";
  voidRecord("invoices",id,reason,"void");
  closeModal(); _refreshInvoiceViews(); toast("Invoice voided.");
}

function printInvoice(inv){
  const s=DB.settings; const m=matterById(inv.matterId)||{};
  const fees=(inv.lines||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const exp=(inv.expenses||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const grand=fees+exp;
  let rows="";
  if(inv.style==="itemised"){
    (inv.lines||[]).forEach((l,i)=>{ rows+=`<tr><td>${i+1}</td><td>${esc(l.desc)}</td><td class="r">${fmtINR(l.amount)}</td></tr>`; });
  }else{
    const desc = inv.notes || "Professional fees for legal services rendered in the matter";
    rows += `<tr><td>1</td><td>${esc(desc)}</td><td class="r">${fmtINR(fees)}</td></tr>`;
  }
  (inv.expenses||[]).forEach((l,i)=>{ rows+=`<tr><td>${(inv.style==="itemised"?(inv.lines.length+i+1):(i+2))}</td><td>${esc(l.desc)} <span style="color:#8a8175">(expense)</span></td><td class="r">${fmtINR(l.amount)}</td></tr>`; });

  let dueText="";
  if(inv.dueMode==="days" || (inv.dueMode===undefined && inv.due)) dueText = `Payable within ${inv.due} day(s) of receipt.`;
  else if(inv.dueMode==="onreceipt") dueText = "Payable on receipt.";
  const contact = s.mobile||s.contact||"";
  const payBlock = dueText
    ? `<div class="inv-pay">${dueText}${contact?` Kindly remit to the chamber. For queries: ${esc(contact)}.`:""}</div>`
    : (contact?`<div class="inv-pay">Kindly remit to the chamber. For queries: ${esc(contact)}.</div>`:"");
  // bank account (independent of UPI)
  let bk = null;
  if(inv.bankId!==undefined){ bk = inv.bankId ? bankById(inv.bankId) : null; }
  else { bk = defaultBank(); }
  const hasBank = bk && (bk.name||bk.acc||bk.ifsc||bk.branch);
  // UPI (independent of bank)
  let up = null;
  if(inv.upiId!==undefined){ up = inv.upiId ? upiById(inv.upiId) : null; }
  else { up = defaultUpi(); }
  const hasUpi = up && up.vpa;
  let qrSvg="";
  if(hasUpi && inv.showQr!==false){
    const payee=encodeURIComponent(s.chamberName||s.advName||"");
    const amt=encodeURIComponent(grand.toFixed(2));
    const note=encodeURIComponent("Invoice "+(inv.no||""));
    const upiStr=`upi://pay?pa=${encodeURIComponent(up.vpa)}&pn=${payee}&am=${amt}&cu=INR&tn=${note}`;
    try{ qrSvg = QR.svg(upiStr, 118); }catch(e){ qrSvg=""; }
  }
  const bankBlock = (hasBank||hasUpi) ? `<div class="tpl-pay">
      <div class="pd">
        <div class="lbl">Payment Details</div>
        ${hasBank&&bk.name?`<div class="row"><span class="k">Account name</span><span>:</span><b>${esc(bk.name)}</b></div>`:""}
        ${hasBank&&bk.branch?`<div class="row"><span class="k">Bank &amp; branch</span><span>:</span><b>${esc(bk.branch)}</b></div>`:""}
        ${hasBank&&bk.acc?`<div class="row"><span class="k">Account no.</span><span>:</span><b>${esc(bk.acc)}</b></div>`:""}
        ${hasBank&&bk.ifsc?`<div class="row"><span class="k">IFSC</span><span>:</span><b>${esc(bk.ifsc)}</b></div>`:""}
        ${hasUpi?`<div class="row"><span class="k">UPI ID</span><span>:</span><b>${esc(up.vpa)}</b></div>`:""}
      </div>
      ${qrSvg?`<div class="tpl-qr"><div class="cap">Scan &amp; Pay</div>${qrSvg}<div class="upi">${hasUpi?esc(up.vpa):""}</div></div>`:""}
    </div>` : "";
  document.getElementById("receiptArea").innerHTML=`
   <div class="tpl">
     <div class="tpl-corner" style="--accent:#efe6cf"></div>
     <div class="tpl-body">
       ${_tplMast(s)}
       <div class="tpl-titlewrap">
         <div>
           <div class="tpl-title">Fee Invoice</div>
           <div class="tpl-subtitle">Memo of Professional Fees</div>
         </div>
         <div class="tpl-metatop">
           <div class="row"><span class="k">Invoice No.</span><span class="c">:</span><b>${esc(inv.no)}</b></div>
           <div class="row"><span class="k">Date</span><span class="c">:</span><b>${fmtDate(inv.date)}</b></div>
           ${dueText?`<div class="row"><span class="k">Due</span><span class="c">:</span><b>${esc(dueText.replace(/\.$/,""))}</b></div>`:""}
         </div>
       </div>
       <div class="tpl-cols">
         <div class="tpl-col">
           <div class="tpl-eyebrow">Bill To</div>
           <div class="tpl-block"><b>${esc(m.client||"—")}</b></div>
         </div>
         <div class="tpl-col">
           <div class="tpl-eyebrow">Matter Details</div>
           <div class="tpl-dl">
             ${m.parties?`<div class="row"><span class="k">Matter</span><span class="c">:</span><b>${esc(m.parties)}</b></div>`:""}
             ${m.court?`<div class="row"><span class="k">Court</span><span class="c">:</span><b>${esc(m.court)}</b></div>`:""}
             ${m.caseNo?`<div class="row"><span class="k">Case No.</span><span class="c">:</span><b>${esc(m.caseNo)}</b></div>`:""}
             ${m.code?`<div class="row"><span class="k">Our Ref.</span><span class="c">:</span><b>${esc(m.code)}</b></div>`:""}
           </div>
         </div>
       </div>
       <table class="tpl-tbl">
         <thead><tr><th style="width:44px">Sr.</th><th>Particulars</th><th class="r" style="width:130px">Amount (₹)</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>
       <div class="tpl-tot"><table>
         <tr><td class="lbl">Professional fees</td><td class="r">${fmtINR(fees)}</td></tr>
         ${exp?`<tr><td class="lbl">Expenses / out-of-pocket</td><td class="r">${fmtINR(exp)}</td></tr>`:""}
         <tr class="grand"><td class="lbl">Total Amount Due</td><td class="r">${fmtINR(grand)}</td></tr>
       </table></div>
       <div class="tpl-words">(Rupees ${esc(numToWords(grand))} only)</div>
       ${inv.notes&&inv.style==="itemised"?`<div class="tpl-note">${esc(inv.notes)}</div>`:""}
       ${bankBlock}
       <div class="tpl-sign">
         <div class="box"><div class="who">${esc(s.advName||"")}</div></div>
       </div>
       <div class="tpl-note">${s.rcmNote?esc(s.rcmNote)+" ":""}This is a memo of fees / bill of costs and not a receipt; a separate receipt will be issued on payment.</div>
     </div>
     ${_tplFoot(s)}
   </div>`;
  setTimeout(()=>window.print(),150);
}

   * qrcode
   * @param typeNumber 1 to 40

   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

          var buffer = qrBitBuffer();

            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';

      qrHtml += '</table>';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

    var escapeXml = function(s) {

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),

/* QR.svg wrapper for inline use (UPI payloads) */
var QR = (function(){
  function svg(text, px){
    try{
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount();
      var rects = "";
      for(var r=0;r<n;r++)for(var c=0;c<n;c++){ if(qr.isDark(r,c)) rects += '<rect x="'+c+'" y="'+r+'" width="1" height="1"/>'; }
      var dim = n+8;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 '+dim+' '+dim+'" width="'+(px||140)+'" height="'+(px||140)+'"><rect x="-4" y="-4" width="'+dim+'" height="'+dim+'" fill="#fff"/><g fill="#1a1a18">'+rects+'</g></svg>';
    }catch(e){ return ""; }
  }
  return { svg: svg };
})();


function numToWords(n){
  n = Math.round(Number(n)||0);
  if(n===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=> x<20? a[x] : b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=> { const h=Math.floor(x/100), r=x%100; return (h? a[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
  let out="", crore=Math.floor(n/10000000); n%=10000000;
  let lakh=Math.floor(n/100000); n%=100000;
  let thou=Math.floor(n/1000); n%=1000;
  let hund=n;
  if(crore) out+=two(crore)+" Crore ";
  if(lakh) out+=two(lakh)+" Lakh ";
  if(thou) out+=two(thou)+" Thousand ";
  if(hund) out+=three(hund);
  return out.trim().replace(/\s+/g," ");
}

function setMatterKind(k){
  document.querySelectorAll("#mfKindSeg .seg-btn").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  document.getElementById("mfKind").value=k;
  document.getElementById("mfCode").value = k==="query"?peekNextQueryCode():peekNextMatterCode();
  // for a query, diary/case numbers are usually blank — keep the fields but hint
  const row=document.getElementById("mfNumsRow");
  if(row) row.style.opacity = k==="query"?".55":"1";
}
/* repopulate the matter-type dropdown when forum changes */
function onForumChange(){
  const forum = document.getElementById("mfCourt").value;
  const sel = document.getElementById("mfType");
  const cur = sel.value;
  const list = typesForForum(forum);
  sel.innerHTML = ['<option value="">— Select matter type —</option>']
    .concat(list.map(t=>`<option ${cur===t?"selected":""}>${esc(t)}</option>`)).join("");
}
function addMatter(){ openModal("New matter", matterFormHTML()); }
function editMatter(id){ const m=matterById(id); openModal("Edit matter", matterFormHTML(m)); }
function saveMatter(id){
  const client = document.getElementById("mfClient").value.trim();
  if(!client){ toast("Client name is required.", true); return; }
  const kind = (document.getElementById("mfKind")||{}).value || "case";
  const data = {
    client,
    contact: document.getElementById("mfContact").value.trim(),
    email: document.getElementById("mfEmail").value.trim(),
    refName: document.getElementById("mfRefName").value.trim(),
    refContact: document.getElementById("mfRefContact").value.trim(),
    parties: document.getElementById("mfParties").value.trim(),
    matterType: document.getElementById("mfType").value.trim(),
    court: document.getElementById("mfCourt").value.trim(),
    diaryNo: document.getElementById("mfDiary").value.trim(),
    caseNo: document.getElementById("mfCase").value.trim(),
    notes: document.getElementById("mfNotes").value.trim(),
    status: document.getElementById("mfStatus").value
  };
  if(id){
    const m = matterById(id); Object.assign(m, data);
  }else{
    const code = kind==="query"? nextQueryCode() : nextMatterCode();
    DB.matters.push(Object.assign({id:uid(), code, kind, opened:todayISO()}, data));
  }
  save(); renderAll(); closeModal(); toast(kind==="query"?"Query saved.":"Matter saved.");
}
/* Convert a query into a numbered case: renumber, keep origin note,
   move nothing physically (docs/receipts already point by matterId) but
   change the matter's identity so all its records now show the case number. */
function convertToCase(id){
  const m=matterById(id); if(!m) return;
  if(m.kind==="case"){ toast("This is already a case.", true); return; }
  openModal("Convert query to case", `
    <div class="hint">Query <b>${esc(m.code)}</b> — ${esc(m.client)}${m.parties?" · "+esc(m.parties):""}. Enter the case details. All documents and receipts under this query will move to the new case number automatically.</div>
    <div class="grid g2" style="margin-top:6px">
      <div><label class="fld">Diary No.</label><input class="in mono" id="cvDiary" value="${esc(m.diaryNo||"")}" placeholder="12345/2026"></div>
      <div><label class="fld">Case No.</label><input class="in mono" id="cvCase" value="${esc(m.caseNo||"")}" placeholder="SLP(C) 678/2026"></div>
    </div>
    <div style="margin-top:11px"><label class="fld">Cause title / parties</label><input class="in" id="cvParties" value="${esc(m.parties||"")}" placeholder="Ramesh Patil v. State"></div>
    <div class="note">New case number will be <b>${esc(peekNextMatterCode())}</b>. The origin query <b>${esc(m.code)}</b> is recorded on the case for tracing.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doConvertToCase('${id}')">Convert to case</button>
    </div>`);
}
function doConvertToCase(id){
  const m=matterById(id); if(!m) return;
  const originQuery = m.code;
  m.originQuery = originQuery;
  m.kind = "case";
  m.code = nextMatterCode();
  m.diaryNo = document.getElementById("cvDiary").value.trim() || m.diaryNo;
  m.caseNo = document.getElementById("cvCase").value.trim() || m.caseNo;
  m.parties = document.getElementById("cvParties").value.trim() || m.parties;
  // documents and receipts reference matterId (unchanged), so they follow automatically.
  save(); renderAll(); closeModal();
  toast(`${originQuery} converted to ${m.code}. All records moved.`);
}
function deleteMatter(id){
  const m=matterById(id); if(!m) return;
  const has = DB.receipts.some(r=>r.matterId===id && !isVoided(r));
  const latest=_isLatestInSeries("matters",m);
  const kindLabel = m.kind==="query"?"query":"case";
  let warn;
  if(has){
    warn = `This ${kindLabel} has receipts against it. Deleting the ${kindLabel} would orphan them. Consider <b>Cancel</b> instead, which keeps the record and its number.`;
  }else if(latest){
    warn = `<b>${esc(m.code)}</b> is the latest ${kindLabel} number. Deleting frees ${esc(m.code)} for reuse — right for a test or mistaken entry.`;
  }else{

   =========================================================== */
function cashRows(){
  const fromRec = DB.receipts.filter(r=>!isVoided(r)).map(r=>({date:r.date, particulars:`Receipt ${r.no} — ${matterLabel(r.matterId)}`, type:"in", amount:+r.amount||0, mode:r.mode, ref:r.no, src:"receipt"}));
  const fromExp = DB.expenses.map(e=>({date:e.date, particulars:`${e.head}${e.payee?" — "+e.payee:""}`, type:"out", amount:+e.amount||0, mode:e.mode, ref:e.voucherNo||"", src:"expense"}));
  const manual = DB.cash.filter(c=>!c.ref || (!DB.receipts.some(r=>r.no===c.ref))).map(c=>({...c, src:"manual"}));
  // use auto rows for receipts/expenses; manual only for ad-hoc
  return [...fromRec, ...fromExp, ...DB.cash.filter(c=>c.src==="manual")]
    .concat(DB.cash.filter(c=>c.manual))  // safety
    .filter((v,i,arr)=>true)
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
function renderCash(){
  // Build clean: receipts (in) + expenses (out) + explicit manual entries
  const rows = [];
  DB.receipts.forEach(r=>rows.push({date:r.date, p:`Receipt ${r.no} — ${matterLabel(r.matterId)}`, t:"in", a:+r.amount||0, mode:r.mode}));
  DB.expenses.forEach(e=>rows.push({date:e.date, p:`${e.head}${e.payee?" — "+e.payee:""}`, t:"out", a:+e.amount||0, mode:e.mode}));
  DB.cash.filter(c=>c.manual).forEach(c=>rows.push({date:c.date, p:c.particulars, t:c.type, a:+c.amount||0, mode:c.mode}));
  rows.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let bal=0;
  const body = rows.map(r=>{
    bal += r.t==="in"? r.a : -r.a;
    return `<tr>
      <td>${fmtDate(r.date)}</td><td>${esc(r.p)}</td><td>${esc(r.mode||"")}</td>
      <td class="num">${r.t==="in"?fmtINR(r.a):""}</td>
      <td class="num">${r.t==="out"?fmtINR(r.a):""}</td>
      <td class="num" style="font-weight:600">${fmtINR(bal)}</td></tr>`;
  }).join("");
  const totIn = rows.filter(r=>r.t==="in").reduce((s,r)=>s+r.a,0);
  const totOut = rows.filter(r=>r.t==="out").reduce((s,r)=>s+r.a,0);
  document.getElementById("panel-cash").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><h2>Cash book</h2><div class="hint">Auto-built from receipts (in) and expenses (out). Add manual entries for anything else. This is your Rule 6F cash record.</div></div>
        <button class="btn ghost sm" onclick="addCash()">+ Manual entry</button>
      </div>
      ${rows.length? `<div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Particulars</th><th>Mode</th><th class="num">Receipts</th><th class="num">Payments</th><th class="num">Balance</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr style="font-weight:700;background:#efe9db">
          <td colspan="3">Totals</td><td class="num">${fmtINR(totIn)}</td>
          <td class="num">${fmtINR(totOut)}</td><td class="num">${fmtINR(totIn-totOut)}</td></tr></tfoot>
        </table></div>`
        : `<div class="empty">No entries yet.</div>`}
    </div>`;
}

/* ---- proof handling: compress images, hold in staging until save ---- */
let _proofStaging = null;
function onProofPicked(input){
  const f = input.files && input.files[0];
  const info = document.getElementById("exFileInfo");
  _proofStaging = null;
  if(!f){ info.textContent=""; return; }
  if(f.type === "application/pdf"){
    const r = new FileReader();
    r.onload = ()=>{ _proofStaging = {name:f.name, type:f.type, data:r.result};
      info.textContent = `Attached: ${f.name} (${(f.size/1024).toFixed(0)} KB)`; };
    r.readAsDataURL(f);
  } else if(f.type.startsWith("image/")){
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600; let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){ const s = maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const out = c.toDataURL("image/jpeg", 0.8);
        _proofStaging = {name:f.name.replace(/\.\w+$/,"")+".jpg", type:"image/jpeg", data:out};
        info.textContent = `Attached: ${_proofStaging.name} (~${Math.round((out.length*0.75)/1024)} KB)`;
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  } else { info.innerHTML = `<span style="color:var(--seal)">Only images or PDF allowed.</span>`; input.value=""; }
}
async function viewProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(!e || !e.proofMeta){ toast("No attachment.",true); return; }
  let blobData;
  try{ blobData = await idbGet("proof:"+id); }catch(_){}
  if(!blobData){ toast("Attachment missing on this device. Restore from a full backup.",true); return; }
  const p = e.proofMeta;
  const body = p.type==="application/pdf"
    ? `<iframe src="${blobData}" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:6px"></iframe>`
    : `<img src="${blobData}" style="max-width:100%;border:1px solid var(--line);border-radius:6px">`;
  openModal(`Proof — ${esc(p.name||"attachment")} (voucher ${esc(e.voucherNo||"")})`, `${body}
    <div class="btn-row" style="margin-top:14px">
      <a class="btn ghost" href="${blobData}" download="${esc(p.name||'proof')}">Download</a>
      <button class="btn ghost" onclick="removeProof('${id}')">Remove attachment</button>
      <button class="btn seal" onclick="closeModal()">Close</button>
    </div>`);
}
async function removeProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(e){ delete e.proofMeta; try{ await idbDel("proof:"+id); }catch(_){}
    save(); renderExpense(); closeModal(); toast("Attachment removed."); }
}

async function saveLateProof(id){
  const e = DB.expenses.find(x=>x.id===id); if(!e) return;
  if(!_proofStaging){ toast("Choose a file first.",true); return; }
  try{
    await idbPut("proof:"+id, _proofStaging.data);
    e.proofMeta = {name:_proofStaging.name, type:_proofStaging.type};
    _proofStaging=null; save(); renderExpense(); closeModal(); toast("Proof attached.");
  }catch(err){ toast("Could not store the file.",true); }
}
async function saveExpense(){
  const head=document.getElementById("exHead").value;
  const amt=+document.getElementById("exAmt").value;
  if(!head){ toast("Select an expense head.",true); return; }
  const miscDetail = head==="Misc." ? document.getElementById("exMisc").value.trim() : "";
  if(head==="Misc." && !miscDetail){ toast("Specify what the miscellaneous expense was.",true); return; }
  if(!amt){ toast("Enter the amount.",true); return; }
  const id = uid();
  const voucherNo = nextVoucherNo();
  const exp = {id, voucherNo, date:document.getElementById("exDate").value,
    head, miscDetail, payee:document.getElementById("exPayee").value.trim(), amount:amt,
    mode:document.getElementById("exMode").value, remarks:document.getElementById("exRem").value.trim()};
  if(_proofStaging){
    try{ await idbPut("proof:"+id, _proofStaging.data);
      exp.proofMeta = {name:_proofStaging.name, type:_proofStaging.type}; }
    catch(err){ toast("Voucher saved, but the attachment could not be stored.", true); }
  }
  DB.expenses.push(exp);
  _proofStaging = null;
  save(); renderAll(); closeModal(); toast(`Voucher ${voucherNo} saved.`);
}
function delExpense(id){
  DB.expenses=DB.expenses.filter(e=>e.id!==id);
  try{ idbDel("proof:"+id); }catch(_){}
  save(); renderAll(); toast("Expense deleted.");
}

function collectBanksFromDOM(){
  const rows=document.querySelectorAll("#bankList .bank-row");
  const banks=[];
  const defId=(document.querySelector('input[name="bankDefault"]:checked')||{}).value;
  rows.forEach(r=>{
    const g=cls=>{ const el=r.querySelector("."+cls); return el?(el.type==="checkbox"?el.checked:el.value.trim()):""; };
    const id=r.getAttribute("data-bid");
    const bk={id,label:g("bank-label")||g("bank-name")||"Account",name:g("bank-name"),branch:g("bank-branch"),
      acc:g("bank-acc"),ifsc:(g("bank-ifsc")||"").toUpperCase(),acctype:g("bank-type"),isDefault:id===defId};
    // skip fully-empty rows
    if(bk.name||bk.acc||bk.branch) banks.push(bk);
  });
  if(banks.length && !banks.some(b=>b.isDefault)) banks[0].isDefault=true;
  return banks;
}

function genHandoverKey(){
  const al="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const r=crypto.getRandomValues(new Uint8Array(32));
  let k=""; for(let i=0;i<32;i++) k+=al[r[i]%al.length];
  const el=document.getElementById("stHandoverKey"); if(el) el.value=k;
  toast("New key generated. Save settings, then copy it into the staff config.");
}
function saveSettings(){
  const s=DB.settings;
  const has=(id)=>document.getElementById(id)!==null;
  const gv=(id)=>{const e=document.getElementById(id);return e?e.value.trim():undefined;};
  // Chamber section
  if(has("stName")) s.advName=gv("stName");
  if(has("stL1")) s.line1=gv("stL1");
  if(has("stChamber")) s.chamberName=gv("stChamber");
  if(has("stDesig")) s.designation=gv("stDesig");
  if(has("stCourt")) s.court=gv("stCourt");
  if(has("stMobile")){ s.mobile=gv("stMobile"); s.contact=s.mobile; }
  if(has("stEmail")) s.email=gv("stEmail");
  if(has("stAddr")) s.address=gv("stAddr");
  if(has("stBar")) s.barId=gv("stBar");
  if(has("stPan")) s.pan=gv("stPan");
  if(has("stPlace")) s.place=gv("stPlace");
  // Banking section
  if(document.getElementById("bankList")){ s.banks=collectBanksFromDOM(); const db0=defaultBank(); if(db0){ s.bankName=db0.name; s.bankBranch=db0.branch; s.bankAcc=db0.acc; s.bankIfsc=db0.ifsc; } }
  if(document.getElementById("upiList")){ s.upis=collectUpisFromDOM(); const du0=defaultUpi(); s.bankUpi=du0?du0.vpa:""; }
  // Numbering & mode
  if(has("stPrefix")) s.receiptPrefix=gv("stPrefix")||"R";
  if(has("stFy")) s.fyStart=gv("stFy")||s.fyStart;
  const mode=document.querySelector('input[name="mode"]:checked'); if(mode) s.mode=mode.value;
  // RCM
  if(has("stRcm")) s.rcmNote=gv("stRcm");
  // Security handover key
  if(has("stHandoverKey")) s.handoverKey=gv("stHandoverKey");
  save(); applyBranding(); toast("Settings saved.");
  // stay in settings; return to the section menu
  renderSettings();
}

function monthKey(iso){ return (iso||"").slice(0,7); } // YYYY-MM
function monthLabel(ym){
  if(!ym || ym.length<7) return "Undated";
  const [y,m]=ym.split("-");
  const mon=["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1]||"";
  return `${mon} ${y}`;
}
let _archiveOpen = {}; // track expanded months

function buildArchiveIndex(){
  // returns { year: { ym: {receipts:[], invoices:[], expenses:[], docsIn:[], docsFiled:[], imports:[] , fees, exp} } }
  const idx = {};
  function bucket(ym){
    const yr = ym && ym.length>=4 ? ym.slice(0,4) : "Undated";
    idx[yr] = idx[yr] || {};
    idx[yr][ym] = idx[yr][ym] || {receipts:[],invoices:[],expenses:[],docsIn:[],docsFiled:[],imports:[],fees:0,exp:0,inv:0};
    return idx[yr][ym];
  }
  (DB.receipts||[]).forEach(r=>{ const b=bucket(monthKey(r.date)); b.receipts.push(r); b.fees+=+r.amount||0; });
  (DB.invoices||[]).forEach(v=>{ const b=bucket(monthKey(v.date));
    const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
    b.invoices.push(v); b.inv+=t; });
  (DB.expenses||[]).forEach(e=>{ const b=bucket(monthKey(e.date)); b.expenses.push(e); b.exp+=+e.amount||0; });
  (DB.docsIn||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.received)); b.docsIn.push(d); });
  (DB.docsFiled||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.filed)); b.docsFiled.push(d); });
  // (staff import log removed with handover feature)
  return idx;
}

function renderArchive(){
  const idx = buildArchiveIndex();
  const years = Object.keys(idx).sort((a,b)=>b.localeCompare(a)); // newest first
  let body="";
  if(!years.length){
    body = `<div class="card"><div class="empty">Nothing archived yet. As you add receipts, invoices, expenses, documents and import staff entries, they'll be catalogued here by month and year.</div></div>`;
  } else {
    for(const yr of years){
      const months = Object.keys(idx[yr]).sort((a,b)=>b.localeCompare(a));
      // year totals
      let yFees=0,yExp=0,yInv=0,yR=0,yV=0,yD=0,yI=0;
      months.forEach(ym=>{const m=idx[yr][ym]; yFees+=m.fees;yExp+=m.exp;yInv+=m.inv;yR+=m.receipts.length;yV+=m.expenses.length;yD+=m.docsIn.length+m.docsFiled.length;yI+=m.imports.length;});
      body += `<div class="card">
        <div class="card-head"><div>
          <h2 style="margin-bottom:2px">${esc(yr)}</h2>
          <div class="hint" style="margin:0">${yR} receipts · ${yV} vouchers · ${yInv?fmtINR(yInv)+" invoiced · ":""}${yD} documents · ${yI} imports</div>
        </div>
        <div style="text-align:right"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Fees received</div>
          <div style="font-size:20px;font-weight:700;color:var(--seal)">${fmtINR(yFees)}</div></div></div>
        <div style="margin-top:10px">`;
      for(const ym of months){
        const m = idx[yr][ym];
        const open = !!_archiveOpen[ym];
        const count = m.receipts.length+m.invoices.length+m.expenses.length+m.docsIn.length+m.docsFiled.length+m.imports.length;
        body += `<div class="arch-month">
          <div class="arch-mhead" onclick="toggleArchMonth('${ym}')">
            <div><span class="arch-caret">${open?"▾":"▸"}</span> <b>${esc(monthLabel(ym))}</b>
              <span style="color:var(--muted);font-size:12.5px;margin-left:8px">${count} item${count!==1?"s":""}</span></div>
            <div style="font-size:12.5px;color:var(--muted)">${m.fees?"Fees "+fmtINR(m.fees):""}${m.exp?" · Exp "+fmtINR(m.exp):""}</div>
          </div>
          ${open?renderArchMonthDetail(m):""}
        </div>`;
      }
      body += `</div></div>`;
    }
  }
  document.getElementById("panel-archive").innerHTML = `
    <div class="card">
      <h2>Archive</h2>
      <div class="hint">Your complete chamber record, catalogued by year and month — receipts, invoices, expenses, documents, and imported staff entries. This grows with you over the years.</div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ghost sm" onclick="exportArchiveCSV()">Export full archive (CSV)</button>
      </div>
    </div>
    ${body}`;
}
function toggleArchMonth(ym){ _archiveOpen[ym]=!_archiveOpen[ym]; renderArchive(); go("archive"); }

function renderArchMonthDetail(m){
  let out = `<div class="arch-detail">`;
  if(m.receipts.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Receipts</div><table class="arch-tbl"><tbody>`;
    m.receipts.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(r=>{
      out += `<tr><td class="mono">${esc(r.no||"")}</td><td>${fmtDate(r.date)}</td><td>${esc(matterLabel(r.matterId))}</td><td class="num">${fmtINR(r.amount)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.invoices.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Invoices</div><table class="arch-tbl"><tbody>`;
    m.invoices.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(v=>{
      const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
      out += `<tr><td class="mono">${esc(v.no||"")}</td><td>${fmtDate(v.date)}</td><td>${esc(matterLabel(v.matterId))}</td><td class="num">${fmtINR(t)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.expenses.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Expenses</div><table class="arch-tbl"><tbody>`;
    m.expenses.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>{
      out += `<tr><td class="mono">${esc(e.voucherNo||"")}</td><td>${fmtDate(e.date)}</td><td>${esc(e.head||"")}${e.payee?" · "+esc(e.payee):""}</td><td class="num">${fmtINR(e.amount)}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.docsIn.length || m.docsFiled.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Documents</div><table class="arch-tbl"><tbody>`;
    [...m.docsIn.map(d=>({d,k:"Inward"})), ...m.docsFiled.map(d=>({d,k:"Filed"}))]
      .sort((a,b)=>((a.d.date||"")).localeCompare(b.d.date||"")).forEach(({d,k})=>{
      out += `<tr><td>${esc(k)}</td><td>${fmtDate(d.date)}</td><td>${esc(d.title||d.desc||"—")}</td><td>${esc(matterLabel(d.matterId)||"")}</td></tr>`;
    });
    out += `</tbody></table></div>`;
  }
  if(m.imports.length){
    out += `<div class="arch-sec"><div class="arch-sec-t">Staff imports</div><table class="arch-tbl"><tbody>`;
    m.imports.forEach(l=>{ out += `<tr><td>${fmtDate(l.at.slice(0,10))}</td><td>${esc(l.station||"")}</td><td>${l.nr} receipts, ${l.ne} expenses</td><td></td></tr>`; });
    out += `</tbody></table></div>`;
  }
  out += `</div>`;
  return out;
}

function exportArchiveCSV(){
  const rows=[["Type","Number","Date","Matter/Head","Party/Payee","Amount","RecordedBy"]];
  (DB.receipts||[]).forEach(r=>{const m=matterById(r.matterId)||{};rows.push(["Receipt",r.no||"",r.date||"",m.code||"",m.client||"",r.amount||"",r.enteredBy||""]);});
  (DB.invoices||[]).forEach(v=>{const m=matterById(v.matterId)||{};const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);rows.push(["Invoice",v.no||"",v.date||"",m.code||"",m.client||"",t,""]);});
  (DB.expenses||[]).forEach(e=>{rows.push(["Expense",e.voucherNo||"",e.date||"",e.head||"",e.payee||"",e.amount||"",e.enteredBy||""]);});
  (DB.docsIn||[]).forEach(d=>{const m=matterById(d.matterId)||{};rows.push(["Inward doc","",d.date||"",d.title||d.desc||"",m.client||"","",""]);});
  (DB.docsFiled||[]).forEach(d=>{const m=matterById(d.matterId)||{};rows.push(["Filed doc",d.iaNo||"",d.date||"",d.title||d.desc||"",m.client||"","",""]);});
  rows.sort((a,b)=>(a[2]||"").localeCompare(b[2]||""));
  const csv = rows.map(r=>r.map(c=>{c=String(c==null?"":c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`Chamber-Archive-${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("Full archive exported as CSV.");
}

const DOC_SOURCES = ["Client","Court","Opposite party / counsel","Government office","Registry","Courier / post","Other"];
const INWARD_TYPES = ["Vakalatnama","Case papers / file","Court order / notice","Affidavit","Agreement / deed",
  "ID / KYC documents","Cheque / DD","Correspondence","Evidence / annexure","Other"];
const FILED_TYPES = ["Main petition / paper-book (full filed copy)","SLP (filed copy)","Writ Petition (filed copy)",
  "Appeal (filed copy)","Interlocutory Application (IA)","Interim Application","Stay Application",
  "Counter / Reply","Rejoinder","Affidavit","Annexure compilation","Vakalatnama","Other filed document"];
let _mDocStaging = [];
function onMDocsPicked(input, infoId){
  const files=[...(input.files||[])]; _mDocStaging=[];
  const info=document.getElementById(infoId); if(!files.length){info.textContent="";return;}
  let done=0; const total=files.length; const collected=[];
  info.textContent=`Reading ${total} file(s)…`;
  files.forEach(f=>{
    if(f.type==="application/pdf"){ const r=new FileReader();
      r.onload=()=>{collected.push({name:f.name,type:f.type,data:r.result,size:f.size});tick();}; r.readAsDataURL(f);
    }else if(f.type.startsWith("image/")){ const r=new FileReader();
      r.onload=()=>{const img=new Image();img.onload=()=>{const max=1800;let{width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",0.82);collected.push({name:f.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data:out,size:Math.round(out.length*0.75)});tick();
      };img.src=r.result;}; r.readAsDataURL(f);
    }else{collected.push(null);tick();}
  });
  function tick(){done++;if(done===total){_mDocStaging=collected.filter(Boolean);
    const kb=_mDocStaging.reduce((s,x)=>s+(x.size||0),0)/1024;
    info.textContent=`${_mDocStaging.length} file(s) ready (~${kb>1024?(kb/1024).toFixed(1)+" MB":Math.round(kb)+" KB"}).`;}}
}

let _docSearch="";
let _docFolderOpen={};
function setDocSearch(v){ _docSearch=(v||"").toLowerCase(); renderDocFolders(true); }
function toggleDocFolder(key){ _docFolderOpen[key]=!_docFolderOpen[key]; renderDocFolders(true); }
function renderDocFolders(keepFocus){
  const all=[...(DB.docsIn||[]).map(d=>({...d,_grp:"docsIn"})), ...(DB.docsFiled||[]).map(d=>({...d,_grp:"docsFiled"}))];
  const folders={}; const misc=[];
  all.forEach(d=>{
    if(d.matterId && matterById(d.matterId)){ (folders[d.matterId]=folders[d.matterId]||[]).push(d); }
    else misc.push(d);
  });
  const q=_docSearch;
  function matchMatter(m){
    if(!q) return true;
    return [m.code,m.parties,m.client,m.caseNo,m.diaryNo,m.originQuery].filter(Boolean).join(" ").toLowerCase().includes(q);
  }
  const matterIds = DB.matters.map(m=>m.id).filter(id=>matchMatter(matterById(id)));
  const folderCards = matterIds.map(id=>{
    const m=matterById(id); const docs=(folders[id]||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const open=_docFolderOpen[id];
    const kindTag = m.kind==="query"?'<span class="tag q">Query</span>':'<span class="tag c">Case</span>';
    const rows = docs.map(d=>docRowHTML(d)).join("") || `<div class="empty">No documents in this folder yet.</div>`;
    const convertBtn = m.kind==="query"?`<button class="btn ghost sm" onclick="event.stopPropagation();convertToCase('${id}')">Convert to case</button>`:"";
    return `<div class="folder">
      <div class="folder-head" onclick="toggleDocFolder('${id}')">
        <div class="fh-l"><span class="fh-caret">${open?"▾":"▸"}</span>
          <div><div class="fh-title">${esc(matterFolderTitle(m))} ${kindTag}</div>
          <div class="fh-sub">${docs.length} document${docs.length===1?"":"s"}${m.originQuery?` · originally ${esc(m.originQuery)}`:""}</div></div>
        </div>
        <div class="fh-r">${convertBtn}</div>
      </div>
      ${open?`<div class="folder-body">${rows}</div>`:""}
    </div>`;
  }).join("");
  const miscMatch = q? misc.filter(d=>[d.title,d.docType,d.caseNo,d.source].filter(Boolean).join(" ").toLowerCase().includes(q)) : misc;
  const miscOpen=_docFolderOpen["__misc__"];
  const miscRows = miscMatch.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(d=>docRowHTML(d,true)).join("") || `<div class="empty">Nothing unfiled.</div>`;
  const miscCard = `<div class="folder misc">
    <div class="folder-head" onclick="toggleDocFolder('__misc__')">
      <div class="fh-l"><span class="fh-caret">${miscOpen?"▾":"▸"}</span>
        <div><div class="fh-title">Misc / Unassigned</div>
        <div class="fh-sub">${miscMatch.length} document${miscMatch.length===1?"":"s"} awaiting a case</div></div>
      </div>
    </div>
    ${miscOpen?`<div class="folder-body">${miscRows}</div>`:""}
  </div>`;
  document.getElementById("panel-docin").innerHTML=`
    <div class="card">
      <div class="card-head">
        <div><h2>Documents by case</h2><div class="hint">Court files and inward documents, filed under your chamber's own case/query number. Anything unclassified sits in Misc.</div></div>
        <button class="btn seal sm" onclick="addMDoc('docsIn')">+ Add document</button>
      </div>
      <input class="in" id="docSearch" placeholder="Search by chamber no., cause title, case/diary no…" value="${esc(_docSearch)}" oninput="setDocSearch(this.value)" style="margin-bottom:14px">
      <div class="folders">
        ${folderCards||""}
        ${miscCard}
      </div>
    </div>`;
  if(keepFocus){ const s=document.getElementById("docSearch"); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); } }
}

  const reassign = `<button class="row-act" onclick="assignDoc('${grp}','${d.id}')">${inMisc?"Assign":"Move"}</button>`;
  return `<div class="drow">

      <div class="dr-meta">${fmtDate(d.date)} · ${esc(d.docType||"")}${d.source?" · "+esc(d.source):""}${(d.files||[]).length?` · ${(d.files||[]).length} file(s)`:""}${d.enteredBy&&d.enteredBy!=="(self)"?` · <span class="tag">${esc(d.enteredBy)}</span>`:""}</div></div>

  </div>`;
}

/* ===========================================================
   EXPORT DOCUMENTS TO A REAL FOLDER (catalogued case files)
   Uses File System Access API (Chrome/Edge desktop). Falls
   back to a downloadable ZIP where unsupported.
   =========================================================== */
function fsSupported(){ return typeof window!=="undefined" && "showDirectoryPicker" in window; }
function safeName(s){ return (s||"").replace(/[\/\\:*?"<>|]/g,"-").replace(/\s+/g," ").trim().slice(0,120); }
function dataURLtoBlob(dataURL){
  try{
    const [head,b64]=dataURL.split(",");
    const mime=(head.match(/data:(.*?);/)||[])[1]||"application/octet-stream";
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}
function matterFolderName(m){
  if(!m) return "Unassigned";
  const bits=[m.code, safeName(m.client)];
  if(m.caseNo) bits.push(safeName(m.caseNo).replace(/\//g,"-"));
  return safeName(bits.join("  "));
}
function docsForMatter(matterId){
  return {
    filed: DB.docsFiled.filter(d=>d.matterId===matterId),
    inward: DB.docsIn.filter(d=>d.matterId===matterId)
  };
}
function buildIndexText(m, sets){
  const L=[];
  L.push("CASE DOCUMENT INDEX");
  L.push("=".repeat(40));
  if(m){ L.push("Matter code : "+m.code); L.push("Client      : "+m.client);
    if(m.parties) L.push("Parties     : "+m.parties);
    if(m.caseNo) L.push("Case no.    : "+m.caseNo);
    if(m.court) L.push("Forum       : "+m.court);
  } else L.push("Unassigned documents");
  L.push("Generated   : "+new Date().toLocaleString());
  L.push("");
  function section(title, arr){
    L.push(title); L.push("-".repeat(title.length));
    if(!arr.length){ L.push("(none)"); L.push(""); return; }
    arr.forEach(d=>{
      (d.files||[]).forEach((f,i)=>{
        const fname = fileNameFor(d, f, i);
        L.push(`${fmtDate(d.date)}  ${fname}`);
      });
      const extra=[d.docType, d.source?("from "+d.source):"", d.iaNo, d.notes, d.enteredBy&&d.enteredBy!=="(self)"?("logged by "+d.enteredBy):""].filter(Boolean).join(" · ");
      if(extra) L.push("    "+extra);
    });
    L.push("");
  }
  section("FILED RECORDS", sets.filed);
  section("INWARD DOCUMENTS", sets.inward);
  return L.join("\n");
}
function fileNameFor(d, f, i){
  const ext = (f.name && f.name.includes(".")) ? f.name.slice(f.name.lastIndexOf(".")) : (f.type==="application/pdf"?".pdf":".jpg");
  const base = safeName(d.title) + (((d.files||[]).length>1)?(" ("+(i+1)+")"):"");
  return `${d.date}  ${base}${ext}`;
}

async function writeMatterToDir(parentDir, m, sets){
  const folderName = matterFolderName(m);
  const dir = await parentDir.getDirectoryHandle(folderName, {create:true});
  async function writeSet(subName, arr){
    if(!arr.length) return 0;
    const sub = await dir.getDirectoryHandle(subName, {create:true});
    let n=0;
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i];
        let data; try{ data=await idbGet(f.key); }catch(e){}
        if(!data) continue;
        const blob=dataURLtoBlob(data); if(!blob) continue;
        const fh=await sub.getFileHandle(fileNameFor(d,f,i), {create:true});
        const w=await fh.createWritable(); await w.write(blob); await w.close(); n++;
      }
    }
    return n;
  }
  const nf=await writeSet("Filed", sets.filed);
  const ni=await writeSet("Inward", sets.inward);
  // index file
  const idx=await dir.getFileHandle("_index.txt",{create:true});
  const w=await idx.createWritable(); await w.write(buildIndexText(m,sets)); await w.close();
  return nf+ni;
}

async function exportMatterToFolder(matterId){
  const m = matterById(matterId);
  const sets = docsForMatter(matterId);
  if(!sets.filed.length && !sets.inward.length){ toast("No documents for this matter yet.",true); return; }
  if(fsSupported()){
    try{
      const parent = await window.showDirectoryPicker({mode:"readwrite"});
      const n = await writeMatterToDir(parent, m, sets);
      toast(`Saved ${n} file(s) to ${matterFolderName(m)}.`);
    }catch(e){ if(e && e.name==="AbortError") return; toast("Could not write to that folder.",true); }
  }else{
    await exportMatterAsZip(m, sets);
  }
}
async function exportAllToFolder(){
  if(!DB.docsFiled.length && !DB.docsIn.length){ toast("No documents to export.",true); return; }
  if(fsSupported()){
    try{
      const parent = await window.showDirectoryPicker({mode:"readwrite"});
      let total=0, folders=0;
      // one folder per matter that has docs
      const matterIds = new Set([...DB.docsFiled, ...DB.docsIn].map(d=>d.matterId||""));
      for(const mid of matterIds){
        const m = mid? matterById(mid) : null;
        const sets = mid? docsForMatter(mid) : {filed:DB.docsFiled.filter(d=>!d.matterId), inward:DB.docsIn.filter(d=>!d.matterId)};
        if(!sets.filed.length && !sets.inward.length) continue;
        total += await writeMatterToDir(parent, m, sets); folders++;
      }
      toast(`Exported ${total} file(s) across ${folders} case folder(s).`);
    }catch(e){ if(e && e.name==="AbortError") return; toast("Could not write to that folder.",true); }
  }else{
    toast("Folder export needs Chrome or Edge on desktop. Downloading a ZIP instead.");
    await exportAllAsZip();
  }
}

/* ---- ZIP fallback (Safari/iPhone) via a tiny zip builder ---- */
function crc32(buf){
  let c, table=crc32.t||(crc32.t=(()=>{const t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})());
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function buildZip(files){ // files:[{path,bytes}]
  const chunks=[], central=[]; let offset=0;
  const dosTime=0, dosDate=0x21;
  for(const f of files){
    const nameB=strBytes(f.path); const data=f.bytes; const crc=crc32(data);
    const local=new Uint8Array(30+nameB.length);
    const dv=new DataView(local.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    local.set(nameB,30);
    chunks.push(local, data);
    const cen=new Uint8Array(46+nameB.length); const cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameB.length,true); cv.setUint32(42,offset,true); cen.set(nameB,46);
    central.push(cen);
    offset+=local.length+data.length;
  }
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array(22); const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true); ev.setUint32(16,offset,true);
  return new Blob([...chunks,...central,end],{type:"application/zip"});
}
async function collectFilesForZip(m, sets, rootName){
  const out=[];
  async function add(subName, arr){
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i]; let data; try{data=await idbGet(f.key);}catch(e){}
        if(!data) continue; const blob=dataURLtoBlob(data); if(!blob) continue;
        const bytes=new Uint8Array(await blob.arrayBuffer());
        out.push({path:`${rootName}/${subName}/${fileNameFor(d,f,i)}`, bytes});
      }
    }
  }
  await add("Filed", sets.filed); await add("Inward", sets.inward);
  out.push({path:`${rootName}/_index.txt`, bytes:strBytes(buildIndexText(m,sets))});
  return out;
}
async function exportMatterAsZip(m, sets){
  const root=matterFolderName(m);
  const files=await collectFilesForZip(m,sets,root);
  const zip=buildZip(files); downloadBlob(zip, root+".zip");
  toast("Case documents downloaded as a ZIP.");
}
async function exportAllAsZip(){
  let all=[];
  const matterIds=new Set([...DB.docsFiled,...DB.docsIn].map(d=>d.matterId||""));
  for(const mid of matterIds){
    const m=mid?matterById(mid):null;
    const sets=mid?docsForMatter(mid):{filed:DB.docsFiled.filter(d=>!d.matterId),inward:DB.docsIn.filter(d=>!d.matterId)};
    if(!sets.filed.length&&!sets.inward.length) continue;
    const part=await collectFilesForZip(m,sets,matterFolderName(m)); all=all.concat(part);
  }
  if(!all.length){ toast("Nothing to export.",true); return; }
  downloadBlob(buildZip(all), "Chamber-Cases-"+todayISO()+".zip");
  toast("All case documents downloaded as a ZIP.");
}
function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function _daysUntil(iso){
  if(!iso) return null;
  const today=new Date(todayISO()+"T00:00:00");
  const d=new Date(iso+"T00:00:00");
  return Math.round((d-today)/86400000);
}
function _dateBucket(iso){
  const n=_daysUntil(iso);
  if(n==null) return "none";
  if(n<0) return "overdue";
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n<=7) return "week";
  return "later";
}

  const dated = active.filter(m=>m.nextDate).sort((a,b)=>(a.nextDate||"").localeCompare(b.nextDate||""));
  const undated = active.filter(m=>!m.nextDate);

  const buckets={overdue:[],today:[],tomorrow:[],week:[],later:[]};
  dated.forEach(m=>{ buckets[_dateBucket(m.nextDate)].push(m); });

  const weekCount = buckets.today.length+buckets.tomorrow.length+buckets.week.length;
  const overdueCount = buckets.overdue.length;

  function caseCard(m){
    const n=_daysUntil(m.nextDate);
    const when = n<0?`${Math.abs(n)}d overdue`:n===0?"Today":n===1?"Tomorrow":`in ${n}d`;
    const cls = n<0?"od":n===0?"td":n===1?"tm":"";
    return `<div class="hc" onclick="updateNextDate('${m.id}')">
      <div class="hc-l">
        <div class="hc-when ${cls}">${when}</div>
        <div class="hc-date">${fmtDate(m.nextDate)}</div>
