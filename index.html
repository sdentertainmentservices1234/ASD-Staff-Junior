const SCHEMA_VERSION = 3;  // bump when the data shape changes; migrate handles upgrades
function migrate(data){
  // Forward-compatible: merges in any NEW default fields without dropping
  // existing data, preserves unknown keys, and never throws on partial data.
  if(!data || typeof data!=="object") data = {};
  const base = DEFAULTS();
  // settings: keep all existing values, add any newly-introduced defaults
  data.settings = Object.assign({}, base.settings, data.settings||{});
  // core arrays: ensure present
  for(const k of ["matters","receipts","expenses","cash","docsIn","docsFiled","invoices"]) if(!Array.isArray(data[k])) data[k]=[];
  data.counters = Object.assign({}, base.counters, data.counters||{});
  // back-fill voucher counter from existing vouchers if missing
  if(!data.counters.voucher){
    let mx=0; data.expenses.forEach(e=>{ const m=/V-\d{2}-(\d{3})/.exec(e.voucherNo||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.voucher = mx;
  }
  // back-fill invoice counter likewise
  if(!data.counters.invoice){
    let mx=0; (data.invoices||[]).forEach(v=>{ const m=/\/(\d{3})$/.exec(v.no||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.invoice = mx;
  }
  // migrate any legacy inline proof -> IndexedDB, keep only meta in index
  data.expenses.forEach(e=>{
    if(e.proof && e.proof.data){
      const pid = e.id;
      try{ idbPut("proof:"+pid, e.proof.data); }catch(_){}
      e.proofMeta = {name:e.proof.name, type:e.proof.type};
      delete e.proof;
    }
  });
  if(!Array.isArray(data.staffLog)) data.staffLog = [];
  if(!Array.isArray(data.staff)) data.staff = [];
  if(!Array.isArray(data.filings)) data.filings = [];
  if(!Array.isArray(data.appointments)) data.appointments = [];
  if(!Array.isArray(data.myAppointments)) data.myAppointments = [];
  if(data.counters && data.counters.pastcase==null) data.counters.pastcase = 0;
  (data.matters||[]).forEach(m=>{ if(!Array.isArray(m.dates)) m.dates=[]; });
  if(!Array.isArray(data.advances)) data.advances = [];
  if(!Array.isArray(data.trash)) data.trash = [];
  // auto-download backup is now off by default (was a source of confusing Downloads clutter)
  data.settings.autoBackup = false;
  // migrate legacy single bank details into the banks[] array
  if(!Array.isArray(data.settings.banks)) data.settings.banks = [];
  if(data.settings.banks.length===0 && (data.settings.bankName||data.settings.bankAcc)){
    data.settings.banks.push({
      id: uid(), label: data.settings.bankName||"Primary account",
      name: data.settings.bankName||"", branch: data.settings.bankBranch||"",
      acc: data.settings.bankAcc||"", ifsc: data.settings.bankIfsc||"", acctype:"", isDefault: true
    });
  }
  // migrate legacy UPI (from settings or from any bank row) into upis[]
  if(!Array.isArray(data.settings.upis)) data.settings.upis = [];
  if(data.settings.upis.length===0){
    let legacyUpi = data.settings.bankUpi||"";
    if(!legacyUpi){ const wb=(data.settings.banks||[]).find(b=>b.upi); if(wb) legacyUpi=wb.upi; }
    if(legacyUpi){ data.settings.upis.push({id:uid(), label:"UPI", vpa:legacyUpi, isDefault:true}); }
  }
  // strip upi/showQr off any migrated bank rows
  (data.settings.banks||[]).forEach(b=>{ delete b.upi; delete b.showQr; });
  data.ver = APP_VER;
  data.schema = SCHEMA_VERSION;
  return data;
}

/* ===========================================================
   PROOF STORE — IndexedDB (uses your actual disk, no 5MB cap)
   Only the small JSON index lives in localStorage; the heavy
   PDF/image bytes live here, keyed by proof id.
   =========================================================== */
const IDB_NAME = "chamberProofs", IDB_STORE = "proofs";
let _idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{ _idb=req.result; res(_idb); };
    req.onerror = ()=>rej(req.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>res(r.result||null); r.onerror = ()=>rej(r.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}


/* ---------- numbering: computed from existing records (multi-device safe) ----------
   Instead of a hidden per-device counter, each number is derived from the
   highest sequence already present in the records everyone can see. Both the
   owner and staff devices see the same shared records, so they compute the
   same next number. Works offline; self-heals on sync. A duplicate check
   (findDuplicateNumbers) warns if two records ever share a number.            */
function _maxSeq(values, re){
  let max=0;
  (values||[]).forEach(v=>{
    if(!v) return;
    const m=String(v).match(re);
    if(m){ const n=parseInt(m[1],10); if(!isNaN(n)&&n>max) max=n; }
  });
  return max;
}
function _peekMatterSeq(){
  // highest of active matters (M-) — historical PC- and queries Q- are separate series
  return _maxSeq((DB.matters||[]).filter(m=>!m.historical && (m.code||"").indexOf("M-")===0).map(m=>m.code), /M-\d{2}-(\d+)/);
}
function nextReceiptNo(){
  const seqNum = _maxSeq((DB.receipts||[]).map(r=>r.no), new RegExp(esc(DB.settings.receiptPrefix)+"\\/[^\\/]+\\/(\\d+)")) + 1;
  DB.counters.receipt = Math.max(DB.counters.receipt||0, seqNum);
  return `${DB.settings.receiptPrefix}/${fyLabel(DB.settings.fyStart)}/${String(seqNum).padStart(3,"0")}`;
}
// read-only preview of the next receipt number (no counter mutation)
function peekNextReceiptNo(){

}

/* SAFETY NET: detect any number issued twice (e.g. two offline devices).
   Returns a list like [{kind:"Matter", number:"M-26-001", count:2}]. */
function findDuplicateNumbers(){
  const out=[];
  const scan=(label, values)=>{
    const seen={};
    (values||[]).filter(Boolean).forEach(v=>{ seen[v]=(seen[v]||0)+1; });
    Object.keys(seen).forEach(k=>{ if(seen[k]>1) out.push({kind:label, number:k, count:seen[k]}); });
  };
  scan("Matter", (DB.matters||[]).filter(m=>!m.historical).map(m=>m.code));
  scan("Past case", (DB.matters||[]).filter(m=>m.historical).map(m=>m.code));
  scan("Receipt", (DB.receipts||[]).filter(r=>!isVoided(r)).map(r=>r.no));
  scan("Invoice", (DB.invoices||[]).filter(i=>!isVoided(i)).map(i=>i.no));
  scan("Voucher", (DB.expenses||[]).map(e=>e.voucherNo));
  return out;
}
function duplicateWarningHTML(){
  const dups=findDuplicateNumbers();
  if(!dups.length) return "";
  const lines=dups.map(d=>`${esc(d.kind)} <b>${esc(d.number)}</b> (\u00d7${d.count})`).join(", ");
  return `<div class="dup-warn">\u26a0\ufe0f Duplicate numbers detected: ${lines}. This can happen if two devices added records offline at the same time. Open each and renumber one to keep your records clean.</div>`;
}
/* ---------- delete / void / cancel core ----------
   Delete  = soft-delete (recoverable in trash). If the record holds the
             LATEST number in its series, roll the counter back so the number
             is reused; the trashed copy releases its number (formerNo).
   Void/Cancel = keep the record visible, mark status 'void'/'cancelled' with
             a short reason; number is retained and never reused; excluded
             from income totals.
   Series map: receipts->counters.receipt, invoices->counters.invoice,
             matters(kind case)->counters.matter, matters(kind query)->counters.query.
*/
function _seqInfo(coll, rec){
  // returns {counterKey, num} where num is the numeric sequence this record holds
  if(coll==="receipts"){ return {counterKey:"receipt", num:_numFromCode(rec.no)}; }
  if(coll==="invoices"){ return {counterKey:"invoice", num:_numFromCode(rec.no)}; }
  if(coll==="matters"){
    if(rec.kind==="query") return {counterKey:"query", num:_numFromCode(rec.code)};
    return {counterKey:"matter", num:_numFromCode(rec.code)};
  }
  return {counterKey:null, num:null};
}
function _numFromCode(code){
  if(!code) return null;
  // grab the LAST group of digits in the code (e.g. R/2026-27/014 -> 14, M-26-003 -> 3)
  const m = String(code).match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1],10) : null;
}
function _isLatestInSeries(coll, rec){
  const {counterKey, num} = _seqInfo(coll, rec);
  if(!counterKey || num==null) return false;
  return DB.counters[counterKey] === num;   // holds the top number
}
// Soft-delete (recoverable). Returns true if the number was reused.
function softDelete(coll, id){
  const arr = DB[coll]; if(!Array.isArray(arr)) return false;
  const idx = arr.findIndex(x=>x.id===id); if(idx<0) return false;
  const rec = arr[idx];
  const latest = _isLatestInSeries(coll, rec);
  const {counterKey, num} = _seqInfo(coll, rec);
  let reused=false, formerNo=null;
  if(latest && counterKey){
    DB.counters[counterKey] = Math.max(0, DB.counters[counterKey]-1); // roll back
    formerNo = rec.no || rec.code || null;
    reused=true;
  }
  // move to trash (recoverable); strip its active number if reused
  const trashed = Object.assign({}, rec);
  if(reused){ trashed.no=null; trashed.code=null; trashed._releasedNo=formerNo; }
  DB.trash = DB.trash || [];
  const _snapId = uid();
  DB.trash.push({ id:_snapId, coll, rec:trashed, deletedAt:new Date().toISOString(), formerNo });
  window._lastTrashId = _snapId;
  arr.splice(idx,1);
  save();
  return reused;
}
// Void/Cancel (keep, mark, never reuse number)
function voidRecord(coll, id, reason, label){
  const arr = DB[coll]; if(!Array.isArray(arr)) return;
  const rec = arr.find(x=>x.id===id); if(!rec) return;
  rec.status = label || "void";           // 'void' for receipts/invoices, 'cancelled' for matters
  rec.voidReason = reason || "";
  rec.voidedAt = new Date().toISOString();
  save();
}
function isVoided(rec){ return rec && (rec.status==="void" || rec.status==="cancelled" || rec.status==="rejected"); }
function isRejected(rec){ return rec && rec.status==="rejected"; }

let toastT;

// Toast with an Undo button. undoFn runs if tapped within the window.
var _undoFn=null;
function toastUndo(msg, undoFn){
  const el = document.getElementById("toast");
  _undoFn = undoFn;
  el.innerHTML = `<span>${esc(msg)}</span><button class="toast-undo" onclick="_doUndo()">Undo</button>`;
  el.className = "show has-act";
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ el.className = el.className.replace("show","").replace("has-act","").trim(); _undoFn=null; }, 6000);
}
function _doUndo(){
  const el=document.getElementById("toast");
  el.className = el.className.replace("show","").replace("has-act","").trim();
  clearTimeout(toastT);
  const fn=_undoFn; _undoFn=null;
  if(typeof fn==="function"){ try{ fn(); }catch(e){} }
}
// Restore the most recently soft-deleted record of a collection back into place.
function _undoSoftDelete(coll, snapshotId){
  DB.trash = DB.trash || [];
  const ti = DB.trash.findIndex(t=>t.id===snapshotId);
  if(ti<0){ toast("Could not undo — item not found.",true); return; }
  const entry=DB.trash[ti];
  const rec=Object.assign({}, entry.rec);
  // restore released number if one was freed
  if(entry.formerNo){ if(rec._releasedNo){ rec.no=rec._releasedNo; delete rec._releasedNo; }
    const {counterKey}=_seqInfo(coll, rec); if(counterKey){ DB.counters[counterKey]=(DB.counters[counterKey]||0)+1; } }
  if(!Array.isArray(DB[coll])) DB[coll]=[];
  DB[coll].push(rec);
  DB.trash.splice(ti,1);
  save();
  toast("Restored.");
  try{ renderAll(); }catch(e){}
}

/* ===========================================================
   BACKUP & SYNC  — manual export + auto dated snapshots
   =========================================================== */
async function gatherProofs(){
  const out = {};
  for(const e of DB.expenses){
    if(e.proofMeta){ try{ const d = await idbGet("proof:"+e.id); if(d) out[e.id] = d; }catch(_){} }
  }
  return out;
}
async function gatherDocFiles(){
  const out = {};
  for(const grp of [DB.docsIn, DB.docsFiled]){
    for(const x of (grp||[])){ for(const f of (x.files||[])){ try{ const d=await idbGet(f.key); if(d) out[f.key]=d; }catch(_){} } }
  }
  return out;
}
async function exportData(filenameOverride){
  const proofs = await gatherProofs();
  const docfiles = await gatherDocFiles();
  const bundle = Object.assign({}, DB, {_proofs: proofs, _docfiles: docfiles, _bundleVer: 2});
  const payload = JSON.stringify(bundle, null, 2);
  const blob = new Blob([payload], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const name = filenameOverride || `ChamberRegister-${todayISO()}.json`;
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  DB.lastBackup = new Date().toISOString();
  save();
}
function manualExport(){
  exportData(`ChamberRegister-MAIN.json`).then(()=>{
    toast("Exported ChamberRegister-MAIN.json — keep it in your Drive/iCloud folder.");
    renderData();
  });
}
function autoBackupIfDue(){ /* removed: cloud sync is the safety net; no auto-download */ }
// Monthly backup — a full local snapshot named by month, for the user's records.
function monthlyBackup(){
  const d=new Date();
  const mLabel=d.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  const fname=`ChamberBackup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}.json`;
  exportData(fname).then(()=>{
    DB.lastMonthlyBackup=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    save();
    toast(`Backup for ${mLabel} saved. Keep it in your OneDrive → Monthly Backups folder.`);
    if(document.getElementById("panel-data")&&document.getElementById("panel-data").classList.contains("active")) renderData();
  });
}
// Around month-end (last 5 days) if this month's backup hasn't been taken yet,
// gently surface a reminder on the home screen. Owner only.
function _monthEndBackupDue(){
  if(isStaffView()) return false;
  const d=new Date();
  const daysInMonth=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  if(d.getDate() < daysInMonth-4) return false; // only last 5 days
  const thisMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  return DB.lastMonthlyBackup!==thisMonth;
}
function _backupReminderHTML(){
  if(!_monthEndBackupDue()) return "";
  const mLabel=new Date().toLocaleDateString("en-IN",{month:"long"});
  return `<div class="backup-nudge">
    <div class="bn-txt">📦 Month-end: save your <b>${esc(mLabel)}</b> backup to keep a local copy safe.</div>
    <button class="btn seal sm" onclick="monthlyBackup()">Back up now</button>
  </div>`;
}
function importData(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=="object" || (!("settings" in data) && !("receipts" in data)))
        throw new Error("Not a Chamber Register file");
      const proofs = data._proofs || {};
      const docfiles = data._docfiles || {};
      delete data._proofs; delete data._docfiles; delete data._bundleVer;
      DB = migrate(data);
      save();
      for(const [id, blobData] of Object.entries(proofs)){ try{ await idbPut("proof:"+id, blobData); }catch(_){} }
      for(const [key, blobData] of Object.entries(docfiles)){ try{ await idbPut(key, blobData); }catch(_){} }
      renderAll();
      toast("Data, attachments and documents restored.");
      closeModal();
    }catch(e){ toast("That file could not be read.", true); }
  };
  reader.readAsText(file);
}
function wipeAll(){
  if(isStaffView()){ toast("Only the Head of Chamber can erase data.", true); return; }
  openModal("Erase ALL data?",
    `<div style="font-size:14px;line-height:1.65">
      <p style="margin:0 0 10px"><b style="color:var(--seal)">This permanently deletes every matter, receipt, invoice, expense, advance, document link, task, and activity record</b> — from the cloud and this device. It cannot be undone.</p>
      <p style="margin:0 0 10px">Your chamber settings (name, banks, AOR) and your access allow-list are kept. Only the records are erased.</p>
      <p style="margin:0 0 12px">Files in your OneDrive are <b>not</b> touched — only the app's records.</p>
      <div style="background:#faf5ee;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:12px">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">To confirm, type <b>ERASE</b> below:</div>
        <input class="in" id="wipeConfirm" placeholder="Type ERASE" autocomplete="off" oninput="_wipeCheck()">
      </div>
     </div>
     <div class="btn-row" style="margin-top:6px">
       <button class="btn ghost" onclick="closeModal()">Cancel</button>
       <button class="btn ghost" onclick="exportData()">Backup first</button>
       <button class="btn seal" id="wipeGo" disabled style="opacity:.5" onclick="doWipe()">Erase everything</button>
     </div>`);
}
function _wipeCheck(){
  const v=((document.getElementById("wipeConfirm")||{}).value||"").trim();
  const btn=document.getElementById("wipeGo");
  if(btn){ const ok=v==="ERASE"; btn.disabled=!ok; btn.style.opacity=ok?"1":".5"; }
}
async function doWipe(){
  const v=((document.getElementById("wipeConfirm")||{}).value||"").trim();
  if(v!=="ERASE"){ toast("Type ERASE to confirm.", true); return; }
  const btn=document.getElementById("wipeGo");
  if(btn){ btn.disabled=true; btn.textContent="Erasing…"; }
  // keep settings + counters intact locally; wipe only the record arrays
  const keptSettings = DB.settings;
  try{
    if(window.FB && FB.wipeCloud){ await FB.wipeCloud(); }
  }catch(e){ toast("Cloud erase problem: "+(e&&e.message?e.message:e)+". Some records may remain.", true); }
  // clear local record arrays but preserve settings and role
  const fresh=DEFAULTS();
  fresh.settings = keptSettings;          // keep chamber identity
  fresh.deviceRole = DB.deviceRole;       // stay signed in as owner
  fresh.settings.ownerUid = DB.settings.ownerUid;
  DB = fresh;
  save();
  closeModal();
  renderAll();
  toast("All records erased.");
}

/* ===========================================================
   DERIVED TOTALS
   =========================================================== */
function fyReceipts(){ return DB.receipts.filter(r=>inFY(r.date, DB.settings.fyStart) && !isVoided(r)); }
function fyExpenses(){ return DB.expenses.filter(e=>inFY(e.date, DB.settings.fyStart) && !isRejected(e)); }
function grossReceiptsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.amount||0),0); }
function expensesFY(){ return fyExpenses().reduce((s,e)=>s+(+e.amount||0),0); }
function presumptive(){ return Math.round(grossReceiptsFY()*0.5); }
function tdsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.tds||0),0); }
function netActual(){ return grossReceiptsFY() - expensesFY(); }
// Fees received per month across the current FY (Apr..Mar), for the trend chart.
function monthlyFeesFY(){
  const start=DB.settings.fyStart; const y=parseInt(start.slice(0,4),10);
  const buckets=new Array(12).fill(0);   // index 0 = April … 11 = March
  fyReceipts().forEach(r=>{
    if(!r.date) return;
    const d=new Date(r.date); const m=d.getMonth();            // 0=Jan
    const idx=(m>=3)? (m-3) : (m+9);                            // April→0
    buckets[idx]+=(+r.amount||0);
  });
  return buckets;
}
// Tax position under BOTH methods, so the owner can compare 44ADA vs normal books.
// Returns income + estimated tax (new regime) for each, and which is lower.
function taxComparison(){
  const gross=grossReceiptsFY(), exp=expensesFY(), tds=tdsFY();
  const presIncome=Math.round(gross*0.5);                        // 44ADA: 50% of gross
  const bookIncome=Math.max(0, gross-exp);                       // normal books: actual net
  const presTax=newRegimeTax(presIncome);
  const bookTax=newRegimeTax(bookIncome);
  return {
    gross, exp, tds,
    pres:{ income:presIncome, tax:presTax, net:presTax-tds },
    book:{ income:bookIncome, tax:bookTax, net:bookTax-tds },
    lower: (presTax<=bookTax) ? "pres" : "book"
  };
}
// Invoices raised this FY (excluding voided), summing fee lines + billed expenses.
function fyInvoices(){ return DB.invoices.filter(i=>inFY(i.date, DB.settings.fyStart) && !isVoided(i)); }
function invoiceTotal(inv){
  return (inv.lines||[]).reduce((s,l)=>s+(+l.amount||0),0) + (inv.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
}
function billedFY(){ return fyInvoices().reduce((s,inv)=>s+invoiceTotal(inv),0); }
// Outstanding = billed this FY minus fees received this FY (a practical, chamber-level view).
function outstandingFY(){ return Math.max(0, billedFY() - grossReceiptsFY()); }

/* ===========================================================
   STAFF ADVANCES / FLOAT (imprest) with review-then-accept
   Balance in staff hands = accepted advances - accepted expenses
     - accepted returns.  Only ACCEPTED entries count toward the
     balance and the chamber books (one source of truth).
   Staff-created entries start status:'pending'; owner accepts.
   Accepted expenses post to the chamber expense books (dual purpose),
   taking the next voucher number AT ACCEPTANCE (gap-free series).
   =========================================================== */
function advancesFor(uid){ return DB.advances.filter(a=>a.staffUid===uid); }
function acceptedFor(uid){ return advancesFor(uid).filter(a=>a.status==="accepted"); }
function pendingFor(uid){ return advancesFor(uid).filter(a=>a.status==="pending"); }
function allPending(){ return DB.advances.filter(a=>a.status==="pending"); }
function staffBalance(uid){
  return acceptedFor(uid).reduce((bal,a)=>{
    if(a.type==="advance") return bal + (+a.amount||0);
    if(a.type==="return")  return bal - (+a.amount||0);
    if(a.type==="expense") return bal - (+a.amount||0);
    return bal;
  }, 0);
}
function pendingBalanceImpact(uid){
  // net effect on balance if all pending were accepted (for a staff "pending" note)
  return pendingFor(uid).reduce((d,a)=>{
    if(a.type==="advance") return d + (+a.amount||0);
    return d - (+a.amount||0);
  },0);
}
// Create an advance-ledger entry. byOwner => accepted immediately; staff => pending.
function addAdvanceEntry(type, staffUid, staffName, amount, date, note, opts){
  opts=opts||{};
  const rec={ id:uid(), staffUid, staffName:staffName||"", date:date||todayISO(), type,
    amount:+amount||0, note:note||"", mode:opts.mode||"Cash",
    head:opts.head||null, payee:opts.payee||null,
    status: opts.byOwner ? "accepted" : "pending",
    createdBy: opts.byOwner ? "owner" : "staff",
    createdAt: new Date().toISOString(),
    acceptedAt: opts.byOwner ? new Date().toISOString() : null,
    expenseId: null };
  if(type==="expense" && rec.status==="accepted"){ rec.expenseId = _postExpenseToBooks(rec); }
  DB.advances.push(rec); save(); return rec;
}
function acceptAdvance(id){
  const a=DB.advances.find(x=>x.id===id); if(!a || a.status!=="pending") return;
  a.status="accepted"; a.acceptedAt=new Date().toISOString();
  if(a.type==="expense"){ a.expenseId = _postExpenseToBooks(a); }
  save();
}
function rejectAdvance(id, reason){
  const a=DB.advances.find(x=>x.id===id); if(!a) return;
  a.status="rejected"; a.rejectReason=reason||""; a.rejectedAt=new Date().toISOString();
  save();
}
function _postExpenseToBooks(a){
  const expId=uid();
  DB.expenses.push({ id:expId, date:a.date||todayISO(), head:a.head||"Miscellaneous",
    payee:a.payee||"", amount:+a.amount||0, mode:"Cash", voucherNo:nextVoucherNo(),
    remarks:(a.note||"")+" (paid by "+(a.staffName||"staff")+" from advance)",
    staffUid:a.staffUid, fromAdvance:true });
  return expId;
}
function addAdvance(staffUid, staffName, amount, date, note, mode){
  return addAdvanceEntry("advance", staffUid, staffName, amount, date, note, {byOwner:true, mode});
}
function addReturn(staffUid, staffName, amount, date, note, mode){
  return addAdvanceEntry("return", staffUid, staffName, amount, date, note, {byOwner:true, mode});
}
function matterById(id){ return DB.matters.find(m=>m.id===id); }
function matterLabel(id){
  const m = matterById(id); if(!m) return "\u2014";
  return `${m.code} · ${m.client}`;
}
/* Folder title: "Chamber No. — Cause title — Diary/Case No." */
function matterFolderTitle(m){
  if(!m) return "Misc / Unassigned";
  const cause = m.parties || m.client || "Untitled";
  const num = m.caseNo || m.diaryNo || (m.kind==="query"?"query — no number yet":"");
  return [m.code, cause, num].filter(Boolean).join(" — ");
}

function newRegimeTax(income){
  // FY 2025-26 new regime slabs + 87A rebate (nil up to 12L taxable).
  // Slabs: 0-4L nil, 4-8L 5%, 8-12L 10%, 12-16L 15%, 16-20L 20%, 20-24L 25%, >24L 30%.
  if(income<=1200000) return 0; // rebate makes it nil
  let t=0;
  const sl=[[400000,0],[800000,0.05],[1200000,0.10],[1600000,0.15],[2000000,0.20],[2400000,0.25],[Infinity,0.30]];
  let prev=0;
  for(const [cap,rate] of sl){ if(income>prev){ t+=(Math.min(income,cap)-prev)*rate; prev=cap; } else break; }
  return Math.round(t*1.04); // + 4% cess
}
function taxSnapshot(declared){
  const tds = tdsFY();
  const tax = newRegimeTax(declared);
  const balance = tax - tds;     // positive = payable, negative = refund
  const safe = declared <= 1200000;
  let line2;
  if(tax===0){
    line2 = tds>0
      ? `<div style="font-size:14px;margin-top:8px">Estimated tax: <b>\u20B90</b> (within \u20B912L rebate). TDS of <b>${fmtINR(tds)}</b> already deducted is <b>refundable</b> on filing.</div>`
      : "";
  } else {
    line2 = `<div style="font-size:14px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap">
      <span>Estimated tax: <b>${fmtINR(tax)}</b></span>
      <span>Less TDS credit: <b>${fmtINR(tds)}</b></span>
      <span>${balance>=0?`Balance payable: <b style="color:var(--seal)">${fmtINR(balance)}</b>`:`Refund due: <b style="color:var(--green)">${fmtINR(-balance)}</b>`}</span>
    </div>`;
  }
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:15px">Declared income this FY: <b>${fmtINR(declared)}</b></div>
      <span class="tag ${safe?'active':'closed'}">${safe?'Within \u20B912L rebate \u2014 indicatively nil tax':'Above \u20B912L \u2014 tax likely'}</span>
    </div>
    ${line2}
    <div class="hint" style="margin-top:10px;margin-bottom:0">TDS credit is the tax already withheld by clients against your PAN (visible in Form 26AS / AIS). It is set off against your tax — and refunded if it exceeds your liability. Figures indicative; confirm with your CA.</div>`;
}

function setTdsMode(m){
  _tdsMode=m;

  document.getElementById("tdsBox").style.display = m==="yes"?"block":"none";

function setTdsRate(r){

function focusCustomRate(){ const f=document.getElementById("rcTdsRate"); if(f){ f.value=""; f.focus(); } }
function computeFee(){
  const gross=+document.getElementById("rcGross").value||0;
  let tds=0;
  if(_tdsMode==="yes"){
    const amt=+document.getElementById("rcTdsAmt").value||0;
    const rate=+document.getElementById("rcTdsRate").value||0;
    if(amt>0) tds=amt;
    else if(rate>0) tds=Math.round(gross*rate/100);
  }
  if(tds>gross) tds=gross;
  return {gross, tds, net:gross-tds};
}
function updFee(src){
  // if user typed a rate, clear amount and vice-versa (they're alternatives)
  if(src==="rate"){ const a=document.getElementById("rcTdsAmt"); if(a) a.value=""; }
  if(src==="amt"){ const r=document.getElementById("rcTdsRate"); if(r) r.value=""; }

  const p=document.getElementById("rcPreview");
  if(!p) return;
  if(gross<=0){ p.innerHTML="Enter the gross fee to see the breakdown."; return; }
  if(_tdsMode==="no" || tds<=0){
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-muted">No TDS</span>`;
  }else{
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-t">TDS ${fmtINR(tds)}</span> <span class="fp-sep">·</span> <span class="fp-n">Net ${fmtINR(net)}</span>`;
  }
}

// ---- Web Share API: share a document via the device's native share sheet ----
// Shares to WhatsApp, email, Telegram, AirDrop — whatever the device offers.
// Sends a composed message plus, if the document has a saved cloud link, that
// link to the actual PDF. Falls back to copying the text where share is absent.
var _webShareSupported = (typeof navigator!=="undefined") && !!navigator.share;
function _shareMsg(kind, obj){
  const s=DB.settings||{};
  const who=(s.chamberName&&s.chamberName.trim())||s.advName||"Chamber";
  const m = obj.matterId ? matterById(obj.matterId) : null;
  const caseBit = m && (m.caseNo||m.parties) ? ` in ${m.caseNo||m.parties}` : "";
  let lines=[];
  if(kind==="receipt"){
    lines.push(`Dear Sir/Madam,`);
    lines.push(`Please find your payment receipt${caseBit}:`);
    lines.push(`Receipt No. ${obj.no||""} dated ${fmtDate(obj.date)} for ${fmtINR(obj.amount)} towards ${obj.towards||"professional fees"}.`);
  } else if(kind==="invoice"){
    const grand=((obj.lines||[]).reduce((a,l)=>a+(+l.amount||0),0))+((obj.expenses||[]).reduce((a,l)=>a+(+l.amount||0),0));
    lines.push(`Dear Sir/Madam,`);
    lines.push(`Please find your invoice${caseBit}:`);
    lines.push(`Invoice No. ${obj.no||""} dated ${fmtDate(obj.date)} for ${fmtINR(grand)}.`);
  }
  if(obj.cloudUrl){ lines.push(`\nView / download: ${obj.cloudUrl}`); }
  lines.push(`\n— ${who}`);
  return lines.join("\n");
}
async function shareDoc(kind, id){
  const coll = kind==="receipt"?DB.receipts:kind==="invoice"?DB.invoices:null;
  if(!coll) return;
  const obj=coll.find(x=>x.id===id); if(!obj){ toast("Record not found.",true); return; }
  const s=DB.settings||{};
  const who=(s.chamberName&&s.chamberName.trim())||s.advName||"Chamber";
  const title=`${kind==="receipt"?"Receipt":"Invoice"} ${obj.no||""} — ${who}`;
  const text=_shareMsg(kind, obj);
  if(_webShareSupported){
    try{ await navigator.share({ title, text }); return; }
    catch(e){ if(e && e.name==="AbortError") return; /* fall through to copy */ }
  }
  // Fallback: copy the message to clipboard.
  try{
    await navigator.clipboard.writeText(text);
    toast("Sharing isn't available here — message copied. Paste it into WhatsApp or email.");
  }catch(e){
    // last-resort: show it
    openModal("Share "+kind, `<div class="hint" style="margin-bottom:8px">Copy this message and send it to your client:</div>
      <textarea class="in" rows="7" readonly onclick="this.select()" style="font-size:13px">${esc(text)}</textarea>
      <div class="btn-row" style="margin-top:12px"><button class="btn seal" onclick="closeModal()">Done</button></div>`);
  }
}
// Convenience: a Share button for a document, hidden gracefully if unsupported
// AND no clipboard (extremely rare). Almost always shows.
// ---- Smart defaults: remember client details across the chamber ----
// Builds an index of everyone billed before (from matters, receipts, invoices)
// so forms can auto-fill address/phone/email and offer name autocomplete.
function _knownClients(){
  const map={}; // lowercased name -> {name, addr, phone, email, towards, seen}
  const add=(name, addr, phone, email, towards, when)=>{
    name=(name||"").trim(); if(!name) return;
    const k=name.toLowerCase();
    const cur=map[k]||{name, addr:"", phone:"", email:"", towards:"", seen:""};
    // most recent non-empty value wins
    if(when && when>=(cur.seen||"")){
      if(addr) cur.addr=addr; if(phone) cur.phone=phone; if(email) cur.email=email;
      if(towards) cur.towards=towards; cur.seen=when; cur.name=name;
    } else {
      if(!cur.addr&&addr) cur.addr=addr; if(!cur.phone&&phone) cur.phone=phone;
      if(!cur.email&&email) cur.email=email; if(!cur.towards&&towards) cur.towards=towards;
    }
    map[k]=cur;
  };
  (DB.matters||[]).forEach(m=>add(m.client, m.clientAddr||m.address, m.clientPhone, m.clientEmail, "", m.opened||""));
  (DB.receipts||[]).forEach(r=>add(r.payer||r.from, r.payerLoc||r.clientAddr, r.clientPhone, r.clientEmail, r.towards, r.date||""));
  (DB.invoices||[]).forEach(v=>add(v.to, v.clientAddr, v.clientPhone, v.clientEmail, "", v.date||""));
  return map;
}
function _lookupClient(name){
  if(!name) return null;
  const map=_knownClients();
  return map[(name||"").trim().toLowerCase()]||null;
}
// Attach autocomplete + auto-fill to a name input. When a known client's name
// is entered, fills the linked address/phone/email inputs (if empty).
function _attachClientAutofill(nameId, fillIds){
  const el=document.getElementById(nameId); if(!el) return;
  // datalist for suggestions
  const map=_knownClients();
  const names=Object.keys(map).map(k=>map[k].name).sort();
  if(names.length){
    const dlId="dl_"+nameId;
    if(!document.getElementById(dlId)){
      const dl=document.createElement("datalist"); dl.id=dlId;
      dl.innerHTML=names.map(n=>`<option value="${esc(n)}"></option>`).join("");
      el.parentNode.appendChild(dl); el.setAttribute("list",dlId);
    }
  }
  const fill=()=>{
    const c=_lookupClient(el.value); if(!c) return;
    const set=(id,val)=>{ const f=id&&document.getElementById(id); if(f && !f.value && val) f.value=val; };
    set(fillIds.addr, c.addr); set(fillIds.phone, c.phone); set(fillIds.email, c.email);
    if(fillIds.towards){ const t=document.getElementById(fillIds.towards); if(t && (!t.value||t.value==="Professional fees") && c.towards) t.value=c.towards; }
  };
  el.addEventListener("change", fill);
  el.addEventListener("blur", fill);
}
// Detect small-screen / touch devices where window.print() is unreliable
// (notably iOS Safari and installed PWAs).
function _isMobilePrint(){
  try{
    const ua=navigator.userAgent||"";
    const iOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    const small=window.matchMedia && window.matchMedia("(max-width: 820px)").matches;
    const standalone=(window.navigator.standalone===true) || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    return iOS || small || standalone;
  }catch(e){ return false; }
}
// Open the just-rendered document (#receiptArea contents) as a clean, standalone
// page in a new tab, carrying the app's own styles. On mobile this is far more
// reliable than window.print() on the installed app: the user gets a normal page
// they can print or save via the browser's own controls (Share ▸ Print).
function _openPrintView(title){
  try{
    const docHTML=(document.getElementById("receiptArea")||{}).innerHTML||"";
    let styles="";
    document.querySelectorAll("style").forEach(s=>{ styles+=s.innerHTML+"\n"; });
    const w=window.open("", "_blank");
    if(!w){ // popup blocked — fall back to direct print
      window.print(); return;
    }
    w.document.open();
    w.document.write(
      "<!doctype html><html><head><meta charset='utf-8'>"+
      "<meta name='viewport' content='width=device-width, initial-scale=1'>"+
      "<title>"+String(title||"Document").replace(/[<>]/g,"")+"</title>"+
      "<style>"+styles+"</style>"+
      "<style>html,body{margin:0;background:#f2eee6}"+
      "body{padding:12px 0 84px;overflow-x:hidden}"+
      "#receiptArea{position:static !important;left:auto !important;top:auto !important}"+
      // On screen, scale the fixed A4 page down to fit the device width so it never
      // overflows horizontally. A wrapper keeps layout height correct after scaling.
      ".__pgwrap{width:100%;display:flex;justify-content:center}"+
      ".tpl{box-shadow:0 4px 24px rgba(0,0,0,.12);transform-origin:top center}"+
      "@media screen and (max-width:820px){"+
        ".__pgwrap{overflow:hidden}"+
        ".tpl{transform:scale(var(--pgscale,1))}"+
      "}"+
      "@media print{body{background:#fff;padding:0}.tpl{box-shadow:none;transform:none !important}.__pbar{display:none !important}.__pgwrap{display:block}}"+
      ".__pbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;"+
      "padding:12px;background:#fff;border-top:1px solid #e7e0d4;z-index:9}"+
      ".__pbar button{border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}"+
      ".__pbtn-print{background:#6b1f1f;color:#fff}.__pbtn-close{background:#eee;color:#333}</style>"+
      "</head><body><div class='__pgwrap'><div id='receiptArea'>"+docHTML+"</div></div>"+
      "<div class='__pbar'>"+
      "<button class='__pbtn-print' onclick='window.print()'>Print / Save as PDF</button>"+
      "<button class='__pbtn-close' onclick='window.close()'>Close</button>"+
      "</div>"+
      "<script>(function(){function fit(){try{var t=document.querySelector('.tpl');if(!t)return;"+
      "var avail=document.documentElement.clientWidth-16;var w=t.offsetWidth||794;"+
      "var s=avail<w?(avail/w):1;document.documentElement.style.setProperty('--pgscale',s);"+
      "var wrap=document.querySelector('.__pgwrap');if(wrap&&s<1){wrap.style.height=(t.offsetHeight*s)+'px';}"+
      "}catch(e){}}window.addEventListener('load',fit);window.addEventListener('resize',fit);setTimeout(fit,60);})();</"+"script>"+
      "</"+"body></"+"html>"
    );
    w.document.close();
  }catch(e){ try{ window.print(); }catch(_){} }
}
function _printAs(title){
  // On mobile / installed PWA, window.print() is unreliable (iOS Safari blocks or
  // hangs it). Route to a clean standalone page the user can reliably print/save.
  if(_isMobilePrint()){ _openPrintView(title); return; }
  const prev=document.title;
  document.title=title;
  const restore=()=>{ document.title=prev; window.removeEventListener("afterprint",restore); };
  window.addEventListener("afterprint",restore);
  window.print();
  // fallback restore in case afterprint doesn't fire
  setTimeout(restore, 3000);
}
/* Colour vs B&W print chooser for receipts & invoices.
   kind = "receipt" | "invoice"; obj = the record. */
function _docPrintChooser(kind, obj){
  const render=(bw)=>{

function _tplMonogram(s){

  const bw = !!(s && s.__bw);
  const gold = bw ? "#6e5320" : "#9a7b3f";
  try{ return chamberLogoSVG(initials, "#6b1f1f", gold); }catch(e){ return ""; }

// Centered masthead — mirrors the home screen: Chambers of / NAME / designation / court
// Build a COMPLETE chamber-document settings object (header + footer fields),
// resolving from the staff profile when on a staff device — so chamber documents
// (receipts, vouchers, invoices, salary slips) carry the SAME masthead and footer
// on the owner app and the staff app. On the owner device DB.settings is
// authoritative; on staff the chamber branding lives in window.__staff.profile.
function _chamberDocSettings(extra){
  const s=DB.settings||{};
  const staff=(typeof isStaffView==="function") && isStaffView();
  const prof=(window.__staff&&window.__staff.profile)||{};
  const pick=(k,pk)=>{ pk=pk||k;
    if(staff) return prof[pk]||s[k]||"";
    return s[k]||prof[pk]||"";
  };
  const out={
    chamberName: pick("chamberName"),
    advName: pick("advName"),
    designation: pick("designation"),
    court: pick("court"),
    address: pick("address"),
    mobile: pick("mobile") || (staff?"":(s.contact||"")),
    contact: pick("mobile") || (staff?"":(s.contact||"")),
    email: pick("email"),
    // signature stays OWNER-ONLY: staff-generated chamber docs never carry the owner's signature image
    signatureImg: staff ? "" : (s.signatureImg||""),
    aorCode: s.aorCode||prof.aorCode||"",
    barId: s.barId||s.enrolmentNo||prof.enrolmentNo||"",
    enrolmentNo: s.enrolmentNo||prof.enrolmentNo||""
  };
  if(extra) Object.assign(out, extra);
  return out;
}
function _tplMast(s){
  const hasChamber = s.chamberName && s.chamberName.trim();

}
// Footer — address (left, labelled) · phone + email (right, labelled)

// Date formatter -> DD.MM.YYYY
function _tplDate(d){
  try{
    const dt = d ? new Date(d) : null;
    if(dt && !isNaN(dt)){
      const p=n=>String(n).padStart(2,"0");
      return `${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}`;
    }
  }catch(e){}
  // fall back to fmtDate if not parseable
  try{ return fmtDate(d); }catch(e){ return esc(String(d||"")); }
}
// "Generated on DD.MM.YYYY, h:MM AM/PM"
function _tplStamp(iso){
  try{
    const dt = iso ? new Date(iso) : new Date();
    if(isNaN(dt)) return "";
    const p=n=>String(n).padStart(2,"0");
    let h=dt.getHours(); const ap=h>=12?"PM":"AM"; h=h%12; if(h===0) h=12;
    return `Generated on ${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}, ${h}:${p(dt.getMinutes())} ${ap}`;
  }catch(e){ return ""; }
}
// Resolve the display name + role of whoever generated a document.
// Owner -> chamber advName + designation; staff -> their profile name + "Staff".
function _tplGenerator(rec, s){
  const staffView = (function(){ try{ return isStaffView(); }catch(e){ return false; } })();
  if(staffView){
    let nm="";
    try{ nm = (window.__staff && window.__staff.profile && window.__staff.profile.name) || ""; }catch(e){}
    nm = nm || rec.staffName || rec.createdByName || "Staff";
    return { name: nm, role: "Chambers of "+(s.chamberName||s.advName||"the Chamber") };
  }
  return { name: s.advName||s.chamberName||"", role: s.designation||"Advocate" };
}

function voucherThreshold(){ return (DB.settings&&+DB.settings.voucherThreshold)||1000; }
function needsVoucher(amount){ return (+amount||0) >= voucherThreshold(); }
function _expenseFolderUrl(e){
  // case expense -> that case's folder (or chamber folder); else General Expenses subfolder
  if(e && e.matterId){
    const m=matterById(e.matterId);
    return (m&&m.folderUrl) || _chamberFolderUrl();
  }
  return (isStaffView()
      ? ((window.__staff&&window.__staff.profile&&window.__staff.profile.generalExpFolderUrl)||"")
      : (DB.settings&&DB.settings.generalExpFolderUrl)||"")
    || _chamberFolderUrl();
}
/* Where a document should be filed: by CASE when it belongs to one, else the
   category folder under the Unassigned area. Falls back to the chamber folder. */
function _docFolderUrl(kind, matterId){
  if(matterId){ const m=matterById(matterId); if(m&&m.folderUrl) return m.folderUrl; }
  const s=DB.settings||{};
  const cat = kind==="receipt" ? s.receiptFolderUrl
            : kind==="invoice" ? s.invoiceFolderUrl
            : kind==="voucher" ? s.generalExpFolderUrl
            : kind==="salary"  ? s.salaryFolderUrl : "";
  // Fall back to the last folder this category was actually filed into, then chamber.
  const remembered = (s._lastFolders && s._lastFolders[kind]) || "";
  return cat || remembered || s.unassignedFolderUrl || _chamberFolderUrl();
}
function _docFolderLabel(kind, matterId){
  if(matterId){ const m=matterById(matterId); if(m&&m.folderUrl) return "this case's folder"; }
  return ({receipt:"the Receipts folder",invoice:"the Invoices folder",voucher:"the Vouchers folder",salary:"the Salary Slips folder"}[kind]) || "the chamber folder";
}
// A short, exact "where this document belongs" line derived from the routing.
function _docDestLine(kind, matterId){
  if(matterId){ const m=matterById(matterId); if(m){ return `Case folder · <b>${esc(m.code||m.caseNo||"this case")}</b>`; } }
  const fy=fyLabel(DB.settings.fyStart);
  const cat={receipt:"Receipts",invoice:"Invoices",voucher:"Vouchers",salary:"Salary Slips"}[kind]||"Chamber";
  return `${esc(cat)} ▸ <b>FY ${esc(fy)}</b> sub-folder`;
}
// Remember the folder a category was last filed into, so one-tap open keeps working.
function _rememberFolder(kind, url){
  if(!url || !/^https?:\/\//i.test(url)) return;

}

// Read the auto-fetched court-updates.json and present it as a tight,
// glanceable table grouped by day → court (coram shown once per court) → matter.
// Tolerates BOTH fetcher schemas: the original {by_date:{...}} and the v2
// pipeline {days:{date:{lists,matches}}}. Same-origin fetch; silent if absent.
function _normCourtUpdates(data){
  const out={when:"", days:[]};
  if(!data) return out;
  out.when=data.generated_at?new Date(data.generated_at).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const src=data.by_date||data.days||{};
  Object.keys(src).sort().forEach(d=>{
    const day=src[d]||{};
    const suppOut = (day.has_supplementary!==undefined)
      ? !!day.has_supplementary
      : (day.lists||[]).some(l=>l.supplementary);
    const matches=(day.matches||[]).map(m=>({
      court:m.court||"—",
      coram:m.coram||"",
      item:m.item||"—",
      supp:(m.is_supplementary!==undefined)?!!m.is_supplementary:!!m.supplementary,
      title:m.text || [m.case, [m.petitioner,m.respondent].filter(Boolean).join(" v. ")].filter(Boolean).join(" — "),
      tot:m.court_total||"", fresh:m.court_fresh||""
    }));
    out.days.push({date:d, suppOut, matches});
  });
  return out;
}

// Format a "HH:MM" time as a friendly 12-hour string, e.g. "14:00" -> "2:00 PM".
function _cl12h(t){
  if(!t) return "";
  const m=/^(\d{1,2}):(\d{2})/.exec(t); if(!m) return t;
  let h=parseInt(m[1],10); const mi=m[2]; const ap=h>=12?"PM":"AM";
  h=h%12; if(h===0)h=12;
  return h+":"+mi+" "+ap;
}
function printCauseList(iso, includeMeetings, opts){
  opts=opts||{};
  iso=iso||todayISO();
  const staff=isStaffView();
  const rows=[];
  (DB.matters||[]).forEach(m=>{
    if(isVoided(m)) return;
    const de=(m.dates||[]).find(d=>d.date===iso);
    if(m.nextDate===iso || de){
      const d=de||{};
      rows.push({
        forum:m.court||"", court:d.courtNo||"", item:d.itemNo||"",
        timingMode:d.timingMode||"default", courtFrom:d.courtFrom||"", courtTo:d.courtTo||"",
        specialTime:d.specialTime||"", __defaultTiming:_courtDefaultTiming(m.court).replace(/ (AM|PM)/g,"").replace(" – ","–"),
        coram:d.coram||"", caseNo:m.caseNo||"", diaryNo:m.diaryNo||"", title:m.parties||m.client||"", team:d.team||"",
        mainTotal:d.mainTotal||"", mainFresh:d.mainFresh||"", suppTotal:d.suppTotal||"",
        suppFresh:d.suppFresh||"", seqPos:d.seqPos||""
      });
    }
  });
  // Grouping key + label per row.
  // Supreme Court matters group by courtroom ("Court No. 5"); matters before any
  // other forum (High Court, tribunal, arbitration, etc.) group under that forum's
  // name. This keeps the usual SC-heavy list tidy while cleanly separating the
  // occasional matter listed elsewhere.
  const isSC=(f)=>/supreme court/i.test(f||"");
  function _grpKey(r){
    if(isSC(r.forum) || !r.forum){
      return r.court ? ("SC#"+String(r.court).padStart(4,"0")) : "SC#zzzz";
    }
    return "F#"+(r.forum||"");
  }
  function _grpLabel(r){
    if(isSC(r.forum) || !r.forum){
      return r.court ? ("CR. No. "+r.court) : "Supreme Court — (court no. to be updated)";
    }
    return r.forum;
  }
  rows.sort((a,b)=>{
    const ka=_grpKey(a), kb=_grpKey(b);
    // SC groups (key starts "SC#") come before other forums ("F#")
    const sa=ka[0]==="S"?0:1, sb=kb[0]==="S"?0:1;
    if(sa!==sb) return sa-sb;
    if(ka!==kb) return ka<kb?-1:1;
    return parseInt(a.item||"9999",10)-parseInt(b.item||"9999",10);
  });
  const dstr=new Date(iso+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const anyTeam=rows.some(r=>r.team);
  const anySeq=rows.some(r=>r.mainTotal||r.suppTotal||r.seqPos);
  // Court-level figures live in the court header: Coram, Total Matters (Main & Supp),
  // and Sequence (auto-filled if entered, else blank to handwrite at print).
  function _grpCoram(grpRows){ for(const r of grpRows){ if(r.coram) return r.coram; } return ""; }
  function _grpTotals(grpRows){
    let mt="",mf="",st="",sf="";
    grpRows.forEach(r=>{ if(!mt&&r.mainTotal)mt=r.mainTotal; if(!mf&&r.mainFresh)mf=r.mainFresh; if(!st&&r.suppTotal)st=r.suppTotal; if(!sf&&r.suppFresh)sf=r.suppFresh; });
    if(!mt&&!st) return "";
    const total=(parseInt(mt||"0",10)||0)+(parseInt(st||"0",10)||0);
    const parts=[];
    if(total) parts.push(`<span class="cl-sum-total">Total ${total}</span>`);
    if(mt) parts.push(`Main ${esc(mt)}${mf?` <span class="cl-sum-fresh">(${esc(mf)} fresh)</span>`:""}`);
    if(st) parts.push(`Supp. ${esc(st)}${sf?` <span class="cl-sum-fresh">(${esc(sf)} fresh)</span>`:""}`);
    return parts.join('<span class="cl-sum-sep">·</span>');
  }
  function _grpSeq(grpRows){ for(const r of grpRows){ if(r.seqPos) return r.seqPos; } return ""; }
  // Court sitting timing for the band: prefer an explicit custom window, else the
  // forum's default sitting window. (Matter-specific fixed times stay on the row.)
  function _grpTiming(grpRows){
    for(const r of grpRows){
      if(r.timingMode==="custom" && (r.courtFrom||r.courtTo)){
        return (r.courtFrom?_cl12h(r.courtFrom):"")+(r.courtTo?" – "+_cl12h(r.courtTo):"");
      }
    }
    for(const r of grpRows){ if(r.__defaultTiming) return r.__defaultTiming; }
    return "";
  }
  let tbl="";
  if(rows.length){
    const groups=[]; const gmap={};
    rows.forEach(r=>{ const k=_grpKey(r); if(!gmap[k]){ gmap[k]={key:k,label:_grpLabel(r),rows:[]}; groups.push(gmap[k]); } gmap[k].rows.push(r); });
    const body=groups.map(g=>{
      const coram=_grpCoram(g.rows);
      const totals=_grpTotals(g.rows);
      const timing=_grpTiming(g.rows);
      // Court band: left = Court · Coram (bigger) · Timings ; right = matters breakup
      // (in the Matters & Sequence column, once at the top of the court's block).
      const leftBits=[`<span class="cl-bd-court">${esc(g.label)}</span>`];
      if(coram) leftBits.push(`<span class="cl-bd-coram">${esc(coram)}</span>`);
      if(timing) leftBits.push(`<span class="cl-bd-time">${esc(timing)}</span>`);
      const band=`<tr class="cl-band">
        <td colspan="3"><div class="cl-bd">${leftBits.join('<span class="cl-bd-sep">·</span>')}</div></td>
        <td class="cl-c-seq cl-band-seq">${totals?`<div class="cl-bd-tot">${totals}</div>`:""}</td>
      </tr>`;
      const rws=g.rows.map(r=>{
        const subBits=[];
        if(anyTeam && r.team) subBits.push(`<span class="cl-teamline">Appearing: ${esc(r.team)}</span>`);
        const fixed = r.specialTime ? `<span class="cl-fixed">⏱ ${esc(_cl12h(r.specialTime))}</span>` : "";
        const numCell = `${r.diaryNo?`<div class="cl-diary">D.${esc(r.diaryNo)}</div>`:""}<div class="cl-caseno">${esc(r.caseNo||"—")}</div>`;
        const seqCell = r.seqPos ? `<span class="cl-seqval">${esc(r.seqPos)}</span>` : "";
        const itemDisp = (r.court && r.item) ? (esc(r.court)+"/"+esc(r.item))
                        : (r.item ? esc(r.item) : (r.court ? esc(r.court)+"/—" : "—"));
        return `<tr>
          <td class="cl-c-item">${itemDisp}</td>
          <td class="cl-c-num">${numCell}</td>
          <td class="cl-c-case"><div class="cl-title2">${esc(r.title||"—")}</div>${fixed}${subBits.length?`<div class="cl-subline">${subBits.join('<span class="cl-subdot">·</span>')}</div>`:""}</td>
          <td class="cl-c-seq">${seqCell}</td>
        </tr>`;
      }).join("");
      return band+rws;
    }).join("");
    tbl=`<table class="cl-tbl">
      <thead><tr>
        <th class="cl-c-item">Court / Item</th>
        <th class="cl-c-num">Diary / Case No.</th>
        <th class="cl-c-case">Cause Title</th>
        <th class="cl-c-seq">Matters &amp; Sequence</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  } else {
    tbl=`<div class="lst-empty">No cases listed for this day.</div>`;
  }

  // Meetings & Conferences — grouped by date/day, then time-wise.
  // Format per line: time – cause title/subject – with whom (no location for case meetings).
  let meetingsHtml="";
  if(includeMeetings){
    const from=todayISO(), to=iso;
    let mtgs=_allApptsForMe().filter(a=>{
      if(staff && a.kind==="personal") return false;
      return a.date>=from && a.date<=to;
    }).sort((a,b)=>((a.date||"")+(a.time||"")).localeCompare((b.date||"")+(b.time||"")));
    if(mtgs.length){
      // group by date
      const byDate={};
      mtgs.forEach(a=>{ (byDate[a.date]||(byDate[a.date]=[])).push(a); });
      const blocks=Object.keys(byDate).sort().map(dt=>{
        const dd=new Date(dt+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
        const lines=byDate[dt].map(a=>{
          const mt=a.matterId?matterById(a.matterId):null;
          const subject = mt? (mt.parties||mt.client||mt.code) : (a.title||"Meeting");
          const withWhom = a.title && mt ? a.title : (a.with||a.title&&!mt?"":"");
          const parts=[`<span class="cl-mtime">${a.time?esc(a.time):"—"}</span>`, `<b>${esc(subject)}</b>`];
          const w = a.withWhom || (mt? (a.title||"") : "");
          if(w && w!==subject) parts.push(esc(w));
          return `<div class="cl-mline">${parts.join(' <span class="cl-dash">–</span> ')}</div>`;
        }).join("");
        return `<div class="cl-mday"><div class="cl-mday-h">${dd}</div>${lines}</div>`;
      }).join("");
      meetingsHtml=`<div class="cl-mtg"><div class="cl-mtg-h">Meetings &amp; Conferences</div>${blocks}</div>`;
    }
  }
  const area=document.getElementById("receiptArea");
  area.innerHTML=`<div class="tpl-list cause-list${opts.bw?" bw":""}">${_causeListHeader("Cause List · "+dstr)}${tbl}${meetingsHtml}</div>`;
  setTimeout(()=>_printAs("Cause List "+iso),150);
}

    </div>
    <div class="card">
      <div class="card-head"><div><h2>Actions</h2></div></div>
      <div class="btn-row" style="flex-wrap:wrap;gap:8px">
        <button class="btn seal sm" onclick="openSalarySlip('${p.id}')">Generate salary slip</button>
        <button class="btn ghost sm" onclick="openSalaryAdvance('${p.id}')">Add money borrowed</button>
        <button class="btn ghost sm" onclick="openRecordRepayment('${p.id}')">Record repayment</button>

      ${ledgerHtml}

function _slToggleAdv(){ const on=(document.getElementById("slAdvChk")||{}).checked; const r=document.getElementById("slAdvRow"); if(r) r.style.display=on?"block":"none"; }
function _slToggleLeave(){ const on=(document.getElementById("slLeaveChk")||{}).checked; const r=document.getElementById("slLeaveRow"); if(r) r.style.display=on?"block":"none"; if(on) _slUpdateLeaveCalc(); }
function _slLeaveMode(){
  const mode=(document.querySelector('input[name="slLeaveMode"]:checked')||{}).value;
  const d=document.getElementById("slLeaveDays"), a=document.getElementById("slLeaveAmt");
  if(d&&a){ d.style.display=(mode==="days")?"block":"none"; a.style.display=(mode==="amount")?"block":"none"; }
  _slUpdateLeaveCalc();
}
function _slParsePeriod(){
  const v=(document.getElementById("slMonth")||{}).value||"";
  const [y,m]=v.split("-").map(x=>parseInt(x,10));
  return {y,m}; // m 1-12
}
function _slUpdateLeaveCalc(){
  const el=document.getElementById("slLeaveCalc"); if(!el) return;
  const basic=parseFloat((document.getElementById("slBasic")||{}).value)||0;
  const days=parseFloat((document.getElementById("slLeaveDaysVal")||{}).value)||0;
  const {y,m}=_slParsePeriod();
  const dim=(y&&m)?_daysInMonth(y,m):30;
  if(days>0 && basic>0){ const perDay=basic/dim; el.textContent=`${days} day(s) × ${fmtINR(Math.round(perDay))}/day (basic ÷ ${dim}) = ${fmtINR(Math.round(perDay*days))}`; }
  else el.textContent=`Per-day = basic ÷ ${dim} days in month.`;
}
function doGenerateSlip(personId){
  const p=rosterById(personId); if(!p) return;
  const {y,m}=_slParsePeriod();
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const period=(y&&m)?`${months[m-1]} ${y}`:"";
  const basic=parseFloat((document.getElementById("slBasic")||{}).value)||0;
  if(basic<=0){ toast("Enter the basic pay.",true); return; }
  const payDate=(document.getElementById("slPayDate")||{}).value||todayISO();
  const payMode=(document.getElementById("slPayMode")||{}).value||"";
  const daysPresentRaw=(document.getElementById("slDaysPresent")||{}).value;
  const daysPresent = daysPresentRaw!=="" ? parseInt(daysPresentRaw,10) : null;
  const dim=(y&&m)?_daysInMonth(y,m):null;
  const deductions=[];
  let recoverAmt=0;
  // advance recovery
  if((document.getElementById("slAdvChk")||{}).checked){
    recoverAmt=parseFloat((document.getElementById("slAdvAmt")||{}).value)||0;
    const bal=salaryAdvBalance(personId);
    if(recoverAmt>bal) recoverAmt=bal;
    if(recoverAmt>0) deductions.push({label:"Advance recovered", amount:recoverAmt, sub:"as agreed"});
  }
  // leave
  if((document.getElementById("slLeaveChk")||{}).checked){
    const mode=(document.querySelector('input[name="slLeaveMode"]:checked')||{}).value;
    if(mode==="days"){
      const days=parseFloat((document.getElementById("slLeaveDaysVal")||{}).value)||0;
      if(days>0 && dim){ const amt=Math.round((basic/dim)*days); deductions.push({label:"Leave deduction", amount:amt, sub:days+" day(s)"}); }
    }else{
      const amt=parseFloat((document.getElementById("slLeaveAmtVal")||{}).value)||0;
      if(amt>0) deductions.push({label:"Leave deduction", amount:amt});
    }
  }
  // other
  const oLabel=(document.getElementById("slOtherLabel")||{}).value.trim();
  const oAmt=parseFloat((document.getElementById("slOtherAmt")||{}).value)||0;
  if(oLabel && oAmt>0) deductions.push({label:oLabel, amount:oAmt});

  const totalDed=deductions.reduce((t,d)=>t+(+d.amount||0),0);
  const net=basic-totalDed;
  const g=_tplGenerator({}, DB.settings);
  const slip={ id:uid(), no:nextSalarySlipNo(), personId, name:p.name, period, payDate, payMode,
    basic, deductions, net, daysPresent, daysInMonth:dim,
    genAt:new Date().toISOString(), genBy:g.name };
  DB.salarySlips.push(slip);
  // post the recovery to the salary-advance ledger (marks it recovered)
  if(recoverAmt>0) recordSalaryRecovery(personId, recoverAmt, payDate, "Recovered via "+slip.no, slip.id);
  logActivity("salary", `Salary slip ${slip.no} — ${p.name} (${period}), net ${fmtINR(net)}`, {ownerOnly:true, refId:slip.id});
  save();
  closeModal();
  if(document.getElementById("panel-persondetail").classList.contains("active")) renderPersonDetail();
  else renderSalary();
  printSalarySlip(slip.id);
}

      <div class="tpl-row-l"><b>${esc(t.name)}</b><div class="hint">${t.lines.length} line${t.lines.length>1?"s":""}</div></div>
      <div><button class="btn seal sm" onclick="_loadInvTemplate(${i})">Load</button>
        <button class="row-act" onclick="_delInvTemplate(${i})">Delete</button></div>
    </div>`).join("");
  openModal("Invoice templates", `
    <div class="hint" style="margin-bottom:10px">Load a saved set of fee lines into this invoice. You can still edit amounts after.</div>
    ${list||`<div class="empty">No templates yet.</div>`}
    <div style="border-top:1px solid var(--line);margin:14px 0"></div>
    <label class="fld">Save current invoice lines as a template</label>
    <input class="in" id="itName" placeholder="Template name" style="margin-top:6px">
    <div class="btn-row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button>
      <button class="btn seal" onclick="_saveInvTemplate()">Save current lines</button></div>`);
}
function _loadInvTemplate(i){
  const t=_invTemplates()[i]; if(!t) return;
  _invLines=t.lines.map(l=>({desc:l.desc,amount:l.amount||""}));
  closeModal(); drawInvLines(); recalcInvTotal(); toast("Loaded \""+t.name+"\".");
}
function _saveInvTemplate(){
  const name=(document.getElementById("itName")||{}).value.trim();
  if(!name){ toast("Give the template a name.",true); return; }
  const lines=_invLines.filter(l=>(l.desc||"").trim()).map(l=>({desc:l.desc,amount:""}));
  if(!lines.length){ toast("Add at least one fee line first.",true); return; }
  _invTemplates().push({name, lines}); save(); _invTemplateMenu(); toast("Template saved.");
}
function _delInvTemplate(i){
  const t=_invTemplates()[i]; if(!t) return;
  if(!confirm("Delete template \""+t.name+"\"?")) return;
  _invTemplates().splice(i,1); save(); _invTemplateMenu();
}
function addInvLine(){ _invLines.push({desc:"",amount:""}); drawInvLines(); }
function rmInvLine(i){ _invLines.splice(i,1); if(!_invLines.length)_invLines=[{desc:"",amount:""}]; drawInvLines(); recalcInvTotal(); }
function updInvLine(i,k,v){ _invLines[i][k]=v; if(k==="amount")recalcInvTotal(); }
function addInvExpense(){ _invExpenses.push({desc:"",amount:""}); drawInvExpenses(); }
function rmInvExp(i){ _invExpenses.splice(i,1); drawInvExpenses(); recalcInvTotal(); }
function updInvExp(i,k,v){ _invExpenses[i][k]=v; if(k==="amount")recalcInvTotal(); }
function recalcInvTotal(){
  const fees=_invLines.reduce((s,l)=>s+(+l.amount||0),0);
  const exp=_invExpenses.reduce((s,l)=>s+(+l.amount||0),0);
  const note=document.getElementById("ivTotalNote");
  if(note) note.innerHTML=`Fees ${fmtINR(fees)}${exp?` + Expenses ${fmtINR(exp)}`:""} &nbsp;=&nbsp; <b>Total ${fmtINR(fees+exp)}</b>`;
}
function saveAndPrintInvoice(){
  const matterId=document.getElementById("ivMatter").value;
  const date=document.getElementById("ivDate").value;
  const toEl=document.getElementById("ivTo");
  const billTo=toEl ? toEl.value.trim() : "";
  // Matter is OPTIONAL. Without one, this is a general invoice not connected to any
  // case — require a free-text "Bill to" party instead.
  if(!matterId && !billTo){ toast("Select a matter, or enter who to bill.",true); return; }
  if(!date){ toast("Pick a date.",true); return; }
  const lines=_invLines.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim()||"Professional fees",amount:+l.amount||0}));
  const expenses=_invExpenses.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim(),amount:+l.amount||0}));
  if(!lines.length || lines.reduce((s,l)=>s+l.amount,0)<=0){ toast("Enter at least one fee amount.",true); return; }
  const dueMode=document.getElementById("ivDueMode").value;
  const dueDays=+document.getElementById("ivDueDays").value||0;
  const bankSel=document.getElementById("ivBank");
  const upiSel=document.getElementById("ivUpi");
  const qrChk=document.getElementById("ivQr");
  const inv={ id:uid(), no:nextInvoiceNo(), date, matterId,
    style:document.getElementById("ivStyle").value, dueMode, due:dueDays,
    bankId: bankSel? bankSel.value : (defaultBank()?defaultBank().id:""),
    upiId: upiSel? upiSel.value : (defaultUpi()?defaultUpi().id:""),
    showQr: qrChk? qrChk.checked : false,
    lines, expenses, notes:document.getElementById("ivNotes").value.trim(), status:"raised" };
  if(!matterId){
    inv.noMatter=true; inv.to=billTo;
    inv.toAddr=(document.getElementById("ivToAddr")||{}).value||"";
    inv.toPhone=(document.getElementById("ivToPhone")||{}).value||"";
    inv.toEmail=(document.getElementById("ivToEmail")||{}).value||"";
  }
  DB.invoices.push(inv);
  logActivity("invoice", `Invoice ${inv.no||""} — ${fmtINR(inv.total||inv.amount||0)}`, {ownerOnly:true, refId:inv.id});
  save();
  printInvoice(inv);
  _invLines=[{desc:"Professional fees",amount:""}]; _invExpenses=[];
  save(); renderInvoice(); markPanel("invoice");
  toast(`Invoice ${inv.no} saved.`);
}
function _ivMatterChange(){
  const sel=document.getElementById("ivMatter");
  const row=document.getElementById("ivBillToRow");
  if(!sel||!row) return;
  row.style.display = sel.value ? "none" : "";
}
// Toggle the invoice between "against a case" and "general (no case)".
function _ivSetKind(kind){
  document.querySelectorAll("#ivKindSeg .seg-btn").forEach(b=>b.classList.toggle("on", b.dataset.kind===kind));
  const wrap=document.getElementById("ivMatterWrap");
  const row=document.getElementById("ivBillToRow");
  const sel=document.getElementById("ivMatter");
  if(kind==="general"){
    if(sel) sel.value="";
    if(wrap) wrap.style.display="none";
    if(row) row.style.display="";
  } else {
    if(wrap) wrap.style.display="";
    if(row) row.style.display="none";
  }
}
function onDueModeChange(){
  const mode=document.getElementById("ivDueMode").value;
  document.getElementById("ivDueDays").style.display = mode==="days" ? "block" : "none";
}
function reprintInvoice(id){ const inv=DB.invoices.find(x=>x.id===id); if(inv) _docPrintChooser("invoice", inv); }
function delInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  const latest=_isLatestInSeries("invoices",inv);
  const warn = latest
    ? `Invoice <b>${esc(inv.no)}</b> is the latest in the series. Deleting it frees the number ${esc(inv.no)} to be used again — right for a test or mistaken entry.`
    : `Invoice <b>${esc(inv.no)}</b> is not the latest. Deleting leaves a permanent gap at ${esc(inv.no)}. If this invoice was actually issued to a client, use <b>Void</b> instead so the number stays on record.`;
  openModal("Delete invoice?", `
    <div class="hint">${warn}</div>
    <div class="note">Deleted items are recoverable from More → Backup, if needed.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${latest?"":`<button class="btn ghost" onclick="closeModal();voidInvoice('${id}')">Void instead</button>`}
      <button class="btn seal" onclick="doDelInvoice('${id}')">Delete</button>
    </div>`);
}
function _refreshInvoiceViews(){
  const ledgerActive=document.getElementById("panel-invoiceledger") && document.getElementById("panel-invoiceledger").classList.contains("active");
  if(ledgerActive) renderInvoiceLedger();
  else renderInvoice();
}
function doDelInvoice(id){
  const reused=softDelete("invoices",id);
  const snap=window._lastTrashId;
  closeModal(); _refreshInvoiceViews();
  toastUndo(reused?"Invoice deleted — number freed.":"Invoice deleted.", ()=>{ _undoSoftDelete("invoices",snap); _refreshInvoiceViews&&_refreshInvoiceViews(); });
}
function voidInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  openModal("Void invoice "+esc(inv.no), `
    <div class="hint">The invoice stays on record as <b>cancelled</b> and its number is never reused. Add a short reason (shown in brackets).</div>
    <label class="fld">Reason</label>
    <input class="in" id="voidReason" placeholder="e.g. wrong amount, duplicate" maxlength="60">
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doVoidInvoice('${id}')">Void invoice</button>
    </div>`);
}
function doVoidInvoice(id){
  const reason=(document.getElementById("voidReason")||{}).value||"";
  voidRecord("invoices",id,reason,"void");
  closeModal(); _refreshInvoiceViews(); toast("Invoice voided.");
}

function printInvoice(inv, opts){
  opts = opts || {};
  const s = _chamberDocSettings({__bw: !!opts.bw});
  const m=matterById(inv.matterId)||{};
  const fees=(inv.lines||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const exp=(inv.expenses||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const grand=fees+exp;
  let rows="";
  if(inv.style==="itemised"){
    (inv.lines||[]).forEach((l,i)=>{ rows+=`<tr><td>${i+1}</td><td>${esc(l.desc)}</td><td class="r">${fmtINR(l.amount)}</td></tr>`; });
  }else{
    const desc = inv.notes || "Professional fees for legal services rendered in the matter";
    rows += `<tr><td>1</td><td>${esc(desc)}</td><td class="r">${fmtINR(fees)}</td></tr>`;
  }
  (inv.expenses||[]).forEach((l,i)=>{ rows+=`<tr><td>${(inv.style==="itemised"?((inv.lines||[]).length+i+1):(i+2))}</td><td>${esc(l.desc)} <span style="color:var(--tpx-muted)">(expense)</span></td><td class="r">${fmtINR(l.amount)}</td></tr>`; });

  // Payable-within line (only when a due term is set)
  let payableText="";
  if(inv.dueMode==="days" || (inv.dueMode===undefined && inv.due)) payableText = `Payable within ${esc(inv.due)} day(s) of receipt.`;
  else if(inv.dueMode==="onreceipt") payableText = "Payable on receipt.";

  // bank account (independent of UPI)
  let bk = null;
  if(inv.bankId!==undefined){ bk = inv.bankId ? bankById(inv.bankId) : null; }
  else { bk = defaultBank(); }
  const hasBank = bk && (bk.name||bk.acc||bk.ifsc||bk.branch);
  // UPI (independent of bank)
  let up = null;
  if(inv.upiId!==undefined){ up = inv.upiId ? upiById(inv.upiId) : null; }
  else { up = defaultUpi(); }
  const hasUpi = up && up.vpa;
  const pan = s.pan||"";
  let qrSvg="";
  if(hasUpi && inv.showQr!==false){
    const payee=encodeURIComponent(s.chamberName||s.advName||"");
    const amt=encodeURIComponent(grand.toFixed(2));
    const note=encodeURIComponent("Invoice "+(inv.no||""));
    const upiStr=`upi://pay?pa=${encodeURIComponent(up.vpa)}&pn=${payee}&am=${amt}&cu=INR&tn=${note}`;
    try{ qrSvg = QR.svg(upiStr, 92); }catch(e){ qrSvg=""; }
  }
  const payRows=[
    hasBank&&bk.name?`<div class="row"><span class="k">Account name</span><b>${esc(bk.name)}</b></div>`:"",
    hasBank&&bk.branch?`<div class="row"><span class="k">Bank &amp; branch</span><b>${esc(bk.branch)}</b></div>`:"",
    hasBank&&bk.acc?`<div class="row"><span class="k">Account no.</span><b>${esc(bk.acc)}</b></div>`:"",
    hasBank&&bk.ifsc?`<div class="row"><span class="k">IFSC</span><b>${esc(bk.ifsc)}</b></div>`:"",
    hasUpi?`<div class="row"><span class="k">UPI ID</span><b>${esc(up.vpa)}</b></div>`:"",
    pan?`<div class="row"><span class="k">PAN</span><b>${esc(pan)}</b></div>`:""
  ].filter(Boolean).join("");
  const instr = `${payableText?esc(payableText)+" ":""}Please quote the invoice number with your payment. ${s.rcmNote?esc(s.rcmNote)+" ":"Legal services are exempt/under reverse charge; no GST is charged on this memo of fees. "}This is a bill of costs and not a receipt — a separate receipt will be issued upon payment.`;
  const noteBlock = (payRows||qrSvg) ? `<div class="tpl-noteblk">
        <div class="h">Payment Details</div>
        <div class="paygrid">
          ${payRows?`<div class="pcol">${payRows}</div>`:""}
          ${qrSvg?`<div class="qr"><div class="cap">Scan &amp; Pay</div>${qrSvg}</div>`:""}
        </div>
        <div class="instr">${instr}</div>
      </div>` : `<div class="tpl-noteblk"><div class="h">Payment Details</div><div class="instr">${instr}</div></div>`;

  // Bill To — the client, or the referring advocate when billed to the referrer,
  // or the senior advocate for a retainer, or a free-text party for a general
  // (no-matter) invoice.
  const isRetainer = inv.retainer;
  const isGeneral = inv.noMatter || isRetainer || !inv.matterId;
  const toRef = m.invoiceReferrer && (m.refName||m.refAddress||m.refContact);
  const billName = isGeneral ? (inv.to||inv.retainerSenior||"—") : (toRef ? (m.refName||"Referring Advocate") : (m.client||"—"));
  const billAddr = isGeneral ? inv.toAddr : (toRef ? m.refAddress : (m.address||m.clientAddr));
  const billPhone = isGeneral ? (inv.toPhone||"") : (toRef ? m.refContact : (m.contact||m.clientPhone));
  const billEmail = isGeneral ? (inv.toEmail||"") : (toRef ? m.refEmail : m.email);
  const billMeta=[billAddr, billPhone, billEmail].filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join("");
  const billBlock = `<div class="tpl-col">
        <div class="tpl-lbl">${isRetainer?"Bill To (Senior Advocate)":(toRef?"Bill To (Referring Advocate)":"Bill To")}</div>
        <div class="tpl-bigname">${esc(billName)}</div>
        ${billMeta?`<div class="tpl-meta">${billMeta}</div>`:""}
      </div>`;
  const caseBlock = isGeneral ? "" : _tplCaseBlock(m);

  document.getElementById("receiptArea").innerHTML=`
   <div class="tpl${opts.bw?" bw":""}">
     ${_tplMast(s)}
     <div class="tpl-dband"><div class="tpl-dtitle">Memorandum of Fees</div></div>
     <div class="tpl-body">
       ${_tplNoRow("Invoice No.", inv.no, _tplDate(inv.date))}
       <div class="tpl-cols${caseBlock?"":" solo"}">
         ${billBlock}
         ${caseBlock}
       </div>
       <table class="tpl-tbl">
         <thead><tr><th style="width:42px">Sr.</th><th>Particulars</th><th class="r" style="width:130px">Amount (₹)</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>
       <div class="tpl-tot"><table>
         <tr><td class="k">Professional fees</td><td class="r">${fmtINR(fees)}</td></tr>
         ${exp?`<tr><td class="k">Expenses / out-of-pocket</td><td class="r">${fmtINR(exp)}</td></tr>`:""}
         <tr class="grand"><td class="k">Total Amount Due</td><td class="r">${fmtINR(grand)}</td></tr>
       </table></div>
       <div class="tpl-words">(Rupees ${esc(numToWords(grand))} only)</div>
       ${payableText?`<div class="tpl-payable">${esc(payableText)}</div>`:""}
       ${noteBlock}
       <div class="tpl-signrow">${_verifyQRBlock("Invoice", inv.no, inv.date, grand)}${_tplSign(s)}</div>
     </div>
     ${_tplFoot(s)}
   </div>`;
  if(!opts.noPrint) setTimeout(()=>_printAs("ASDC Invoice number "+String(inv.no||"").replace(/[\/\\]/g,"-")),150);
}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

      setupPositionProbePattern(_moduleCount - 7, 0);

      }

      if (_dataCache == null) {

      }

    var setupPositionProbePattern = function(row, col) {

        for (var c = -1; c <= 7; c += 1) {

          } else {

          throw 'length over';
        }

        while (_bitLength + length >= 8) {
          _out.writeByte(0xff & ( (data << _bitLength) | _bitBuffer) );
          length -= (8 - _bitLength);
          data >>>= (8 - _bitLength);
          _bitBuffer = 0;
          _bitLength = 0;
        }

        _bitBuffer = (data << _bitLength) | _bitBuffer;
        _bitLength = _bitLength + length;
      };

      _this.flush = function() {
        if (_bitLength > 0) {
          _out.writeByte(_bitBuffer);
        }
      };

      return _this;
    };

    var getLZWRaster = function(lzwMinCodeSize) {

      var clearCode = 1 << lzwMinCodeSize;
      var endCode = (1 << lzwMinCodeSize) + 1;
      var bitLength = lzwMinCodeSize + 1;

      // Setup LZWTable
      var table = lzwTable();

      for (var i = 0; i < clearCode; i += 1) {
        table.add(String.fromCharCode(i) );
      }
      table.add(String.fromCharCode(clearCode) );
      table.add(String.fromCharCode(endCode) );

      var byteOut = byteArrayOutputStream();
      var bitOut = bitOutputStream(byteOut);

      // clear code
      bitOut.write(clearCode, bitLength);

      var dataIndex = 0;

      var s = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

      while (dataIndex < _data.length) {

        var c = String.fromCharCode(_data[dataIndex]);
        dataIndex += 1;

        if (table.contains(s + c) ) {

          s = s + c;

        } else {

          bitOut.write(table.indexOf(s), bitLength);

          if (table.size() < 0xfff) {

            if (table.size() == (1 << bitLength) ) {
              bitLength += 1;
            }

            table.add(s + c);
          }

          s = c;
        }
      }

      bitOut.write(table.indexOf(s), bitLength);

      // end code
      bitOut.write(endCode, bitLength);

      bitOut.flush();

      return byteOut.toByteArray();
    };

    var lzwTable = function() {

      var _map = {};
      var _size = 0;

      var _this = {};

      _this.add = function(key) {
        if (_this.contains(key) ) {
          throw 'dup key:' + key;
        }
        _map[key] = _size;
        _size += 1;
      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

      _this.contains = function(key) {
        return typeof _map[key] != 'undefined';
      };

      return _this;
    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  // returns qrcode function.

  return qrcode;
