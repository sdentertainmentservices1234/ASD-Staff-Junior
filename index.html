function doCalAddHearing(iso){
  const mid=(document.getElementById("chMatter")||{}).value||"";
  if(!mid){ toast("Select a case.", true); return; }
  const m=matterById(mid); if(!m) return;
  let reason=(document.getElementById("chReason")||{}).value||"";
  if(/other/i.test(reason)) reason=(document.getElementById("chCustom")||{}).value||"Other";
  const note=(document.getElementById("chNote")||{}).value||"";
  if(!Array.isArray(m.dates)) m.dates=[];
  m.dates.push(_auditStamp({ id:uid(), date:iso, reason, note }, true));
  m.dates.sort((a,b)=>(a.date||"").localeCompare(b.date||""));

/* ===========================================================
   REJECT / DELETE for expenses and advances.
   Reject (owner only): keeps entry, marks 'rejected', excludes from
   books, balance and totals; shows reason. Delete: removes entirely.
   Staff may delete only their OWN entries; only owner may reject.
   =========================================================== */
function _canDeleteOwn(rec){
  if(!isStaffView()) return true;   // owner can delete anything
  const me=(window.__staff&&window.__staff.profile&&window.__staff.profile.name)||"Staff";
  return rec && rec.createdBy===me;  // staff: only own
}
// EXPENSE reject: mark the books expense rejected AND its linked advance entry (so balance returns)
function rejectExpense(id){
  if(isStaffView()){ toast("Only the Head of Chamber can reject.", true); return; }
  openModal("Reject this expense?", `
    <div class="hint">The expense stays on record marked <b>Rejected</b>, is removed from your books, and the amount returns to the staff member's balance. Add a reason.</div>
    <input class="in" id="rjReason" placeholder="Reason (e.g. not chamber expense)" maxlength="60">
    <div class="btn-row" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doRejectExpense('${id}')">Reject</button></div>`);
}
function doRejectExpense(id){
  const reason=(document.getElementById("rjReason")||{}).value||"";
  const e=DB.expenses.find(x=>x.id===id); if(!e) return;
  e.status="rejected"; e.rejectReason=reason; e.rejectedAt=new Date().toISOString(); e.rejectedBy=headLabel();
  // also reject the linked advance-ledger entry so the staff balance returns
  const linked=DB.advances.find(a=>a.expenseId===id);
  if(linked){ linked.status="rejected"; linked.rejectReason=reason; }
  save(); closeModal(); _refreshMatterDetail();
  if(document.getElementById("panel-salary")&&document.getElementById("panel-salary").classList.contains("active")){ try{renderPeople();}catch(_){} } else if(document.getElementById("panel-advances")&&document.getElementById("panel-advances").classList.contains("active")){ try{renderAdvances();}catch(_){} }
  toast("Expense rejected; amount returned to balance.");
}

function doRejectAdvanceEntry(id){

function delReceipt(id){
  const r=DB.receipts.find(x=>x.id===id); if(!r) return;
  const latest=_isLatestInSeries("receipts",r);
  const warn = latest
    ? `Receipt <b>${esc(r.no)}</b> is the latest in the series. Deleting frees the number ${esc(r.no)} to be used again — right for a test or mistaken entry.`
    : `Receipt <b>${esc(r.no)}</b> is not the latest. Deleting leaves a permanent gap at ${esc(r.no)}. If this receipt was actually issued to a client, use <b>Void</b> instead so the number stays on record.`;
  openModal("Delete receipt?", `
    <div class="hint">${warn}</div>
    <div class="note">Deleted items are recoverable from More → Backup, if needed.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${latest?"":`<button class="btn ghost" onclick="closeModal();voidReceiptPrompt('${id}')">Void instead</button>`}
      <button class="btn seal" onclick="doDelReceipt('${id}')">Delete</button>
    </div>`);

/* ===========================================================
   CASH BOOK  (auto from receipts + expenses, plus manual rows)
   =========================================================== */
function cashRows(){
  const fromRec = DB.receipts.filter(r=>!isVoided(r)).map(r=>({date:r.date, particulars:`Receipt ${r.no} — ${matterLabel(r.matterId)}`, type:"in", amount:+r.amount||0, mode:r.mode, ref:r.no, src:"receipt"}));
  const fromExp = DB.expenses.map(e=>({date:e.date, particulars:`${e.head}${e.payee?" — "+e.payee:""}`, type:"out", amount:+e.amount||0, mode:e.mode, ref:e.voucherNo||"", src:"expense"}));
  const manual = DB.cash.filter(c=>!c.ref || (!DB.receipts.some(r=>r.no===c.ref))).map(c=>({...c, src:"manual"}));
  // use auto rows for receipts/expenses; manual only for ad-hoc
  return [...fromRec, ...fromExp, ...DB.cash.filter(c=>c.src==="manual")]
    .concat(DB.cash.filter(c=>c.manual))  // safety
    .filter((v,i,arr)=>true)
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
function renderCash(){
  // Build clean: receipts (in) + expenses (out) + explicit manual entries
  const rows = [];
  DB.receipts.forEach(r=>rows.push({date:r.date, p:`Receipt ${r.no} — ${matterLabel(r.matterId)}`, t:"in", a:+r.amount||0, mode:r.mode}));
  DB.expenses.forEach(e=>rows.push({date:e.date, p:`${e.head}${e.payee?" — "+e.payee:""}`, t:"out", a:+e.amount||0, mode:e.mode}));
  DB.cash.filter(c=>c.manual).forEach(c=>rows.push({date:c.date, p:c.particulars, t:c.type, a:+c.amount||0, mode:c.mode}));
  rows.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let bal=0;
  const body = rows.map(r=>{
    bal += r.t==="in"? r.a : -r.a;
    return `<tr>
      <td>${fmtDate(r.date)}</td><td>${esc(r.p)}</td><td>${esc(r.mode||"")}</td>
      <td class="num">${r.t==="in"?fmtINR(r.a):""}</td>
      <td class="num">${r.t==="out"?fmtINR(r.a):""}</td>
      <td class="num" style="font-weight:600">${fmtINR(bal)}</td></tr>`;
  }).join("");
  const totIn = rows.filter(r=>r.t==="in").reduce((s,r)=>s+r.a,0);
  const totOut = rows.filter(r=>r.t==="out").reduce((s,r)=>s+r.a,0);
  document.getElementById("panel-cash").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><h2>Cash book</h2><div class="hint">Auto-built from receipts (in) and expenses (out). Add manual entries for anything else. This is your Rule 6F cash record.</div></div>
        <button class="btn ghost sm" onclick="addCash()">+ Manual entry</button>
      </div>
      ${rows.length? `<div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Particulars</th><th>Mode</th><th class="num">Receipts</th><th class="num">Payments</th><th class="num">Balance</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr style="font-weight:700;background:#efe9db">
          <td colspan="3">Totals</td><td class="num">${fmtINR(totIn)}</td>
          <td class="num">${fmtINR(totOut)}</td><td class="num">${fmtINR(totIn-totOut)}</td></tr></tfoot>
        </table></div>`
        : `<div class="empty">No entries yet.</div>`}
    </div>`;
}

/* ---- proof handling: compress images, hold in staging until save ---- */
let _proofStaging = null;
function onProofPicked(input){
  const f = input.files && input.files[0];
  const info = document.getElementById("exFileInfo");
  _proofStaging = null;
  if(!f){ info.textContent=""; return; }
  if(f.type === "application/pdf"){
    const r = new FileReader();
    r.onload = ()=>{ _proofStaging = {name:f.name, type:f.type, data:r.result};
      info.textContent = `Attached: ${f.name} (${(f.size/1024).toFixed(0)} KB)`; };
    r.readAsDataURL(f);
  } else if(f.type.startsWith("image/")){
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600; let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){ const s = maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const out = c.toDataURL("image/jpeg", 0.8);
        _proofStaging = {name:f.name.replace(/\.\w+$/,"")+".jpg", type:"image/jpeg", data:out};
        info.textContent = `Attached: ${_proofStaging.name} (~${Math.round((out.length*0.75)/1024)} KB)`;
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  } else { info.innerHTML = `<span style="color:var(--seal)">Only images or PDF allowed.</span>`; input.value=""; }
}
async function viewProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(!e || !e.proofMeta){ toast("No attachment.",true); return; }
  let blobData;
  try{ blobData = await idbGet("proof:"+id); }catch(_){}
  if(!blobData){ toast("Attachment missing on this device. Restore from a full backup.",true); return; }
  const p = e.proofMeta;
  const body = p.type==="application/pdf"
    ? `<iframe src="${blobData}" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:6px"></iframe>`
    : `<img src="${blobData}" style="max-width:100%;border:1px solid var(--line);border-radius:6px">`;
  openModal(`Proof — ${esc(p.name||"attachment")} (voucher ${esc(e.voucherNo||"")})`, `${body}
    <div class="btn-row" style="margin-top:14px">
      <a class="btn ghost" href="${blobData}" download="${esc(p.name||'proof')}">Download</a>
      <button class="btn ghost" onclick="removeProof('${id}')">Remove attachment</button>
      <button class="btn seal" onclick="closeModal()">Close</button>
    </div>`);
}
async function removeProof(id){
  const e = DB.expenses.find(x=>x.id===id);
  if(e){ delete e.proofMeta; try{ await idbDel("proof:"+id); }catch(_){}
    save(); renderExpense(); closeModal(); toast("Attachment removed."); }
}
/* attach a proof to an existing voucher that had none */
function attachLater(id){
  const e = DB.expenses.find(x=>x.id===id); if(!e) return;
  _proofStaging = null;
  openModal(`Attach proof — voucher ${esc(e.voucherNo||"")}`, `
    <label class="fld">Bill / receipt / screenshot</label>
    <input class="in" type="file" id="exFile" accept="image/*,application/pdf" onchange="onProofPicked(this)">
    <div id="exFileInfo" style="font-size:12.5px;color:var(--muted);margin-top:6px"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="saveLateProof('${id}')">Attach</button>
    </div>`);
}
async function saveLateProof(id){
  const e = DB.expenses.find(x=>x.id===id); if(!e) return;
  if(!_proofStaging){ toast("Choose a file first.",true); return; }
  try{
    await idbPut("proof:"+id, _proofStaging.data);
    e.proofMeta = {name:_proofStaging.name, type:_proofStaging.type};
    _proofStaging=null; save(); renderExpense(); closeModal(); toast("Proof attached.");
  }catch(err){ toast("Could not store the file.",true); }
}
async function saveExpense(){
  const head=document.getElementById("exHead").value;
  const amt=+document.getElementById("exAmt").value;
  if(!head){ toast("Select an expense head.",true); return; }
  const miscDetail = head==="Misc." ? document.getElementById("exMisc").value.trim() : "";
  if(head==="Misc." && !miscDetail){ toast("Specify what the miscellaneous expense was.",true); return; }
  if(!amt){ toast("Enter the amount.",true); return; }
  const id = uid();
  const voucherNo = nextVoucherNo();
  const exp = {id, voucherNo, date:document.getElementById("exDate").value,
    head, miscDetail, payee:document.getElementById("exPayee").value.trim(), amount:amt,
    mode:document.getElementById("exMode").value, remarks:document.getElementById("exRem").value.trim(),
    billRef:(document.getElementById("exBillRef")||{value:""}).value.trim()};
  if(_proofStaging){
    try{ await idbPut("proof:"+id, _proofStaging.data);
      exp.proofMeta = {name:_proofStaging.name, type:_proofStaging.type}; }
    catch(err){ toast("Voucher saved, but the attachment could not be stored.", true); }
  }
  DB.expenses.push(exp);
  _proofStaging = null;
  save(); renderAll(); closeModal(); toast(`Voucher ${voucherNo} saved.`);
}
function delExpense(id){
  DB.expenses=DB.expenses.filter(e=>e.id!==id);
  try{ idbDel("proof:"+id); }catch(_){}
  save(); renderAll(); toast("Expense deleted.");
}

            <label style="font-size:12px;color:var(--ink);display:flex;align-items:center;gap:7px;margin-top:2px">
              <input type="checkbox" id="stSigStripWhite" ${s.sigStripWhite?"checked":""} onchange="if(window.__lastSigRaw)_applyStripToggle()"> Make white background transparent

// Signature upload handling — reads file, optional white-strip, stores data URI on settings.
function onSigPicked(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ window.__lastSigRaw = rd.result; _applyStripToggle(); };
  rd.readAsDataURL(f);
}
function _applyStripToggle(){
  const raw = window.__lastSigRaw; if(!raw) return;
  const strip = !!(document.getElementById("stSigStripWhite")||{}).checked;
  const finish = (dataUrl)=>{
    DB.settings.signatureImg = dataUrl;
    DB.settings.sigStripWhite = strip;
    const pv = document.getElementById("sigPreview");
    if(pv) pv.innerHTML = `<img src="${dataUrl}" style="max-width:170px;max-height:56px;object-fit:contain">`;
  };
  if(!strip){ finish(raw); return; }
  // strip near-white pixels to transparent
  const img = new Image();
  img.onload = ()=>{
    try{
      const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const cx=c.getContext("2d"); cx.drawImage(img,0,0);
      const d=cx.getImageData(0,0,c.width,c.height); const a=d.data;
      for(let i=0;i<a.length;i+=4){ if(a[i]>235 && a[i+1]>235 && a[i+2]>235){ a[i+3]=0; } }
      cx.putImageData(d,0,0);
      finish(c.toDataURL("image/png"));
    }catch(e){ finish(raw); }
  };
  img.onerror = ()=>finish(raw);
  img.src = raw;
}
function removeSignature(){
  DB.settings.signatureImg=""; window.__lastSigRaw=null;
  const pv=document.getElementById("sigPreview");
  if(pv) pv.innerHTML=`<span style="font-size:11px;color:var(--muted)">No signature</span>`;
  save();
  toast("Signature removed.");
}

function genHandoverKey(){
  const al="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const r=crypto.getRandomValues(new Uint8Array(32));
  let k=""; for(let i=0;i<32;i++) k+=al[r[i]%al.length];
  const el=document.getElementById("stHandoverKey"); if(el) el.value=k;
  toast("New key generated. Save settings, then copy it into the staff config.");
}

/* ===========================================================
   ARCHIVE — everything catalogued by year and month
   Pulls together receipts, invoices, expenses, documents and
   imported staff handovers into one browsable timeline.
   =========================================================== */
function monthKey(iso){ return (iso||"").slice(0,7); } // YYYY-MM
function monthLabel(ym){
  if(!ym || ym.length<7) return "Undated";
  const [y,m]=ym.split("-");
  const mon=["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1]||"";
  return `${mon} ${y}`;
}
let _archiveOpen = {}; // track expanded months

function buildArchiveIndex(){
  // returns { year: { ym: {receipts:[], invoices:[], expenses:[], docsIn:[], docsFiled:[], imports:[] , fees, exp} } }
  const idx = {};
  function bucket(ym){
    const yr = ym && ym.length>=4 ? ym.slice(0,4) : "Undated";
    idx[yr] = idx[yr] || {};
    idx[yr][ym] = idx[yr][ym] || {receipts:[],invoices:[],expenses:[],docsIn:[],docsFiled:[],imports:[],fees:0,exp:0,inv:0};
    return idx[yr][ym];
  }
  (DB.receipts||[]).forEach(r=>{ const b=bucket(monthKey(r.date)); b.receipts.push(r); b.fees+=+r.amount||0; });
  (DB.invoices||[]).forEach(v=>{ const b=bucket(monthKey(v.date));
    const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
    b.invoices.push(v); b.inv+=t; });
  (DB.expenses||[]).forEach(e=>{ const b=bucket(monthKey(e.date)); b.expenses.push(e); b.exp+=+e.amount||0; });
  (DB.docsIn||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.received)); b.docsIn.push(d); });
  (DB.docsFiled||[]).forEach(d=>{ const b=bucket(monthKey(d.date||d.filed)); b.docsFiled.push(d); });
  // (staff import log removed with handover feature)
  return idx;
}

function renderArchive(){
  const idx = buildArchiveIndex();
  const years = Object.keys(idx).sort((a,b)=>b.localeCompare(a)); // newest first
  let body="";
  if(!years.length){
    body = `<div class="card"><div class="empty">Nothing archived yet. As you add receipts, invoices, expenses, documents and import staff entries, they'll be catalogued here by month and year.</div></div>`;
  } else {
    for(const yr of years){
      const months = Object.keys(idx[yr]).sort((a,b)=>b.localeCompare(a));
      // year totals
      let yFees=0,yExp=0,yInv=0,yR=0,yV=0,yD=0,yI=0;
      months.forEach(ym=>{const m=idx[yr][ym]; yFees+=m.fees;yExp+=m.exp;yInv+=m.inv;yR+=m.receipts.length;yV+=m.expenses.length;yD+=m.docsIn.length+m.docsFiled.length;yI+=m.imports.length;});
      body += `<div class="card">
        <div class="card-head"><div>
          <h2 style="margin-bottom:2px">${esc(yr)}</h2>
          <div class="hint" style="margin:0">${yR} receipts · ${yV} vouchers · ${yInv?fmtINR(yInv)+" invoiced · ":""}${yD} documents · ${yI} imports</div>
        </div>
        <div style="text-align:right"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Fees received</div>
          <div style="font-size:20px;font-weight:700;color:var(--seal)">${fmtINR(yFees)}</div></div></div>
        <div style="margin-top:10px">`;
      for(const ym of months){
        const m = idx[yr][ym];
        const open = !!_archiveOpen[ym];
        const count = m.receipts.length+m.invoices.length+m.expenses.length+m.docsIn.length+m.docsFiled.length+m.imports.length;
        body += `<div class="arch-month">

function exportArchiveCSV(){
  const rows=[["Type","Number","Date","Matter/Head","Party/Payee","Amount","RecordedBy"]];
  (DB.receipts||[]).forEach(r=>{const m=matterById(r.matterId)||{};rows.push(["Receipt",r.no||"",r.date||"",m.code||"",m.client||"",r.amount||"",r.enteredBy||""]);});
  (DB.invoices||[]).forEach(v=>{const m=matterById(v.matterId)||{};const t=(v.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(v.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);rows.push(["Invoice",v.no||"",v.date||"",m.code||"",m.client||"",t,""]);});
  (DB.expenses||[]).forEach(e=>{rows.push(["Expense",e.voucherNo||"",e.date||"",e.head||"",e.payee||"",e.amount||"",e.enteredBy||""]);});
  (DB.docsIn||[]).forEach(d=>{const m=matterById(d.matterId)||{};rows.push(["Inward doc","",d.date||"",d.title||d.desc||"",m.client||"","",""]);});
  (DB.docsFiled||[]).forEach(d=>{const m=matterById(d.matterId)||{};rows.push(["Filed doc",d.iaNo||"",d.date||"",d.title||d.desc||"",m.client||"","",""]);});
  rows.sort((a,b)=>(a[2]||"").localeCompare(b[2]||""));
  const csv = rows.map(r=>r.map(c=>{c=String(c==null?"":c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`Chamber-Archive-${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);

const INWARD_TYPES = ["Vakalatnama","Case papers / file","Court order / notice","Affidavit","Agreement / deed",
  "ID / KYC documents","Cheque / DD","Correspondence","Evidence / annexure","Other"];
const FILED_TYPES = ["Main petition / paper-book (full filed copy)","SLP (filed copy)","Writ Petition (filed copy)",
  "Appeal (filed copy)","Interlocutory Application (IA)","Interim Application","Stay Application",

let _mDocStaging = [];
function onMDocsPicked(input, infoId){
  const files=[...(input.files||[])]; _mDocStaging=[];
  const info=document.getElementById(infoId); if(!files.length){info.textContent="";return;}
  let done=0; const total=files.length; const collected=[];
  info.textContent=`Reading ${total} file(s)…`;
  files.forEach(f=>{
    if(f.type==="application/pdf"){ const r=new FileReader();
      r.onload=()=>{collected.push({name:f.name,type:f.type,data:r.result,size:f.size});tick();}; r.readAsDataURL(f);
    }else if(f.type.startsWith("image/")){ const r=new FileReader();
      r.onload=()=>{const img=new Image();img.onload=()=>{const max=1800;let{width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",0.82);collected.push({name:f.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data:out,size:Math.round(out.length*0.75)});tick();
      };img.src=r.result;}; r.readAsDataURL(f);
    }else{collected.push(null);tick();}
  });
  function tick(){done++;if(done===total){_mDocStaging=collected.filter(Boolean);
    const kb=_mDocStaging.reduce((s,x)=>s+(x.size||0),0)/1024;
    info.textContent=`${_mDocStaging.length} file(s) ready (~${kb>1024?(kb/1024).toFixed(1)+" MB":Math.round(kb)+" KB"}).`;}}
}

/* ===========================================================
   EXPORT DOCUMENTS TO A REAL FOLDER (catalogued case files)
   Uses File System Access API (Chrome/Edge desktop). Falls
   back to a downloadable ZIP where unsupported.
   =========================================================== */
function fsSupported(){ return typeof window!=="undefined" && "showDirectoryPicker" in window; }
function safeName(s){ return (s||"").replace(/[\/\\:*?"<>|]/g,"-").replace(/\s+/g," ").trim().slice(0,120); }
function dataURLtoBlob(dataURL){
  try{
    const [head,b64]=dataURL.split(",");
    const mime=(head.match(/data:(.*?);/)||[])[1]||"application/octet-stream";
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}
function matterFolderName(m){
  if(!m) return "Unassigned";
  const bits=[m.code, safeName(m.client)];
  if(m.caseNo) bits.push(safeName(m.caseNo).replace(/\//g,"-"));
  return safeName(bits.join("  "));
}
function docsForMatter(matterId){
  return {
    filed: DB.docsFiled.filter(d=>d.matterId===matterId),
    inward: DB.docsIn.filter(d=>d.matterId===matterId)
  };
}
function buildIndexText(m, sets){
  const L=[];
  L.push("CASE DOCUMENT INDEX");
  L.push("=".repeat(40));
  if(m){ L.push("Matter code : "+m.code); L.push("Client      : "+m.client);
    if(m.parties) L.push("Parties     : "+m.parties);
    if(m.caseNo) L.push("Case no.    : "+m.caseNo);
    if(m.court) L.push("Forum       : "+m.court);
  } else L.push("Unassigned documents");
  L.push("Generated   : "+new Date().toLocaleString());
  L.push("");
  function section(title, arr){
    L.push(title); L.push("-".repeat(title.length));
    if(!arr.length){ L.push("(none)"); L.push(""); return; }
    arr.forEach(d=>{
      (d.files||[]).forEach((f,i)=>{
        const fname = fileNameFor(d, f, i);
        L.push(`${fmtDate(d.date)}  ${fname}`);
      });
      const extra=[d.docType, d.source?("from "+d.source):"", d.iaNo, d.notes, d.enteredBy&&d.enteredBy!=="(self)"?("logged by "+d.enteredBy):""].filter(Boolean).join(" · ");
      if(extra) L.push("    "+extra);
    });
    L.push("");
  }
  section("FILED RECORDS", sets.filed);
  section("INWARD DOCUMENTS", sets.inward);
  return L.join("\n");
}
function fileNameFor(d, f, i){
  const ext = (f.name && f.name.includes(".")) ? f.name.slice(f.name.lastIndexOf(".")) : (f.type==="application/pdf"?".pdf":".jpg");
  const base = safeName(d.title) + (((d.files||[]).length>1)?(" ("+(i+1)+")"):"");
  return `${d.date}  ${base}${ext}`;
}

async function writeMatterToDir(parentDir, m, sets){
  const folderName = matterFolderName(m);
  const dir = await parentDir.getDirectoryHandle(folderName, {create:true});
  async function writeSet(subName, arr){
    if(!arr.length) return 0;
    const sub = await dir.getDirectoryHandle(subName, {create:true});
    let n=0;
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i];
        let data; try{ data=await idbGet(f.key); }catch(e){}
        if(!data) continue;
        const blob=dataURLtoBlob(data); if(!blob) continue;
        const fh=await sub.getFileHandle(fileNameFor(d,f,i), {create:true});
        const w=await fh.createWritable(); await w.write(blob); await w.close(); n++;
      }
    }
    return n;
  }
  const nf=await writeSet("Filed", sets.filed);
  const ni=await writeSet("Inward", sets.inward);
  // index file
  const idx=await dir.getFileHandle("_index.txt",{create:true});
  const w=await idx.createWritable(); await w.write(buildIndexText(m,sets)); await w.close();
  return nf+ni;
}

async function exportMatterToFolder(matterId){

    try{

      const matterIds = new Set([...DB.docsFiled, ...DB.docsIn].map(d=>d.matterId||""));
      for(const mid of matterIds){
        const m = mid? matterById(mid) : null;
        const sets = mid? docsForMatter(mid) : {filed:DB.docsFiled.filter(d=>!d.matterId), inward:DB.docsIn.filter(d=>!d.matterId)};

        total += await writeMatterToDir(parent, m, sets); folders++;
      }

    await exportAllAsZip();
  }
}

/* ---- ZIP fallback (Safari/iPhone) via a tiny zip builder ---- */
function crc32(buf){
  let c, table=crc32.t||(crc32.t=(()=>{const t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})());
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function buildZip(files){ // files:[{path,bytes}]
  const chunks=[], central=[]; let offset=0;
  const dosTime=0, dosDate=0x21;
  for(const f of files){
    const nameB=strBytes(f.path); const data=f.bytes; const crc=crc32(data);
    const local=new Uint8Array(30+nameB.length);
    const dv=new DataView(local.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    local.set(nameB,30);
    chunks.push(local, data);
    const cen=new Uint8Array(46+nameB.length); const cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameB.length,true); cv.setUint32(42,offset,true); cen.set(nameB,46);
    central.push(cen);
    offset+=local.length+data.length;
  }
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array(22); const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true); ev.setUint32(16,offset,true);
  return new Blob([...chunks,...central,end],{type:"application/zip"});
}
async function collectFilesForZip(m, sets, rootName){
  const out=[];
  async function add(subName, arr){
    for(const d of arr){
      for(let i=0;i<(d.files||[]).length;i++){
        const f=d.files[i]; let data; try{data=await idbGet(f.key);}catch(e){}
        if(!data) continue; const blob=dataURLtoBlob(data); if(!blob) continue;
        const bytes=new Uint8Array(await blob.arrayBuffer());
        out.push({path:`${rootName}/${subName}/${fileNameFor(d,f,i)}`, bytes});
      }
    }
  }
  await add("Filed", sets.filed); await add("Inward", sets.inward);
  out.push({path:`${rootName}/_index.txt`, bytes:strBytes(buildIndexText(m,sets))});
  return out;
}
async function exportMatterAsZip(m, sets){
  const root=matterFolderName(m);
  const files=await collectFilesForZip(m,sets,root);
  const zip=buildZip(files); downloadBlob(zip, root+".zip");
  toast("Case documents downloaded as a ZIP.");
}
async function exportAllAsZip(){
  let all=[];
  const matterIds=new Set([...DB.docsFiled,...DB.docsIn].map(d=>d.matterId||""));
  for(const mid of matterIds){
    const m=mid?matterById(mid):null;
    const sets=mid?docsForMatter(mid):{filed:DB.docsFiled.filter(d=>!d.matterId),inward:DB.docsIn.filter(d=>!d.matterId)};
    if(!sets.filed.length&&!sets.inward.length) continue;
    const part=await collectFilesForZip(m,sets,matterFolderName(m)); all=all.concat(part);
  }
  if(!all.length){ toast("Nothing to export.",true); return; }
  downloadBlob(buildZip(all), "Chamber-Cases-"+todayISO()+".zip");
  toast("All case documents downloaded as a ZIP.");
}
function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

var _pickRole=null, _shellTab="home";
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function crestSVG(){
  const s=DB.settings||{};
  const initials=(s.advName||s.chamberName||"A").replace(/^(adv\.?|dr\.?|mr\.?|mrs\.?|ms\.?)\s+/i,"").split(/\s+/).map(w=>w[0]||"").join("").slice(0,4).toUpperCase()||"A";
  return chamberLogoSVG(initials,"var(--seal)","var(--brass)").replace('width="84" height="84"','width="62" height="40"');
}
function showGate(){
  // Single-user owner app: no per-device role pick. Establish owner and enter.
  DB.deviceRole="owner"; save();
  enterAppShell();
}

function pickRole(r){
  _pickRole=r;
  document.querySelectorAll("#rolePick button").forEach(b=>b.classList.toggle("sel", b.dataset.r===r));
  const next=document.getElementById("gateNext");
  if(r==="owner"){
    next.innerHTML=`
      <div class="glead" style="margin-bottom:12px;text-align:left">You're setting this device up as the <b>Head of Chamber</b>. Your data is protected by your cloud login. Tap below to enter.</div>
      <div id="gMsg" style="color:var(--seal);font-size:13px;margin-top:8px;min-height:16px"></div>
      <button class="primary" style="margin-top:4px" onclick="finishOwnerSetup()">Enter chamber app</button>`;
  }else{
    next.innerHTML=`
      <div class="glead" style="margin-bottom:12px;text-align:left">As staff, set a 4–6 digit PIN to protect your entries on this device.</div>
      <input class="in" id="gPin1" inputmode="numeric" maxlength="6" placeholder="Set PIN" style="text-align:center;letter-spacing:.3em;font-size:20px">
      <input class="in" id="gPin2" inputmode="numeric" maxlength="6" placeholder="Confirm PIN" style="text-align:center;letter-spacing:.3em;font-size:20px;margin-top:10px">
      <div id="gMsg" style="color:var(--seal);font-size:13px;margin-top:8px;min-height:16px"></div>
      <button class="primary" style="margin-top:12px" onclick="finishStaffSetup()">Set up &amp; enter</button>`;
  }
}
async function finishOwnerSetup(){
  DB.deviceRole="owner"; save();
  document.getElementById("gate").style.display="none";
  enterAppShell();
}
async function finishStaffSetup(){
  const a=(document.getElementById("gPin1").value||"").trim(), b=(document.getElementById("gPin2").value||"").trim(), msg=document.getElementById("gMsg");
  if(!/^\d{4,6}$/.test(a)){ msg.textContent="PIN must be 4–6 digits."; return; }
  if(a!==b){ msg.textContent="PINs don't match."; return; }
  DB.deviceRole="staff"; DB.staffPinHash=await sha256("pin:"+a); save();
  document.getElementById("gate").style.display="none";
  enterAppShell();
}
function showStaffLock(){
  document.getElementById("appRoot").style.display="none";
  const g=document.getElementById("gate"); g.style.display="flex";
  g.innerHTML=`
    <div class="gcard">
      <h1>${esc(DB.settings.chamberName||"ASD Chamber")}</h1>
      <div class="glead">Enter your PIN to continue.</div>
      <input class="in" id="slPin" inputmode="numeric" maxlength="6" placeholder="PIN" style="text-align:center;letter-spacing:.3em;font-size:20px" onkeydown="if(event.key==='Enter')staffUnlock()">
      <div id="slMsg" style="color:var(--seal);font-size:13px;margin-top:8px;min-height:16px"></div>
      <button class="primary" style="margin-top:12px" onclick="staffUnlock()">Unlock</button>
    </div>`;
  setTimeout(()=>{const f=document.getElementById("slPin");if(f)f.focus();},60);
}
async function staffUnlock(){
  const pin=(document.getElementById("slPin").value||"").trim(), msg=document.getElementById("slMsg");
  if(await sha256("pin:"+pin)!==DB.staffPinHash){ msg.textContent="Wrong PIN."; return; }
  document.getElementById("gate").style.display="none";
  enterAppShell();
}
function enterAppShell(){
  document.body.classList.toggle("staff-theme", DB.deviceRole==="staff");

  applyViewPref();

  _shellTab=t; renderBotNav();
  const home=document.getElementById("panel-home");
  document.querySelectorAll("#appRoot .panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("groupNav").style.display="none";
  if(t==="home"){ _subBackTo="home"; home.classList.add("active"); renderHome(); }
  else if(t==="matters"){ renderMatters(); markPanel("matters"); }
  else if(t==="calendar"){ document.getElementById("panel-calendar").classList.add("active"); if(!_calMonth)_calMonth=todayISO().slice(0,7); renderCalendar(false); }
  else if(t==="billing"){ openBilling(_billingTab); }
  else if(t==="receipt"){ renderReceipt(); markPanel("receipt"); }
  else if(t==="books"){ go("books"); }
  else if(t==="documents"){ renderDocFolders(); markPanel("docin"); }
  else if(t==="more"){ home.classList.add("active"); renderMoreMenu(); }

// Stamp each register-table <td> with a data-label taken from its column header,
// so the responsive card layout (CSS <=640px) can show "Label: value" lines.
// Idempotent and defensive: does nothing if there's no table/thead. Scoped to
// .tbl-wrap tables only, leaving print templates (table.inv/.tpl-tbl) alone.
function _labelizeTables(root){
  if(!root) return;
  try{
    root.querySelectorAll(".tbl-wrap table").forEach(function(tbl){
      var ths = tbl.querySelectorAll("thead th");
      if(!ths.length) return;
      var labels = Array.prototype.map.call(ths, function(th){ return (th.textContent||"").trim(); });
      tbl.querySelectorAll("tbody tr").forEach(function(tr){
        Array.prototype.forEach.call(tr.children, function(td, i){
          if(td.tagName==="TD" && td.getAttribute("data-label")===null)
            td.setAttribute("data-label", labels[i]!=null?labels[i]:"");
        });
      });
    });
  }catch(e){ /* labeling is cosmetic; never let it break a render */ }
}
// Watch the app for any register table being (re)built by ANY render path
// — openSub, in-place refreshes, cloud listeners, staff tabs — and labelize it.
// One central hook means no renderer needs editing and none can be missed.
function _startTableLabeler(){
  try{
    var root=document.getElementById("appRoot")||document.body;
    _labelizeTables(root);
    var scheduled=false;
    var obs=new MutationObserver(function(){
      if(scheduled) return; scheduled=true;
      requestAnimationFrame(function(){ scheduled=false; _labelizeTables(root); });
    });
    obs.observe(root,{childList:true,subtree:true});
  }catch(e){}
}

function _daysUntil(iso){
  if(!iso) return null;
  const today=new Date(todayISO()+"T00:00:00");
  const d=new Date(iso+"T00:00:00");
  return Math.round((d-today)/86400000);
}
function _dateBucket(iso){
  const n=_daysUntil(iso);
  if(n==null) return "none";
  if(n<0) return "overdue";
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n<=7) return "week";
  return "later";
}

function showCounter(kind){

  if(kind==="hearings"){

    const od=dated.filter(m=>_daysUntil(m.nextDate)<0);
    title="Hearings this week";
    const line=(m)=>{const n=_daysUntil(m.nextDate);const d=new Date(m.nextDate+"T00:00:00");
      const w=n<0?`${Math.abs(n)}d overdue`:n===0?"Today":n===1?"Tomorrow":d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
      const cls=n<0?"od":n===0?"td":"";

    const body=(od.length?`<div class="cb-grp">Overdue</div>`+od.map(line).join(""):"")

  }
  openModal(title, `<div class="cb-list">${rows}</div>
    <div class="btn-row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);

/* ===========================================================
   AUTO-LOGOUT ON INACTIVITY
   A rolling timer: any interaction resets it. After the idle period
   with no activity, the session is signed out for security. A short
   warning appears first so the user can stay signed in with one tap.
   =========================================================== */
var _idleTimer=null, _idleWarnTimer=null, _idleWarnEl=null;
function idleTimeoutMin(){
  const v = DB.settings && +DB.settings.idleLogoutMin;
  return (v && v>0) ? v : 30;   // default 30 minutes
}
function _clearIdleWarn(){
  if(_idleWarnEl){ try{_idleWarnEl.remove();}catch(e){} _idleWarnEl=null; }
  if(_idleWarnTimer){ clearTimeout(_idleWarnTimer); _idleWarnTimer=null; }
}
function _showIdleWarning(){
  _clearIdleWarn();
  const el=document.createElement("div");
  el.id="idleWarn";
  el.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9500;background:#6b1f1f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:340px;width:92%;text-align:center;font-family:inherit";
  el.innerHTML=`You'll be signed out shortly for security.<div style="margin-top:9px"><button id="idleStay" style="background:#fff;color:#6b1f1f;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">Stay signed in</button></div>`;
  document.body.appendChild(el); _idleWarnEl=el;
  document.getElementById("idleStay").addEventListener("click",()=>{ _clearIdleWarn(); _resetIdleTimer(); });
  // if ignored for 60s, log out
  _idleWarnTimer=setTimeout(()=>{ _autoLogout(); }, 60000);
}
async function _autoLogout(){
  _clearIdleWarn(); _stopIdleTimer();
  try{
    DB.deviceRole=null; save();
    if(window.FB && FB.logout) await FB.logout();
  }catch(e){}
  try{ sessionStorage.setItem("asd_autologout","1"); }catch(e){}
  location.reload();
}
function _resetIdleTimer(){
  if(_idleTimer) clearTimeout(_idleTimer);
  _clearIdleWarn();
  if(!DB.deviceRole) return;   // only when signed in
  const ms = idleTimeoutMin()*60000;
  // show the warning 60s before the actual logout
  const warnAt = Math.max(ms-60000, Math.floor(ms*0.5));
  _idleTimer=setTimeout(()=>{ _showIdleWarning(); }, warnAt);
}
var _idleBound=false;
function _startIdleTimer(){
  if(!_idleBound){
    ["click","keydown","touchstart","mousemove","scroll","visibilitychange"].forEach(evt=>{
      window.addEventListener(evt, ()=>{ if(document.visibilityState!=="hidden") _resetIdleTimer(); }, {passive:true});
    });
    _idleBound=true;
  }
  _resetIdleTimer();
}
function _stopIdleTimer(){
  if(_idleTimer){ clearTimeout(_idleTimer); _idleTimer=null; }
  _clearIdleWarn();
}

  // data is stored under accounts/{uid}/{collection}/{recordId}
  _base(){ const u=this.uid(); return u ? `accounts/${u}` : null; },
  colRef(name){ const b=this._baseFor(name); return b ? collection(db, b, name) : null; },
  docRef(name, id){ const b=this._baseFor(name); return b ? doc(db, b, name, id) : null; },
  async putRecord(name, id, data){
    const r=this.docRef(name,id); if(!r) throw new Error("not signed in");
    await setDoc(r, Object.assign({}, data, {_updated: serverTimestamp()}), {merge:true});
  },
  async deleteRecord(name, id){
    const r=this.docRef(name,id); if(!r) return;
    await deleteDoc(r);
  },
  async getAll(name){
    const c=this.colRef(name); if(!c) return [];
    const snap=await getDocs(c); const out=[];
    snap.forEach(d=>out.push(Object.assign({id:d.id}, d.data())));
    return out;
  },
  listen(name, cb){
    const c=this.colRef(name); if(!c) return ()=>{};
    return onSnapshot(c, snap=>{
      const out=[]; snap.forEach(d=>out.push(Object.assign({id:d.id}, d.data())));
      cb(out, snap);
    }, err=>{ console.warn("listen error", name, err); });
  },
  // settings live as a single doc accounts/{uid}/meta/settings
  async putSettings(obj){
    const b=this._base(); if(!b) throw new Error("not signed in");
    await setDoc(doc(db,b,"meta","settings"), Object.assign({},obj,{_updated:serverTimestamp()}), {merge:true});
  },
  async getSettings(){
    const b=this._base(); if(!b) return null;
    const s=await getDoc(doc(db,b,"meta","settings"));
    return s.exists()? s.data() : null;
  },
  listenSettings(cb){
    const b=this._base(); if(!b) return ()=>{};
    return onSnapshot(doc(db,b,"meta","settings"), s=>{ cb(s.exists()?s.data():null); });
  },
  batch(){ return writeBatch(db); },
  // ACCESS CONTROL: allow-list + kill-switch, stored at chamber/main/meta/access.
  // Owner writes it; everyone reads it at startup. Gate is enforced app-side.
  async getAccess(){
    try{ const s=await getDoc(doc(db,"chamber","main","meta","access")); return s.exists()? s.data() : null; }
    catch(e){ return null; }
  },
  async putAccess(obj){
    await setDoc(doc(db,"chamber","main","meta","access"), Object.assign({},obj,{_updated:serverTimestamp()}), {merge:true});
  },
  listenAccess(cb){
    try{ return onSnapshot(doc(db,"chamber","main","meta","access"), s=>{ cb(s.exists()?s.data():null); }); }
    catch(e){ return ()=>{}; }
  },
  _db(){ return db; },

  // ERASE ALL CLOUD DATA (owner only). Deletes every document in every
  // collection — shared (chamber/main) and owner-private (accounts/{uid}) —
  // plus meta counters. Settings and the access allow-list are preserved by
  // default so the chamber identity + who-can-access survive the wipe.
  async wipeCloud(opts){
    opts=opts||{};
    const u=this.uid(); if(!u) throw new Error("not signed in");
    const cols=this.COLLECTIONS.slice();
    let deleted=0;
    for(const name of cols){
      const b = (this.SHARED.indexOf(name)>=0) ? this.CHAMBER_BASE : ("accounts/"+u);
      try{
        const snap=await getDocs(collection(db, b, name));
        // batch deletes in chunks of 400 (Firestore limit is 500 ops/batch)
        let batch=writeBatch(db), n=0;
        for(const d of snap.docs){
          batch.delete(d.ref); n++; deleted++;
          if(n>=400){ await batch.commit(); batch=writeBatch(db); n=0; }
        }
        if(n>0) await batch.commit();
      }catch(e){ console.warn("wipe collection failed:", name, e); }
    }
    // reset counters so numbering restarts clean
    try{ await setDoc(doc(db,"accounts",u,"meta","counters"),
      {matter:0,receipt:0,invoice:0,voucher:0,query:0,pastcase:0,_updated:serverTimestamp()}); }catch(e){}
    return deleted;
  },

  // ---- SYNC CONTROLLER ----
  // record collections that mirror DB arrays
  COLLECTIONS: ["matters","receipts","expenses","cash","docsIn","docsFiled","invoices","advances","staff","trash","filings","appointments","todos","activity","staffRoster","salaryAdvances","salarySlips"],
  // SHARED collections live in a common chamber space both owner & staff use.
  // OWNER-ONLY collections (receipts, invoices, salary*) live in the owner's private account.
  SHARED: ["matters","expenses","cash","docsIn","docsFiled","advances","staff","trash","filings","appointments","todos","activity"],
  OWNER_ONLY: ["receipts","invoices","staffRoster","salaryAdvances","salarySlips"],
  CHAMBER_BASE: "chamber/main",
  role: "owner",   // set by bridge: 'owner' or 'staff'
  activeCollections(){ return this.role==="staff" ? this.SHARED.slice() : this.COLLECTIONS.slice(); },
  _isShared(name){ return this.SHARED.indexOf(name) !== -1; },
  _baseFor(name){
    // shared -> chamber/main ; owner-only -> accounts/{uid}
    if(this._isShared(name)) return this.CHAMBER_BASE;
    const u=this.uid(); return u ? `accounts/${u}` : null;
  },
  _listeners: [],
  // Pull everything from Firestore into a plain object shaped like DB arrays + meta
  async pullAll(){
    const out = { settings:null, counters:null };
    for(const name of this.activeCollections()){
      out[name] = await this.getAll(name);
    }
    if(this.role!=="staff"){
      const b=this._base();
      if(b){
        const st=await getDoc(doc(db,b,"meta","settings"));
        out.settings = st.exists()? st.data() : null;
        const ct=await getDoc(doc(db,b,"meta","counters"));
        out.counters = ct.exists()? ct.data() : null;
      }
    }
    return out;
  },
  // Push one record (create/update)
  async pushRecord(name, rec){
    if(!rec || !rec.id) return;
    await this.putRecord(name, rec.id, rec);
  },
  // Push a whole array as a batch (used on first upload / full mirror)
  async pushCollection(name, arr){
    const b=this._baseFor(name); if(!b || !Array.isArray(arr)) return;
    for(let i=0;i<arr.length;i+=450){
      const batch=writeBatch(db);
      arr.slice(i,i+450).forEach(rec=>{
        if(rec && rec.id) batch.set(doc(db,b,name,rec.id), Object.assign({},rec,{_updated:serverTimestamp()}), {merge:true});
      });
      await batch.commit();
    }
  },
  async pushSettings(settings){ if(settings) await this.putSettings(settings); },
  async pushCounters(counters){
    const b=this._base(); if(!b || !counters) return;
    await setDoc(doc(db,b,"meta","counters"), Object.assign({},counters,{_updated:serverTimestamp()}), {merge:true});
  },
  // Mirror the entire in-memory DB up to Firestore (first-time upload)
  async pushEntireDB(DB){
    if(this.role!=="staff"){
      await this.pushSettings(DB.settings);
      await this.pushCounters(DB.counters);
    }
    for(const name of this.activeCollections()){ await this.pushCollection(name, DB[name]||[]); }
  },
  startListeners(onCollection, onSettings, onCounters){
    this.stopListeners();
    for(const name of this.activeCollections()){
      this._listeners.push(this.listen(name, recs=>onCollection(name, recs)));
    }
    if(this.role!=="staff"){
      const b=this._base();
      if(b){
        this._listeners.push(onSnapshot(doc(db,b,"meta","settings"), s=>{ if(s.exists()) onSettings(s.data()); }));
        this._listeners.push(onSnapshot(doc(db,b,"meta","counters"), s=>{ if(s.exists()) onCounters(s.data()); }));
      }
    }
  },
  stopListeners(){ this._listeners.forEach(u=>{ try{u();}catch(e){} }); this._listeners=[]; }
};

/* ---- STAFF INBOX (top-level, shared drop-box) ----
   Staff write only under inbox/{their-uid}. Owner reads all of inbox.
   Also a top-level staffdir/{uid} holds each staff member's profile +
   approval status + a mirror of their balance (owner-written, staff-readable). */
FB.inboxColRef = function(staffUid){ return collection(db, "inbox", staffUid, "entries"); };
FB.inboxDocRef = function(staffUid, id){ return doc(db, "inbox", staffUid, "entries", id); };
FB.pushInbox = async function(staffUid, id, data){
  await setDoc(FB.inboxDocRef(staffUid, id), Object.assign({}, data, {_updated: serverTimestamp()}), {merge:true});
};
FB.deleteInbox = async function(staffUid, id){ try{ await deleteDoc(FB.inboxDocRef(staffUid, id)); }catch(e){} };
FB.myInboxAll = async function(){
  const u=FB.uid(); if(!u) return [];
  const snap=await getDocs(FB.inboxColRef(u)); const out=[]; snap.forEach(d=>out.push(Object.assign({id:d.id}, d.data()))); return out;
};
// staff profile / directory (owner-managed approval + balance mirror)
FB.staffDirRef = function(uid){ return doc(db, "staffdir", uid); };
// Staff member's own private space (their own account) — for personal billing etc.
FB.putOwnDoc = async function(coll, id, data){
  const u=FB.uid(); if(!u) return;
  await setDoc(doc(db,"accounts",u,coll,id), Object.assign({},data,{_updated:serverTimestamp()}), {merge:true});
};
FB.getOwnDoc = async function(coll, id){
  const u=FB.uid(); if(!u) return null;
  const s=await getDoc(doc(db,"accounts",u,coll,id)); return s.exists()? s.data() : null;
};
FB.getStaffDir = async function(uid){ const s=await getDoc(FB.staffDirRef(uid)); return s.exists()? s.data() : null; };
FB.putStaffDir = async function(uid, data){ await setDoc(FB.staffDirRef(uid), Object.assign({},data,{_updated:serverTimestamp()}), {merge:true}); };
FB.listenStaffDir = function(uid, cb){ return onSnapshot(FB.staffDirRef(uid), s=>cb(s.exists()?s.data():null)); };
// owner watches the whole inbox across all staff via collectionGroup
FB.listenAllInbox = function(cb){
  const q = collectionGroup(db, "entries");
  return onSnapshot(q, snap=>{
    const out=[]; snap.forEach(d=>{ const data=d.data(); out.push(Object.assign({id:d.id, _path:d.ref.path}, data)); });
    cb(out);
  }, err=>{ console.warn("inbox listen error", err); });
};
// owner lists the staff directory (all who have registered)
FB.listenStaffDirAll = function(cb){
  return onSnapshot(collection(db, "staffdir"), snap=>{
    const out=[]; snap.forEach(d=>out.push(Object.assign({uid:d.id}, d.data()))); cb(out);
  }, err=>{ console.warn("staffdir listen error", err); });
};
FB.getStaffDirAll = async function(){
  const snap=await getDocs(collection(db,"staffdir")); const out=[]; snap.forEach(d=>out.push(Object.assign({uid:d.id}, d.data()))); return out;
};

onAuthStateChanged(auth, u=>{
  FB.user = u || null;
  FB._authCbs.forEach(cb=>{ try{ cb(FB.user); }catch(e){} });
  // let the engine know
  if(window.onFirebaseAuth) window.onFirebaseAuth(FB.user);
});

window.FB = FB;
window.dispatchEvent(new Event("firebase-ready"));

</script>
