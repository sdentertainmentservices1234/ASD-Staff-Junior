/* ===========================================================
   ENCRYPTION (WebCrypto: PBKDF2 + AES-GCM)
   The localStorage index is encrypted at rest. The data key is
   wrapped by both the password and a one-time recovery code, so
   either can unlock; losing both = unrecoverable (by design).
   =========================================================== */
const _sessionKeyHolder = true; // (enc state vars hoisted above)

function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ const s=atob(b64); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a.buffer; }
function randBytes(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }

async function deriveKEK(passphrase, salt){ // key-encryption-key from a passphrase
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["wrapKey","unwrapKey","encrypt","decrypt"]);
}
function genRecoveryCode(){ // 24 chars, grouped: XXXX-XXXX-XXXX-XXXX-XXXX-XXXX
  const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r=randBytes(24);
  let s=""; for(let i=0;i<24;i++){ s+=al[r[i]%al.length]; if(i%4===3&&i<23)s+="-"; } return s;
}

// Create a fresh data key, wrap it with password + recovery code, store meta.
async function encSetup(password){
  const dataKey = await crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
  const recovery = genRecoveryCode();
  const pSalt = randBytes(16), rSalt = randBytes(16);
  const pKEK = await deriveKEK(password, pSalt);
  const rKEK = await deriveKEK(recovery, rSalt);
  const pIv = randBytes(12), rIv = randBytes(12);
  const pWrap = await crypto.subtle.wrapKey("raw", dataKey, pKEK, {name:"AES-GCM", iv:pIv});
  const rWrap = await crypto.subtle.wrapKey("raw", dataKey, rKEK, {name:"AES-GCM", iv:rIv});
  const meta = {
    v:1,
    p:{ salt:buf2b64(pSalt), iv:buf2b64(pIv), wrap:buf2b64(pWrap) },
    r:{ salt:buf2b64(rSalt), iv:buf2b64(rIv), wrap:buf2b64(rWrap) }
  };
  localStorage.setItem(ENC_META, JSON.stringify(meta));
  _sessionKey = dataKey;
  return recovery;
}
function encEnabled(){ return !!localStorage.getItem(ENC_META); }

async function encUnlock(secret, which){ // which: 'p' or 'r'
  const meta = JSON.parse(localStorage.getItem(ENC_META)||"null"); if(!meta) return false;
  const slot = meta[which]; if(!slot) return false;
  try{
    const KEK = await deriveKEK(secret, new Uint8Array(b642buf(slot.salt)));
    const dataKey = await crypto.subtle.unwrapKey("raw", b642buf(slot.wrap), KEK,
      {name:"AES-GCM", iv:new Uint8Array(b642buf(slot.iv))}, {name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
    _sessionKey = dataKey; return true;
  }catch(e){ return false; }
}
// Re-wrap the existing data key under a new password (keeps recovery code valid only if re-issued)
async function encChangePassword(newPassword){
  if(!_sessionKey) return null;
  const meta = JSON.parse(localStorage.getItem(ENC_META));
  const pSalt = randBytes(16), pIv = randBytes(12);
  const pKEK = await deriveKEK(newPassword, pSalt);
  const pWrap = await crypto.subtle.wrapKey("raw", _sessionKey, pKEK, {name:"AES-GCM", iv:pIv});
  meta.p = { salt:buf2b64(pSalt), iv:buf2b64(pIv), wrap:buf2b64(pWrap) };
  // also issue a fresh recovery code
  const recovery = genRecoveryCode(); const rSalt=randBytes(16), rIv=randBytes(12);
  const rKEK = await deriveKEK(recovery, rSalt);
  const rWrap = await crypto.subtle.wrapKey("raw", _sessionKey, rKEK, {name:"AES-GCM", iv:rIv});
  meta.r = { salt:buf2b64(rSalt), iv:buf2b64(rIv), wrap:buf2b64(rWrap) };
  localStorage.setItem(ENC_META, JSON.stringify(meta));
  return recovery;
}
async function encryptDB(){
  if(!_sessionKey) return null;
  const iv = randBytes(12);
  const plain = new TextEncoder().encode(JSON.stringify(DB));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, _sessionKey, plain);
  return JSON.stringify({iv:buf2b64(iv), ct:buf2b64(ct)});
}
async function decryptBlob(blob){
  const o = JSON.parse(blob);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(b642buf(o.iv))}, _sessionKey, b642buf(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- persistence ---------- */
function load(){
  // when encryption is enabled, the real data load happens after unlock (loadDecrypted)
  if(encEnabled()){ _locked = true; return DEFAULTS(); }
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return DEFAULTS();
    return migrate(JSON.parse(raw));
  }catch(e){ console.warn("load failed",e); return DEFAULTS(); }
}
async function loadDecrypted(){
  const blob = localStorage.getItem(ENC_KEY);
  if(!blob){ DB = DEFAULTS(); _locked=false; return; }
  try{ DB = migrate(await decryptBlob(blob)); _locked=false; }
  catch(e){ throw new Error("decrypt failed"); }
}

function lockNow(){

const SCHEMA_VERSION = 3;  // bump when the data shape changes; migrate handles upgrades
function migrate(data){
  // Forward-compatible: merges in any NEW default fields without dropping
  // existing data, preserves unknown keys, and never throws on partial data.
  if(!data || typeof data!=="object") data = {};
  const base = DEFAULTS();
  // settings: keep all existing values, add any newly-introduced defaults
  data.settings = Object.assign({}, base.settings, data.settings||{});
  // core arrays: ensure present
  for(const k of ["matters","receipts","expenses","cash","docsIn","docsFiled","invoices"]) if(!Array.isArray(data[k])) data[k]=[];
  data.counters = Object.assign({}, base.counters, data.counters||{});
  // back-fill voucher counter from existing vouchers if missing
  if(!data.counters.voucher){
    let mx=0; data.expenses.forEach(e=>{ const m=/V-\d{2}-(\d{3})/.exec(e.voucherNo||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.voucher = mx;
  }
  // back-fill invoice counter likewise
  if(!data.counters.invoice){
    let mx=0; (data.invoices||[]).forEach(v=>{ const m=/\/(\d{3})$/.exec(v.no||""); if(m) mx=Math.max(mx,+m[1]); });
    data.counters.invoice = mx;
  }
  // migrate any legacy inline proof -> IndexedDB, keep only meta in index
  data.expenses.forEach(e=>{
    if(e.proof && e.proof.data){
      const pid = e.id;
      try{ idbPut("proof:"+pid, e.proof.data); }catch(_){}
      e.proofMeta = {name:e.proof.name, type:e.proof.type};
      delete e.proof;
    }
  });
  if(!Array.isArray(data.staffLog)) data.staffLog = [];
  if(!Array.isArray(data.staff)) data.staff = [];
  if(!Array.isArray(data.filings)) data.filings = [];
  if(!Array.isArray(data.appointments)) data.appointments = [];
  if(!Array.isArray(data.myAppointments)) data.myAppointments = [];
  if(data.counters && data.counters.pastcase==null) data.counters.pastcase = 0;
  (data.matters||[]).forEach(m=>{ if(!Array.isArray(m.dates)) m.dates=[]; });
  if(!Array.isArray(data.advances)) data.advances = [];
  if(!Array.isArray(data.trash)) data.trash = [];
  // auto-download backup is now off by default (was a source of confusing Downloads clutter)
  data.settings.autoBackup = false;
  // migrate legacy single bank details into the banks[] array
  if(!Array.isArray(data.settings.banks)) data.settings.banks = [];
  if(data.settings.banks.length===0 && (data.settings.bankName||data.settings.bankAcc)){
    data.settings.banks.push({
      id: uid(), label: data.settings.bankName||"Primary account",
      name: data.settings.bankName||"", branch: data.settings.bankBranch||"",
      acc: data.settings.bankAcc||"", ifsc: data.settings.bankIfsc||"", acctype:"", isDefault: true
    });
  }
  // migrate legacy UPI (from settings or from any bank row) into upis[]
  if(!Array.isArray(data.settings.upis)) data.settings.upis = [];
  if(data.settings.upis.length===0){
    let legacyUpi = data.settings.bankUpi||"";
    if(!legacyUpi){ const wb=(data.settings.banks||[]).find(b=>b.upi); if(wb) legacyUpi=wb.upi; }
    if(legacyUpi){ data.settings.upis.push({id:uid(), label:"UPI", vpa:legacyUpi, isDefault:true}); }
  }
  // strip upi/showQr off any migrated bank rows
  (data.settings.banks||[]).forEach(b=>{ delete b.upi; delete b.showQr; });
  data.ver = APP_VER;
  data.schema = SCHEMA_VERSION;
  return data;
}
function save(){
  if(encEnabled() && _sessionKey){
    // write encrypted blob; remove any plaintext index
    encryptDB().then(blob=>{ if(blob){ localStorage.setItem(ENC_KEY, blob); localStorage.removeItem(LS_KEY); } })
      .catch(()=>toast("Could not save (encryption error).", true));
    return;
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast("Could not save the index. Export a backup now.", true); }
}

/* ===========================================================
   PROOF STORE — IndexedDB (uses your actual disk, no 5MB cap)
   Only the small JSON index lives in localStorage; the heavy
   PDF/image bytes live here, keyed by proof id.
   =========================================================== */
const IDB_NAME = "chamberProofs", IDB_STORE = "proofs";
let _idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{ _idb=req.result; res(_idb); };
    req.onerror = ()=>rej(req.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>res(r.result||null); r.onerror = ()=>rej(r.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error);
  });
}


/* ---------- numbering: computed from existing records (multi-device safe) ----------
   Instead of a hidden per-device counter, each number is derived from the
   highest sequence already present in the records everyone can see. Both the
   owner and staff devices see the same shared records, so they compute the
   same next number. Works offline; self-heals on sync. A duplicate check
   (findDuplicateNumbers) warns if two records ever share a number.            */
function _maxSeq(values, re){
  let max=0;
  (values||[]).forEach(v=>{
    if(!v) return;
    const m=String(v).match(re);
    if(m){ const n=parseInt(m[1],10); if(!isNaN(n)&&n>max) max=n; }
  });
  return max;
}
function _peekMatterSeq(){
  // highest of active matters (M-) — historical PC- and queries Q- are separate series
  return _maxSeq((DB.matters||[]).filter(m=>!m.historical && (m.code||"").indexOf("M-")===0).map(m=>m.code), /M-\d{2}-(\d+)/);
}
function nextReceiptNo(){
  const seqNum = _maxSeq((DB.receipts||[]).map(r=>r.no), new RegExp(esc(DB.settings.receiptPrefix)+"\\/[^\\/]+\\/(\\d+)")) + 1;
  DB.counters.receipt = Math.max(DB.counters.receipt||0, seqNum);
  return `${DB.settings.receiptPrefix}/${fyLabel(DB.settings.fyStart)}/${String(seqNum).padStart(3,"0")}`;
}
// read-only preview of the next receipt number (no counter mutation)
function peekNextReceiptNo(){
  const seqNum = _maxSeq((DB.receipts||[]).map(r=>r.no), new RegExp(esc(DB.settings.receiptPrefix)+"\\/[^\\/]+\\/(\\d+)")) + 1;
  return `${DB.settings.receiptPrefix}/${fyLabel(DB.settings.fyStart)}/${String(seqNum).padStart(3,"0")}`;
}

  const yr = DB.settings.fyStart.slice(2,4);

  DB.counters.matter = Math.max(DB.counters.matter||0, seqNum);
  return `M-${yr}-${String(seqNum).padStart(3,"0")}`;
}

}

}

/* SAFETY NET: detect any number issued twice (e.g. two offline devices).
   Returns a list like [{kind:"Matter", number:"M-26-001", count:2}]. */
function findDuplicateNumbers(){
  const out=[];
  const scan=(label, values)=>{
    const seen={};
    (values||[]).filter(Boolean).forEach(v=>{ seen[v]=(seen[v]||0)+1; });
    Object.keys(seen).forEach(k=>{ if(seen[k]>1) out.push({kind:label, number:k, count:seen[k]}); });
  };
  scan("Matter", (DB.matters||[]).filter(m=>!m.historical).map(m=>m.code));
  scan("Past case", (DB.matters||[]).filter(m=>m.historical).map(m=>m.code));
  scan("Receipt", (DB.receipts||[]).filter(r=>!isVoided(r)).map(r=>r.no));
  scan("Invoice", (DB.invoices||[]).filter(i=>!isVoided(i)).map(i=>i.no));
  scan("Voucher", (DB.expenses||[]).map(e=>e.voucherNo));
  return out;
}
function duplicateWarningHTML(){
  const dups=findDuplicateNumbers();
  if(!dups.length) return "";
  const lines=dups.map(d=>`${esc(d.kind)} <b>${esc(d.number)}</b> (\u00d7${d.count})`).join(", ");
  return `<div class="dup-warn">\u26a0\ufe0f Duplicate numbers detected: ${lines}. This can happen if two devices added records offline at the same time. Open each and renumber one to keep your records clean.</div>`;
}
/* ---------- delete / void / cancel core ----------
   Delete  = soft-delete (recoverable in trash). If the record holds the
             LATEST number in its series, roll the counter back so the number
             is reused; the trashed copy releases its number (formerNo).
   Void/Cancel = keep the record visible, mark status 'void'/'cancelled' with
             a short reason; number is retained and never reused; excluded
             from income totals.
   Series map: receipts->counters.receipt, invoices->counters.invoice,
             matters(kind case)->counters.matter, matters(kind query)->counters.query.
*/
function _seqInfo(coll, rec){
  // returns {counterKey, num} where num is the numeric sequence this record holds
  if(coll==="receipts"){ return {counterKey:"receipt", num:_numFromCode(rec.no)}; }
  if(coll==="invoices"){ return {counterKey:"invoice", num:_numFromCode(rec.no)}; }
  if(coll==="matters"){
    if(rec.kind==="query") return {counterKey:"query", num:_numFromCode(rec.code)};
    return {counterKey:"matter", num:_numFromCode(rec.code)};
  }
  return {counterKey:null, num:null};
}
function _numFromCode(code){
  if(!code) return null;
  // grab the LAST group of digits in the code (e.g. R/2026-27/014 -> 14, M-26-003 -> 3)
  const m = String(code).match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1],10) : null;
}
function _isLatestInSeries(coll, rec){
  const {counterKey, num} = _seqInfo(coll, rec);
  if(!counterKey || num==null) return false;
  return DB.counters[counterKey] === num;   // holds the top number
}
// Soft-delete (recoverable). Returns true if the number was reused.
function softDelete(coll, id){
  const arr = DB[coll]; if(!Array.isArray(arr)) return false;
  const idx = arr.findIndex(x=>x.id===id); if(idx<0) return false;
  const rec = arr[idx];
  const latest = _isLatestInSeries(coll, rec);
  const {counterKey, num} = _seqInfo(coll, rec);
  let reused=false, formerNo=null;
  if(latest && counterKey){
    DB.counters[counterKey] = Math.max(0, DB.counters[counterKey]-1); // roll back
    formerNo = rec.no || rec.code || null;
    reused=true;
  }
  // move to trash (recoverable); strip its active number if reused
  const trashed = Object.assign({}, rec);
  if(reused){ trashed.no=null; trashed.code=null; trashed._releasedNo=formerNo; }
  DB.trash = DB.trash || [];
  DB.trash.push({ id:uid(), coll, rec:trashed, deletedAt:new Date().toISOString(), formerNo });
  arr.splice(idx,1);
  save();
  return reused;
}
// Void/Cancel (keep, mark, never reuse number)
function voidRecord(coll, id, reason, label){
  const arr = DB[coll]; if(!Array.isArray(arr)) return;
  const rec = arr.find(x=>x.id===id); if(!rec) return;
  rec.status = label || "void";           // 'void' for receipts/invoices, 'cancelled' for matters
  rec.voidReason = reason || "";
  rec.voidedAt = new Date().toISOString();
  save();
}
function isVoided(rec){ return rec && (rec.status==="void" || rec.status==="cancelled" || rec.status==="rejected"); }
function isRejected(rec){ return rec && rec.status==="rejected"; }

async function gatherProofs(){
  const out = {};
  for(const e of DB.expenses){
    if(e.proofMeta){ try{ const d = await idbGet("proof:"+e.id); if(d) out[e.id] = d; }catch(_){} }
  }
  return out;
}
async function gatherDocFiles(){
  const out = {};
  for(const grp of [DB.docsIn, DB.docsFiled]){
    for(const x of (grp||[])){ for(const f of (x.files||[])){ try{ const d=await idbGet(f.key); if(d) out[f.key]=d; }catch(_){} } }
  }
  return out;
}
async function exportData(filenameOverride){
  const proofs = await gatherProofs();
  const docfiles = await gatherDocFiles();
  const bundle = Object.assign({}, DB, {_proofs: proofs, _docfiles: docfiles, _bundleVer: 2});
  const payload = JSON.stringify(bundle, null, 2);
  const blob = new Blob([payload], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const name = filenameOverride || `ChamberRegister-${todayISO()}.json`;
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  DB.lastBackup = new Date().toISOString();
  save();
}
function manualExport(){
  exportData(`ChamberRegister-MAIN.json`).then(()=>{
    toast("Exported ChamberRegister-MAIN.json — keep it in your Drive/iCloud folder.");
    renderData();
  });
}
function autoBackupIfDue(){ /* removed: cloud sync is the safety net; no auto-download */ }
function importData(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=="object" || (!("settings" in data) && !("receipts" in data)))
        throw new Error("Not a Chamber Register file");
      const proofs = data._proofs || {};
      const docfiles = data._docfiles || {};
      delete data._proofs; delete data._docfiles; delete data._bundleVer;
      DB = migrate(data);
      save();
      for(const [id, blobData] of Object.entries(proofs)){ try{ await idbPut("proof:"+id, blobData); }catch(_){} }
      for(const [key, blobData] of Object.entries(docfiles)){ try{ await idbPut(key, blobData); }catch(_){} }
      renderAll();
      toast("Data, attachments and documents restored.");
      closeModal();
    }catch(e){ toast("That file could not be read.", true); }
  };
  reader.readAsText(file);
}

      <div style="background:#faf5ee;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:12px">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">To confirm, type <b>ERASE</b> below:</div>

function _wipeCheck(){

async function doWipe(){

  fresh.deviceRole = DB.deviceRole;       // stay signed in as owner

/* ===========================================================
   DERIVED TOTALS
   =========================================================== */
function fyReceipts(){ return DB.receipts.filter(r=>inFY(r.date, DB.settings.fyStart) && !isVoided(r)); }
function fyExpenses(){ return DB.expenses.filter(e=>inFY(e.date, DB.settings.fyStart) && !isRejected(e)); }
function grossReceiptsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.amount||0),0); }
function expensesFY(){ return fyExpenses().reduce((s,e)=>s+(+e.amount||0),0); }
function presumptive(){ return Math.round(grossReceiptsFY()*0.5); }
function tdsFY(){ return fyReceipts().reduce((s,r)=>s+(+r.tds||0),0); }
function netActual(){ return grossReceiptsFY() - expensesFY(); }

/* ===========================================================
   STAFF ADVANCES / FLOAT (imprest) with review-then-accept
   Balance in staff hands = accepted advances - accepted expenses
     - accepted returns.  Only ACCEPTED entries count toward the
     balance and the chamber books (one source of truth).
   Staff-created entries start status:'pending'; owner accepts.
   Accepted expenses post to the chamber expense books (dual purpose),
   taking the next voucher number AT ACCEPTANCE (gap-free series).
   =========================================================== */
function advancesFor(uid){ return DB.advances.filter(a=>a.staffUid===uid); }
function acceptedFor(uid){ return advancesFor(uid).filter(a=>a.status==="accepted"); }
function pendingFor(uid){ return advancesFor(uid).filter(a=>a.status==="pending"); }
function allPending(){ return DB.advances.filter(a=>a.status==="pending"); }
function staffBalance(uid){
  return acceptedFor(uid).reduce((bal,a)=>{
    if(a.type==="advance") return bal + (+a.amount||0);
    if(a.type==="return")  return bal - (+a.amount||0);
    if(a.type==="expense") return bal - (+a.amount||0);
    return bal;
  }, 0);
}
function staffAdvancesTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="advance").reduce((s,a)=>s+(+a.amount||0),0); }
function staffExpensesTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="expense").reduce((s,a)=>s+(+a.amount||0),0); }
function staffReturnsTotal(uid){ return acceptedFor(uid).filter(a=>a.type==="return").reduce((s,a)=>s+(+a.amount||0),0); }
function pendingBalanceImpact(uid){
  // net effect on balance if all pending were accepted (for a staff "pending" note)
  return pendingFor(uid).reduce((d,a)=>{
    if(a.type==="advance") return d + (+a.amount||0);
    return d - (+a.amount||0);
  },0);
}
// Create an advance-ledger entry. byOwner => accepted immediately; staff => pending.
function addAdvanceEntry(type, staffUid, staffName, amount, date, note, opts){
  opts=opts||{};
  const rec={ id:uid(), staffUid, staffName:staffName||"", date:date||todayISO(), type,
    amount:+amount||0, note:note||"", mode:opts.mode||"Cash",
    head:opts.head||null, payee:opts.payee||null,
    status: opts.byOwner ? "accepted" : "pending",
    createdBy: opts.byOwner ? "owner" : "staff",
    createdAt: new Date().toISOString(),
    acceptedAt: opts.byOwner ? new Date().toISOString() : null,
    expenseId: null };
  if(type==="expense" && rec.status==="accepted"){ rec.expenseId = _postExpenseToBooks(rec); }
  DB.advances.push(rec); save(); return rec;
}
function acceptAdvance(id){
  const a=DB.advances.find(x=>x.id===id); if(!a || a.status!=="pending") return;
  a.status="accepted"; a.acceptedAt=new Date().toISOString();
  if(a.type==="expense"){ a.expenseId = _postExpenseToBooks(a); }
  save();
}
function rejectAdvance(id, reason){
  const a=DB.advances.find(x=>x.id===id); if(!a) return;
  a.status="rejected"; a.rejectReason=reason||""; a.rejectedAt=new Date().toISOString();
  save();
}
function _postExpenseToBooks(a){
  const expId=uid();
  DB.expenses.push({ id:expId, date:a.date||todayISO(), head:a.head||"Miscellaneous",
    payee:a.payee||"", amount:+a.amount||0, mode:"Cash", voucherNo:nextVoucherNo(),
    remarks:(a.note||"")+" (paid by "+(a.staffName||"staff")+" from advance)",
    staffUid:a.staffUid, fromAdvance:true });

function newRegimeTax(income){
  // FY 2025-26 new regime slabs + 87A rebate (nil up to 12L taxable).
  // Slabs: 0-4L nil, 4-8L 5%, 8-12L 10%, 12-16L 15%, 16-20L 20%, 20-24L 25%, >24L 30%.
  if(income<=1200000) return 0; // rebate makes it nil
  let t=0;
  const sl=[[400000,0],[800000,0.05],[1200000,0.10],[1600000,0.15],[2000000,0.20],[2400000,0.25],[Infinity,0.30]];
  let prev=0;
  for(const [cap,rate] of sl){ if(income>prev){ t+=(Math.min(income,cap)-prev)*rate; prev=cap; } else break; }
  return Math.round(t*1.04); // + 4% cess
}
function taxSnapshot(declared){
  const tds = tdsFY();
  const tax = newRegimeTax(declared);
  const balance = tax - tds;     // positive = payable, negative = refund
  const safe = declared <= 1200000;
  let line2;
  if(tax===0){
    line2 = tds>0
      ? `<div style="font-size:14px;margin-top:8px">Estimated tax: <b>\u20B90</b> (within \u20B912L rebate). TDS of <b>${fmtINR(tds)}</b> already deducted is <b>refundable</b> on filing.</div>`
      : "";
  } else {
    line2 = `<div style="font-size:14px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap">
      <span>Estimated tax: <b>${fmtINR(tax)}</b></span>
      <span>Less TDS credit: <b>${fmtINR(tds)}</b></span>
      <span>${balance>=0?`Balance payable: <b style="color:var(--seal)">${fmtINR(balance)}</b>`:`Refund due: <b style="color:var(--green)">${fmtINR(-balance)}</b>`}</span>
    </div>`;
  }
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:15px">Declared income this FY: <b>${fmtINR(declared)}</b></div>
      <span class="tag ${safe?'active':'closed'}">${safe?'Within \u20B912L rebate \u2014 indicatively nil tax':'Above \u20B912L \u2014 tax likely'}</span>
    </div>
    ${line2}
    <div class="hint" style="margin-top:10px;margin-bottom:0">TDS credit is the tax already withheld by clients against your PAN (visible in Form 26AS / AIS). It is set off against your tax — and refunded if it exceeds your liability. Figures indicative; confirm with your CA.</div>`;
}

let _tdsMode="no";
function setTdsMode(m){
  _tdsMode=m;
  document.querySelectorAll("#tdsSeg .seg-btn").forEach(b=>b.classList.toggle("on", b.dataset.tds===m));
  document.getElementById("tdsBox").style.display = m==="yes"?"block":"none";
  if(m==="no"){ document.getElementById("rcTdsRate").value=""; document.getElementById("rcTdsAmt").value=""; }
  updFee();
}
function setTdsRate(r){
  document.getElementById("rcTdsRate").value=r;
  document.getElementById("rcTdsAmt").value="";
  updFee("rate");
}
function focusCustomRate(){ const f=document.getElementById("rcTdsRate"); if(f){ f.value=""; f.focus(); } }
function computeFee(){
  const gross=+document.getElementById("rcGross").value||0;
  let tds=0;
  if(_tdsMode==="yes"){
    const amt=+document.getElementById("rcTdsAmt").value||0;
    const rate=+document.getElementById("rcTdsRate").value||0;
    if(amt>0) tds=amt;
    else if(rate>0) tds=Math.round(gross*rate/100);
  }
  if(tds>gross) tds=gross;
  return {gross, tds, net:gross-tds};
}
function updFee(src){
  // if user typed a rate, clear amount and vice-versa (they're alternatives)
  if(src==="rate"){ const a=document.getElementById("rcTdsAmt"); if(a) a.value=""; }
  if(src==="amt"){ const r=document.getElementById("rcTdsRate"); if(r) r.value=""; }
  const {gross,tds,net}=computeFee();
  const p=document.getElementById("rcPreview");
  if(!p) return;
  if(gross<=0){ p.innerHTML="Enter the gross fee to see the breakdown."; return; }
  if(_tdsMode==="no" || tds<=0){
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-muted">No TDS</span>`;
  }else{
    p.innerHTML=`<span class="fp-g">Gross ${fmtINR(gross)}</span> <span class="fp-sep">·</span> <span class="fp-t">TDS ${fmtINR(tds)}</span> <span class="fp-sep">·</span> <span class="fp-n">Net ${fmtINR(net)}</span>`;
  }
}
function quickMatter(){
  openModal("Quick new matter", matterFormHTML());
}

function issueReceipt(){
  const matterId = document.getElementById("rcMatter").value;
  const date = document.getElementById("rcDate").value;
  const {gross,tds,net}=computeFee();
  if(!matterId){ toast("Select a matter first.", true); return; }
  if(!date){ toast("Pick a date.", true); return; }
  if(!gross || gross<=0){ toast("Enter the gross professional fee.", true); return; }
  const no = nextReceiptNo();
  const rec = {
    id: uid(), no, date, matterId,
    amount: gross,               // gross fee (what the receipt acknowledges)
    net: net,                    // reaches bank
    tds: tds,                    // tax deducted at source
    showTds: document.getElementById("rcShowTds").checked,
    mode: document.getElementById("rcMode").value,
    towards: document.getElementById("rcTowards").value.trim() || "Professional fees",
    remarks: document.getElementById("rcRemarks").value.trim()
  };
  DB.receipts.push(rec);
  DB.cash.push({id:uid(), date, particulars:`Receipt ${no} — ${matterLabel(matterId)}${tds?" (net of TDS "+fmtINR(tds)+")":""}`,
    type:"in", amount: net, mode:rec.mode, ref:no});
  logActivity("receipt", `Receipt ${no} — ${fmtINR(rec.amount)}${matterId?" ("+matterLabel(matterId)+")":""}`, {ownerOnly:true, refId:rec.id});
  save();
  printReceipt(rec);
  renderAll();
  shellGo("books");
  toast(`Receipt ${no} saved.`);
}

  if(m.parties) rows.push(`<div class="row caze"><span class="k">Case</span><b>${esc(m.parties)}</b></div>`);
  if(m.court) rows.push(`<div class="row"><span class="k">Court</span><b>${esc(m.court)}</b></div>`);

  if(m.code) rows.push(`<div class="row"><span class="k">Our Ref.</span><b>${esc(m.code)}</b></div>`);

}
// Date formatter -> DD.MM.YYYY
function _tplDate(d){
  try{
    const dt = d ? new Date(d) : null;
    if(dt && !isNaN(dt)){
      const p=n=>String(n).padStart(2,"0");
      return `${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}`;
    }
  }catch(e){}
  // fall back to fmtDate if not parseable
  try{ return fmtDate(d); }catch(e){ return esc(String(d||"")); }
}
// "Generated on DD.MM.YYYY, h:MM AM/PM"
function _tplStamp(iso){
  try{
    const dt = iso ? new Date(iso) : new Date();
    if(isNaN(dt)) return "";
    const p=n=>String(n).padStart(2,"0");
    let h=dt.getHours(); const ap=h>=12?"PM":"AM"; h=h%12; if(h===0) h=12;
    return `Generated on ${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}, ${h}:${p(dt.getMinutes())} ${ap}`;
  }catch(e){ return ""; }
}
// Resolve the display name + role of whoever generated a document.
// Owner -> chamber advName + designation; staff -> their profile name + "Staff".
function _tplGenerator(rec, s){
  const staffView = (function(){ try{ return isStaffView(); }catch(e){ return false; } })();
  if(staffView){
    let nm="";
    try{ nm = (window.__staff && window.__staff.profile && window.__staff.profile.name) || ""; }catch(e){}
    nm = nm || rec.staffName || rec.createdByName || "Staff";
    return { name: nm, role: "Chambers of "+(s.chamberName||s.advName||"the Chamber") };
  }
  return { name: s.advName||s.chamberName||"", role: s.designation||"Advocate" };
}

function _daysInMonth(y,m){ return new Date(y, m, 0).getDate(); } // m is 1-12

    </div>

    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <div class="fld" style="margin-bottom:8px">Deductions</div>

        <label style="font-size:12.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <input type="checkbox" id="slLeaveChk" onchange="_slToggleLeave()"> Deduct for leave
        </label>
        <div id="slLeaveRow" style="display:none">
          <div style="display:flex;gap:8px;margin-bottom:8px;font-size:12px">

            <label style="display:flex;align-items:center;gap:5px"><input type="radio" name="slLeaveMode" value="amount" onchange="_slLeaveMode()"> By amount</label>
          </div>

function _slToggleAdv(){ const on=(document.getElementById("slAdvChk")||{}).checked; const r=document.getElementById("slAdvRow"); if(r) r.style.display=on?"block":"none"; }
function _slToggleLeave(){ const on=(document.getElementById("slLeaveChk")||{}).checked; const r=document.getElementById("slLeaveRow"); if(r) r.style.display=on?"block":"none"; if(on) _slUpdateLeaveCalc(); }
function _slLeaveMode(){
  const mode=(document.querySelector('input[name="slLeaveMode"]:checked')||{}).value;
  const d=document.getElementById("slLeaveDays"), a=document.getElementById("slLeaveAmt");
  if(d&&a){ d.style.display=(mode==="days")?"block":"none"; a.style.display=(mode==="amount")?"block":"none"; }
  _slUpdateLeaveCalc();
}
function _slParsePeriod(){
  const v=(document.getElementById("slMonth")||{}).value||"";
  const [y,m]=v.split("-").map(x=>parseInt(x,10));
  return {y,m}; // m 1-12
}
function _slUpdateLeaveCalc(){
  const el=document.getElementById("slLeaveCalc"); if(!el) return;
  const basic=parseFloat((document.getElementById("slBasic")||{}).value)||0;
  const days=parseFloat((document.getElementById("slLeaveDaysVal")||{}).value)||0;
  const {y,m}=_slParsePeriod();
  const dim=(y&&m)?_daysInMonth(y,m):30;
  if(days>0 && basic>0){ const perDay=basic/dim; el.textContent=`${days} day(s) × ${fmtINR(Math.round(perDay))}/day (basic ÷ ${dim}) = ${fmtINR(Math.round(perDay*days))}`; }
  else el.textContent=`Per-day = basic ÷ ${dim} days in month.`;
}
function doGenerateSlip(personId){
  const p=rosterById(personId); if(!p) return;
  const {y,m}=_slParsePeriod();
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const period=(y&&m)?`${months[m-1]} ${y}`:"";
  const basic=parseFloat((document.getElementById("slBasic")||{}).value)||0;
  if(basic<=0){ toast("Enter the basic pay.",true); return; }
  const payDate=(document.getElementById("slPayDate")||{}).value||todayISO();
  const payMode=(document.getElementById("slPayMode")||{}).value||"";
  const daysPresentRaw=(document.getElementById("slDaysPresent")||{}).value;
  const daysPresent = daysPresentRaw!=="" ? parseInt(daysPresentRaw,10) : null;
  const dim=(y&&m)?_daysInMonth(y,m):null;
  const deductions=[];
  let recoverAmt=0;
  // advance recovery
  if((document.getElementById("slAdvChk")||{}).checked){
    recoverAmt=parseFloat((document.getElementById("slAdvAmt")||{}).value)||0;
    const bal=salaryAdvBalance(personId);
    if(recoverAmt>bal) recoverAmt=bal;
    if(recoverAmt>0) deductions.push({label:"Advance recovered", amount:recoverAmt, sub:"as agreed"});
  }
  // leave
  if((document.getElementById("slLeaveChk")||{}).checked){
    const mode=(document.querySelector('input[name="slLeaveMode"]:checked')||{}).value;
    if(mode==="days"){
      const days=parseFloat((document.getElementById("slLeaveDaysVal")||{}).value)||0;
      if(days>0 && dim){ const amt=Math.round((basic/dim)*days); deductions.push({label:"Leave deduction", amount:amt, sub:days+" day(s)"}); }
    }else{
      const amt=parseFloat((document.getElementById("slLeaveAmtVal")||{}).value)||0;
      if(amt>0) deductions.push({label:"Leave deduction", amount:amt});
    }
  }
  // other
  const oLabel=(document.getElementById("slOtherLabel")||{}).value.trim();
  const oAmt=parseFloat((document.getElementById("slOtherAmt")||{}).value)||0;
  if(oLabel && oAmt>0) deductions.push({label:oLabel, amount:oAmt});

  const totalDed=deductions.reduce((t,d)=>t+(+d.amount||0),0);
  const net=basic-totalDed;
  const g=_tplGenerator({}, DB.settings);
  const slip={ id:uid(), no:nextSalarySlipNo(), personId, name:p.name, period, payDate, payMode,
    basic, deductions, net, daysPresent, daysInMonth:dim,
    genAt:new Date().toISOString(), genBy:g.name };
  DB.salarySlips.push(slip);
  // post the recovery to the salary-advance ledger (marks it recovered)
  if(recoverAmt>0) recordSalaryRecovery(personId, recoverAmt, payDate, "Recovered via "+slip.no, slip.id);
  logActivity("salary", `Salary slip ${slip.no} — ${p.name} (${period}), net ${fmtINR(net)}`, {ownerOnly:true, refId:slip.id});
  save();
  closeModal();
  if(document.getElementById("panel-persondetail").classList.contains("active")) renderPersonDetail();
  else renderSalary();
  printSalarySlip(slip.id);
}

      <div class="grid g2" style="margin-top:11px">

              <option value="none">No mention</option>
            </select>

        <div class="eyebrow">Expenses / out-of-pocket (optional)</div>
        <div id="ivExpenses"></div>
        <button class="btn ghost sm" onclick="addInvExpense()" style="margin-top:8px">+ Add expense line</button>
      </div>

      <div style="margin-top:14px"><label class="fld">Notes on the invoice (optional)</label>
        <input class="in" id="ivNotes" placeholder="e.g. towards drafting and filing of SLP, appearances on 2 dates"></div>

      <div class="note" id="ivTotalNote" style="font-size:14px">Total: ₹0</div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn seal" onclick="saveAndPrintInvoice()">Save &amp; print invoice</button>
      </div>
    </div>`;
  // init lines
  if(_invLines.length===0) _invLines=[{desc:"Professional fees",amount:""}];
  drawInvLines(); drawInvExpenses(); onInvStyleChange(); onDueModeChange();
}
function renderInvoiceLedger(){
  const list=[...DB.invoices].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.no||"").localeCompare(a.no||""));
  const raised = list.filter(i=>!isVoided(i)).reduce((s,inv)=>s+((inv.lines||[]).reduce((x,l)=>x+(+l.amount||0),0)+(inv.expenses||[]).reduce((x,l)=>x+(+l.amount||0),0)),0);
  const rows=list.map(inv=>{
    const tot=(inv.lines||[]).reduce((s,l)=>s+(+l.amount||0),0)+(inv.expenses||[]).reduce((s,l)=>s+(+l.amount||0),0);
    const voided=isVoided(inv);
    const noCell = voided
      ? `<span style="text-decoration:line-through;color:var(--muted)">${esc(inv.no)}</span> <span class="tag">Void${inv.voidReason?" ("+esc(inv.voidReason)+")":""}</span>`
      : esc(inv.no);
    return `<tr${voided?' style="opacity:.6"':''}><td class="mono">${noCell}</td><td>${fmtDate(inv.date)}</td>
      <td>${esc(matterLabel(inv.matterId))}</td><td>${inv.style==="itemised"?"Itemised":"Consolidated"}</td>
      <td class="num">${fmtINR(tot)}</td>
      <td style="white-space:nowrap"><button class="row-act" onclick="reprintInvoice('${inv.id}')">Print</button>
        ${voided?"":`<button class="row-act" onclick="voidInvoice('${inv.id}')">Void</button>`}
        <button class="row-act" onclick="delInvoice('${inv.id}')">Delete</button></td></tr>`;
  }).join("");
  document.getElementById("panel-invoiceledger").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><h2>Invoices</h2><div class="hint">All fee invoices raised. Total billed (excluding voided): <b>${fmtINR(raised)}</b></div></div>
        <button class="btn ghost sm" onclick="openBilling('invoice')">+ New invoice</button>
      </div>
      ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Date</th><th>Matter</th><th>Style</th><th class="num">Total</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No invoices raised yet.</div>`}
    </div>`;
}
function onInvStyleChange(){
  const style=document.getElementById("ivStyle").value;
  const addBtn=document.getElementById("ivAddLine");
  // consolidated: single locked-ish line; itemised: multiple
  if(style==="consolidated"){
    if(_invLines.length>1) _invLines=[{desc:"Professional fees", amount:_invLines.reduce((s,l)=>s+(+l.amount||0),0)||""}];
    if(_invLines.length===0) _invLines=[{desc:"Professional fees",amount:""}];
    addBtn.style.display="none";
  }else{
    addBtn.style.display="inline-flex";
  }
  drawInvLines(); recalcInvTotal();
}
function drawInvLines(){
  const wrap=document.getElementById("ivLines"); if(!wrap) return;
  wrap.innerHTML=_invLines.map((l,i)=>`<div class="grid" style="grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:7px">
    <input class="in" placeholder="Description of work" value="${esc(l.desc)}" oninput="updInvLine(${i},'desc',this.value)">
    <input class="in" type="number" min="0" placeholder="Amount" value="${esc(l.amount)}" oninput="updInvLine(${i},'amount',this.value)">
    ${_invLines.length>1?`<button class="btn ghost sm" onclick="rmInvLine(${i})" style="padding:6px">✕</button>`:"<div></div>"}
  </div>`).join("");
}
function drawInvExpenses(){
  const wrap=document.getElementById("ivExpenses"); if(!wrap) return;
  wrap.innerHTML=_invExpenses.map((l,i)=>`<div class="grid" style="grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:7px">
    <input class="in" placeholder="e.g. court fees, travel, printing" value="${esc(l.desc)}" oninput="updInvExp(${i},'desc',this.value)">
    <input class="in" type="number" min="0" placeholder="Amount" value="${esc(l.amount)}" oninput="updInvExp(${i},'amount',this.value)">
    <button class="btn ghost sm" onclick="rmInvExp(${i})" style="padding:6px">✕</button>
  </div>`).join("");
}
function addInvLine(){ _invLines.push({desc:"",amount:""}); drawInvLines(); }
function rmInvLine(i){ _invLines.splice(i,1); if(!_invLines.length)_invLines=[{desc:"",amount:""}]; drawInvLines(); recalcInvTotal(); }
function updInvLine(i,k,v){ _invLines[i][k]=v; if(k==="amount")recalcInvTotal(); }
function addInvExpense(){ _invExpenses.push({desc:"",amount:""}); drawInvExpenses(); }
function rmInvExp(i){ _invExpenses.splice(i,1); drawInvExpenses(); recalcInvTotal(); }
function updInvExp(i,k,v){ _invExpenses[i][k]=v; if(k==="amount")recalcInvTotal(); }
function recalcInvTotal(){
  const fees=_invLines.reduce((s,l)=>s+(+l.amount||0),0);
  const exp=_invExpenses.reduce((s,l)=>s+(+l.amount||0),0);
  const note=document.getElementById("ivTotalNote");
  if(note) note.innerHTML=`Fees ${fmtINR(fees)}${exp?` + Expenses ${fmtINR(exp)}`:""} &nbsp;=&nbsp; <b>Total ${fmtINR(fees+exp)}</b>`;
}
function saveAndPrintInvoice(){
  const matterId=document.getElementById("ivMatter").value;
  const date=document.getElementById("ivDate").value;
  if(!matterId){ toast("Select a matter.",true); return; }
  if(!date){ toast("Pick a date.",true); return; }
  const lines=_invLines.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim()||"Professional fees",amount:+l.amount||0}));
  const expenses=_invExpenses.filter(l=>l.desc.trim()||(+l.amount>0)).map(l=>({desc:l.desc.trim(),amount:+l.amount||0}));
  if(!lines.length || lines.reduce((s,l)=>s+l.amount,0)<=0){ toast("Enter at least one fee amount.",true); return; }
  const dueMode=document.getElementById("ivDueMode").value;
  const dueDays=+document.getElementById("ivDueDays").value||0;
  const bankSel=document.getElementById("ivBank");
  const upiSel=document.getElementById("ivUpi");
  const qrChk=document.getElementById("ivQr");
  const inv={ id:uid(), no:nextInvoiceNo(), date, matterId,
    style:document.getElementById("ivStyle").value, dueMode, due:dueDays,
    bankId: bankSel? bankSel.value : (defaultBank()?defaultBank().id:""),
    upiId: upiSel? upiSel.value : (defaultUpi()?defaultUpi().id:""),
    showQr: qrChk? qrChk.checked : false,
    lines, expenses, notes:document.getElementById("ivNotes").value.trim(), status:"raised" };
  DB.invoices.push(inv);
  logActivity("invoice", `Invoice ${inv.no||""} — ${fmtINR(inv.total||inv.amount||0)}`, {ownerOnly:true, refId:inv.id});
  save();
  printInvoice(inv);
  _invLines=[{desc:"Professional fees",amount:""}]; _invExpenses=[];
  save(); renderInvoice(); markPanel("invoice");
  toast(`Invoice ${inv.no} saved.`);
}
function onDueModeChange(){
  const mode=document.getElementById("ivDueMode").value;
  document.getElementById("ivDueDays").style.display = mode==="days" ? "block" : "none";
}
function reprintInvoice(id){ const inv=DB.invoices.find(x=>x.id===id); if(inv) _docPrintChooser("invoice", inv); }
function delInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  const latest=_isLatestInSeries("invoices",inv);
  const warn = latest
    ? `Invoice <b>${esc(inv.no)}</b> is the latest in the series. Deleting it frees the number ${esc(inv.no)} to be used again — right for a test or mistaken entry.`
    : `Invoice <b>${esc(inv.no)}</b> is not the latest. Deleting leaves a permanent gap at ${esc(inv.no)}. If this invoice was actually issued to a client, use <b>Void</b> instead so the number stays on record.`;
  openModal("Delete invoice?", `
    <div class="hint">${warn}</div>
    <div class="note">Deleted items are recoverable from More → Backup, if needed.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${latest?"":`<button class="btn ghost" onclick="closeModal();voidInvoice('${id}')">Void instead</button>`}
      <button class="btn seal" onclick="doDelInvoice('${id}')">Delete</button>
    </div>`);
}
function _refreshInvoiceViews(){
  const ledgerActive=document.getElementById("panel-invoiceledger") && document.getElementById("panel-invoiceledger").classList.contains("active");
  if(ledgerActive) renderInvoiceLedger();
  else renderInvoice();
}
function doDelInvoice(id){
  const reused=softDelete("invoices",id);
  closeModal(); _refreshInvoiceViews();
  toast(reused?"Invoice deleted — number freed for reuse.":"Invoice deleted.");
}
function voidInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id); if(!inv) return;
  openModal("Void invoice "+esc(inv.no), `
    <div class="hint">The invoice stays on record as <b>cancelled</b> and its number is never reused. Add a short reason (shown in brackets).</div>
    <label class="fld">Reason</label>
    <input class="in" id="voidReason" placeholder="e.g. wrong amount, duplicate" maxlength="60">
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doVoidInvoice('${id}')">Void invoice</button>
    </div>`);
}
function doVoidInvoice(id){
  const reason=(document.getElementById("voidReason")||{}).value||"";
  voidRecord("invoices",id,reason,"void");
  closeModal(); _refreshInvoiceViews(); toast("Invoice voided.");
}

function printInvoice(inv, opts){
  opts = opts || {};
  const s=Object.assign({}, DB.settings, {__bw: !!opts.bw});
  const m=matterById(inv.matterId)||{};
  const fees=(inv.lines||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const exp=(inv.expenses||[]).reduce((sm,l)=>sm+(+l.amount||0),0);
  const grand=fees+exp;
  let rows="";
  if(inv.style==="itemised"){
    (inv.lines||[]).forEach((l,i)=>{ rows+=`<tr><td>${i+1}</td><td>${esc(l.desc)}</td><td class="r">${fmtINR(l.amount)}</td></tr>`; });
  }else{
    const desc = inv.notes || "Professional fees for legal services rendered in the matter";
    rows += `<tr><td>1</td><td>${esc(desc)}</td><td class="r">${fmtINR(fees)}</td></tr>`;
  }
  (inv.expenses||[]).forEach((l,i)=>{ rows+=`<tr><td>${(inv.style==="itemised"?((inv.lines||[]).length+i+1):(i+2))}</td><td>${esc(l.desc)} <span style="color:var(--tpx-muted)">(expense)</span></td><td class="r">${fmtINR(l.amount)}</td></tr>`; });

  // Payable-within line (only when a due term is set)
  let payableText="";
  if(inv.dueMode==="days" || (inv.dueMode===undefined && inv.due)) payableText = `Payable within ${esc(inv.due)} day(s) of receipt.`;
  else if(inv.dueMode==="onreceipt") payableText = "Payable on receipt.";

  // bank account (independent of UPI)
  let bk = null;
  if(inv.bankId!==undefined){ bk = inv.bankId ? bankById(inv.bankId) : null; }
  else { bk = defaultBank(); }
  const hasBank = bk && (bk.name||bk.acc||bk.ifsc||bk.branch);
  // UPI (independent of bank)
  let up = null;
  if(inv.upiId!==undefined){ up = inv.upiId ? upiById(inv.upiId) : null; }
  else { up = defaultUpi(); }
  const hasUpi = up && up.vpa;
  const pan = s.pan||"";
  let qrSvg="";
  if(hasUpi && inv.showQr!==false){
    const payee=encodeURIComponent(s.chamberName||s.advName||"");
    const amt=encodeURIComponent(grand.toFixed(2));
    const note=encodeURIComponent("Invoice "+(inv.no||""));
    const upiStr=`upi://pay?pa=${encodeURIComponent(up.vpa)}&pn=${payee}&am=${amt}&cu=INR&tn=${note}`;
    try{ qrSvg = QR.svg(upiStr, 92); }catch(e){ qrSvg=""; }
  }
  const payRows=[
    hasBank&&bk.name?`<div class="row"><span class="k">Account name</span><b>${esc(bk.name)}</b></div>`:"",
    hasBank&&bk.branch?`<div class="row"><span class="k">Bank &amp; branch</span><b>${esc(bk.branch)}</b></div>`:"",
    hasBank&&bk.acc?`<div class="row"><span class="k">Account no.</span><b>${esc(bk.acc)}</b></div>`:"",
    hasBank&&bk.ifsc?`<div class="row"><span class="k">IFSC</span><b>${esc(bk.ifsc)}</b></div>`:"",
    hasUpi?`<div class="row"><span class="k">UPI ID</span><b>${esc(up.vpa)}</b></div>`:"",
    pan?`<div class="row"><span class="k">PAN</span><b>${esc(pan)}</b></div>`:""
  ].filter(Boolean).join("");
  const instr = `${payableText?esc(payableText)+" ":""}Please quote the invoice number with your payment. ${s.rcmNote?esc(s.rcmNote)+" ":"Legal services are exempt/under reverse charge; no GST is charged on this memo of fees. "}This is a bill of costs and not a receipt — a separate receipt will be issued upon payment.`;
  const noteBlock = (payRows||qrSvg) ? `<div class="tpl-noteblk">
        <div class="h">Payment Details</div>
        <div class="paygrid">
          ${payRows?`<div class="pcol">${payRows}</div>`:""}
          ${qrSvg?`<div class="qr"><div class="cap">Scan &amp; Pay</div>${qrSvg}</div>`:""}
        </div>
        <div class="instr">${instr}</div>
      </div>` : `<div class="tpl-noteblk"><div class="h">Payment Details</div><div class="instr">${instr}</div></div>`;

  // Bill To — client name + optional address/phone
  const billMeta=[m.clientAddr, m.clientPhone].filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join("");
  const billBlock = `<div class="tpl-col">
        <div class="tpl-lbl">Bill To</div>
        <div class="tpl-bigname">${esc(m.client||"—")}</div>
        ${billMeta?`<div class="tpl-meta">${billMeta}</div>`:""}
      </div>`;
  const caseBlock = _tplCaseBlock(m);

  document.getElementById("receiptArea").innerHTML=`
   <div class="tpl${opts.bw?" bw":""}">
     ${_tplMast(s)}
     <div class="tpl-dband"><div class="tpl-dtitle">Memorandum of Fees</div></div>
     <div class="tpl-body">
       ${_tplNoRow("Invoice No.", inv.no, _tplDate(inv.date))}
       <div class="tpl-cols${caseBlock?"":" solo"}">
         ${billBlock}
         ${caseBlock}
       </div>
       <table class="tpl-tbl">
         <thead><tr><th style="width:42px">Sr.</th><th>Particulars</th><th class="r" style="width:130px">Amount (₹)</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>
       <div class="tpl-tot"><table>
         <tr><td class="k">Professional fees</td><td class="r">${fmtINR(fees)}</td></tr>
         ${exp?`<tr><td class="k">Expenses / out-of-pocket</td><td class="r">${fmtINR(exp)}</td></tr>`:""}
         <tr class="grand"><td class="k">Total Amount Due</td><td class="r">${fmtINR(grand)}</td></tr>
       </table></div>
       <div class="tpl-words">(Rupees ${esc(numToWords(grand))} only)</div>
       ${payableText?`<div class="tpl-payable">${esc(payableText)}</div>`:""}
       ${noteBlock}
       ${_tplSign(s)}
     </div>
     ${_tplFoot(s)}
   </div>`;
  if(!opts.noPrint) setTimeout(()=>_printAs("ASDC Invoice number "+String(inv.no||"").replace(/[\/\\]/g,"-")),150);
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

      if (_buflen > 0) {
        writeEncoded(_buffer << (6 - _buflen) );
        _buffer = 0;
        _buflen = 0;
      }

      if (_length % 3 != 0) {
        // padding
        var padlen = 3 - _length % 3;
        for (var i = 0; i < padlen; i += 1) {
          _base64 += '=';
        }
      }
    };

    _this.toString = function() {
      return _base64;
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // base64DecodeInputStream
  //---------------------------------------------------------------------

  var base64DecodeInputStream = function(str) {

    var _str = str;
    var _pos = 0;
    var _buffer = 0;
    var _buflen = 0;

    var _this = {};

    _this.read = function() {

      while (_buflen < 8) {

        if (_pos >= _str.length) {
          if (_buflen == 0) {
            return -1;
          }
          throw 'unexpected end of file./' + _buflen;
        }

        var c = _str.charAt(_pos);
        _pos += 1;

        if (c == '=') {
          _buflen = 0;
          return -1;
        } else if (c.match(/^\s$/) ) {
          // ignore if whitespace.
          continue;
        }

        _buffer = (_buffer << 6) | decode(c.charCodeAt(0) );
        _buflen += 6;
      }

      var n = (_buffer >>> (_buflen - 8) ) & 0xff;
      _buflen -= 8;
      return n;
    };

    var decode = function(c) {
      if (0x41 <= c && c <= 0x5a) {
        return c - 0x41;
      } else if (0x61 <= c && c <= 0x7a) {
        return c - 0x61 + 26;
      } else if (0x30 <= c && c <= 0x39) {
        return c - 0x30 + 52;
      } else if (c == 0x2b) {
        return 62;
      } else if (c == 0x2f) {
        return 63;
      } else {
        throw 'c:' + c;
      }
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // gifImage (B/W)
  //---------------------------------------------------------------------

  var gifImage = function(width, height) {

    var _width = width;
    var _height = height;
    var _data = new Array(width * height);

    var _this = {};

    _this.setPixel = function(x, y, pixel) {
      _data[y * _width + x] = pixel;
    };

    _this.write = function(out) {

      //---------------------------------
      // GIF Signature

      out.writeString('GIF87a');

      //---------------------------------
      // Screen Descriptor

      out.writeShort(_width);
      out.writeShort(_height);

      out.writeByte(0x80); // 2bit
      out.writeByte(0);
      out.writeByte(0);

      //---------------------------------
      // Global Color Map

      // black
      out.writeByte(0x00);
      out.writeByte(0x00);
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);
      out.writeByte(0xff);
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeString(',');
      out.writeShort(0);
      out.writeShort(0);
      out.writeShort(_width);
      out.writeShort(_height);
      out.writeByte(0);

      //---------------------------------
      // Local Color Map

      //---------------------------------
      // Raster Data

      var lzwMinCodeSize = 2;
      var raster = getLZWRaster(lzwMinCodeSize);

      out.writeByte(lzwMinCodeSize);

      var offset = 0;

      while (raster.length - offset > 255) {
        out.writeByte(255);
        out.writeBytes(raster, offset, 255);
        offset += 255;
      }

      out.writeByte(raster.length - offset);
      out.writeBytes(raster, offset, raster.length - offset);
      out.writeByte(0x00);

      //---------------------------------
      // GIF Terminator
      out.writeString(';');
    };

    var bitOutputStream = function(out) {

      var _out = out;
      var _bitLength = 0;
      var _bitBuffer = 0;

      var _this = {};

      _this.write = function(data, length) {

        if ( (data >>> length) != 0) {
          throw 'length over';
        }

        while (_bitLength + length >= 8) {
          _out.writeByte(0xff & ( (data << _bitLength) | _bitBuffer) );
          length -= (8 - _bitLength);
          data >>>= (8 - _bitLength);
          _bitBuffer = 0;
          _bitLength = 0;
        }

        _bitBuffer = (data << _bitLength) | _bitBuffer;
        _bitLength = _bitLength + length;
      };

      _this.flush = function() {
        if (_bitLength > 0) {
          _out.writeByte(_bitBuffer);
        }
      };

      return _this;
    };

    var getLZWRaster = function(lzwMinCodeSize) {

      var clearCode = 1 << lzwMinCodeSize;
      var endCode = (1 << lzwMinCodeSize) + 1;
      var bitLength = lzwMinCodeSize + 1;

      // Setup LZWTable
      var table = lzwTable();

      for (var i = 0; i < clearCode; i += 1) {
        table.add(String.fromCharCode(i) );
      }
      table.add(String.fromCharCode(clearCode) );
      table.add(String.fromCharCode(endCode) );

      var byteOut = byteArrayOutputStream();
      var bitOut = bitOutputStream(byteOut);

      // clear code
      bitOut.write(clearCode, bitLength);

      var dataIndex = 0;

      var s = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

      while (dataIndex < _data.length) {

        var c = String.fromCharCode(_data[dataIndex]);
        dataIndex += 1;

        if (table.contains(s + c) ) {

          s = s + c;

        } else {

          bitOut.write(table.indexOf(s), bitLength);

          if (table.size() < 0xfff) {

            if (table.size() == (1 << bitLength) ) {
              bitLength += 1;
            }

            table.add(s + c);
          }

          s = c;
        }
      }

      bitOut.write(table.indexOf(s), bitLength);

      // end code
      bitOut.write(endCode, bitLength);

      bitOut.flush();

      return byteOut.toByteArray();
    };

    var lzwTable = function() {

      var _size = 0;

      var _this = {};

      _this.add = function(key) {

          throw 'dup key:' + key;
        }
        _map[key] = _size;
        _size += 1;
      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

      _this.contains = function(key) {
        return typeof _map[key] != 'undefined';
      };

      return _this;
    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  // returns qrcode function.

  return qrcode;

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

/* QR.svg wrapper for inline use (UPI payloads) */
var QR = (function(){
  function svg(text, px){
    try{
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount();
      var rects = "";
      for(var r=0;r<n;r++)for(var c=0;c<n;c++){ if(qr.isDark(r,c)) rects += '<rect x="'+c+'" y="'+r+'" width="1" height="1"/>'; }
      var dim = n+8;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 '+dim+' '+dim+'" width="'+(px||140)+'" height="'+(px||140)+'"><rect x="-4" y="-4" width="'+dim+'" height="'+dim+'" fill="#fff"/><g fill="#1a1a18">'+rects+'</g></svg>';
    }catch(e){ return ""; }
  }
  return { svg: svg };
})();


function numToWords(n){
  n = Math.round(Number(n)||0);
  if(n===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=> x<20? a[x] : b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=> { const h=Math.floor(x/100), r=x%100; return (h? a[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
  let out="", crore=Math.floor(n/10000000); n%=10000000;
  let lakh=Math.floor(n/100000); n%=100000;
  let thou=Math.floor(n/1000); n%=1000;
  let hund=n;
  if(crore) out+=two(crore)+" Crore ";
  if(lakh) out+=two(lakh)+" Lakh ";
  if(thou) out+=two(thou)+" Thousand ";
  if(hund) out+=three(hund);
  return out.trim().replace(/\s+/g," ");
}

function deleteMatter(id){
  const m=matterById(id); if(!m) return;
  const has = DB.receipts.some(r=>r.matterId===id && !isVoided(r));
  const latest=_isLatestInSeries("matters",m);
  const kindLabel = m.kind==="query"?"query":"case";
  let warn;
  if(has){
    warn = `This ${kindLabel} has receipts against it. Deleting the ${kindLabel} would orphan them. Consider <b>Cancel</b> instead, which keeps the record and its number.`;
  }else if(latest){
    warn = `<b>${esc(m.code)}</b> is the latest ${kindLabel} number. Deleting frees ${esc(m.code)} for reuse — right for a test or mistaken entry.`;
  }else{
    warn = `Deleting <b>${esc(m.code)}</b> leaves a permanent gap in the ${kindLabel} series. If this was a real ${kindLabel}, use <b>Cancel</b> instead.`;
  }
  openModal("Delete "+kindLabel+"?", `
    <div class="hint">${warn}</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel action</button>
      <button class="btn ghost" onclick="closeModal();cancelMatter('${id}')">Mark cancelled</button>
      ${has?"":`<button class="btn seal" onclick="doDeleteMatter('${id}')">Delete</button>`}
    </div>`);
}

/* ===========================================================
   APPOINTMENTS & MEETINGS
   - Case-related / Other business -> SHARED (DB.appointments)
   - Personal -> PRIVATE to the person (DB.myAppointments, mirrored
     to their own account space; never shared)
   Both owner and staff can add/edit/delete shared ones.
   =========================================================== */
function _myApptKey(){
  const who = isStaffView() ? ((window.__staff&&window.__staff.uid)||"staff") : "owner";
  return "asd_myappts_"+who;
}
function _loadMyAppts(){
  // Always load strictly from THIS person's key. Never inherit another
  // person's in-memory personal appointments (privacy).
  let v=[];
  try{ const raw=localStorage.getItem(_myApptKey()); v=raw?JSON.parse(raw):[]; }catch(e){ v=[]; }
  DB.myAppointments = Array.isArray(v)? v : [];
  return DB.myAppointments;
}
function _saveMyAppts(){
  try{ localStorage.setItem(_myApptKey(), JSON.stringify(DB.myAppointments||[])); }catch(e){}
  try{ if(window.FB && FB.putOwnDoc) FB.putOwnDoc("private","appointments",{list:DB.myAppointments||[]}); }catch(e){}
}
function _allApptsForMe(){
  // shared (case/business) + my personal ones
  const shared=(DB.appointments||[]);
  const mine=_loadMyAppts();
  return shared.concat(mine);
}

function addTodo(){

function deleteTodo(id){

function headLabelOrStaff(){

}
/* ===========================================================
   ACTIVITY FEED (in-app notifications)
   Shared events (matters, expenses, advances, tasks, documents) go to the
   shared feed everyone sees. Owner-only events (receipts, invoices) go to a
   private owner feed so the finance wall is preserved — staff never see them.
   =========================================================== */
function logActivity(type, text, opts){
  opts=opts||{};
  const ev={ id:uid(), type, text:text||"", who:headLabelOrStaff(), at:new Date().toISOString(), refId:opts.refId||"" };
  if(opts.ownerOnly){
    if(!Array.isArray(DB._ownerActivity)) DB._ownerActivity=[];
    DB._ownerActivity.unshift(ev);
    DB._ownerActivity=DB._ownerActivity.slice(0,300);
  }else{
    if(!Array.isArray(DB.activity)) DB.activity=[];
    DB.activity.push(ev);
    // keep the shared feed from growing without bound
    if(DB.activity.length>400) DB.activity=DB.activity.slice(-400);
  }
  _refreshActivityBadge();
}
function _activityForMe(){
  const shared=(DB.activity||[]).slice();
  const own = (!isStaffView() && Array.isArray(DB._ownerActivity)) ? DB._ownerActivity.slice() : [];
  return shared.concat(own).sort((a,b)=>(b.at||"").localeCompare(a.at||""));
}
function _activitySeenKey(){
  const who = isStaffView() ? ((window.__staff&&window.__staff.uid)||"staff") : "owner";
  return "asd_activity_seen_"+who;
}
function _lastSeenActivity(){
  try{ return localStorage.getItem(_activitySeenKey())||""; }catch(e){ return ""; }
}
function _markActivitySeen(){
  const list=_activityForMe();
  const newest=list.length?list[0].at:new Date().toISOString();
  try{ localStorage.setItem(_activitySeenKey(), newest); }catch(e){}
  _refreshActivityBadge();
}
function unreadActivityCount(){
  const seen=_lastSeenActivity();
  return _activityForMe().filter(e=>(e.at||"")>seen).length;
}
function _refreshActivityBadge(){
  const n=unreadActivityCount();
  document.querySelectorAll(".act-badge").forEach(b=>{
    b.textContent = n>99?"99+":String(n);
    b.style.display = n>0 ? "inline-flex" : "none";
  });
  // refresh the feed panel if open
  const ap=document.getElementById("panel-activity");
  if(ap && ap.classList.contains("active")) try{ renderActivity(isStaffView()); }catch(e){}
}
var _actIcon={matter:"📋",receipt:"🧾",invoice:"📄",expense:"💸",advance:"💵",task:"✅",document:"📎",date:"📅",appointment:"🗓️",staff:"👤"};
function openActivity(){
  if(isStaffView()){
    _shellTab="activity"; renderStaffBotNav&&renderStaffBotNav();
    document.querySelectorAll("#appRoot .panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("panel-activity").classList.add("active");
    renderActivity(true); _markActivitySeen();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{ openSub("activity"); _markActivitySeen(); }
}
function renderActivity(staffBack){
  const panel=document.getElementById("panel-activity");
  const staff=isStaffView();
  const backBar = staff ? `<div class="subnav"><button class="subnav-back" onclick="staffGo('home')">‹</button><span style="align-self:center;font-weight:600;color:var(--seal)">Activity</span></div>` : "";
  const list=_activityForMe();
  const seen=_lastSeenActivity();
  const rows = list.length ? list.slice(0,150).map(e=>{
    const isNew=(e.at||"")>seen;
    const go = _activityHasTarget(e) ? ` onclick="_activityGoTo('${e.type}','${(e.refId||"").replace(/'/g,"")}')" style="cursor:pointer"` : "";
    return `<div class="act-row${isNew?" act-new":""}"${go}>
      <span class="act-ic">${_actIcon[e.type]||"•"}</span>
      <div class="act-main"><div class="act-text">${esc(e.text)}</div>
        <div class="act-meta">${esc(e.who||"")} · ${_actWhen(e.at)}</div></div>
      ${_activityHasTarget(e)?`<span class="act-chev">›</span>`:""}
      ${isNew?`<span class="act-newdot"></span>`:""}
    </div>`;
  }).join("") : `<div class="empty" style="padding:18px">No activity yet.</div>`;
  const clearBtn = list.length ? `<button class="btn ghost sm" onclick="clearActivity()">Clear</button>` : "";
  panel.innerHTML=`${backBar}
    <div class="card">
      <div class="card-head"><div><h2>Activity</h2><div class="hint">Everything logged in the chamber${staff?"":", including your receipts and invoices"}. Tap an item to open it.</div></div>${clearBtn}</div>
      <div class="act-list">${rows}</div>
    </div>`;
}
// Which activity types can open an underlying record (needs a refId we can route)
function _activityHasTarget(e){
  if(!e) return false;
  if(e.type==="matter") return true; // routes by refId or by parsing code
  return !!e.refId && ["receipt","invoice","expense","advance","task","document","appointment","date"].indexOf(e.type)>=0;
}
// Route a tapped activity item to the record it refers to.
function _activityGoTo(type, refId){
  try{
    switch(type){
      case "matter":{
        if(refId && DB.matters.some(m=>m.id===refId)){ openMatterDetail(refId); return; }
        // older matter events had no refId — fall back to the Matters register
        openSub("matters"); return;
      }
      case "receipt": openSub("ledger"); return;
      case "invoice": openBilling? openBilling("invoiceledger") : openSub("ledger"); return;
      case "expense":
      case "advance": openLedger(); return;
      case "task": openTodos(); return;
      case "document": openSub("unassigned"); return;
      case "appointment":
      case "date": openAppointments(); return;
      default: return;
    }
  }catch(err){ /* never let routing throw */ }
}
// Clear the activity feed: mark all seen (clears the badge) and empty the list.
function clearActivity(){
  openModal("Clear activity?", `
    <div class="hint">This clears the notification list and resets the badge. It does not delete any of your records — matters, receipts, expenses and everything else stay exactly as they are.</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn seal" onclick="doClearActivity()">Clear notifications</button>
    </div>`);
}
function doClearActivity(){
  try{
    DB.activity=[];
    if(!isStaffView()) DB._ownerActivity=[];
    save && save();
    _markActivitySeen();
    closeModal();
    if(document.getElementById("panel-activity").classList.contains("active")) renderActivity(isStaffView());
    _refreshActivityBadge();
    toast && toast("Notifications cleared.");
  }catch(e){ closeModal(); }
}

function openSearch(){

      autocomplete="off" oninput="_gsRun(this.value)" style="font-size:15px">

    <div id="gsResults" class="gs-results"></div>`);

function _gsMatchesText(hay, q){ return (hay||"").toLowerCase().indexOf(q)>=0; }
// text of the matter a record is linked to, so searching a party/code/case no.
// also surfaces the receipts/expenses/docs attached to that matter
function _gsMatterText(matterId){
  if(!matterId) return "";
  const m=(DB.matters||[]).find(x=>x.id===matterId); if(!m) return "";
  return [m.code,m.parties,m.client,m.caseNo].filter(Boolean).join(" ");
}
function _gsMatterLabel(matterId){
  if(!matterId) return "";
  const m=(DB.matters||[]).find(x=>x.id===matterId); if(!m) return "";
  const t=m.parties||m.client||""; return m.code+(t?" · "+t:"");
}
// Build a flat, ranked result list from every collection the current viewer may see.
function _gsSearch(q){
  q=(q||"").trim().toLowerCase();
  if(!q) return [];
  const staff=isStaffView();
  const out=[];
  // Matters (everyone)
  (DB.matters||[]).forEach(m=>{
    const hay=[m.code,m.parties,m.client,m.caseNo,m.court,m.forum,m.status].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"matter", icon:"📋", title:(m.code||"")+(m.parties?" — "+m.parties:(m.client?" — "+m.client:"")),
      sub:(m.caseNo?("Case "+m.caseNo+" · "):"")+(m.status||"Active"),
      go:()=>{ closeModal(); openMatterDetail(m.id); }
    });
  });
  // Expenses (everyone)
  (DB.expenses||[]).forEach(x=>{
    const hay=[x.head,x.note,x.remarks,String(x.amount),_gsMatterText(x.matterId)].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"expense", icon:"💸", title:"Expense "+fmtINR(x.amount)+(x.head?" — "+x.head:""),
      sub:(x.date?fmtDate(x.date)+" · ":"")+(_gsMatterLabel(x.matterId)||"General"),
      go:()=>{ closeModal(); openLedger(); }
    });
  });
  // Tasks (everyone)
  (DB.todos||[]).forEach(t=>{
    if(_gsMatchesText(t.text,q)) out.push({
      type:"task", icon:"✅", title:t.text, sub:(t.status==="resolved"?"Resolved":"Open task"),
      go:()=>{ closeModal(); openTodos(); }
    });
  });
  // Documents (everyone)
  (DB.docsIn||[]).concat(DB.docsFiled||[]).forEach(d=>{
    const hay=[d.title,d.name,d.note,_gsMatterText(d.matterId)].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"document", icon:"📎", title:"Doc: "+(d.title||d.name||"file"),
      sub:_gsMatterLabel(d.matterId)||"Unassigned",
      go:()=>{ closeModal(); if(d.url){ window.open(d.url,"_blank"); } else { openSub("unassigned"); } }
    });
  });
  // Appointments (everyone)
  (DB.appointments||[]).forEach(a=>{
    const hay=[a.title,a.note,a.with,a.place].join(" ");
    if(_gsMatchesText(hay,q)) out.push({
      type:"appointment", icon:"🗓️", title:a.title||"Appointment",
      sub:(a.date?fmtDate(a.date):"")+(a.time?" "+a.time:""),
      go:()=>{ closeModal(); openAppointments(); }
    });
  });
  // Receipts & invoices — OWNER ONLY (finance wall)
  if(!staff){
    (DB.receipts||[]).forEach(r=>{
      const hay=[r.no,r.towards,r.remarks,String(r.amount),r.mode,_gsMatterText(r.matterId)].join(" ");
      if(_gsMatchesText(hay,q)) out.push({
        type:"receipt", icon:"🧾", title:"Receipt "+(r.no||"")+" — "+fmtINR(r.amount),
        sub:(r.date?fmtDate(r.date)+" · ":"")+(_gsMatterLabel(r.matterId)||""),
        go:()=>{ closeModal(); openSub("ledger"); }
      });
    });
    (DB.invoices||[]).forEach(v=>{
      const hay=[v.no,v.towards,String(v.total||v.amount),_gsMatterText(v.matterId)].join(" ");
      if(_gsMatchesText(hay,q)) out.push({
        type:"invoice", icon:"📄", title:"Invoice "+(v.no||"")+" — "+fmtINR(v.total||v.amount||0),
        sub:(v.date?fmtDate(v.date)+" · ":"")+(_gsMatterLabel(v.matterId)||""),
        go:()=>{ closeModal(); (typeof openBilling==="function"?openBilling("invoiceledger"):openSub("ledger")); }
      });
    });
  }
  // exact code/number matches first, then the rest
  out.sort((a,b)=>{
    const ax=(a.title||"").toLowerCase().indexOf(q), bx=(b.title||"").toLowerCase().indexOf(q);
    return ax-bx;
  });
  return out;
}
var _gsHandlers=[];
function _gsRun(q){
  const box=document.getElementById("gsResults"); if(!box) return;
  const results=_gsSearch(q);
  _gsHandlers=results;
  if(!q || !q.trim()){ box.innerHTML=`<div class="hint" style="padding:10px 2px">Start typing to search across the whole chamber.</div>`; return; }
  if(!results.length){ box.innerHTML=`<div class="empty" style="padding:20px">No matches for “${esc(q)}”.</div>`; return; }
  box.innerHTML=results.slice(0,60).map((r,i)=>`
    <div class="gs-row" onclick="_gsGo(${i})">
      <span class="gs-ic">${r.icon||"•"}</span>
      <div class="gs-main"><div class="gs-title">${esc(r.title||"")}</div>
        <div class="gs-sub">${esc(r.sub||"")}</div></div>
      <span class="gs-chev">›</span>
    </div>`).join("")
    + (results.length>60?`<div class="hint" style="padding:8px 2px">Showing first 60 of ${results.length}. Refine your search to narrow.</div>`:"");
}
function _gsGo(i){ const r=_gsHandlers[i]; if(r && typeof r.go==="function") r.go(); }
function _actWhen(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date();
  const diff=(now-d)/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+"m ago";
  if(diff<86400 && d.getDate()===now.getDate()) return "today "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  if(diff<172800) return "yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}
