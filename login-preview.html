<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login directions A/B — preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
.bar{position:sticky;top:0;z-index:9;display:flex;gap:8px;padding:10px 14px;
 background:#14100d;color:#cfc6b8;font-size:13px;align-items:center}
.bar button{font:inherit;background:#2a231d;color:#e8dfd0;border:1px solid #3d332a;
 border-radius:8px;padding:7px 16px;cursor:pointer}
.bar button.on{background:#c9b47e;border-color:#c9b47e;color:#1b1713}
.login{min-height:calc(100vh - 46px);display:grid;place-items:center;padding:28px 20px;
 background:radial-gradient(130% 80% at 50% -15%,#611c1c 0%,#421212 48%,#260a0a 100%)}
.inner{width:100%;max-width:400px;text-align:center}
.card{background:#fffdf8;border-radius:16px;padding:28px 24px;text-align:left;
 box-shadow:0 24px 60px rgba(12,4,4,.55);border-top:3px solid #9a7b3f}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
 color:#6d675e;margin-bottom:6px}
.field input{width:100%;font:16px system-ui;padding:14px;border:1px solid #e5dfd2;
 border-radius:10px;background:#fff}
.field input:focus{outline:2px solid #9a7b3f;outline-offset:1px}
.btn{width:100%;background:#6b1f1f;color:#f6efe0;border:0;border-radius:10px;
 padding:16px;font-size:15.5px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn:hover{background:#5a1919}
.aux{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.aux a{color:#6b1f1f;text-decoration:none}.aux span{color:#6d675e}
.ver{margin-top:26px;font-size:11.5px;color:#9c8f7c;letter-spacing:.06em}
.dirA,.dirB{display:none}.show-A .dirA,.show-B .dirB{display:block}
/* A — colonnade */
.dirA .of{font-size:11px;letter-spacing:.4em;color:#c9b47e;text-transform:uppercase}
.dirA h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:31px;
 color:#f6efe0;margin:6px 0 4px}
.dirA .dg{font-size:13px;color:#c9bda9;margin-bottom:26px}
.dirA svg path,.dirA svg circle{stroke-dasharray:600;stroke-dashoffset:600;
 animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* B — nameplate */
.plate{border:1px solid rgba(201,180,126,.65);position:relative;
 padding:34px 18px 30px;margin-bottom:30px;overflow:hidden}
.plate::before{content:"";position:absolute;inset:5px;
 border:1px solid rgba(201,180,126,.28)}
.plate::after{content:"";position:absolute;top:-30%;bottom:-30%;width:36%;
 left:-45%;transform:skewX(-18deg);
 background:linear-gradient(90deg,transparent,rgba(246,239,224,.13),transparent);
 animation:sweep 2.6s .4s ease forwards}
@keyframes sweep{to{left:130%}}
.plate .of{font-size:10.5px;letter-spacing:.52em;color:#c9b47e;
 text-transform:uppercase;padding-left:.52em}
.plate h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:26px;
 letter-spacing:.14em;text-transform:uppercase;color:#f2e8d2;
 margin:14px 0 12px;padding-left:.14em;line-height:1.35}
.plate .rule{width:56px;height:1px;background:#c9b47e;margin:0 auto 12px}
.plate .dg{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;
 color:#b8a888;padding-left:.24em}
@media(prefers-reduced-motion:reduce){
 .dirA svg path,.dirA svg circle{animation:none;stroke-dashoffset:0}
 .plate::after{animation:none;display:none}}
</style></head><body class="show-A">
<div class="bar">Login preview
 <button class="on" id="bA">A — Colonnade</button>
 <button id="bB">B — Nameplate</button></div>
<div class="login"><div class="inner">

<div class="dirA">
<svg width="240" height="98" viewBox="0 0 240 98" fill="none"
 xmlns="http://www.w3.org/2000/svg" style="margin-bottom:6px">
<g stroke="#c9b47e" stroke-width="1.4" stroke-linecap="round">
<path d="M120 8 v6"/><circle cx="120" cy="6" r="2.4"/>
<path d="M84 46 C 84 26, 156 26, 156 46"/>
<path d="M92 46 C 92 31, 148 31, 148 46"/>
<path d="M84 46 h72"/>
<path d="M96 46 v10 M108 46 v10 M120 46 v10 M132 46 v10 M144 46 v10"/>
<path d="M90 56 h60"/>
<path d="M40 62 C 40 50, 72 50, 72 62 M40 62 h32 M46 62 v8 M56 62 v8 M66 62 v8 M42 70 h28"/>
<path d="M168 62 C 168 50, 200 50, 200 62 M168 62 h32 M174 62 v8 M184 62 v8 M194 62 v8 M170 70 h28"/>
<path d="M28 80 h184"/>
<path d="M36 80 v10 M60 80 v10 M84 80 v10 M108 80 v10 M132 80 v10 M156 80 v10 M180 80 v10 M204 80 v10"/>
<path d="M24 92 h192"/></g></svg>
<div class="of">Chambers of</div>
<h1>Adith Satish Deshmukh</h1>
<div class="dg">Advocate on Record · Supreme Court of India</div>
</div>

<div class="dirB"><div class="plate">
<div class="of">Chambers of</div>
<h1>Adith Satish<br>Deshmukh</h1>
<div class="rule"></div>
<div class="dg">Advocate on Record<br>Supreme Court of India</div>
</div></div>

<div class="card">
<div class="field"><label>Email</label><input type="email"></div>
<div class="field"><label>Password</label><input type="password"></div>
<button class="btn">Sign in</button>
<div class="aux"><a href="#">Forgot password</a><span>Owner &amp; staff</span></div>
</div>
<div class="ver">v2026.07.06-1806 · works offline</div>
</div></div>
<script>
const set=(m)=>{document.body.className='show-'+m;
 bA.classList.toggle('on',m==='A');bB.classList.toggle('on',m==='B');};
bA.onclick=()=>set('A');bB.onclick=()=>set('B');
</script></body></html>
